<!--
title: leading, search, and actions slots
description: Each named slot adds its region around the default title without requiring internal wrapper markup.
-->
<ui-top-bar>
  <ui-button slot="leading" size="sm">Back</ui-button>
  <strong>Title</strong>
  <ui-button slot="search" size="sm">Search</ui-button>
  <ui-button slot="actions" size="sm">Save</ui-button>
</ui-top-bar>
