<!--
title: placement="top-end"
description: Placement sets the preferred edge and alignment against the trigger; here the surface opens above, aligned to the trigger's end edge.
-->
<ui-button id="details-trigger">Open popover</ui-button>
<ui-popover id="details-popover" for="details-trigger" placement="top-end">
  <strong>Popover heading</strong>
  <p>Popover content.</p>
</ui-popover>
