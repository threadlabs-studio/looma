<!--
title: help and label-visibility="sr-only"
description: Help adds a hint button with a tooltip; label-visibility keeps the label for assistive technology while hiding it visually.
-->
<ui-combobox label="Destination" label-visibility="sr-only" help="Pick where the shipment should be delivered." disclosure placeholder="Destination">
  <option value="north">North terminal</option>
  <option value="west">West terminal</option>
</ui-combobox>
