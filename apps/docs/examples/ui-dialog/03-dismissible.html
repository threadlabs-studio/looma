<!--
title: dismissible
description: Dismissible also closes the dialog when the user presses Escape or presses anywhere outside it.
-->
<ui-button id="open-dismissible-dialog">Open dismissible dialog</ui-button>
<ui-dialog id="dismissible-dialog" for="open-dismissible-dialog" modal dismissible label="Keyboard shortcuts">
  <p>Press <kbd>Escape</kbd> or click the backdrop to close this dialog.</p>
</ui-dialog>
