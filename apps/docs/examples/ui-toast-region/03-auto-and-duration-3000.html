<!--
title: auto and duration="3000"
description: Auto dismisses each message after its duration. Hovering or focusing a message pauses its timer.
-->
<ui-toast-region id="auto-notifications" auto duration="3000">
</ui-toast-region>
<ui-button commandfor="auto-notifications" command="--show-toast" value="Draft saved.">Show auto-dismissing toast</ui-button>
