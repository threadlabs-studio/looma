<link rel="component" href="@threadlabs/looma/components/ui-stack/ui-stack.html">
<link rel="component" href="@threadlabs/looma/components/ui-cluster/ui-cluster.html">
<link rel="component" href="@threadlabs/looma/components/ui-avatar/ui-avatar.html">
<link rel="component" href="@threadlabs/looma/components/ui-badge/ui-badge.html">
<link rel="component" href="@threadlabs/looma/components/ui-checkbox/ui-checkbox.html">
<link rel="component" href="@threadlabs/looma/components/ui-button/ui-button.html">
<link rel="component" href="@threadlabs/looma/components/ui-meter/ui-meter.html">
<link rel="component" href="@threadlabs/looma/components/ui-text/ui-text.html">
<link rel="component" href="@threadlabs/looma/components/ui-separator/ui-separator.html">
<link rel="component" href="@threadlabs/looma/components/ui-switch/ui-switch.html">
<link rel="component" href="@threadlabs/looma/components/ui-icon/ui-icon.html">
<template component="looma-home-demo" module="./looma-home-demo.js">
  <defs><state name="completed" type="number" value="2"></state></defs>
  <ui-card variant="elevated" treatment="expressive" padding="lg" aria-label="Live component showcase">
    <ui-cluster justify="between" gap="s">
      <ui-text variant="eyebrow" tone="secondary">The little details, together</ui-text>
      <ui-badge tone="accent" variant="subtle">Live components</ui-badge>
    </ui-cluster>
    <ui-stack gap="xs">
      <ui-text as="h2" variant="heading">Something good is taking shape.</ui-text>
      <ui-text size="sm" tone="secondary">A shared plan. A little progress. A team in sync.</ui-text>
    </ui-stack>
    <ui-cluster justify="between">
      <ui-cluster gap="xs" aria-label="Project team">
        <ui-avatar name="Alex Chen" fallback="AC" size="sm"></ui-avatar>
        <ui-avatar name="Sam Rivera" fallback="SR" size="sm"></ui-avatar>
        <ui-avatar name="Jo Morgan" fallback="JM" size="sm"></ui-avatar>
      </ui-cluster>
      <ui-badge tone="success" variant="subtle">On track</ui-badge>
    </ui-cluster>
    <ui-stack gap="xs">
      <ui-cluster justify="between"><ui-text size="sm">Ready for launch</ui-text><ui-text size="sm" tone="accent" weight="semibold">{$completed} of 3</ui-text></ui-cluster>
      <ui-meter style="--ui-meter-inline-size: 100%" from:value="$completed" max="3" tone="accent" label="Launch progress" from:value-text="concat($completed, ' of 3 steps complete')"></ui-meter>
    </ui-stack>
    <ui-stack gap="xs" $ref="checklist">
      <ui-checkbox checked>Find the right direction</ui-checkbox>
      <ui-checkbox checked>Make room for the details</ui-checkbox>
      <ui-checkbox>Share it with the world</ui-checkbox>
    </ui-stack>
    <ui-separator></ui-separator>
    <ui-cluster justify="between" gap="s">
      <ui-switch size="sm" checked>Keep me in the loop</ui-switch>
      <ui-button as="a" href="/looma/components/" preset="primary" size="sm">Explore Looma<ui-icon name="chevron-right"></ui-icon></ui-button>
    </ui-cluster>
    <ui-text variant="caption" tone="muted">Try the controls. This is Looma, working in your browser.</ui-text>
  </ui-card>
</template>
