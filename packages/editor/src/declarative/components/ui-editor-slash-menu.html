    <prop name="query" type="string" default="">query value.</prop>
    <prop name="items" type="list(object({ title: string, description: string, icon: string }))">items value.</prop>
    <prop name="selectedIndex" type="integer" default="0">selectedIndex value.</prop>
    <prop name="anchorRect" type="object({ left?: number, top?: number, right?: number, bottom?: number, x?: number, y?: number, width?: number, height?: number }) | null">anchorRect value.</prop>
    <event name="highlight" type="object({ index: integer })"></event>

  <div .items="items" .anchorRect="anchorRect"></div>
