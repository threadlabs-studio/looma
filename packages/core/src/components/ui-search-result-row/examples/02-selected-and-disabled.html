<!--
title: selected and disabled
description: Selected marks the active result; disabled keeps an unavailable result visible but inert.
-->
<div>
  <ui-search-result-row selected>
    <span slot="title">Selected result</span>
    <span slot="meta">Available</span>
  </ui-search-result-row>
  <ui-search-result-row disabled>
    <span slot="title">Disabled result</span>
    <span slot="meta">Unavailable</span>
  </ui-search-result-row>
</div>
