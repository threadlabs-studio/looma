<link rel="component" href="../ui-menu/ui-menu.html">
<template component="ui-context-menu" controller="./ui-context-menu.js" status="early" summary="Adds pointer-context and explicit activation paths to an action menu associated by element ID.">
  <defs>
    <prop name="open" type="boolean" default="false">Whether the context menu is open initially or when set externally.</prop>
    <prop name="for" type="string" default="">ID of the control that opens the menu by click, keyboard activation, or context click.</prop>
    <state name="internalOpen" :value="false"></state>
    <state name="focusTrigger" :value="'programmatic'"></state>
    <event name="open" type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"></event>
    <event name="close" type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"></event>
    <event name="select" type="object({ value: string, trigger: keyboard | pointer | programmatic })"></event>
  </defs>
  <span :data-state-open="internalOpen"><div class="menu" :data-state-open="internalOpen"><ui-menu><slot></slot></ui-menu></div></span>
  <style>:scope {
  display: contents;
}

/* The outer .menu owns open state; the nested menu is only its surface. */
:scope .menu > [data-component-root~="ui-menu"] {
  display: flex;
}

:scope[data-focus-trigger='pointer'] :slotted(ui-menu-item:focus) {
  outline: none;
}

.menu {
  position: fixed;
  inset: auto;
  margin: 0;
  padding: 0;
  border: 0;
  outline: 0;
  background: transparent;
  box-shadow: none;
  overflow: visible;
  z-index: var(--ui-z-overlay, 1000);
  min-width: 12rem;
  opacity: 0;
  transform: translateY(-4px) scale(0.99);
  transition:
    opacity var(--ui-motion-fast) var(--ui-motion-ease),
    transform var(--ui-motion-fast) var(--ui-motion-ease),
    display var(--ui-motion-fast) allow-discrete,
    overlay var(--ui-motion-fast) allow-discrete;
}

.menu:popover-open { opacity: 1; transform: translateY(0) scale(1); }

@starting-style {
  .menu:popover-open { opacity: 0; transform: translateY(-4px) scale(0.99); }
}

.menu[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  .menu { transition: none; }
}
</style>
</template>
