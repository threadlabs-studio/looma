  <style>:scope {

.row {

:scope[data-selected='true'] .row,

  border: 0;

.disclosure-icon::before {

  block-size: 0.45rem;

  border-block-end: 2px solid currentColor;

  transform: translateY(-20%) rotate(45deg);

:scope[aria-expanded='true'] .disclosure-icon {
  transform: rotate(0deg);

.drag-handle svg {
  display: block;
  inline-size: 100%;
  block-size: 100%;

/* Slotted content is outside this scope, so :has() cannot see it; hide only a truly empty slot. */
.leading {

  place-items: center;
  grid-column: 2;
  grid-row: 1;
  inline-size: 1em;
  block-size: 1em;

:slotted(img) {

  inline-size: 1em;
  block-size: 1em;

.label {

  grid-row: 1;

.drag-handle:hover,
.drag-handle:focus-visible,
:scope[data-dragging] .drag-handle {

.drop-indicator::before,
.drop-indicator::after {

  block-size: 7px;

.drop-indicator::after { inset-inline-end: -1px; }
