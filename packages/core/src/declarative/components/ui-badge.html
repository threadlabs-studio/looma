<template component="ui-badge" status="early" summary="Migrated Looma ui-badge component.">
  <defs>
    <prop name="variant" type="solid | subtle" default="subtle">variant token.</prop>
    <prop name="tone" type="neutral | accent | info | success | warning | danger" default="neutral">tone token.</prop>
  </defs>
  <span :data-variant="variant" :data-tone="tone"><span class="badge__surface"><slot></slot></span></span>
  <style>:scope {
  --_badge-surface: var(--ui-surface-subtle);
  --_badge-text: var(--ui-text-secondary);
  --_badge-border: color-mix(in srgb, var(--ui-text-secondary) 30%, transparent);
  --_badge-font-size: var(--ui-font-size-sm);
  --_badge-font-weight: var(--ui-font-medium);
  --_badge-line-height: var(--ui-line-height-tight);
  --_badge-padding-block: var(--ui-space-0-5);
  --_badge-padding-inline: var(--ui-space-2);

  display: inline-flex;
  max-width: 100%;
}

.badge__surface {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  max-width: 100%;
  padding: var(--ui-badge-padding-block, var(--_badge-padding-block)) var(--ui-badge-padding-inline, var(--_badge-padding-inline));
  border: 1px solid var(--ui-badge-border, var(--_badge-border));
  border-radius: var(--ui-radius-round);
  background: var(--ui-badge-surface, var(--_badge-surface));
  color: var(--ui-badge-text, var(--_badge-text));
  font-family: var(--ui-font-family-sans);
  font-size: var(--ui-badge-font-size, var(--_badge-font-size));
  font-weight: var(--ui-badge-font-weight, var(--_badge-font-weight));
  line-height: var(--ui-badge-line-height, var(--_badge-line-height));
  white-space: nowrap;
}

:scope[data-tone='accent'] .badge__surface {
  --_badge-surface: var(--ui-accent-strong-surface, var(--ui-accent-solid));
  --_badge-border: var(--ui-accent-strong-surface, var(--ui-accent-solid));
  --_badge-text: var(--ui-accent-on-strong, var(--ui-text-on-accent));
}

:scope[data-tone='danger'] .badge__surface {
  --_badge-surface: var(--ui-danger-strong-surface, var(--ui-danger-solid));
  --_badge-border: var(--ui-danger-strong-surface, var(--ui-danger-solid));

}

:scope[data-tone='success'] .badge__surface {
  --_badge-surface: var(--ui-success-strong-surface, var(--ui-success-solid));
  --_badge-border: var(--ui-success-strong-surface, var(--ui-success-solid));
  --_badge-text: var(--ui-success-on-strong, var(--ui-text-on-accent));
}

:scope[data-tone='warning'] .badge__surface {
  --_badge-surface: var(--ui-warning-strong-surface, var(--ui-warning-solid));
  --_badge-border: var(--ui-warning-strong-surface, var(--ui-warning-solid));
  --_badge-text: var(--ui-warning-on-strong, var(--ui-text-on-accent));
}

:scope[data-tone='info'] .badge__surface {
  --_badge-surface: var(--ui-info-strong-surface, var(--ui-info-solid));
  --_badge-border: var(--ui-info-strong-surface, var(--ui-info-solid));
  --_badge-text: var(--ui-info-on-strong, var(--ui-text-on-accent));
}

:scope[data-variant='subtle'][data-tone='accent'] .badge__surface {
  --_badge-surface: var(--ui-accent-soft);
  --_badge-border: var(--ui-accent-soft);
  --_badge-text: var(--ui-accent-subtle-text, var(--ui-accent-solid));
}

:scope[data-variant='subtle'][data-tone='danger'] .badge__surface {
  --_badge-surface: var(--ui-danger-soft);
  --_badge-border: var(--ui-danger-soft);

:scope[data-variant='subtle'][data-tone='success'] .badge__surface {

  --_badge-border: var(--ui-success-soft);

}

  --_badge-surface: var(--ui-warning-soft);
  --_badge-border: var(--ui-warning-soft);

}
</style>
</template>
