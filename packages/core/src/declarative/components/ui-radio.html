<template component="ui-radio" controller="./controllers/ui-radio.js" status="early" summary="Migrated Looma ui-radio component.">
  <defs>
    <prop name="checked" type="boolean" default="false">Whether the radio is checked initially or when set externally.</prop>
    <prop name="disabled" type="boolean" default="false">disabled token.</prop>
    <prop name="name" type="string" default="">name token.</prop>
    <prop name="required" type="boolean" default="false">required token.</prop>
    <prop name="value" type="string" default="on">value token.</prop>
    <state name="internalChecked" :value="false"></state>
    <event name="change" type="object({ checked: boolean, value: string, trigger: keyboard | pointer | programmatic })"></event>
  </defs>
  <span :data-disabled="disabled"><label class="control"><input type="radio" :checked="internalChecked" :name="name" :required="required" :value="value"></input><span class="label"><slot></slot></span></label></span>
  <style>:scope { display: inline-block; color: var(--ui-text-primary); }

.control {
  display: inline-flex;
  align-items: flex-start;
  gap: var(--ui-radio-gap, var(--ui-space-2));
  max-inline-size: 100%;
  color: inherit;
  cursor: pointer;
}

.label { min-inline-size: 0; line-height: var(--ui-line-height-md); }

input[type='radio'] {
  flex: 0 0 auto;
  inline-size: var(--ui-radio-size, 1.125rem);
  block-size: var(--ui-radio-size, 1.125rem);
  margin: 0.125em 0 0;
  accent-color: var(--ui-accent-solid);
  cursor: pointer;
}

input[type='radio']:focus-visible {
  outline: 2px solid var(--ui-focus-ring, var(--ui-accent-solid));
  outline-offset: 2px;
}

:scope[data-disabled='true'] .control { color: var(--ui-text-muted); cursor: not-allowed; }
:scope[data-disabled='true'] input { cursor: not-allowed; }
</style>
</template>
