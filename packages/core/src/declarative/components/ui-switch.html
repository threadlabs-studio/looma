<template component="ui-switch" controller="./controllers/ui-switch.js" status="early" summary="Migrated Looma ui-switch component.">
  <defs>
    <prop name="checked" type="boolean" default="false">Whether the switch is checked initially or when set externally.</prop>
    <prop name="disabled" type="boolean" default="false">disabled token.</prop>
    <prop name="required" type="boolean" default="false">required token.</prop>
    <prop name="value" type="string" default="on">value token.</prop>
    <state name="internalChecked" :value="false"></state>
    <event name="change" type="object({ checked: boolean, value: string, trigger: keyboard | pointer | programmatic })"></event>
  </defs>
  <span :data-disabled="disabled"><label class="control"><input type="checkbox" role="switch" :checked="internalChecked" :required="required" :value="value"></input><span class="label"><slot></slot></span></label></span>
  <style>:scope { display: inline-block; color: var(--ui-text-primary); }

.control {
  display: inline-flex;
  align-items: flex-start;
  gap: var(--ui-switch-gap, var(--ui-space-2));
  max-inline-size: 100%;
  color: inherit;
  cursor: pointer;
}

.label { min-inline-size: 0; line-height: var(--ui-line-height-md); }

:scope input[type='checkbox'] {
  appearance: none;
  -webkit-appearance: none;
  position: relative;
  flex: 0 0 auto;
  width: var(--ui-switch-track-width, 2.5rem);
  height: var(--ui-switch-track-height, 1.5rem);
  padding: 0;
  border: 1px solid var(--ui-control-border-hover, var(--ui-border-strong));
  border-radius: 999px;
  background: var(--ui-control-surface, var(--ui-surface-default));
  box-shadow: inset 0 1px 2px color-mix(in srgb, var(--ui-text-primary) 10%, transparent);
  cursor: pointer;
  transition:
    background-color var(--ui-motion-fast) var(--ui-motion-ease),
    border-color var(--ui-motion-fast) var(--ui-motion-ease);
  margin: 0;
}

:scope input[type='checkbox']::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 1rem;
  height: 1rem;
  border-radius: 999px;
  background: var(--ui-text-secondary);
  box-shadow: var(--ui-shadow-xs);
  transition: transform var(--ui-motion-fast) var(--ui-motion-ease);
}

:scope input[type='checkbox']:checked {
  background: var(--ui-accent-solid);
  border-color: var(--ui-accent-solid);
}

:scope input[type='checkbox']:checked::after {
  transform: translateX(1rem);
  background: var(--ui-text-on-accent);
}

:scope input[type='checkbox']:focus-visible {
  outline: 2px solid var(--ui-focus-ring, var(--ui-accent-solid));
  outline-offset: 2px;
}

:scope[data-disabled='true'] .control { color: var(--ui-text-muted); cursor: not-allowed; }
:scope[data-disabled='true'] input {
  border-color: var(--ui-border-default);
  background: var(--ui-control-surface-disabled, var(--ui-surface-muted));
  cursor: not-allowed;
}

@media (prefers-reduced-motion: reduce) {
  :scope input[type='checkbox'], :scope input[type='checkbox']::after { transition: none; }
}
</style>
</template>
