<template component="ui-dialog" controller="./controllers/ui-dialog.js" status="early" summary="Coordinates a native dialog with an optional associated trigger and the shared overlay lifecycle.">
  <defs>
    <prop name="open" type="boolean" default="false">Whether the dialog is open initially or when set externally.</prop>
    <prop name="modal" type="boolean" default="false">Open in the top layer with a backdrop and make the rest of the page inert.</prop>
    <prop name="dismissible" type="boolean" default="false">Also close on Escape and on a pointer press outside the dialog. The header close button and actions always close it.</prop>
    <prop name="label" type="string">Visible title in the dialog header; also its accessible name.</prop>
    <prop name="for" type="string" default="">ID of the control that opens the dialog.</prop>
    <state name="internalOpen" :value="false"></state>
    <state name="accessibleLabel" :value="'Dialog'"></state>
    <event name="close" type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"></event>
  </defs>
  <dialog :aria-label="accessibleLabel"><header class="dialog__header"><h2 class="dialog__title" $if="label"><template $value="label"></template></h2><button class="dialog__close" type="button" aria-label="Close"></button></header><div class="dialog__body"><slot></slot></div><footer class="dialog__footer"><slot name="actions"></slot></footer></dialog>
  <style>:scope {
  --ui-dialog-duration: var(--ui-motion-base);
  --ui-dialog-viewport-gap: var(--ui-space-4, 1rem);
  position: fixed;
  inset: 0;
  box-sizing: border-box;
  inline-size: min(
    calc(100% - (var(--ui-dialog-viewport-gap) * 2)),
    var(--ui-dialog-max-width, 440px)
  );
  max-inline-size: none;
  max-block-size: calc(100dvh - (var(--ui-dialog-viewport-gap) * 2));
  margin: auto;
  padding: 0;
  overflow: hidden;
  flex-direction: column;
  background: var(--ui-surface-elevated);
  border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-dialog);
  box-shadow: var(--ui-elevation-dialog, var(--ui-shadow-xl));
  visibility: hidden;
  pointer-events: none;
  opacity: 0;
  transform: scale(0.96);
  transition:
    opacity var(--ui-dialog-duration) var(--ui-motion-ease),
    transform var(--ui-dialog-duration) var(--ui-motion-ease),
    visibility var(--ui-dialog-duration),
    display var(--ui-dialog-duration) var(--ui-motion-ease) allow-discrete,
    overlay var(--ui-dialog-duration) var(--ui-motion-ease) allow-discrete;
}

:scope[open] {
  display: flex;
  visibility: visible;
  pointer-events: auto;
  opacity: 1;
  transform: scale(1);
  animation: ui-dialog-enter var(--ui-dialog-duration) var(--ui-motion-ease);
}

/* Header and actions stay pinned; only the body scrolls when content is long. */
.dialog__header {
  display: flex;
  align-items: center;
  gap: var(--ui-space-3);
  flex: none;
  padding: var(--ui-space-3) var(--ui-space-3) var(--ui-space-3) var(--ui-space-5);
  border-block-end: 1px solid var(--ui-border-default);
}

/* :scope-qualified so host-page heading and svg rules cannot outrank the dialog chrome. */
:scope .dialog__title {
  flex: 1;
  min-inline-size: 0;
  margin: 0;
  padding: 0;
  border: 0;
  color: var(--ui-text-primary);
  letter-spacing: normal;
  font-size: var(--ui-font-size-lg, 1.125rem);
  font-weight: var(--ui-font-semibold, 600);
  line-height: var(--ui-line-height-tight);
}

.dialog__close {
  display: inline-grid;
  place-items: center;
  flex: none;
  margin-inline-start: auto;
  inline-size: var(--ui-control-size-sm, 2rem);
  block-size: var(--ui-control-size-sm, 2rem);
  padding: 0;
  border: 0;
  border-radius: var(--ui-radius-round, 999px);
  background: transparent;
  color: var(--ui-text-secondary);
  cursor: pointer;
  transition: background-color var(--ui-motion-fast) var(--ui-motion-ease), color var(--ui-motion-fast) var(--ui-motion-ease);
}

/* CSS-drawn X: template SVG does not yet lower in the SVG namespace. */
.dialog__close::before,
.dialog__close::after {
  content: "";
  grid-area: 1 / 1;
  inline-size: 0.875rem;
  block-size: 1.5px;
  border-radius: 1px;
  background: currentColor;
  transform: rotate(45deg);
}

.dialog__close::after {
  transform: rotate(-45deg);
}

.dialog__close:hover {
  background: var(--ui-surface-muted);
  color: var(--ui-text-primary);
}

.dialog__close:focus-visible {
  outline: 2px solid var(--ui-focus-ring);
  outline-offset: 2px;
}

.dialog__body {
  flex: 1 1 auto;
  min-block-size: 0;
  overflow: auto;
  overscroll-behavior: contain;
  padding: var(--ui-space-5);
}

.dialog__footer {
  display: flex;
  flex: none;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: var(--ui-space-2);
  padding: var(--ui-space-3) var(--ui-space-5);
  border-block-start: 1px solid var(--ui-border-default);
}

.dialog__footer:empty {
  display: none;
}

@keyframes ui-dialog-enter {
  from {
    opacity: 0;
    transform: scale(0.96);
  }
}

:scope::backdrop {
  background-color: transparent;
  transition:
    background-color var(--ui-dialog-duration) var(--ui-motion-ease),
    display var(--ui-dialog-duration) var(--ui-motion-ease) allow-discrete,
    overlay var(--ui-dialog-duration) var(--ui-motion-ease) allow-discrete;
}

:scope[open]::backdrop {
  background-color: var(--ui-overlay-backdrop);
  animation: ui-dialog-backdrop-enter var(--ui-dialog-duration) var(--ui-motion-ease);
}

@keyframes ui-dialog-backdrop-enter {
  from {
    background-color: transparent;
  }
}
</style>
</template>
