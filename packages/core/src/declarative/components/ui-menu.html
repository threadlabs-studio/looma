<template component="ui-menu" controller="./controllers/ui-menu.js" status="early" summary="Presents a keyboard-navigable action list, either directly or from an explicitly associated trigger.">
  <defs>
    <prop name="open" type="boolean" default="false">Whether the menu is open initially or when set externally.</prop>
    <prop name="for" type="string" default="">ID of the control that toggles and anchors the menu.</prop>
    <prop name="placement" type="string" default="bottom-start">Positions an associated menu relative to its trigger.</prop>
    <state name="internalOpen" :value="false"></state>
    <event name="select" type="object({ value: string, trigger: keyboard | pointer | programmatic })"></event>
    <event name="open" type="object({ open: boolean, reason: action | programmatic, trigger: keyboard | pointer | programmatic })"></event>
    <event name="close" type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"></event>
  </defs>
  <div role="menu" aria-orientation="vertical" :data-state-open="internalOpen"><div class="menu__surface"><slot></slot></div></div>
  <style>:scope {
  --ui-menu-viewport-gap: var(--ui-space-2, 0.5rem);
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  inline-size: max-content;
  min-inline-size: min(12rem, calc(100vw - (var(--ui-menu-viewport-gap) * 2)));
  max-inline-size: calc(100vw - (var(--ui-menu-viewport-gap) * 2));
  padding: 0;
  border: 0;
  outline: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  overflow: visible;
}

.menu__surface {
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  max-inline-size: inherit;
  padding: var(--ui-space-1);
  background: var(--ui-surface-elevated);
  border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-3);
  box-shadow: var(--ui-elevation-overlay, var(--ui-shadow-lg));
  max-block-size: inherit;
  overflow: auto;
}

:scope:is(:not([data-state-open]), [data-state-open="false"]) {
  display: none;
}

:scope[popover] {
  position: fixed;
  inset: auto;
  margin: 0;
  overflow: visible;
  max-block-size: calc(100dvh - (var(--ui-menu-viewport-gap) * 2));
  opacity: 0;
  transform: translateY(-4px) scale(0.99);
  transition:
    opacity var(--ui-motion-fast) var(--ui-motion-ease),
    transform var(--ui-motion-fast) var(--ui-motion-ease),
    display var(--ui-motion-fast) allow-discrete,
    overlay var(--ui-motion-fast) allow-discrete;
}

:scope[popover]:popover-open {
  opacity: 1;
  transform: translateY(0) scale(1);
}

@starting-style {
  :scope[popover]:popover-open {
    opacity: 0;
    transform: translateY(-4px) scale(0.99);
  }
}

:scope[hidden] {
  display: none !important;
}

@media (prefers-reduced-motion: reduce) {
  :scope[popover] { transition: none; }
}

:slotted(ui-menu-item) {
  display: block;
  width: 100%;
}
</style>
</template>
