<!--
title: size
description: sm and lg set the padding and type size to match fields of the same size; rows still sets the height.
-->
<ui-stack gap="s">
  <ui-textarea size="sm" rows="2" aria-label="Small" placeholder="Small"></ui-textarea>
  <ui-textarea size="lg" rows="2" aria-label="Large" placeholder="Large"></ui-textarea>
</ui-stack>
