<template component="ui-textarea" controller="./ui-textarea.js">
  <defs>
    <prop name="value" type="string"
    >The textarea's text. Setting or changing it replaces the live text; between changes the user's typing stands, so follow input events to keep it in step. It
      is also the textarea's default, so a form reset returns to it.</prop>
    <prop name="disabled" type="boolean" default="false">Prevents editing and form submission.</prop>
    <prop name="invalid" type="boolean" default="false">Exposes invalid state to assistive technology and styling.</prop>
    <prop name="readonly" type="boolean" default="false">Allows selection without allowing edits.</prop>
    <prop name="required" type="boolean" default="false">Marks the control as required for form validation.</prop>
    <prop name="rows" type="integer" default="4">Initial number of visible text rows.</prop>
  </defs>
  <textarea :value="value" :disabled="disabled" :readonly="readonly" :required="required" :aria-invalid="invalid" :rows="rows"></textarea>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-textarea-focus-shadow {
      syntax: "*";
      inherits: false;
    }
    @property --ui-textarea-radius {
      syntax: "*";
      inherits: false;
    }
    @property --ui-textarea-shadow {
      syntax: "*";
      inherits: false;
    }

    :host {
      box-sizing: border-box;
      display: inline-block;
      inline-size: 100%;
      min-inline-size: 0;
      min-block-size: calc(3rem * 2);
      margin: 0;
      padding: var(--ui-space-2) var(--ui-space-3);
      appearance: none;
      resize: vertical;
      border: 1px solid var(--ui-control-border, var(--ui-border-strong));
      border-radius: var(--ui-textarea-radius, var(--ui-radius-md));
      background: var(--ui-control-surface, var(--ui-surface-elevated));
      color: var(--ui-text-primary);
      font: inherit;
      line-height: var(--ui-line-height-md);
      box-shadow: var(--ui-textarea-shadow, var(--ui-control-inset));
      transition:
        border-color var(--ui-motion-fast) var(--ui-motion-ease),
        box-shadow var(--ui-motion-fast) var(--ui-motion-ease),
        background-color var(--ui-motion-fast) var(--ui-motion-ease);
    }

    /* Tabbing into a field selects its text; tint that selection softly instead of the page highlight. */
    :host::selection {
      background: color-mix(in srgb, var(--ui-accent-solid) 20%, transparent);
      color: inherit;
    }

    :host::placeholder {
      color: var(--ui-control-placeholder, var(--ui-text-secondary));
      opacity: 1;
    }

    :host:hover:not(:focus):not(:disabled) {
      border-color: var(--ui-control-border-hover, var(--ui-text-secondary));
    }

    :host:focus-visible {
      border-color: var(--ui-control-focus, var(--ui-accent-solid));
      outline: none;
      box-shadow: var(--ui-textarea-focus-shadow, var(--ui-control-inset), var(--ui-control-focus-halo-shadow));
    }

    /* The app's invalid flag, or the browser's own verdict once the user has left an invalid field. */
    :host[aria-invalid="true"],
    :host:user-invalid {
      border-color: var(--ui-danger-solid);
    }

    :host:is([aria-invalid="true"], :user-invalid):focus-visible {
      box-shadow:
        var(--ui-control-inset),
        0 0 0 3px color-mix(in srgb, var(--ui-danger-solid) 22%, transparent);
    }

    :host:disabled {
      background: var(--ui-control-surface-disabled, var(--ui-surface-muted));
      color: var(--ui-disabled-text);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
