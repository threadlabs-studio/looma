<!--
title: Empty, loading, and error
description: Inline states inside existing cards. The card supplies the boundary; the status announces its state and offers a next step.
-->
<ui-stack gap="s">
  <ui-card><ui-status-message heading="No pages yet">Pages you create appear here.<ui-button slot="action" size="sm" variant="solid"
      >Create a page</ui-button></ui-status-message></ui-card>
  <ui-card><ui-status-message kind="loading">Loading pages…</ui-status-message></ui-card>
  <ui-card><ui-status-message kind="error">Activity could not be loaded.</ui-status-message></ui-card>
</ui-stack>
