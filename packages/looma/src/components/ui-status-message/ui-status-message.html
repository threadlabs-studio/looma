<template component="ui-status-message">
  <defs>
    <prop name="kind" type="empty | loading | error" default="empty"
    >What the view is saying. empty: there is nothing here yet (announced politely); loading: it is on its way, with a spinner (announced politely); error: it
      could not be shown, in the danger tone (announced at once).</prop>
    <prop name="heading" type="string" default="">A short heading above the message, such as "No pages yet". Optional.</prop>
    <prop name="layout" type="inline | panel | fill" default="inline"
    >Where it sits. inline takes its place in the view's flow; panel sits it on a dashed surface, for an empty area in a page; fill centres it in all the space
      it is given, for a whole view that is loading or failed.</prop>
  </defs>
  <div :role="{ true: 'alert', false: 'status' }[format('%s', kind = 'error')]">
    <ui-spinner size="sm" :hidden="kind != 'loading'"></ui-spinner>
    <span class="copy">
      <strong class="heading" :hidden="not heading"><template $value="heading"></template></strong>
      <span class="message"><slot></slot></span>
    </span>
    <span class="action"><slot name="action"></slot></span>
  </div>
  <style>
    /* The one way a view says it is loading, has nothing yet, or failed, with an optional next step.
       Every view says it the same way, in the same place, at the same size. */
    :host {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--ui-space-2) var(--ui-space-4);
      padding-block: var(--ui-space-4);
      color: var(--ui-text-muted);
      font-size: var(--ui-font-size-md);
      line-height: var(--ui-line-height);
    }

    :host-state([kind="error"]) {
      color: var(--ui-danger);
    }

    :host-state([layout="panel"]) {
      padding: var(--ui-space-6);
      border: 1px dashed var(--ui-border-default);
      border-radius: var(--ui-radius-lg);
    }

    :host-state([layout="fill"]) {
      flex: 1;
      flex-direction: column;
      justify-content: center;
      min-block-size: 50vh;
      text-align: center;
    }

    .copy {
      display: flex;
      flex: 1 1 12rem;
      flex-direction: column;
      gap: var(--ui-space-1);
      min-inline-size: 0;
    }

    :host-state([layout="fill"]) .copy {
      flex: none;
      align-items: center;
    }

    .heading {
      color: var(--ui-text-primary);
      font-weight: var(--ui-font-semibold);
    }

    .action {
      display: inline-flex;
      flex-wrap: wrap;
      gap: var(--ui-space-2);
    }

    .action:empty {
      display: none;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
