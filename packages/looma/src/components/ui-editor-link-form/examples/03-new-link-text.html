title: New link with text
description: A link added where no text is selected also asks for its text; a problem shows as an alert under the fields.
-->

  searchable
  mode="target"
  placeholder="Search pages or paste a URL…"
  status="Type at least two letters to search."
  text-editable
  error="Enter link text."
>
</ui-editor-link-form>
