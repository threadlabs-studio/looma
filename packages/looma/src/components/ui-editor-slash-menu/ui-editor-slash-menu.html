<link rel="component" href="../ui-icon/ui-icon.html">
<template component="ui-editor-slash-menu" controller="./ui-editor-slash-menu.js">
  <defs>
    <prop name="open" type="boolean" default="false">Whether the menu is open.</prop>
    <prop name="query" type="string" default="">The text typed after the slash.</prop>
    <prop name="items" type="list(object({ title: string, description: string, icon: string }))">The blocks the menu offers.</prop>
    <prop name="selectedIndex" type="integer" default="0">The highlighted item.</prop>
    <prop
      name="anchorRect"
      type="object({ left?: number, top?: number, right?: number, bottom?: number, x?: number, y?: number, width?: number, height?: number }) | null"
    >Where the slash was typed, in viewport coordinates.</prop>
    <state name="visible" :value="false"></state>
    <state name="active" :value="0"></state>
    <event name="highlight" type="object({ index: integer })"></event>
    <event name="select" type="object({ index: integer })"></event>
  </defs>
  <div role="listbox" aria-label="Insert block" :hidden="not visible">
    <div class="header" aria-hidden="true">
      <span class="header-label">Insert</span>
      <span $if="query" class="header-query" $value="query"></span>
    </div>
    <ul class="list" role="presentation">
      <li $each="item, index of items" class="item" class:active="index = active" role="option" :aria-selected="index = active" :data-index="index">
        <span class="icon" aria-hidden="true"><ui-icon :name="item.icon"></ui-icon></span>
        <span class="body"><span class="title" $value="item.title"></span><span class="description" $value="item.description"></span></span>
      </li>
    </ul>
    <div class="footer" aria-hidden="true">
      <kbd>↑↓</kbd> navigate · <kbd>↵</kbd> insert · <kbd>Esc</kbd> close
    </div>
  </div>
  <style>
    :host {
      user-select: none;
    }

    :host {
      background: var(--ui-surface, #fff);
      border: 1px solid var(--ui-border, #e5e7eb);
      border-radius: var(--ui-radius-dialog, 1rem);
      box-shadow: var(--ui-shadow-lg, 0 8px 24px rgb(0 0 0 / 0.12));
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 767px) {
      :host {
        border-radius: var(--ui-radius-dialog, 1rem) var(--ui-radius-dialog, 1rem) 0 0;
        border-bottom: none;
      }
    }

    .header {
      display: none;
      align-items: center;
      gap: var(--ui-space-2, 8px);
      padding: var(--ui-space-3, 12px) var(--ui-space-4, 16px);
      border-bottom: 1px solid var(--ui-border, #e5e7eb);
      font-size: var(--ui-font-size-xs, 0.75rem);
      color: var(--ui-text-muted, #6b7280);
      font-weight: var(--ui-font-semibold, 600);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    @media (max-width: 767px) {
      .header {
        display: flex;
      }
    }

    .header-query {
      background: var(--ui-surface-hover, #f3f4f6);
      border-radius: var(--ui-radius-sm, 4px);
      padding: 0.1em 0.4em;
      font-family: var(--ui-font-family-mono, ui-monospace, monospace);
      font-size: var(--ui-font-size-xs, 0.75rem);
      color: var(--ui-accent, #3b82f6);
      text-transform: none;
      letter-spacing: 0;
    }

    .list {
      list-style: none;
      margin: 0;
      padding: var(--ui-space-1, 4px) 0;
      overflow-y: auto;
      max-height: 280px;
      overscroll-behavior: contain;
    }

    @media (max-width: 767px) {
      .list {
        max-height: calc(60dvh - 80px);
        padding: var(--ui-space-1, 4px) 0 var(--ui-space-2, 8px);
      }
    }

    .item {
      display: flex;
      align-items: center;
      gap: var(--ui-space-3, 12px);
      padding: var(--ui-space-2, 8px) var(--ui-space-3, 12px);
      min-height: 44px;
      cursor: pointer;
      transition: background-color 120ms ease;
    }

    .item.active {
      background: var(--ui-accent-subtle, rgb(59 130 246 / 0.1));
    }

    .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: var(--ui-surface-hover, #f3f4f6);
      border: 1px solid var(--ui-border, #e5e7eb);
      border-radius: var(--ui-radius-md, 6px);
      font-size: var(--ui-font-size-sm, 0.875rem);
      font-weight: var(--ui-font-bold, 700);
      color: var(--ui-text-secondary, #4b5563);
      font-family: var(--ui-font-family-mono, ui-monospace, monospace);
      flex-shrink: 0;
      line-height: 1;
    }

    .item.active .icon {
      background: var(--ui-accent, #3b82f6);
      border-color: var(--ui-accent, #3b82f6);
      color: var(--ui-accent-contrast, #fff);
    }

    .icon {
      --ui-icon-size: 1rem;
      --ui-icon-stroke-width: var(--ui-editor-toolbar-icon-stroke-width, 1.75);
    }

    .body {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 1px;
    }

    .title {
      font-size: var(--ui-font-size-sm, 0.875rem);
      font-weight: var(--ui-font-medium, 500);
      color: var(--ui-text, #111827);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .description {
      font-size: var(--ui-font-size-xs, 0.75rem);
      color: var(--ui-text-muted, #6b7280);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer {
      display: none;
      padding: var(--ui-space-2, 8px) var(--ui-space-3, 12px);
      border-top: 1px solid var(--ui-border, #e5e7eb);
      font-size: var(--ui-font-size-xs, 0.75rem);
      color: var(--ui-text-muted, #6b7280);
    }

    @media (min-width: 768px) {
      .footer {
        display: block;
      }
    }

    :host kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--ui-font-family-mono, ui-monospace, monospace);
      font-size: 10px;
      background: var(--ui-surface-hover, #f3f4f6);
      border: 1px solid var(--ui-border, #e5e7eb);
      border-radius: 3px;
      padding: 0 3px;
      color: var(--ui-text-secondary, #4b5563);
    }

    :host[hidden] {
      display: none;
    }
  </style>
</template>
