<link rel="component" href="../ui-icon/ui-icon.html">
<link rel="component" href="../ui-editor-slash-menu-item/ui-editor-slash-menu-item.html">
<link rel="component" href="../ui-editor-slash-menu-group/ui-editor-slash-menu-group.html">
<template component="ui-editor-slash-menu" controller="./ui-editor-slash-menu.js">
  <defs>
    <prop name="open" type="boolean" default="false">Whether the menu is open.</prop>
    <prop name="query" type="string" default="">The text typed after the slash.</prop>
    <prop name="items" type="list(object({ value?: string, title: string, description: string, icon: string }))"
    >Integration-supplied commands. Authored Slash Menu Item children are the markup alternative.</prop>
    <prop name="label" type="string" default="Insert block"
    >Accessible name of the suggestion list, used unless an aria-label or aria-labelledby is authored.</prop>
    <prop name="selectedIndex" type="integer" default="0"
    >The zero-based index of the highlighted item. The menu does not handle arrow keys itself: the editor sets this as the user moves, while hovering an item
      highlights it and reports a highlight event.</prop>
    <prop
      name="anchorRect"
      type="object({ left?: number, top?: number, right?: number, bottom?: number, x?: number, y?: number, width?: number, height?: number }) | null"
    >Where the slash was typed, in viewport coordinates.</prop>
    <state name="visible" :value="false"></state>
    <state name="active" :value="0"></state>
    <state name="rows" type="list(object({ value: string, title: string, description: string, icon: string }))" :value="[]"></state>
    <event name="highlight" type="object({ index: integer, value: string })"></event>
    <event name="select" type="object({ index: integer, value: string })"></event>
  </defs>
  <div role="listbox" :hidden="not visible">
    <div class="header"><slot name="header"></slot></div>
    <ul class="list" role="presentation">
      <li
        $each="item, index of rows"
        class="item"
        class:active="index = active"
        role="option"
        :aria-selected="index = active"
        :data-index="index"
        :data-value="item.value"
      >
        <span class="icon" aria-hidden="true"><ui-icon :name="item.icon"></ui-icon></span>
        <span class="body"><span class="title" $value="item.title"></span><span class="description" $value="item.description"></span></span>
      </li>
      <slot></slot>
    </ul>
    <div class="empty" $ref="empty"><slot name="empty"></slot></div>
    <div class="footer"><slot name="footer"></slot></div>
  </div>
  <style>
    :host {
      user-select: none;
    }

    :host {
      background: var(--ui-surface);
      border: 1px solid var(--ui-border-strong);
      border-radius: var(--ui-radius-dialog);
      box-shadow: var(--ui-shadow-lg, 0 8px 24px rgb(0 0 0 / 0.12));
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 767px) {
      :host {
        border-radius: var(--ui-radius-dialog) var(--ui-radius-dialog) 0 0;
        border-bottom: none;
      }
    }

    .header {
      display: none;
      align-items: center;
      gap: var(--ui-space-2);
      padding: var(--ui-space-3) var(--ui-space-4);
      border-bottom: 1px solid var(--ui-border-divider);
      font-size: var(--ui-font-size-xs);
      color: var(--ui-text-muted);
      font-weight: var(--ui-font-semibold);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    :host > .header:empty, :host > .footer:empty, :host > .empty:empty {
      display: none;
    }

    .empty {
      padding: var(--ui-space-3);
      color: var(--ui-text-muted);
      font-size: var(--ui-font-size-sm);
    }

    @media (max-width: 767px) {
      .header {
        display: flex;
      }
    }

    .list {
      list-style: none;
      margin: 0;
      padding: var(--ui-space-1) 0;
      overflow-y: auto;
      max-height: 280px;
      overscroll-behavior: contain;
      /* Each edge that hides content fades: the scroll fade every Looma scroller uses (see ui-scroll-area). */
      --_ui-scroll-fade-direction: to bottom;
      --_ui-scroll-fade-size: var(--ui-scroll-fade-size, 24px);
      mask-image: linear-gradient(
        var(--_ui-scroll-fade-direction),
        transparent,
        #000 var(--_ui-scroll-fade-start),
        #000 calc(100% - var(--_ui-scroll-fade-end)),
        transparent
      );
      animation: ui-scroll-fade-start linear, ui-scroll-fade-start-hold linear, ui-scroll-fade-end-hold linear, ui-scroll-fade-end linear;
      animation-timeline: scroll(self block);
      animation-range:
        0 var(--_ui-scroll-fade-size),
        var(--_ui-scroll-fade-size) calc(100% + 1px),
        -1px calc(100% - var(--_ui-scroll-fade-size)),
        calc(100% - var(--_ui-scroll-fade-size)) 100%;
    }

    @media (max-width: 767px) {
      .list {
        max-height: calc(60dvh - 80px);
        padding: var(--ui-space-1) 0 var(--ui-space-2);
      }
    }

    .item {
      display: flex;
      align-items: center;
      gap: var(--ui-space-3);
      padding: var(--ui-space-2) var(--ui-space-3);
      min-height: 44px;
      cursor: pointer;
      transition: background-color 120ms ease;
    }

    .item.active {
      background: var(--ui-accent-subtle, rgb(59 130 246 / 0.1));
    }

    .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: var(--ui-surface-hover);
      border: 1px solid var(--ui-border);
      border-radius: var(--ui-radius-md);
      font-size: var(--ui-font-size-sm);
      font-weight: var(--ui-font-bold);
      color: var(--ui-text-secondary);
      font-family: var(--ui-font-family-mono, ui-monospace, monospace);
      flex-shrink: 0;
      line-height: 1;
    }

    .item.active .icon {
      background: var(--ui-accent);
      border-color: var(--ui-accent);
      color: var(--ui-accent-contrast);
    }

    .icon {
      --_ui-default-icon-size: 1rem;
      --_ui-default-icon-stroke-width: var(--ui-editor-toolbar-icon-stroke-width, 1.75);
    }

    .body {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 1px;
    }

    .title {
      font-size: var(--ui-font-size-sm);
      font-weight: var(--ui-font-medium);
      color: var(--ui-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .description {
      font-size: var(--ui-font-size-xs);
      color: var(--ui-text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .footer {
      padding: var(--ui-space-2) var(--ui-space-3);
      border-top: 1px solid var(--ui-border-divider);
      font-size: var(--ui-font-size-xs);
      color: var(--ui-text-muted);
    }

    :host kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--ui-font-family-mono, ui-monospace, monospace);
      font-size: var(--ui-font-size-2xs);
      background: var(--ui-surface-hover);
      border: 1px solid var(--ui-border);
      border-radius: 3px;
      padding: 0 3px;
      color: var(--ui-text-secondary);
    }

    :host[hidden] {
      display: none;
    }
  </style>
</template>
