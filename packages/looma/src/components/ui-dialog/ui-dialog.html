<template component="ui-dialog" controller="./ui-dialog.js">
  <defs>
    <prop name="open" type="boolean" default="false">Whether the dialog is open initially or when set externally.</prop>
    <prop name="modal" type="boolean" default="false">Open in the top layer with a backdrop and make the rest of the page inert.</prop>
    <prop name="dismissible" type="boolean" default="false"
    >Also close on Escape and on a pointer press outside the dialog. The header close button and actions always close it.</prop>
    <prop name="label" type="string">Visible title in the dialog header; also its accessible name.</prop>
    <prop name="for" type="string" default="">ID of the control that opens the dialog.</prop>
    <state name="internalOpen" :value="false"></state>
    <state name="accessibleLabel" :value="'Dialog'"></state>
    <event
      name="close"
      type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"
    ></event>
  </defs>
  <dialog :aria-label="accessibleLabel">
    <header>
      <h2 class="title" $if="label" $value="label"></h2>
      <button class="close" $ref="close" type="button" aria-label="Close"></button>
    </header>
    <div class="body"><slot></slot></div>
    <footer><slot name="actions"></slot></footer>
  </dialog>
  <style>
    :host {
      position: fixed;
      inset: 0;
      box-sizing: border-box;
      inline-size: min(
        calc(100% - var(--ui-dialog-viewport-gap, var(--ui-space-4)) * 2),
        var(--ui-dialog-max-width, 440px)
      );
      max-inline-size: none;
      max-block-size: calc(100dvh - var(--ui-dialog-viewport-gap, var(--ui-space-4)) * 2);
      margin: auto;
      padding: 0;
      overflow: hidden;
      flex-direction: column;
      background: var(--ui-surface-elevated);
      border: 1px solid var(--ui-border-default);
      border-radius: var(--ui-radius-dialog);
      box-shadow: var(--ui-elevation-dialog, var(--ui-shadow-xl));
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.96);
      transition:
        opacity var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease),
        transform var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease),
        visibility var(--ui-dialog-duration, var(--ui-motion-base)),
        display var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease) allow-discrete,
        overlay var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease) allow-discrete;
    }

    :host[open] {
      display: flex;
      visibility: visible;
      pointer-events: auto;
      opacity: 1;
      transform: scale(1);
      animation: ui-dialog-enter var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease);
    }

    /* Header and actions stay pinned; only the body scrolls when content is long. */
    header {
      display: flex;
      align-items: center;
      gap: var(--ui-space-3);
      flex: none;
      padding: var(--ui-space-3) var(--ui-space-3) var(--ui-space-3) var(--ui-space-5);
      border-block-end: 1px solid var(--ui-border-default);
    }

    /* :host-qualified so page heading rules that reach in cannot outrank the dialog chrome. */
    :host .title {
      flex: 1;
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
      color: var(--ui-text-primary);
      letter-spacing: normal;
      font-size: var(--ui-font-size-lg);
      font-weight: var(--ui-font-semibold);
      line-height: var(--ui-line-height-tight);
    }

    .close {
      display: inline-grid;
      place-items: center;
      flex: none;
      margin-inline-start: auto;
      inline-size: var(--ui-control-size-sm);
      block-size: var(--ui-control-size-sm);
      padding: 0;
      border: 0;
      border-radius: var(--ui-radius-round);
      background: transparent;
      color: var(--ui-text-secondary);
      cursor: pointer;
      transition: background-color var(--ui-motion-fast) var(--ui-motion-ease), color var(--ui-motion-fast) var(--ui-motion-ease);
    }

    /* A CSS-drawn X. */
    .close::before,
    .close::after {
      content: "";
      grid-area: 1 / 1;
      inline-size: 0.875rem;
      block-size: 1.5px;
      border-radius: 1px;
      background: currentColor;
      transform: rotate(45deg);
    }

    .close::after {
      transform: rotate(-45deg);
    }

    .close:hover {
      background: var(--ui-surface-muted);
      color: var(--ui-text-primary);
    }

    .close:focus-visible {
      outline: 2px solid var(--ui-focus-ring);
      outline-offset: 2px;
    }

    /* A touch target, like Button on coarse pointers. */
    @media (pointer: coarse) {
      .close {
        inline-size: var(--ui-control-min-block-size);
        block-size: var(--ui-control-min-block-size);
      }
    }

    html[data-ui-input-modality="touch"] :host .close {
      inline-size: var(--ui-control-min-block-size);
      block-size: var(--ui-control-min-block-size);
    }

    .body {
      flex: 1 1 auto;
      min-block-size: 0;
      overflow: auto;
      overscroll-behavior: contain;
      padding: var(--ui-space-5);
    }

    footer {
      display: flex;
      flex: none;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: var(--ui-space-2);
      padding: var(--ui-space-3) var(--ui-space-5);
      border-block-start: 1px solid var(--ui-border-default);
    }

    footer:empty {
      display: none;
    }

    @keyframes ui-dialog-enter {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
    }

    :host::backdrop {
      background-color: transparent;
      transition:
        background-color var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease),
        display var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease) allow-discrete,
        overlay var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease) allow-discrete;
    }

    :host[open]::backdrop {
      background-color: var(--ui-overlay-backdrop);
      animation: ui-dialog-backdrop-enter var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease);
    }

    @keyframes ui-dialog-backdrop-enter {
      from {
        background-color: transparent;
      }
    }
  </style>
</template>
