<link rel="component" href="../ui-scroll-area/ui-scroll-area.html">
<template component="ui-dialog" controller="./ui-dialog.js">
  <defs>
    <prop name="open" type="boolean" default="false">Whether the dialog is open initially or when set externally.</prop>
    <prop name="modal" type="boolean" default="false"
    >Open in the top layer with a backdrop and make the rest of the page inert until it closes, like native showModal(). Without it the dialog is non-modal,
      like native show().</prop>
    <prop name="modeless" type="boolean" default="false"
    >Deprecated: does nothing, since dialogs are non-modal unless modal is set. Accepted so markup written for 0.15 keeps working; modal wins when both are
      set.</prop>
    <prop name="closedby" type="keyword" values="any, closerequest, none"
    >Which user close requests work: any includes outside presses, closerequest includes Escape, and none requires an action. Unset follows native dialog:
      closerequest when modal, none when not.</prop>
    <prop name="alert" type="boolean" default="false"
    >Use alert dialog semantics and require an explicit action instead of the header close button. An alert dialog is always modal.</prop>
    <prop name="size" type="keyword" values="sm, md, lg, fullscreen" default="md">Choose a compact, standard, wide, or viewport-filling dialog.</prop>
    <prop name="label" type="string">Visible title in the dialog header; also its accessible name.</prop>
    <prop name="for" type="string" default="">ID of the control that opens the dialog.</prop>
    <state type="boolean" name="internalOpen" value="false"></state>
    <state type="string" name="accessibleLabel" value="Dialog"></state>
    <event
      name="open"
      type="object"
    >
      <prop name="open" required type="boolean"></prop>
      <prop name="reason" required type="keyword" values="action, programmatic"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
    <event
      name="close"
      type="object"
    >
      <prop name="open" required type="boolean"></prop>
      <prop name="reason" required type="keyword" values="action, programmatic, light-dismiss, escape"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
  </defs>
  <dialog from:aria-label="accessibleLabel">
    <header>
      <h2 class="title" $if="label">{$label}</h2>
      <button class="close" $ref="close" type="button" aria-label="Close"></button>
    </header>
    <ui-scroll-area class="body" from:fill="true" padding="md"><slot></slot></ui-scroll-area>
    <footer><slot name="actions"></slot></footer>
  </dialog>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-dialog-duration {
      syntax: "*";
      inherits: false;
    }
    @property --ui-dialog-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-dialog-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-dialog-radius {
      syntax: "*";
      inherits: false;
    }
    @property --ui-dialog-shadow {
      syntax: "*";
      inherits: false;
    }
    @property --ui-dialog-max-width {
      syntax: "*";
      inherits: false;
    }
    @property --ui-dialog-viewport-gap {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Hooks do not inherit, so the parts below read them from the root. */
      --_ui-dialog-duration: var(--ui-dialog-duration);

      position: fixed;
      inset: 0;
      box-sizing: border-box;
      inline-size: min(
        calc(100% - var(--ui-dialog-viewport-gap, var(--ui-space-4)) * 2),
        var(--ui-dialog-max-width, var(--_ui-dialog-size, 440px))
      );
      max-inline-size: none;
      max-block-size: calc(100dvh - var(--ui-dialog-viewport-gap, var(--ui-space-4)) * 2);
      margin: auto;
      padding: 0;
      overflow: hidden;
      flex-direction: column;
      background: var(--ui-dialog-surface, var(--ui-overlay-surface, var(--ui-surface-elevated)));
      border: var(--ui-border-width) solid var(--ui-dialog-border, var(--ui-overlay-border, var(--ui-border-strong)));
      border-radius: var(--ui-dialog-radius, var(--ui-overlay-radius, var(--ui-radius-dialog)));
      box-shadow: var(--ui-dialog-shadow, var(--ui-overlay-shadow, var(--ui-elevation-dialog, var(--ui-shadow-xl))));
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.96);
      transition:
        opacity var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease),
        transform var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease),
        visibility var(--ui-dialog-duration, var(--ui-motion-base)),
        display var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease) allow-discrete,
        overlay var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease) allow-discrete;
    }

    :host[open] {
      display: flex;
      visibility: visible;
      pointer-events: auto;
      opacity: 1;
      transform: scale(1);
      animation: ui-dialog-enter var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease);
    }

    :host([size="sm"]) {
      --_ui-dialog-size: 360px;
    }

    :host([size="lg"]) {
      --_ui-dialog-size: 640px;
    }

    :host([size="fullscreen"]) {
      inset: 0;
      inline-size: 100%;
      block-size: 100dvh;
      max-block-size: none;
      margin: 0;
      border-radius: var(--ui-dialog-radius, 0);
    }

    :host([alert]) .close {
      display: none;
    }

    /* Header and actions stay pinned; only the body scrolls when content is long. The body is a
       nested Scroll Area, outside these rules, so its fill and padding are set on the invocation. */
    header {
      display: flex;
      align-items: center;
      gap: var(--ui-space-3);
      flex: none;
      padding: var(--ui-space-3) var(--ui-space-3) var(--ui-space-3) var(--ui-space-5);
    }

    /* :host-qualified so page heading rules that reach in cannot outrank the dialog chrome. */
    :host .title {
      flex: 1;
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      border: 0;
      color: var(--ui-text-primary);
      letter-spacing: normal;
      font-size: var(--ui-font-size-lg);
      font-weight: var(--ui-font-semibold);
      line-height: var(--ui-line-height-tight);
    }

    .close {
      display: inline-grid;
      place-items: center;
      flex: none;
      margin-inline-start: auto;
      inline-size: var(--ui-control-size-sm);
      block-size: var(--ui-control-size-sm);
      padding: 0;
      border: 0;
      border-radius: var(--ui-radius-round);
      background: transparent;
      color: var(--ui-text-secondary);
      cursor: pointer;
      transition: background-color var(--ui-motion-fast) var(--ui-motion-ease), color var(--ui-motion-fast) var(--ui-motion-ease);
    }

    /* A CSS-drawn X. */
    .close::before,
    .close::after {
      content: "";
      grid-area: 1 / 1;
      inline-size: 0.875rem;
      block-size: 1.5px;
      border-radius: 1px;
      background: currentColor;
      transform: rotate(45deg);
    }

    .close::after {
      transform: rotate(-45deg);
    }

    .close:hover {
      background: var(--ui-surface-muted);
      color: var(--ui-text-primary);
    }

    .close:focus-visible {
      outline: var(--ui-focus-width) solid var(--ui-focus-ring);
      outline-offset: var(--ui-focus-width);
    }

    /* A touch target, like Button on coarse pointers. */
    @media (pointer: coarse) {
      .close {
        inline-size: var(--ui-control-min-block-size);
        block-size: var(--ui-control-min-block-size);
      }
    }

    html[data-ui-input-modality="touch"] :host .close {
      inline-size: var(--ui-control-min-block-size);
      block-size: var(--ui-control-min-block-size);
    }

    footer {
      display: flex;
      flex: none;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: var(--ui-space-2);
      padding: var(--ui-space-3) var(--ui-space-5);
    }

    footer:empty {
      display: none;
    }

    @keyframes ui-dialog-enter {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
    }

    :host::backdrop {
      background-color: transparent;
      transition:
        background-color var(--_ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease),
        display var(--_ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease) allow-discrete,
        overlay var(--_ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease) allow-discrete;
    }

    :host[open]::backdrop {
      background-color: var(--ui-overlay-backdrop);
      animation: ui-dialog-backdrop-enter var(--_ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease);
    }

    :host[open][data-ui-backdrop-hidden]::backdrop {
      background-color: transparent;
      animation: none;
      transition: none;
    }

    @keyframes ui-dialog-backdrop-enter {
      from {
        background-color: transparent;
      }
    }
  </style>
</template>
