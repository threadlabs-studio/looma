<link rel="component" href="../ui-scroll-area/ui-scroll-area.html">
<link rel="component" href="../ui-icon-button/ui-icon-button.html">
<link rel="component" href="../ui-icon/ui-icon.html">
<template component="ui-dialog" module="./ui-dialog.js">
  <defs>
    <prop name="open" type="boolean" default="false">Whether the dialog is open initially or when set externally.</prop>
    <prop name="modal" type="boolean" default="false"
    >Open in the top layer with a backdrop and make the rest of the page inert until it closes, like native showModal(). Without it the dialog is non-modal,
      like native show().</prop>
    <prop name="modeless" type="boolean" default="false"
    >Deprecated: does nothing, since dialogs are non-modal unless modal is set. Accepted so markup written for 0.15 keeps working; modal wins when both are
      set.</prop>
    <prop name="closedby" type="keyword" values="any, closerequest, none"
    >Which user close requests work: any includes outside presses, closerequest includes Escape, and none requires an action. Unset follows native dialog:
      closerequest when modal, none when not.</prop>
    <prop name="alert" type="boolean" default="false"
    >Use alert dialog semantics and require an explicit action instead of the header close button. An alert dialog is always modal.</prop>
    <prop name="size" type="keyword" values="sm, md, lg, fullscreen" default="md"
    >Choose a compact, standard, wide, or viewport-filling dialog. Shared surface separation adapts to dialog purpose and rendered size.</prop>
    <prop name="label" type="string">Visible title in the dialog header; also its accessible name.</prop>
    <prop name="for" type="string" default="">ID of the control that opens the dialog.</prop>
    <state type="boolean" name="internalOpen" value="false"></state>
    <state type="string" name="accessibleLabel" value="Dialog"></state>
    <event
      name="open"
      type="object"
    >
      <prop name="open" required type="boolean"></prop>
      <prop name="reason" required type="keyword" values="action, programmatic"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
    <event
      name="close"
      type="object"
    >
      <prop name="open" required type="boolean"></prop>
      <prop name="reason" required type="keyword" values="action, programmatic, light-dismiss, escape"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
  </defs>
  <dialog from:aria-label="$accessibleLabel">
    <header $ref="header">
      <h2 class="title" $if="$label">{$label}</h2>
      <div class="close"><ui-icon-button $ref="close" size="sm" round label="Close"><ui-icon name="x"></ui-icon></ui-icon-button></div>
    </header>
    <div class="body" $ref="body"><ui-scroll-area from:trim="true"><slot></slot></ui-scroll-area></div>
    <footer $ref="footer"><slot name="actions"></slot></footer>
  </dialog>
  <style>
    :host {
      --_ui-material-scale: 1;
      /* Resolve shared part values at the component root. */
      --_ui-dialog-duration: var(--ui-dialog-duration);

      position: fixed;
      inset: 0;
      box-sizing: border-box !important;
      inline-size: min(
        calc(100% - var(--ui-dialog-viewport-gap, var(--ui-space-4)) * 2),
        var(--ui-dialog-max-width, var(--_ui-dialog-size, 440px))
      );
      max-inline-size: none;
      max-block-size: calc(100dvh - var(--ui-dialog-viewport-gap, var(--ui-space-4)) * 2);
      margin: auto !important;
      padding: 0 !important;
      overflow: hidden;
      flex-direction: column !important;
      background: var(--ui-dialog-surface, var(--ui-overlay-surface, var(--ui-surface-elevated)));
      border: var(--ui-border-width) solid var(--ui-dialog-border, var(--ui-overlay-border, var(--ui-border-strong)));
      border-radius: var(--ui-dialog-radius, var(--ui-overlay-radius, var(--ui-radius-dialog)));
      box-shadow: var(--ui-dialog-shadow, var(--ui-overlay-shadow, var(--ui-elevation-dialog, var(--ui-shadow-xl))));
      visibility: hidden;
      pointer-events: none;
      opacity: 0;
      transition:
        opacity var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease),
        visibility var(--ui-dialog-duration, var(--ui-motion-base)),
        display var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease) allow-discrete,
        overlay var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease) allow-discrete;
    }

    /* Purpose and measured size shape one shared separation lever. The content plane stays opaque;
       transparency, frosting and edge light belong to the surrounding decorative material. */
    :host {
      --_ui-material-glassiness: clamp(0, var(--ui-glassiness, 0), 1);
      --_ui-material-separation: clamp(0, var(--ui-surface-separation, 0), 1);
      --_ui-material-active: clamp(0, calc(var(--_ui-material-separation) * 100000), 1);
      --_ui-material-rim: calc(var(--_ui-material-separation) * var(--_ui-material-scale, 1) * 8px);
      --_ui-material-content-color: var(
        --ui-dialog-surface,
        var(--_ui-material-underpaint, var(--ui-material-content, var(--ui-overlay-surface, var(--ui-surface-elevated))))
      );
      --_ui-material-rim-color: color-mix(in srgb, var(--ui-material-glass, var(--ui-surface-elevated)) calc(var(--_ui-material-active) * 100%), transparent);
      background:
        var(--ui-material-highlight, var(--ui-surface-highlight, linear-gradient(transparent, transparent))) padding-box,
        linear-gradient(var(--_ui-material-content-color), var(--_ui-material-content-color)) padding-box,
        linear-gradient(var(--_ui-material-rim-color), var(--_ui-material-rim-color)) border-box;
      border-width: calc(var(--ui-border-width) + var(--_ui-material-rim));
      border-color: var(
        --ui-dialog-border,
        color-mix(in oklab, var(--ui-overlay-border, var(--ui-border-strong)) calc((1 - var(--_ui-material-active)) * 100%), transparent)
      );
      box-shadow: var(
        --ui-dialog-shadow,
        var(
          --ui-overlay-shadow,
          0 calc(var(--_ui-material-separation) * var(--_ui-material-scale, 1) * 8px) calc(
            var(--_ui-material-separation) * var(--_ui-material-scale, 1) * 24px
          ) color-mix(in oklab, var(--ui-text-primary) 15%, transparent),
          var(--ui-material-glow, 0 0 transparent),
          inset 0 0 0 calc(var(--_ui-material-active) * var(--ui-border-width)) var(--ui-material-edge, var(--ui-border-strong)),
          var(--ui-elevation-dialog, var(--ui-shadow-xl))
        )
      );
      -webkit-backdrop-filter: blur(calc(var(--_ui-material-glassiness) * var(--_ui-material-scale, 1) * 32px));
      backdrop-filter: blur(calc(var(--_ui-material-glassiness) * var(--_ui-material-scale, 1) * 32px));
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      :host {
        background: oklch(from var(--_ui-material-content-color) l c h / 1);
      }
    }

    @media (prefers-reduced-transparency: reduce) {
      :host {
        background: oklch(from var(--_ui-material-content-color) l c h / 1);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }

    @media (forced-colors: active) {
      :host {
        background: Canvas;
        border-color: CanvasText;
        box-shadow: none;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }

    :host[open] {
      display: flex !important;
      visibility: visible;
      pointer-events: auto;
      opacity: 1;
      animation: ui-dialog-enter var(--ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease);
    }

    :host([size="sm"]) {
      --_ui-dialog-size: 360px;
    }

    :host([size="lg"]) {
      --_ui-dialog-size: 640px;
    }

    :host([size="fullscreen"]) {
      inset: 0;
      inline-size: 100%;
      block-size: 100dvh;
      max-block-size: none;
      margin: 0 !important;
      border-radius: var(--ui-dialog-radius, 0);
    }

    :host([alert]) .close {
      display: none !important;
    }

    /* Own the layout wrapper; nested component roots are outside these scoped rules. */
    header {
      display: flex !important;
      align-items: center !important;
      gap: var(--ui-space-3) !important;
      flex: none;
      /* The title's ink sits inside its line box and the taller close target. Balance that
         visible top inset against the action row's bottom inset, not just the boxes. */
      padding: calc(var(--ui-space-3) + var(--ui-space-1) / 2) var(--ui-space-3) var(--ui-space-3) var(--ui-space-5) !important;
    }

    /* Alerts have no close target to add height above the title. */
    :host([alert]) header {
      padding: var(--ui-space-5) var(--ui-space-5) var(--ui-space-3) !important;
    }

    /* :host-qualified so page heading rules that reach in cannot outrank the dialog chrome. */
    :host .title {
      flex: 1;
      min-inline-size: 0;
      margin: 0 !important;
      padding: 0 !important;
      border: 0;
      color: var(--ui-text-primary);
      letter-spacing: normal;
      font-size: var(--ui-font-size-lg);
      font-weight: var(--ui-font-semibold);
      line-height: var(--ui-line-height-tight);
    }

    .close {
      display: flex !important;
      align-items: center !important;
      flex: none !important;
      margin-inline-start: auto !important;
    }

    .body {
      display: flex !important;
      flex-direction: column !important;
      flex: 1 1 auto;
      min-block-size: 0;
      padding: var(--ui-space-3) var(--ui-space-5) var(--ui-space-5) !important;
    }

    footer {
      display: flex !important;
      flex: none;
      flex-wrap: wrap !important;
      justify-content: flex-end !important;
      gap: var(--ui-space-2) !important;
      padding: 0 var(--ui-space-5) var(--ui-space-5) !important;
    }

    footer:empty {
      display: none !important;
    }

    @keyframes ui-dialog-enter {
      from {
        opacity: 0;
      }
    }

    :host::backdrop {
      background-color: transparent;
      transition:
        background-color var(--_ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease),
        display var(--_ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease) allow-discrete,
        overlay var(--_ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease) allow-discrete;
    }

    :host[open]:modal::backdrop {
      background-color: var(--ui-overlay-backdrop);
      animation: ui-dialog-backdrop-enter var(--_ui-dialog-duration, var(--ui-motion-base)) var(--ui-motion-ease);
    }

    :host[open][data-ui-backdrop-hidden]::backdrop {
      background-color: transparent;
      animation: none;
      transition: none;
    }

    @keyframes ui-dialog-backdrop-enter {
      from {
        background-color: transparent;
      }
    }
  </style>
</template>
