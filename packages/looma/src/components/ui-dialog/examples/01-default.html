<!--
title: Default
description: Without modal a dialog is non-modal, like native show(): the rest of the page stays usable and the header close button is its exit. Label becomes the header title beside that button. Buttons in the actions slot sit right-aligned in the footer, secondary first and primary last; native command="close" closes the dialog.
-->
<ui-button id="open-confirmation">Review Fellowship memo</ui-button>
<ui-dialog id="confirmation-dialog" for="open-confirmation" label="Send Fellowship memo?">
  <p>Frodo and Sam will receive the updated route. Sméagol is keeping the meeting notes.</p>
  <ui-button slot="actions" commandfor="confirmation-dialog" command="close">Keep draft</ui-button>
  <ui-button slot="actions" variant="solid" commandfor="confirmation-dialog" command="close">Send memo</ui-button>
</ui-dialog>
