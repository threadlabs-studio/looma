<!--
title: Sizes
description: Use size for a common width. --ui-dialog-max-width is the one-off width escape hatch. This dialog is non-modal, so the rest of the page remains interactive.
-->
<ui-button id="open-wide-dialog">Open wide dialog</ui-button>
<ui-dialog id="wide-dialog" for="open-wide-dialog" size="lg" label="Reference details">
  <p>Keep the rest of the page available while reviewing these details.</p>
  <ui-button slot="actions" commandfor="wide-dialog" command="close">Done</ui-button>
</ui-dialog>
