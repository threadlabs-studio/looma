<!--
title: Outside dismissal
description: Escape closes a dialog by default; closedby="any" also closes it after a press outside.
-->
<ui-button id="open-dismissible-dialog">Open dismissible dialog</ui-button>
<ui-dialog id="dismissible-dialog" for="open-dismissible-dialog" closedby="any" label="Keyboard shortcuts">
  <p>Press <kbd>Escape</kbd> or click the backdrop to close this dialog.</p>
</ui-dialog>
