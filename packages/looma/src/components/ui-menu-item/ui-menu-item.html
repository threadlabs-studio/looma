<link rel="component" href="../ui-icon/ui-icon.html">
<template component="ui-menu-item" controller="./ui-menu-item.js">
  <defs>
    <prop name="disabled" type="boolean" default="false"
    >Makes the item unavailable: it is faded, skipped by the arrow keys, and choosing it does nothing. It stays visible and is announced as disabled.</prop>
    <prop name="value" type="string" default=""
    >The value the enclosing menu reports in its select event when this item is chosen. Give each item a distinct value so one handler can tell them
      apart.</prop>
    <prop name="href" type="string" default="">A destination makes an action item a real link, with native navigation and link context actions.</prop>
    <prop name="type" type="keyword" values="action, checkbox, radio" default="action"
    >An action closes its menu; a checkbox toggles, and a radio chooses one item within its nearest Menu Group. Checkable items keep the menu open.</prop>
    <prop name="checked" type="boolean" default="false">Initial or externally controlled checked state of a checkbox or radio item.</prop>
    <state type="boolean" name="internalChecked" value="false"></state>
    <event name="change" type="object">
      <prop name="checked" required type="boolean"></prop>
      <prop name="value" required type="string"></prop>
      <prop name="type" required type="keyword" values="checkbox, radio"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
  </defs>
  <template $match>
    <a
      $when="href and type = 'action'"
      role="menuitem"
      tabindex="-1"
      from:aria-disabled="disabled"
      from:data-value="value"
      from:href="{ true: null, false: href }[format('%s', disabled)]"
    >
      <span class="label"><slot></slot></span>
      <span class="shortcut" aria-hidden="true"><slot name="shortcut"></slot></span>
    </a>
    <div
      $else
      from:role="{ action: 'menuitem', checkbox: 'menuitemcheckbox', radio: 'menuitemradio' }[type]"
      from:aria-checked="{ action: null, checkbox: internalChecked, radio: internalChecked }[type]"
      tabindex="-1"
      from:aria-disabled="disabled"
      from:data-value="value"
    >
      <span class="indicator" aria-hidden="true">
        <ui-icon $if="(type = 'checkbox' or type = 'radio') and internalChecked" name="check"></ui-icon>
      </span>
      <span class="label"><slot></slot></span>
      <span class="shortcut" aria-hidden="true"><slot name="shortcut"></slot></span>
    </div>
  </template>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-menu-item-font-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-menu-item-hover-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-menu-item-min-block-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-menu-item-padding-block {
      syntax: "*";
      inherits: false;
    }
    @property --ui-menu-item-padding-inline {
      syntax: "*";
      inherits: false;
    }
    @property --ui-menu-item-radius {
      syntax: "*";
      inherits: false;
    }

    :host {
      display: flex;
      align-items: center;
      gap: var(--ui-space-2);
      box-sizing: border-box;
      width: 100%;
      padding: var(--ui-menu-item-padding-block, var(--_ui-default-menu-item-padding-block, var(--ui-space-2)))
        var(--ui-menu-item-padding-inline, var(--_ui-default-menu-item-padding-inline, var(--ui-space-3)));
      text-align: left;
      border-radius: var(--ui-menu-item-radius, var(--_ui-default-menu-item-radius, var(--ui-selection-radius)));
      color: var(--ui-text-primary);
      font-size: var(--ui-menu-item-font-size, var(--_ui-default-menu-item-font-size, var(--ui-font-size-md)));
      font-weight: var(--ui-font-medium);
      text-decoration: none;
      cursor: pointer;
      outline: none;
      transition: background-color var(--ui-motion-fast) var(--ui-motion-ease), color var(--ui-motion-fast) var(--ui-motion-ease);
    }

    .label {
      display: flex;
      align-items: center;
      gap: var(--ui-space-2);
      flex: 1;
      min-inline-size: 0;
    }

    .indicator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
      box-sizing: border-box;
      inline-size: var(--_ui-default-menu-indicator-size, var(--ui-icon-size-sm));
      block-size: var(--_ui-default-menu-indicator-size, var(--ui-icon-size-sm));
      border: var(--ui-border-width) solid var(--ui-control-border);
      border-radius: var(--ui-radius-sm);
      color: var(--ui-surface);
      --_ui-default-icon-size: 0.75rem;
    }

    :host-state([type="action"]) .indicator {
      display: none;
    }

    :host-state([type="checkbox"])[aria-checked="true"] .indicator {
      border-color: var(--ui-accent);
      background: var(--ui-accent);
    }

    /* A menu marks its chosen item with a check, as menus conventionally do; a radio circle reads
       as a form control. The empty slot keeps unchosen labels aligned with the chosen one. */
    :host-state([type="radio"]) .indicator {
      border-color: transparent;
      color: var(--ui-text-secondary);
    }

    .shortcut {
      margin-inline-start: auto;
      color: var(--ui-text-secondary);
      font-size: var(--ui-font-size-sm);
      font-weight: var(--ui-font-normal);
    }

    .shortcut:empty {
      display: none;
    }

    /* A <kbd> takes the browser's monospace; the hint reads in the item's own type. */
    .shortcut :slotted(kbd) {
      font: inherit;
    }

    /* Keep the text row at the shared control height where cap trimming is available. */
    @supports (text-box-trim: trim-both) {
      :host {
        min-block-size: var(--ui-menu-item-min-block-size, var(--_ui-default-menu-item-min-block-size, var(--ui-control-size-md, 2.5rem)));
        text-box-trim: trim-both;
        text-box-edge: cap alphabetic;
      }
    }

    :host:is(:hover, :focus-visible):not([aria-disabled="true"]) {
      background: var(--ui-menu-item-hover-surface, var(--ui-surface-subtle));
    }

    :host:focus-visible {
      outline: var(--ui-focus-width) solid var(--ui-focus-ring);
      outline-offset: calc(-1 * var(--ui-focus-width));
    }

    :host[aria-disabled="true"] {
      background: var(--ui-disabled-surface);
      color: var(--ui-disabled-text);
      cursor: not-allowed;
    }

    :host[aria-disabled="true"] .indicator {
      border-color: var(--ui-disabled-border);
      background: transparent;
      color: var(--ui-disabled-text);
    }

    :host[aria-disabled="true"] .indicator::after {
      background: var(--ui-disabled-text);
    }

    @media (forced-colors: active) {
      :host:focus-visible {
        outline-color: Highlight;
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
