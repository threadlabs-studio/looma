<!--
title: Theme sampler
description: A compact collection of real controls and a surface for judging a shared theme together.
-->
<ui-card treatment="expressive"><ui-stack gap="l">
    <ui-cluster gap="xs" justify="between"><ui-text variant="eyebrow">Fellowship office</ui-text><ui-badge tone="success">Ready</ui-badge></ui-cluster>
    <ui-stack gap="s"><ui-text variant="heading" as="h3">Second breakfast, sorted.</ui-text>
      <ui-text>Frodo plans. Sam follows through.</ui-text>
      <ui-text variant="caption">Briefing at nine · Bring the maps.</ui-text></ui-stack>
    <ui-cluster>
      <ui-button variant="solid" tone="accent" title="Solid accent">Send</ui-button>
      <ui-button variant="outline" tone="accent" title="Outline accent">Save</ui-button>
      <ui-button variant="solid" tone="neutral" title="Solid neutral">File</ui-button>
      <ui-button variant="outline" tone="neutral" title="Outline neutral">Archive</ui-button>
      <ui-icon-button variant="outline" tone="neutral" match-button label="Acknowledge memo"><ui-icon name="circle-check"></ui-icon></ui-icon-button>
      <ui-button variant="ghost" tone="neutral" title="Ghost neutral">Later</ui-button>
    </ui-cluster>
    <ui-input-group><ui-icon slot="prefix" name="search"></ui-icon><ui-input
        aria-label="Search office"
        placeholder="Search Fellowship office"
      ></ui-input></ui-input-group>
    <ui-cluster><ui-checkbox checked>Notify Sam</ui-checkbox><ui-switch checked>Available</ui-switch><ui-badge tone="accent">Draft</ui-badge></ui-cluster>
  </ui-stack></ui-card>
