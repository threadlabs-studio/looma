<!--
title: Bounded rows with all items available
description: Reserve an overflow action and an always-visible trailing action within three rows. The popup contains the complete collection.
-->
<ui-container fill>
  <ui-stack>
    <ui-cluster max-rows="3" gap="xs">
      <ui-badge>Research and discovery</ui-badge>
      <ui-badge>Interface design</ui-badge>
      <ui-badge>Content strategy</ui-badge>
      <ui-badge>Accessibility review</ui-badge>
      <ui-badge>Implementation</ui-badge>
      <ui-badge>Testing and delivery</ui-badge>
      <ui-button slot="overflow" id="bounded-all-items" size="sm" variant="ghost">All items…</ui-button>
      <ui-button slot="trailing" size="sm" variant="ghost">Add item</ui-button>
    </ui-cluster>
    <ui-popover for="bounded-all-items" role="region" label="All items">
      <ui-cluster gap="xs">
        <ui-badge>Research and discovery</ui-badge>
        <ui-badge>Interface design</ui-badge>
        <ui-badge>Content strategy</ui-badge>
        <ui-badge>Accessibility review</ui-badge>
        <ui-badge>Implementation</ui-badge>
        <ui-badge>Testing and delivery</ui-badge>
      </ui-cluster>
    </ui-popover>
  </ui-stack>
</ui-container>
