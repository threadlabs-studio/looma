<!--
title: wrap="nowrap"
description: Nowrap keeps a small group on one row, so a meter stays beside its amount even in a narrow space.
-->
<div style="max-width: 6rem">
  <ui-cluster gap="s" wrap="nowrap">
    <ui-meter size="sm" value="750" max="1240" tone="info" label="Collected" value-text="$750 of $1,240"></ui-meter>
    $750.00
  </ui-cluster>
</div>
