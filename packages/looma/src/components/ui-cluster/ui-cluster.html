<template component="ui-cluster">
  <defs>
    <prop name="padding" type="keyword" values="none, s, m, l" default="none"
    >Optional internal space for an action group, using the shared spacing scale.</prop>
    <prop name="paddingEnd" type="keyword" values="none, s, m, l, xl" default="none"
    >Optional extra space at the inline end, such as clearance beside another control. xl is 4rem.</prop>
    <prop name="fixed" type="boolean" default="false">Keeps this group at its content size inside a flex layout.</prop>
    <prop name="gap" type="keyword" values="xs, s, m, l, xl"
    >Space between items, on the spacing scale: xs is 0.5rem, s 0.75rem (also the default), m 1rem, l 1.5rem, and xl 2rem. The --ui-cluster-gap custom property,
      set on :root, an ancestor, or the component itself, overrides it.</prop>
    <prop name="align" type="keyword" values="start, center, end, stretch, baseline"
    >How items line up within each row: center (the default) aligns their middles, start their tops, end their bottoms, and stretch makes every item as tall as
      its row. baseline aligns the first text baselines, including multiline columns.</prop>
    <prop name="justify" type="keyword" values="start, center, end, between"
    >Where items sit along each row: start (the default), center, end, or between, which pushes the first and last items to the ends of the row and spreads the
      spare space between them, as for a title with its actions.</prop>
    <prop name="wrap" type="keyword" values="wrap, nowrap"
    >Whether items move onto a new row when they run out of space: wrap (the default) or nowrap, which keeps them on one row at their own sizes. Use nowrap for
      a small group that must read as one unit, such as a meter and its value in a table cell, so the cell grows to fit it; a whole row of actions should keep
      wrapping so it fits narrow screens.</prop>
  </defs>
  <div><slot></slot></div>
  <style>
    :host {
      --_layout-gap: var(--ui-space-3);
      display: flex !important;
      flex-wrap: wrap !important;
      align-items: center !important;
      gap: var(--ui-cluster-gap, var(--_layout-gap)) !important;
      min-inline-size: 0;
      max-inline-size: 100%;
      margin: 0 !important;
    }

    :host([fixed]) {
      flex: none;
    }
    :host([padding="s"]) {
      padding: var(--ui-space-2) !important;
    }
    :host([padding="m"]) {
      padding: var(--ui-space-3) !important;
    }
    :host([padding="l"]) {
      padding: var(--ui-space-4) !important;
    }
    :host([paddingEnd="s"]) {
      padding-inline-end: var(--ui-space-2) !important;
    }
    :host([paddingEnd="m"]) {
      padding-inline-end: var(--ui-space-3) !important;
    }
    :host([paddingEnd="l"]) {
      padding-inline-end: var(--ui-space-4) !important;
    }
    :host([paddingEnd="xl"]) {
      padding-inline-end: calc(var(--ui-space-4) * 4) !important;
    }

    :host([gap="xs"]) {
      --_layout-gap: var(--ui-space-2);
    }
    :host([gap="s"]) {
      --_layout-gap: var(--ui-space-3);
    }
    :host([gap="m"]) {
      --_layout-gap: var(--ui-space-4);
    }
    :host([gap="l"]) {
      --_layout-gap: var(--ui-space-5);
    }
    :host([gap="xl"]) {
      --_layout-gap: var(--ui-space-6);
    }
    :host([align="start"]) {
      align-items: flex-start !important;
    }
    :host([align="end"]) {
      align-items: flex-end !important;
    }
    :host([align="baseline"]) {
      align-items: baseline !important;
    }
    :host([align="stretch"]) {
      align-items: stretch !important;
    }
    :host([justify="center"]) {
      justify-content: center !important;
    }
    :host([justify="end"]) {
      justify-content: flex-end !important;
    }
    :host([justify="between"]) {
      justify-content: space-between !important;
    }
    :host([wrap="nowrap"]) {
      flex-wrap: nowrap !important;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
