<!--
title: Edit a date range
description: Type or paste either endpoint, or use its calendar action. Moving Start while it remains before End preserves End. Crossing either endpoint collapses the range to the edited date.
-->
<ui-date-range-picker
  value="{ start: '2026-10-10', end: '2026-10-15' }"
  start-name="from"
  end-name="to"
  start-input-id="range-start"
  end-input-id="range-end"
  locale="en-US"
></ui-date-range-picker>
