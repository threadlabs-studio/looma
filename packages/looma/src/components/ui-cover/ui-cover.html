<template component="ui-cover">
  <defs>
    <prop name="size" type="keyword" values="screen, fill" default="screen"
    >How tall the cover is. screen is at least the viewport's height, for a view that is one centred card, such as sign-in; fill takes the space its parent
      gives it.</prop>
  </defs>
  <div><slot></slot></div>
  <style>
    /* A layout primitive that centres its content in the space, both ways, with room around it: the
       frame for a view that is one card or one message. */
    :host {
      display: flex !important;
      flex-direction: column !important;
      /* Safe: a child wider than the cover keeps its start edge in view instead of overflowing both ways. */
      align-items: safe center !important;
      justify-content: center !important;
      gap: var(--ui-space-6) !important;
      box-sizing: border-box !important;
      min-block-size: 100dvh;
      padding: var(--ui-space-6) var(--ui-space-4) !important;
    }

    :host([size="fill"]) {
      flex: 1;
      min-block-size: 100%;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
