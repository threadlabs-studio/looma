<template component="ui-tree-item" controller="./ui-tree-item.js">
  <defs>
    <prop name="itemId" type="string" default=""
    >The item's identifier, reported as sourceId and targetId in the tree's reorder events and as id in its expand event. A sortable item needs one to be
      dragged, and a drop onto an item without one is not reported.</prop>
    <prop name="label" type="string" default="">The item's accessible name, also shown as the row text unless the label slot supplies content.</prop>
    <prop name="dropDepth" type="number"
    >Overrides the level this item counts as when the tree checks maxDepth for a drop onto it. Unset, its level in the rendered tree is used; set it when the
      item sits deeper in the real hierarchy than the rendered tree shows.</prop>
    <prop name="subtreeDepth" type="number"
    >Overrides how many levels sit beneath this item when the tree checks maxDepth for a drag of it. Unset, the tree counts the rendered descendants; set it
      when some are not rendered, such as children that load later.</prop>
    <prop name="container" type="boolean" default="false"
    >Makes the item a branch even before it has children: it gets the expand button and aria-expanded, and accepts drops inside it. An item with nested items is
      a branch without it.</prop>
    <prop name="sortable" type="boolean" default="false"
    >Gives the item a drag handle, shown on hover, so it can be dragged to a new place in the tree. The tree reports the drop as a reorder event and leaves
      moving the item to you. Needs itemId; a disabled item, and any item under touch input, shows no handle.</prop>
    <prop name="dragType" type="string" default="item"
    >The item's kind, for drag rules: it can be dropped before or after only items of the same type, and inside a branch only if that branch's accepts allows
      it. Reported as sourceType and targetType.</prop>
    <prop name="dropScope" type="string" default=""
    >Names the list the item sits in, such as its parent's id, and is reported as sourceScope and targetScope in the tree's reorder events, so a handler can
      tell a reorder within one list from a move between lists. It never restricts where an item can be dropped; dragType and accepts do that.</prop>
    <prop name="accepts" type="string" default=""
    >A comma-separated list of the dragType values this branch accepts dropped inside it. Empty accepts any type. It does not affect drops before or after the
      item.</prop>
    <prop name="expanded" type="boolean" default="false"
    >Whether the branch shows its children, initially or when set externally. The expand button, a click on the row, and the arrow keys toggle it from there,
      each reported as an expand event. Only meaningful for a branch.</prop>
    <prop name="selected" type="boolean" default="false"
    >Marks the item selected: it sets aria-selected and gives the row the highlighted surface. The tree does not select on click, so drive it from your own
      state.</prop>
    <prop name="disabled" type="boolean" default="false"
    >Makes the item unavailable: faded, skipped by keyboard navigation, unable to expand or be dragged, and closed to drops inside it.</prop>
    <state name="internalExpanded" :value="false"></state>
    <state name="structuralLevel" :value="1"></state>
    <state name="tabStop" :value="false"></state>
    <state name="isContainer" :value="false"></state>
    <event name="expand" bubbles="false" type="object({ id: string, expanded: boolean, trigger: keyboard | pointer | programmatic })"></event>
  </defs>
  <div
    role="treeitem"
    :aria-label="label"
    :aria-level="structuralLevel"
    :aria-selected="selected"
    :aria-disabled="disabled"
    :data-item-id="itemId"
    :data-drag-type="dragType"
    :data-drop-scope="dropScope"
    :data-accepts="accepts"
    :data-drop-depth="dropDepth"
    :data-subtree-depth="subtreeDepth"
  >
    <div class="row" $ref="row">
      <button
        $if="sortable and not disabled"
        class="drag-handle"
        $ref="dragHandle"
        type="button"
        draggable="true"
        :aria-label="format('Drag %s to reorder', label)"
      >
        <svg
          aria-hidden="true"
          focusable="false"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="9" cy="12" r="1"></circle>
          <circle cx="9" cy="5" r="1"></circle>
          <circle cx="9" cy="19" r="1"></circle>
          <circle cx="15" cy="12" r="1"></circle>
          <circle cx="15" cy="5" r="1"></circle>
          <circle cx="15" cy="19" r="1"></circle>
        </svg>
      </button>
      <button class="disclosure" $ref="disclosure" type="button" :disabled="disabled" :hidden="not isContainer">
        <span class="disclosure-icon" aria-hidden="true"></span>
      </button>
      <span class="leading"><slot name="leading"></slot></span>
      <span class="label"><slot name="label"><template $value="label"></template></slot></span>
      <span class="actions" $ref="actions"><slot name="actions"></slot></span>
      <span class="drop-indicator row-drop-indicator" aria-hidden="true"></span>
    </div>
    <div class="children" $ref="children" role="group" :hidden="not (isContainer and internalExpanded)"><slot></slot></div>
    <span class="drop-indicator subtree-drop-indicator" aria-hidden="true"></span>
  </div>
  <style>
    :host {
      --_tree-row-min-height: 32px;
      --_tree-disclosure-size: 16px;

      position: relative;
      display: block;
      min-inline-size: 0;
      margin-inline-start: calc(var(--ui-tree-item-depth, 0) * var(--ui-tree-indent, 16px));
    }

    .row {
      position: relative;
      display: grid;
      grid-template-columns: var(--_tree-disclosure-size) auto minmax(0, 1fr);
      align-items: center;
      min-block-size: var(--ui-tree-item-min-block-size, var(--_tree-row-min-height));
      min-inline-size: 0;
      font-size: var(--ui-tree-item-font-size, var(--ui-font-size-sm));
      border-radius: var(--ui-radius-md);
      color: var(--ui-text-secondary);
      transition:
        background-color var(--ui-motion-fast) var(--ui-motion-ease),
        color var(--ui-motion-fast) var(--ui-motion-ease),
        opacity var(--ui-motion-fast) var(--ui-motion-ease),
        box-shadow var(--ui-motion-fast) var(--ui-motion-ease),
        min-block-size var(--ui-motion-base) var(--ui-motion-ease);
    }

    .row:hover,
    :host-state([selected]) .row,
    .row:focus-within {
      color: var(--ui-text-primary);
      background: var(--ui-surface-muted);
    }

    :host-state([disabled]) .row {
      opacity: 0.55;
    }

    :host[data-dragging] .row {
      opacity: 0.42;
    }

    :host:focus {
      outline: none;
    }

    :host:focus-visible .row {
      box-shadow: 0 0 0 2px var(--ui-focus-ring);
    }

    /* Child combinators: drop feedback belongs to this item's own row, not the rows nested in it. */
    :host[data-drop-position="inside"] > .row {
      background: var(--ui-accent-subtle);
      box-shadow: inset 0 0 0 1px var(--ui-tree-drop-color, var(--ui-accent-solid));
    }

    .disclosure,
    .disclosure-spacer {
      grid-column: 1;
      grid-row: 1;
      inline-size: var(--_tree-disclosure-size);
      block-size: 28px;
    }

    .disclosure {
      display: grid;
      /* Start-aligned: the chevron's ink, not its hit area, aligns with the content above it. */
      place-items: center start;
      padding: 0;
      color: var(--ui-text-muted);
      background: transparent;
      border: 0;
      border-radius: var(--ui-radius-sm);
      cursor: pointer;
    }

    .disclosure[hidden] {
      display: none;
    }

    .disclosure:hover {
      color: var(--ui-text-primary);
      background: var(--ui-surface-elevated);
    }

    .disclosure-icon {
      display: grid;
      place-items: center;
      inline-size: 12px;
      block-size: 12px;
      transform: rotate(-90deg);
      transition: transform var(--ui-motion-fast) var(--ui-motion-ease);
    }

    .disclosure-icon::before {
      display: block;
      inline-size: 0.375rem;
      block-size: 0.375rem;
      border-inline-end: 1.5px solid currentColor;
      border-block-end: 1.5px solid currentColor;
      content: "";
      /* A chevron's ink sits below its box centre; lift it so it centres optically (in either rotation). */
      transform: translateY(-20%) rotate(45deg);
    }

    :host[aria-expanded="true"] .disclosure-icon {
      transform: rotate(0deg);
    }

    /* Lucide grip-vertical, filling the handle as in Looma 0.2. */
    .drag-handle svg {
      display: block;
      inline-size: 100%;
      block-size: 100%;
    }

    /* Slotted content is outside this scope, so :has() cannot see it; hide only a truly empty slot. */
    .leading {
      display: inline-grid;
      place-items: center;
      grid-column: 2;
      grid-row: 1;
      inline-size: 1em;
      block-size: 1em;
      margin-inline-start: var(--ui-space-1);
      color: var(--ui-text-muted);
    }

    .leading:empty {
      display: none;
    }

    /* Icons match the label's size (as in Knit's tree): an unsized SVG would otherwise render 300×150. */
    :slotted(svg),
    :slotted(img) {
      display: block;
      inline-size: 1em;
      block-size: 1em;
      flex: none;
    }

    /* The label spans the row's height and centres its content, so slotted content (a link) can
       stretch to fill the row as its own hit area; the padding tokens remove the inset. */
    .label {
      grid-column: 3;
      grid-row: 1;
      align-self: stretch;
      display: flex;
      align-items: center;
      min-inline-size: 0;
      padding: var(--ui-tree-item-label-padding-block, var(--ui-space-1)) var(--ui-tree-item-label-padding-inline, var(--ui-space-2));
    }

    /* Slotted label content fills the cell, so a link is the row's hit area rather than sizing to
       its own text and reading as overflow. */
    .label > :slotted(*) {
      flex: 1 1 auto;
      min-inline-size: 0;
    }

    /* The controls sit over the label's end, so the text fades out where they begin. The fade is
       the truncation mark while it shows: an ellipsis under it would read as a second one. */
    .row:hover > .label,
    .row:focus-within > .label {
      text-overflow: clip;
      mask-image: linear-gradient(
        to right,
        #000 calc(100% - var(--_tree-actions-width, 1.75rem) - var(--ui-space-3)),
        transparent calc(100% - var(--_tree-actions-width, 1.75rem))
      );
    }

    .row:hover > .label:dir(rtl),
    .row:focus-within > .label:dir(rtl) {
      mask-image: linear-gradient(
        to left,
        #000 calc(100% - var(--_tree-actions-width, 1.75rem) - var(--ui-space-3)),
        transparent calc(100% - var(--_tree-actions-width, 1.75rem))
      );
    }

    .row:hover > .label > :slotted(*),
    .row:focus-within > .label > :slotted(*) {
      text-overflow: clip;
    }

    .actions {
      position: absolute;
      z-index: 1;
      inset-block: 0;
      inset-inline-end: 0;
      display: inline-flex;
      align-items: center;
      min-inline-size: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--ui-motion-fast) var(--ui-motion-ease);
    }

    .row:hover > .actions,
    .row:focus-within > .actions {
      opacity: 1;
      pointer-events: auto;
    }

    /* Without hover there is no reveal, so the controls keep their own column. */
    @media (hover: none) {
      .row {
        grid-template-columns: var(--_tree-disclosure-size) auto minmax(0, 1fr) auto;
      }

      .actions {
        position: static;
        grid-column: 4;
        grid-row: 1;
        padding-inline-start: 0;
        background: none;
        opacity: 1;
        pointer-events: auto;
      }
    }

    .drag-handle {
      position: absolute;
      z-index: 2;
      inset-block-start: 50%;
      inset-inline-start: -22px;
      inline-size: 20px;
      block-size: 32px;
      display: grid;
      place-items: center;
      padding: 7px 3px;
      color: var(--ui-text-muted);
      background: var(--ui-surface-elevated);
      border: 1px solid transparent;
      border-radius: var(--ui-radius-sm);
      cursor: grab;
      /* Hidden until the row is hovered, but always hittable: the handle sits outside the row, and moving
         the pointer onto it must not hide it on the way. */
      opacity: 0;
      transform: translateY(-50%);
      transition: opacity var(--ui-motion-fast) var(--ui-motion-ease);
    }

    .row:hover .drag-handle,
    .drag-handle:hover,
    .drag-handle:focus-visible,
    :host[data-dragging] > .row > .drag-handle {
      opacity: 1;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .drop-indicator {
      position: absolute;
      z-index: 3;
      inset-inline: 1px;
      display: none;
      block-size: 2px;
      border-radius: 999px;
      background: var(--ui-tree-drop-color, var(--ui-accent-solid));
      pointer-events: none;
    }

    .drop-indicator::before,
    .drop-indicator::after {
      content: "";
      position: absolute;
      inset-block-start: 50%;
      inline-size: 7px;
      block-size: 7px;
      border: 2px solid var(--ui-tree-drop-color, var(--ui-accent-solid));
      border-radius: 999px;
      background: var(--ui-surface-elevated);
      transform: translateY(-50%);
    }

    .drop-indicator::before {
      inset-inline-start: -1px;
    }
    .drop-indicator::after {
      inset-inline-end: -1px;
    }

    :host[data-drop-position="before"] > .row > .row-drop-indicator {
      display: block;
      inset-block-start: -1px;
    }

    :host[data-drop-position="after"] > .subtree-drop-indicator {
      display: block;
      inset-block-end: -1px;
    }

    .children[hidden] {
      display: none;
    }

    html[data-ui-input-modality="touch"] :host {
      --_tree-row-min-height: 44px;
    }

    html[data-ui-input-modality="touch"] :host .drag-handle {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .row,
      .disclosure-icon,
      .drag-handle {
        transition: none;
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
