<template component="ui-callout">
  <defs>
    <prop name="tone" type="keyword" values="info, neutral, note, tip, important, warning, caution, success, danger" default="info"
    >Which kind of message the callout carries, shown by its icon and colour: info (the default) for information, note or neutral for a muted aside, tip for
      advice, important for something the reader must not miss, warning for a caution, danger (or its alias caution) for a harmful consequence, and success for
      a confirmation. These are the tones of VitePress, Docusaurus and GitHub alerts.</prop>
    <prop name="heading" type="string" default=""
    >A short heading above the message, such as "Before you upgrade". Optional; without it the message stands alone.</prop>
  </defs>
  <div role="note">
    <span class="icon" aria-hidden="true">
      <svg $if="$tone = 'info'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 16v-4"></path>
        <path d="M12 8h.01"></path>
      </svg>
      <svg
        $if="$tone = 'neutral' or $tone = 'note'"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M13.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8.5L13.5 2Z"></path>
        <path d="M13 2v7h7"></path>
        <path d="m9.5 17.5 4-4 2 2-4 4H9.5v-2Z"></path>
      </svg>
      <svg $if="$tone = 'tip'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"></path>
        <path d="M9 18h6"></path>
        <path d="M10 22h4"></path>
      </svg>
      <svg $if="$tone = 'important'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"></path>
        <path d="M12 15h.01"></path>
        <path d="M12 7v4"></path>
      </svg>
      <svg $if="$tone = 'warning'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
        <path d="M12 9v4"></path>
        <path d="M12 17h.01"></path>
      </svg>
      <svg $if="$tone = 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="m9 12 2 2 4-4"></path>
      </svg>
      <svg
        $if="$tone = 'danger' or $tone = 'caution'"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10"></circle>
        <path d="m15 9-6 6"></path>
        <path d="m9 9 6 6"></path>
      </svg>
    </span>
    <div class="content">
      <strong class="heading" $if="$heading">{$heading}</strong>
      <slot></slot>
    </div>
  </div>
  <style>
    :host {
      /* Resolve shared part values at the component root. */
      --_ui-callout-icon-column: var(--ui-callout-icon-column);
      --_ui-callout-icon: var(--ui-callout-icon);
      --_ui-callout-icon-size: var(--ui-callout-icon-size);

      --_callout-surface: var(--ui-info-soft);
      --_callout-tone-text: var(--ui-info-subtle-text);
      --_ui-surface-text: var(--ui-callout-text, var(--_callout-tone-text));
      --_ui-selection-context-surface: light-dark(
        oklch(from var(--ui-callout-surface, var(--_callout-surface)) calc(l - 0.045) calc(max(c, min(0.045, c * 3))) h),
        oklch(from var(--ui-callout-surface, var(--_callout-surface)) calc(l + 0.045) calc(max(c, min(0.045, c * 3))) h)
      );
      --_ui-selection-context-border: light-dark(
        oklch(from var(--ui-callout-surface, var(--_callout-surface)) calc(l - 0.085) calc(max(c, min(0.045, c * 3))) h),
        oklch(from var(--ui-callout-surface, var(--_callout-surface)) calc(l + 0.085) calc(max(c, min(0.045, c * 3))) h)
      );
      --_ui-selection-context-text: var(--ui-text-primary);

      --_callout-border: var(--ui-info-soft-border);
      --_callout-icon: var(--ui-info-subtle-text);

      display: grid !important;
      grid-template-columns: var(--ui-callout-icon-column, 1.125rem) minmax(0, 1fr);
      gap: var(--ui-callout-gap, calc(var(--ui-space-2) * 0.75)) !important;
      align-items: start !important;
      max-width: 100%;
      padding-block: var(--ui-callout-padding-block, var(--ui-space-2)) !important;
      padding-inline-start: var(--ui-callout-padding-inline, var(--ui-space-2)) !important;
      padding-inline-end: var(--ui-callout-padding-inline, var(--ui-space-3)) !important;
      border: var(--ui-callout-border-width, var(--ui-border-width)) solid var(--ui-callout-border, var(--_callout-border));
      border-inline-start: var(--ui-callout-leading-border-width, var(--ui-callout-border-width, var(--ui-border-width))) solid
        var(--ui-callout-border, var(--_callout-border));
      border-radius: var(--ui-radius-md);
      background: var(--ui-callout-surface, var(--_callout-surface));
      color: var(--ui-callout-text, var(--_ui-surface-text));
      font-family: var(--ui-font-family-sans);
      font-size: var(--ui-font-size-sm);
      font-weight: var(--ui-font-normal);
      line-height: var(--ui-line-height-md);
    }

    /* One line box tall, so the icon centres on the first line of text. */
    .icon {
      display: grid !important;
      place-items: center;
      inline-size: var(--_ui-callout-icon-column, 1.125rem);
      block-size: 1lh;
      color: var(--_ui-callout-icon, var(--_callout-icon));
    }

    .icon svg {
      inline-size: var(--_ui-callout-icon-size, 1.125rem);
      block-size: var(--_ui-callout-icon-size, 1.125rem);
    }

    .content {
      min-inline-size: 0;
    }

    .heading {
      display: block !important;
      font-weight: var(--ui-font-semibold);
    }

    :host([tone="neutral"]), :host([tone="note"]) {
      --_ui-selection-context-surface: initial;
      --_ui-selection-context-border: initial;
      --_ui-selection-context-text: initial;
      --_callout-surface: var(--ui-surface-muted);
      --_callout-tone-text: var(--ui-text-primary);
      --_callout-border: var(--ui-border-strong);
      --_callout-icon: var(--ui-text-secondary);
    }

    :host([tone="tip"]) {
      --_callout-border: var(--ui-info-soft-border);
      --_callout-surface: var(--ui-info-soft);
      --_callout-tone-text: var(--ui-info-subtle-text);
      --_callout-icon: var(--ui-info-subtle-text);
    }

    :host([tone="important"]) {
      --_callout-border: var(--ui-accent-soft-border);
      --_callout-surface: var(--ui-accent-soft);
      --_callout-tone-text: var(--ui-accent-subtle-text);
      --_callout-icon: var(--ui-accent-subtle-text);
    }

    :host([tone="warning"]) {
      --_callout-border: var(--ui-warning-soft-border);
      --_callout-surface: var(--ui-warning-soft);
      --_callout-tone-text: var(--ui-warning-subtle-text);
      --_callout-icon: var(--ui-warning-subtle-text);
    }

    :host([tone="success"]) {
      --_callout-border: var(--ui-success-soft-border);
      --_callout-surface: var(--ui-success-soft);
      --_callout-tone-text: var(--ui-success-subtle-text);
      --_callout-icon: var(--ui-success-subtle-text);
    }

    :host([tone="danger"]), :host([tone="caution"]) {
      --_callout-border: var(--ui-danger-soft-border);
      --_callout-surface: var(--ui-danger-soft);
      --_callout-tone-text: var(--ui-danger-subtle-text);
      --_callout-icon: var(--ui-danger-subtle-text);
    }

    /* A link in the callout's text is underlined, so it reads as a link by more than colour. */
    .content :slotted(a) {
      color: var(--ui-accent-subtle-text);
      text-decoration: underline;
      text-decoration-thickness: 0.06em;
      text-underline-offset: 0.18em;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
