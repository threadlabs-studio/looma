<template component="ui-callout">
  <defs>
    <prop name="tone" type="info | note | warning | success | danger" default="info"
    >Which kind of message the callout carries, shown by its icon and colour: info (the default) for neutral information, note for an aside in muted grey,
      warning for a caution, success for a confirmation, and danger for an error or a destructive consequence.</prop>
  </defs>
  <div role="note">
    <span class="icon" aria-hidden="true">
      <svg $if="tone = 'info'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M12 16v-4"></path>
        <path d="M12 8h.01"></path>
      </svg>
      <svg $if="tone = 'note'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8.5L13.5 2Z"></path>
        <path d="M13 2v7h7"></path>
        <path d="m9.5 17.5 4-4 2 2-4 4H9.5v-2Z"></path>
      </svg>
      <svg $if="tone = 'warning'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
        <path d="M12 9v4"></path>
        <path d="M12 17h.01"></path>
      </svg>
      <svg $if="tone = 'success'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="m9 12 2 2 4-4"></path>
      </svg>
      <svg $if="tone = 'danger'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="m15 9-6 6"></path>
        <path d="m9 9 6 6"></path>
      </svg>
    </span>
    <div class="content"><slot></slot></div>
  </div>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-callout-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-callout-border-width {
      syntax: "*";
      inherits: false;
    }
    @property --ui-callout-gap {
      syntax: "*";
      inherits: false;
    }
    @property --ui-callout-icon {
      syntax: "*";
      inherits: false;
    }
    @property --ui-callout-icon-column {
      syntax: "*";
      inherits: false;
    }
    @property --ui-callout-icon-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-callout-leading-border-width {
      syntax: "*";
      inherits: false;
    }
    @property --ui-callout-padding-block {
      syntax: "*";
      inherits: false;
    }
    @property --ui-callout-padding-inline {
      syntax: "*";
      inherits: false;
    }
    @property --ui-callout-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-callout-text {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Hooks do not inherit, so the parts below read them from the root. */
      --_ui-callout-icon-column: var(--ui-callout-icon-column);
      --_ui-callout-icon: var(--ui-callout-icon);
      --_ui-callout-icon-size: var(--ui-callout-icon-size);

      --_callout-surface: var(--ui-info-soft);
      --_callout-border: var(--ui-info-solid);
      --_callout-icon: var(--ui-info-solid);

      display: grid;
      grid-template-columns: var(--ui-callout-icon-column, 1.125rem) minmax(0, 1fr);
      gap: var(--ui-callout-gap, calc(var(--ui-space-2) * 0.75));
      align-items: start;
      max-width: 100%;
      padding: var(--ui-callout-padding-block, var(--ui-space-2)) var(--ui-callout-padding-inline, var(--ui-space-3));
      border: var(--ui-callout-border-width, 1px) solid color-mix(in srgb, var(--ui-callout-border, var(--_callout-border)) 35%, transparent);
      border-inline-start: var(--ui-callout-leading-border-width, 4px) solid var(--ui-callout-border, var(--_callout-border));
      border-radius: var(--ui-radius-md);
      background: var(--ui-callout-surface, var(--_callout-surface));
      color: var(--ui-callout-text, var(--ui-text-primary));
      font-family: var(--ui-font-family-sans);
      font-size: var(--ui-font-size-sm);
      font-weight: var(--ui-font-normal);
      line-height: var(--ui-line-height-md);
    }

    /* One line box tall, so the icon centres on the first line of text. */
    .icon {
      display: grid;
      place-items: center;
      inline-size: var(--_ui-callout-icon-column, 1.125rem);
      block-size: 1lh;
      color: var(--_ui-callout-icon, var(--_callout-icon));
    }

    .icon svg {
      inline-size: var(--_ui-callout-icon-size, 1.125rem);
      block-size: var(--_ui-callout-icon-size, 1.125rem);
    }

    .content {
      min-inline-size: 0;
    }

    :host-state([tone="note"]) {
      --_callout-surface: var(--ui-surface-muted);
      --_callout-border: var(--ui-border-strong);
      --_callout-icon: var(--ui-text-secondary);
    }

    :host-state([tone="warning"]) {
      --_callout-surface: var(--ui-warning-soft);
      --_callout-border: var(--ui-warning-solid);
      --_callout-icon: var(--ui-warning-solid);
    }

    :host-state([tone="success"]) {
      --_callout-surface: var(--ui-success-soft);
      --_callout-border: var(--ui-success-solid);
      --_callout-icon: var(--ui-success-solid);
    }

    :host-state([tone="danger"]) {
      --_callout-surface: var(--ui-danger-soft);
      --_callout-border: var(--ui-danger-solid);
      --_callout-icon: var(--ui-danger-solid);
    }

    /* A link in the callout's text is underlined, so it reads as a link by more than colour. */
    .content :slotted(a) {
      color: var(--ui-accent-active);
      text-decoration: underline;
      text-decoration-thickness: 0.06em;
      text-underline-offset: 0.18em;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
