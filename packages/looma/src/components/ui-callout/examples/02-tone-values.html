<!--
title: Tone values
description: Advice, emphasis, warnings, and confirmations have distinct icons and colors. Tip shares Info’s palette; Caution uses danger styling.
-->
<ui-stack gap="s">
  <ui-callout tone="note">Note message.</ui-callout>
  <ui-callout tone="tip">Tip message.</ui-callout>
  <ui-callout tone="info">Info message.</ui-callout>
  <ui-callout tone="important">Important message.</ui-callout>
  <ui-callout tone="warning">Warning message.</ui-callout>
  <ui-callout tone="danger">Danger message.</ui-callout>
  <ui-callout tone="success">Success message.</ui-callout>
</ui-stack>
