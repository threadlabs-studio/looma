<!--
title: Label, control, and help
description: Named label and help slots around a Looma input. The label's for and the input's id link them before JavaScript runs; the field links the help text.
-->
<ui-form-field>
  <label slot="label" for="form-field-label">Label</label>
  <ui-input id="form-field-label"> </ui-input>
  <small slot="help">Help text</small>
</ui-form-field>
