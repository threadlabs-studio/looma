<!--
title: required and invalid
description: Required and invalid attach state to the label, native control, and error message as one field.
-->
<ui-form-field required invalid>
  <label slot="label" for="form-field-required">Label</label>
  <ui-input id="form-field-required"> </ui-input>
  <small slot="error">Error message</small>
</ui-form-field>
