<template component="ui-form-field" controller="./ui-form-field.js">
  <defs>
    <prop name="invalid" type="boolean" default="false">invalid token.</prop>
    <prop name="disabled" type="boolean" default="false">disabled token.</prop>
    <prop name="required" type="boolean" default="false">required token.</prop>
  </defs>
  <div>
    <div class="label"><slot name="label"></slot></div>
    <slot></slot>
    <div class="help"><slot name="help"></slot></div>
    <div class="error"><slot name="error"></slot></div>
  </div>
  <style>
    :host {
      display: grid;
      gap: var(--ui-space-2);
      min-inline-size: 0;
      align-content: start;
      color: var(--ui-text-primary);
    }

    /* Each named region styles whatever fills it, however it was slotted (slot="…" in HTML, #label
       in Vue), and generates no box of its own, so an empty region adds no gap. */
    .label,
    .help,
    .error {
      display: contents;
    }

    .label {
      color: var(--ui-text-secondary);
      font-size: var(--ui-font-size-sm);
    }

    .help {
      color: var(--ui-text-muted);
      font-size: var(--ui-font-size-sm);
      line-height: var(--ui-line-height-md);
    }

    .help > :slotted(*) {
      min-block-size: var(--ui-form-field-help-min-block-size, 0);
    }

    .error,
    :slotted([role="alert"]) {
      color: var(--ui-accent-active);
      font-size: var(--ui-font-size-sm);
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
