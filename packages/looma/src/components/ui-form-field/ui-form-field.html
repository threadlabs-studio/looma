<template component="ui-form-field" controller="./ui-form-field.js">
  <defs>
    <prop name="invalid" type="boolean" default="false"
    >Marks the field's control invalid by setting aria-invalid on it. Only while invalid, the error slot appears and becomes part of the control's
      description.</prop>
    <prop name="disabled" type="boolean" default="false"
    >Disables the field's control: the first input, textarea, or select inside it. The field writes this to the control whenever it updates, so set it here
      rather than on the control.</prop>
    <prop name="required" type="boolean" default="false"
    >Marks the field's control required, for native form validation. Like disabled, it is written to the control, so set it here rather than on the control. It
      adds no visual marker; show one in the label if the form needs it.</prop>
  </defs>
  <div>
    <div class="label">
      <slot name="label"></slot>
      <span class="label-action"><slot name="label-action"></slot></span>
    </div>
    <slot></slot>
    <div class="help"><slot name="help"></slot></div>
    <div class="error"><slot name="error"></slot></div>
  </div>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-form-field-danger {
      syntax: "*";
      inherits: false;
    }
    @property --ui-form-field-help-font-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-form-field-help-min-block-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-form-field-help-text {
      syntax: "*";
      inherits: false;
    }
    @property --ui-form-field-label-font-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-form-field-label-text {
      syntax: "*";
      inherits: false;
    }
    @property --ui-form-field-min-inline-size {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Hooks do not inherit, so the parts below read them from the root. */
      --_ui-form-field-danger: var(--ui-form-field-danger);
      --_ui-form-field-help-min-block-size: var(--ui-form-field-help-min-block-size);
      --_ui-form-field-label-text: var(--ui-form-field-label-text);
      --_ui-form-field-label-font-size: var(--ui-form-field-label-font-size);
      --_ui-form-field-help-text: var(--ui-form-field-help-text);
      --_ui-form-field-help-font-size: var(--ui-form-field-help-font-size);

      display: grid;
      gap: var(--ui-space-2);
      min-inline-size: var(--ui-form-field-min-inline-size, 0);
      align-content: start;
      color: var(--ui-text-primary);
    }

    /* Each named region styles whatever fills it, however it was slotted (slot="…" in HTML, #label
       in Vue), and generates no box of its own, so an empty region adds no gap. */
    .label,
    .help,
    .error {
      display: contents;
    }

    .label {
      color: var(--_ui-form-field-label-text, var(--ui-text-secondary));
      font-size: var(--_ui-form-field-label-font-size, var(--ui-font-size-sm));
    }

    /* A label action, such as a small help button, sits after the label text in a box one line
       tall, centred on the first line and overflowing it. A button taller than a line of label
       text then never makes this field's label row taller than its neighbours' in a grid row. */
    .label:has(> .label-action > *) {
      display: flex;
      align-items: start;
      gap: var(--ui-space-1);
    }

    .label-action {
      display: flex;
      align-items: unsafe center;
      block-size: 1lh;
    }

    .label-action:not(:has(> *)) {
      display: none;
    }

    .help {
      color: var(--_ui-form-field-help-text, var(--ui-text-muted));
      font-size: var(--_ui-form-field-help-font-size, var(--ui-font-size-sm));
      line-height: var(--ui-line-height-md);
    }

    .help > :slotted(*) {
      min-block-size: var(--_ui-form-field-help-min-block-size, 0);
    }

    .error {
      display: none;
    }

    :host([invalid]) .error {
      display: contents;
    }

    /* An error reads in the danger colour, the one the invalid control's border takes. */
    .error,
    :slotted([role="alert"]) {
      color: var(--_ui-form-field-danger, var(--ui-field-danger, var(--ui-danger)));
      font-size: var(--ui-font-size-sm);
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
