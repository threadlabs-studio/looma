<!--
title: Keyboard shortcut
description: The shortcut slot shows a key binding after the label, behind a thin divider, in smaller text. It is a display hint and binds no key; write the keys the way the reader's platform does.
-->
<ui-button id="tooltip-shortcut-trigger">Search</ui-button>
<ui-tooltip for="tooltip-shortcut-trigger" open placement="bottom">Search<kbd slot="shortcut">⌘K</kbd></ui-tooltip>
