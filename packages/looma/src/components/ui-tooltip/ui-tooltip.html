<template component="ui-tooltip" controller="./ui-tooltip.js">
  <defs>
    <prop name="for" type="string" default="">ID of the control described and visually anchored by the tooltip.</prop>
    <prop name="open" type="boolean" default="false">Whether the tooltip is open initially or when set externally.</prop>
    <prop name="placement" type="string" default="top-start">Positions the description relative to its trigger.</prop>
    <prop name="trigger" type="hover | click | focus" default="hover"
    >How the trigger opens it. hover also opens on keyboard focus; click toggles it and suits a help button, where hovering a question mark says nothing; focus
      opens only while the trigger holds focus.</prop>
    <prop name="showDelay" type="number" default="500">Waits this many milliseconds before showing after pointer entry.</prop>
    <prop name="hideDelay" type="number" default="100">Waits this many milliseconds before hiding after pointer exit.</prop>
    <prop name="inverse" type="boolean" default="false">Use the high-contrast inverse surface (dark on light themes, light on dark themes).</prop>
    <state name="internalOpen" :value="false"></state>
    <event
      name="open"
      type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"
    ></event>
    <event
      name="close"
      type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"
    ></event>
  </defs>
  <span role="tooltip" :hidden="not internalOpen"><div class="surface"><slot></slot></div></span>
  <style>
    :host {
      position: fixed;
      inset: auto;
      margin: 0;
      display: inline-block;
      box-sizing: border-box;
      padding: 0;
      border: 0;
      outline: 0;
      border-radius: 0;
      background: transparent;
      /* The UA popover default (overflow: auto) would clip the arrow. */
      overflow: visible;
      opacity: 0;
      transform: translateY(4px);
      transition:
        opacity var(--ui-motion-fast) var(--ui-motion-ease),
        transform var(--ui-motion-fast) var(--ui-motion-ease),
        display var(--ui-motion-fast) allow-discrete,
        overlay var(--ui-motion-fast) allow-discrete;
    }

    .surface {
      --_tooltip-line: var(--ui-tooltip-border, var(--ui-border-default));
      position: relative;
      box-sizing: border-box;
      max-inline-size: var(--ui-tooltip-max-inline-size, 18rem);
      border: 1px solid var(--_tooltip-line);
      border-radius: var(--ui-tooltip-radius, var(--ui-radius-sm));
      background: var(--ui-tooltip-surface, var(--ui-surface-elevated));
      color: var(--ui-tooltip-text, var(--ui-text-primary));
      padding: var(--ui-space-1) var(--ui-space-2);
      font-family: var(--ui-font-family-sans);
      font-size: var(--ui-font-size-sm);
      line-height: var(--ui-line-height-tight);
      box-shadow: var(--ui-tooltip-shadow, var(--ui-elevation-tooltip, var(--ui-shadow-md)));
    }

    :host-state([inverse]) .surface {
      --_tooltip-line: var(--ui-tooltip-inverse-surface, var(--ui-text-primary));
      background: var(--ui-tooltip-inverse-surface, var(--ui-text-primary));
      color: var(--ui-tooltip-inverse-text, var(--ui-surface-default));
    }

    /* A rotated square shares the surface fill and draws the two outward border edges. Its centre sits on
     * the surface border line, so the fill covers that stretch of border and the outline runs unbroken. */
    .surface::after {
      content: "";
      position: absolute;
      z-index: 1;
      inset-inline-start: var(--ui-space-3);
      inset-block-end: calc(var(--ui-tooltip-arrow-size, 0.5rem) / -2 - 0.5px);
      inline-size: var(--ui-tooltip-arrow-size, 0.5rem);
      block-size: var(--ui-tooltip-arrow-size, 0.5rem);
      box-sizing: border-box;
      background: inherit;
      border: 0 solid var(--_tooltip-line);
      border-inline-end-width: 1px;
      border-block-end-width: 1px;
      border-end-end-radius: 1px;
      transform: rotate(45deg);
    }

    :is(:host-state([placement="bottom"]), :host-state([placement="bottom-start"]), :host-state([placement="bottom-end"])) .surface::after {
      inset-block-start: calc(var(--ui-tooltip-arrow-size, 0.5rem) / -2 - 0.5px);
      inset-block-end: auto;
      border-inline-end-width: 0;
      border-block-end-width: 0;
      border-inline-start-width: 1px;
      border-block-start-width: 1px;
      border-end-end-radius: 0;
      border-start-start-radius: 1px;
    }

    :is(:host-state([placement="top-end"]), :host-state([placement="bottom-end"])) .surface::after {
      inset-inline-start: auto;
      inset-inline-end: var(--ui-space-3);
    }

    :host:popover-open {
      opacity: 1;
      transform: translateY(0);
    }

    @starting-style {
      :host:popover-open {
        opacity: 0;
        transform: translateY(4px);
      }
    }

    :host[hidden] {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      :host {
        transition: none;
      }
    }
  </style>
</template>
