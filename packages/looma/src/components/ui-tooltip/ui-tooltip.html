<template component="ui-tooltip" controller="./ui-tooltip.js">
  <defs>
    <prop name="for" type="string" default="">ID of the control described and visually anchored by the tooltip.</prop>
    <prop name="open" type="boolean" default="false">Whether the tooltip is open initially or when set externally.</prop>
    <prop
      name="placement"
      type="keyword"
      values="top, top-start, top-end, bottom, bottom-start, bottom-end, left, left-start, left-end, right, right-start, right-end"
      default="top"
    >Positions the description around its trigger. Start and end on top or bottom follow the writing direction.</prop>
    <prop name="trigger" type="keyword" values="hover, click, focus" default="hover"
    >How the trigger opens it. hover also opens on keyboard focus; click toggles it and suits a help button, where hovering a question mark says nothing; focus
      opens only while the trigger holds focus.</prop>
    <prop name="showDelay" type="number" default="500">Waits this many milliseconds before showing after pointer entry.</prop>
    <prop name="hideDelay" type="number" default="100">Waits this many milliseconds before hiding after pointer exit.</prop>
    <prop name="inverse" type="boolean" default="false">Use the high-contrast inverse surface (dark on light themes, light on dark themes).</prop>
    <state type="boolean" name="internalOpen" value="false"></state>
    <event
      name="open"
      type="object"
    >
      <prop name="open" required type="boolean"></prop>
      <prop name="reason" required type="keyword" values="action, programmatic, light-dismiss, escape"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
    <event
      name="close"
      type="object"
    >
      <prop name="open" required type="boolean"></prop>
      <prop name="reason" required type="keyword" values="action, programmatic, light-dismiss, escape"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
  </defs>
  <span role="tooltip" from:hidden="not internalOpen"><div class="surface"><slot></slot></div></span>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-tooltip-arrow-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-tooltip-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-tooltip-inverse-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-tooltip-inverse-text {
      syntax: "*";
      inherits: false;
    }
    @property --ui-tooltip-max-inline-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-tooltip-offset {
      syntax: "*";
      inherits: false;
    }
    @property --ui-tooltip-radius {
      syntax: "*";
      inherits: false;
    }
    @property --ui-tooltip-shadow {
      syntax: "*";
      inherits: false;
    }
    @property --ui-tooltip-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-tooltip-text {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Hooks do not inherit, so the parts below read them from the root. */
      --_ui-tooltip-border: var(--ui-tooltip-border);
      --_ui-tooltip-max-inline-size: var(--ui-tooltip-max-inline-size);
      --_ui-tooltip-radius: var(--ui-tooltip-radius);
      --_ui-tooltip-surface: var(--ui-tooltip-surface);
      --_ui-tooltip-text: var(--ui-tooltip-text);
      --_ui-tooltip-shadow: var(--ui-tooltip-shadow);
      --_ui-tooltip-inverse-surface: var(--ui-tooltip-inverse-surface);
      --_ui-tooltip-inverse-text: var(--ui-tooltip-inverse-text);
      --_ui-tooltip-arrow-size: var(--ui-tooltip-arrow-size);

      position: fixed;
      inset: auto;
      margin: 0;
      display: inline-block;
      box-sizing: border-box;
      padding: 0;
      border: 0;
      outline: 0;
      border-radius: 0;
      background: transparent;
      /* The UA popover default (overflow: auto) would clip the arrow. */
      overflow: visible;
      opacity: 0;
      transform: translateY(4px);
      transition:
        opacity var(--ui-motion-fast) var(--ui-motion-ease),
        transform var(--ui-motion-fast) var(--ui-motion-ease),
        display var(--ui-motion-fast) allow-discrete,
        overlay var(--ui-motion-fast) allow-discrete;
    }

    .surface {
      --_tooltip-line: var(--_ui-tooltip-border, var(--ui-overlay-border, var(--ui-border-strong)));
      position: relative;
      box-sizing: border-box;
      max-inline-size: var(--_ui-tooltip-max-inline-size, 18rem);
      border: 1px solid var(--_tooltip-line);
      border-radius: var(--_ui-tooltip-radius, var(--ui-overlay-radius, var(--ui-radius-md)));
      background: var(--_ui-tooltip-surface, var(--ui-overlay-surface, var(--ui-surface-elevated)));
      color: var(--_ui-tooltip-text, var(--ui-text-primary));
      padding: var(--ui-space-2) var(--ui-space-3);
      font-family: var(--ui-font-family-sans);
      font-size: var(--ui-font-size-sm);
      line-height: var(--ui-line-height-tight);
      box-shadow: var(--_ui-tooltip-shadow, var(--ui-overlay-shadow, var(--ui-elevation-tooltip, var(--ui-shadow-md))));
    }

    :host-state([inverse]) .surface {
      --_tooltip-line: var(--_ui-tooltip-inverse-surface, var(--ui-text-primary));
      background: var(--_ui-tooltip-inverse-surface, var(--ui-text-primary));
      color: var(--_ui-tooltip-inverse-text, var(--ui-surface-default));
    }

    /* A rotated square shares the surface fill and draws the two outward border edges. Its centre sits on
     * the surface border line, so the fill covers that stretch of border and the outline runs unbroken. */
    .surface::after {
      content: "";
      position: absolute;
      z-index: 1;
      inset-inline-start: var(--ui-space-3);
      inset-block-end: calc(var(--_ui-tooltip-arrow-size, 0.625rem) / -2 - 0.5px);
      inline-size: var(--_ui-tooltip-arrow-size, 0.625rem);
      block-size: var(--_ui-tooltip-arrow-size, 0.625rem);
      box-sizing: border-box;
      background: inherit;
      border: 0 solid var(--_tooltip-line);
      border-inline-end-width: 1px;
      border-block-end-width: 1px;
      border-end-end-radius: 1px;
      transform: rotate(45deg) scaleX(1.25) scaleY(0.85);
    }

    :host[data-ui-actual-placement="bottom"] .surface::after {
      inset-block-start: calc(var(--_ui-tooltip-arrow-size, 0.625rem) / -2 - 0.5px);
      inset-block-end: auto;
      border-inline-end-width: 0;
      border-block-end-width: 0;
      border-inline-start-width: 1px;
      border-block-start-width: 1px;
      border-end-end-radius: 0;
      border-start-start-radius: 1px;
    }

    :host[data-ui-actual-align="center"] .surface::after {
      inset-inline-start: calc(50% - var(--_ui-tooltip-arrow-size, 0.625rem) / 2);
    }

    :host[data-ui-actual-align="end"] .surface::after {
      inset-inline-start: auto;
      inset-inline-end: var(--ui-space-3);
    }

    :host[data-ui-actual-placement="left"] .surface::after,
    :host[data-ui-actual-placement="right"] .surface::after {
      inset-block-start: calc(50% - var(--_ui-tooltip-arrow-size, 0.625rem) / 2);
      inset-block-end: auto;
      border: 0 solid var(--_tooltip-line);
    }

    :host[data-ui-actual-placement="left"] .surface::after {
      inset-inline-start: auto;
      inset-inline-end: calc(var(--_ui-tooltip-arrow-size, 0.625rem) / -2 - 0.5px);
      border-inline-end-width: 1px;
      border-block-start-width: 1px;
    }

    :host[data-ui-actual-placement="right"] .surface::after {
      inset-inline-start: calc(var(--_ui-tooltip-arrow-size, 0.625rem) / -2 - 0.5px);
      inset-inline-end: auto;
      border-inline-start-width: 1px;
      border-block-end-width: 1px;
    }

    :host[data-ui-actual-placement="left"][data-ui-actual-align="start"] .surface::after,
    :host[data-ui-actual-placement="right"][data-ui-actual-align="start"] .surface::after {
      inset-block-start: var(--ui-space-3);
    }

    :host[data-ui-actual-placement="left"][data-ui-actual-align="end"] .surface::after,
    :host[data-ui-actual-placement="right"][data-ui-actual-align="end"] .surface::after {
      inset-block-start: auto;
      inset-block-end: var(--ui-space-3);
    }

    :host:popover-open {
      opacity: 1;
      transform: translateY(0);
    }

    @starting-style {
      :host:popover-open {
        opacity: 0;
        transform: translateY(4px);
      }
    }

    :host[hidden] {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      :host {
        transition: none;
      }
    }
  </style>
</template>
