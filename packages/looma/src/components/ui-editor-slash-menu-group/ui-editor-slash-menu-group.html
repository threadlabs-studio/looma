<template component="ui-editor-slash-menu-group">
  <defs>
    <prop name="label" type="string" default="">Names this group of related slash commands.</prop>
  </defs>
  <li role="presentation">
    <div role="group" from:aria-label="label">
      <div class="heading">{$label}</div>
      <ul role="presentation"><slot></slot></ul>
    </div>
  </li>
  <style>
    :host {
      display: block;
      list-style: none;
    }
    .heading {
      padding: var(--ui-space-2) var(--ui-space-3) var(--ui-space-1);
      color: var(--ui-text-muted);
      font-size: var(--ui-font-size-xs);
      font-weight: var(--ui-font-semibold);
    }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    :host[hidden] {
      display: none;
    }
  </style>
</template>
