<template component="ui-top-bar">
  <header>
    <div class="leading"><slot name="leading"></slot></div>
    <div class="title"><slot></slot></div>
    <div class="search"><slot name="search"></slot></div>
    <div class="actions"><slot name="actions"></slot></div>
  </header>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-top-bar-actions-gap {
      syntax: "*";
      inherits: false;
    }
    @property --ui-top-bar-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-top-bar-gap {
      syntax: "*";
      inherits: false;
    }
    @property --ui-top-bar-height {
      syntax: "*";
      inherits: false;
    }
    @property --ui-top-bar-padding-inline {
      syntax: "*";
      inherits: false;
    }
    @property --ui-top-bar-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-top-bar-z-index {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Hooks do not inherit, so the parts below read them from the root. */
      --_ui-top-bar-actions-gap: var(--ui-top-bar-actions-gap);

      position: sticky;
      inset-block-start: 0;
      z-index: var(--ui-top-bar-z-index, 100);
      min-block-size: calc(var(--ui-top-bar-height, 56px) + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      gap: var(--ui-top-bar-gap, var(--ui-space-3));
      padding-block-start: env(safe-area-inset-top);
      padding-inline-start: max(var(--ui-top-bar-padding-inline, var(--ui-space-4)), env(safe-area-inset-left));
      padding-inline-end: max(var(--ui-top-bar-padding-inline, var(--ui-space-4)), env(safe-area-inset-right));
      background: var(--ui-top-bar-surface, var(--ui-surface-elevated));
      border-block-end: 1px solid var(--ui-top-bar-border, var(--ui-border-default));
    }

    .leading,
    .search,
    .actions {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .actions {
      gap: var(--_ui-top-bar-actions-gap, var(--ui-space-1));
    }

    .title {
      min-inline-size: 0;
      flex: 1;
    }

    /* An unused region takes no space, so it adds no gap. */
    .leading:empty,
    .search:empty,
    .actions:empty {
      display: none;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
