<template component="ui-top-bar" module="./ui-top-bar.js">
  <defs>
    <prop name="titleFor" type="string" default=""
    >The ID of the page heading represented by the default title slot. While that heading is visible below the sticky bar, its duplicate title is concealed.
      After the heading scrolls above the bar, the single-line title slides up and fades in. Leading and action slots stay available, and the bar keeps its
      size. Omit it for an always-visible title. Reduced motion removes the transition.</prop>
    <state name="titleOutOfView" type="boolean" value="false"></state>
    <computed name="titleHidden" from="not ($titleFor = '') and not $titleOutOfView"></computed>
  </defs>
  <header>
    <div class="leading"><slot name="leading"></slot></div>
    <div class="title" class:scroll-title="not ($titleFor = '')" class:concealed="$titleHidden" from:aria-hidden="$titleHidden" from:inert="$titleHidden">
      <slot></slot>
    </div>
    <div class="search"><slot name="search"></slot></div>
    <div class="actions"><slot name="actions"></slot></div>
  </header>
  <style>
    :host {
      /* Resolve shared part values at the component root. */
      --_ui-top-bar-actions-gap: var(--ui-top-bar-actions-gap);

      position: sticky;
      inset-block-start: 0;
      z-index: var(--ui-top-bar-z-index, 100);
      min-block-size: calc(var(--ui-top-bar-height, 56px) + env(safe-area-inset-top));
      display: flex !important;
      align-items: center !important;
      gap: var(--ui-top-bar-gap, var(--ui-space-3)) !important;
      padding-block-start: env(safe-area-inset-top) !important;
      padding-inline-start: max(var(--ui-top-bar-padding-inline, var(--ui-space-4)), env(safe-area-inset-left)) !important;
      padding-inline-end: max(var(--ui-top-bar-padding-inline, var(--ui-space-4)), env(safe-area-inset-right)) !important;
      background: var(--ui-top-bar-surface, var(--ui-surface-elevated));
      border-block-end: var(--ui-border-width) solid var(--ui-top-bar-border, var(--ui-border-divider));
    }

    .leading,
    .search,
    .actions {
      display: flex !important;
      align-items: center !important;
      flex-shrink: 0;
    }

    .actions {
      gap: var(--_ui-top-bar-actions-gap, var(--ui-space-1)) !important;
    }

    .title {
      min-inline-size: 0;
      flex: 1;
    }
    .title.scroll-title {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      opacity: 1;
      transform: translateY(0);
      transition: opacity var(--ui-motion-fast) var(--ui-motion-ease), transform var(--ui-motion-fast) var(--ui-motion-ease);
    }
    .title.scroll-title.concealed {
      opacity: 0;
      transform: translateY(var(--ui-space-2));
      pointer-events: none;
    }
    @media (prefers-reduced-motion: reduce) {
      .title.scroll-title,
      .title.scroll-title.concealed {
        transition: none;
        transform: none;
      }
    }

    /* An unused region takes no space, so it adds no gap. */
    .leading:empty,
    .search:empty,
    .actions:empty {
      display: none !important;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
