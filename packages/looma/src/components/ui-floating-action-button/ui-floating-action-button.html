<template component="ui-floating-action-button">
  <defs>
    <prop name="disabled" type="boolean" default="false">Disables the button, so it cannot be pressed or focused, and fades it to 60% opacity.</prop>
    <prop name="mobileOnly" type="boolean" default="false"
    >Hides the button on viewports 768px wide and wider, for a shortcut that only phones need. Make sure the action is reachable another way at those
      widths.</prop>
    <prop name="label" type="string" default="">The button's accessible name. The button usually holds only an icon, so name the action it performs.</prop>
  </defs>
  <button type="button" :aria-label="label" :disabled="disabled"><slot></slot></button>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-floating-action-button-inset-block-end {
      syntax: "*";
      inherits: false;
    }
    @property --ui-floating-action-button-inset-inline-end {
      syntax: "*";
      inherits: false;
    }
    @property --ui-floating-action-button-z-index {
      syntax: "*";
      inherits: false;
    }

    :host {
      position: fixed;
      inset-block-end: calc(var(--ui-floating-action-button-inset-block-end, var(--ui-space-6)) + env(safe-area-inset-bottom));
      inset-inline-end: max(
        var(--ui-floating-action-button-inset-inline-end, var(--ui-space-5)),
        env(safe-area-inset-right)
      );
      inline-size: var(--ui-control-min-block-size);
      block-size: var(--ui-control-min-block-size);
      display: inline-flex;
      z-index: var(--ui-floating-action-button-z-index, 100);
    }

    :host {
      appearance: none;
      border: none;
      border-radius: 999px;
      margin: 0;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--ui-accent);
      color: var(--ui-on-accent);
      box-shadow: 0 4px 12px color-mix(in srgb, var(--ui-accent) 40%, transparent);
      cursor: pointer;
      transition:
        background-color var(--ui-motion-fast) var(--ui-motion-ease),
        transform var(--ui-motion-fast) var(--ui-motion-ease),
        box-shadow var(--ui-motion-fast) var(--ui-motion-ease);
    }

    :host:hover:enabled {
      background: var(--ui-accent-hover);
      box-shadow: 0 6px 16px color-mix(in srgb, var(--ui-accent) 50%, transparent);
    }

    :host:active:enabled {
      transform: scale(0.94);
    }

    :host:focus-visible {
      outline: 2px solid var(--ui-focus-ring);
      outline-offset: 2px;
    }

    :host:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    :slotted(svg) {
      inline-size: var(--ui-icon-size-lg);
      block-size: var(--ui-icon-size-lg);
      flex-shrink: 0;
    }

    @media (min-width: 768px) {
      :host-state([mobileOnly]) {
        display: none;
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
