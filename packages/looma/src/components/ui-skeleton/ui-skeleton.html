<template component="ui-skeleton" module="./ui-skeleton.js">
  <defs>
    <prop name="shape" type="keyword" values="text, circle, rectangle" default="text"
    >The content's silhouette. text reserves one inherited line box with a shorter bar inside it; circle matches a medium Avatar; rectangle reserves a media
      area.</prop>
    <prop name="width" type="string" default=""
    >Inline size as a CSS length or percentage, constrained to the container. Empty fills the available width for text and rectangles, or matches a medium
      Avatar's outer size for circles.</prop>
    <prop name="height" type="string" default=""
    >Block size as a CSS length. Empty reserves one line for text, a square for circles, or 8rem for rectangles. Set only width to keep a circle square.</prop>
    <prop
      name="animated"
      type="boolean"
      default="true"
      default-true-reason="A travelling highlight identifies pending content by default; reduced-motion preferences always keep it static."
    >Moves a subtle highlight from left to right. On by default; pass false to keep it static. Reduced-motion preferences always disable the shimmer.</prop>
  </defs>
  <span aria-hidden="true" style:--ui-skeleton-width="$width" style:--ui-skeleton-height="$height"></span>
  <style>
    @property --_ui-skeleton-viewport-x {
      syntax: "<length>";
      inherits: false;
      initial-value: 0px;
    }
    @property --_ui-skeleton-viewport-scale {
      syntax: "<number>";
      inherits: false;
      initial-value: 1;
    }

    :host {
      --_ui-skeleton-paint-x: var(--_ui-skeleton-viewport-x);
      --_ui-skeleton-paint-scale: var(--_ui-skeleton-viewport-scale);
      display: block !important;
      position: relative;
      box-sizing: border-box !important;
      flex: none;
      min-inline-size: 0;
      max-inline-size: 100%;
      inline-size: var(--ui-skeleton-width, 100%);
      block-size: var(--ui-skeleton-height, 1lh);
      margin: 0 !important;
      font: inherit;
    }

    :host::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: var(--ui-radius-sm);
      background: color-mix(in srgb, var(--ui-text-primary) 16%, transparent);
    }

    :host([shape="text"])::before {
      inset-block: 22%;
    }

    :host([shape="circle"]) {
      inline-size: var(--ui-skeleton-width, calc(2.5rem + 2 * var(--ui-border-width)));
      block-size: var(--ui-skeleton-height, auto);
      aspect-ratio: 1;
    }
    :host([shape="circle"])::before {
      border-radius: var(--ui-radius-round);
    }

    :host([shape="rectangle"]) {
      block-size: var(--ui-skeleton-height, 8rem);
    }
    :host([shape="rectangle"])::before {
      border-radius: var(--ui-radius-md);
    }

    :host([animated])::before {
      background-image: linear-gradient(
        90deg,
        transparent,
        light-dark(rgb(255 255 255 / 0.6), rgb(255 255 255 / 0.14)) 50%,
        transparent
      );
      background-size: calc(100vw / var(--_ui-skeleton-paint-scale)) 100%;
      background-position: calc(0vw - var(--_ui-skeleton-paint-x)) 0;
      background-repeat: repeat-x;
      animation: ui-skeleton-shimmer 3s linear infinite;
    }
    @keyframes ui-skeleton-shimmer {
      to {
        background-position: calc(100vw / var(--_ui-skeleton-paint-scale) - var(--_ui-skeleton-paint-x)) 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      :host([animated])::before {
        animation: none;
        background-image: none;
      }
    }
    @media (forced-colors: active) {
      :host::before {
        background: CanvasText;
        opacity: 0.2;
      }
      :host([animated])::before {
        animation: none;
        background-image: none;
      }
    }
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
