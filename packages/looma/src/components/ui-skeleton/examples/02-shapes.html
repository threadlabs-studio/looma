<!--
title: Avatar and media shapes
description: The default circle matches a medium Avatar. Supply dimensions for a thumbnail or a larger media area; narrow containers constrain the width.
-->
<ui-stack gap="m">
  <ui-cluster gap="m">
    <ui-skeleton shape="circle"></ui-skeleton>
    <ui-skeleton shape="circle" width="1.75rem"></ui-skeleton>
    <ui-skeleton shape="rectangle" width="6rem" height="2.5rem"></ui-skeleton>
  </ui-cluster>
  <ui-skeleton shape="rectangle"></ui-skeleton>
</ui-stack>
