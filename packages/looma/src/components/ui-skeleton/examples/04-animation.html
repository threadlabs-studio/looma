<!--
title: Shared shimmer
description: One broad gradient stays fixed to the viewport, so every placeholder reveals the same moving highlight. It loops continuously and stops for reduced motion.
-->
<ui-stack gap="s">
  <ui-cluster gap="s">
    <ui-skeleton shape="circle"></ui-skeleton>
    <ui-skeleton width="50%"></ui-skeleton>
  </ui-cluster>
  <ui-skeleton shape="rectangle" width="75%" height="3rem"></ui-skeleton>
</ui-stack>
