<template component="ui-switcher" controller="./ui-switcher.js">
  <defs>
    <prop name="gap" type="keyword" values="xs, s, m, l, xl"
    >Space between items, on the spacing scale: xs is 0.5rem, s 0.75rem, m 1rem (also the default), l 1.5rem, and xl 2rem. The --ui-switcher-gap custom
      property, set on the switcher itself, overrides it; set on an ancestor, it does nothing.</prop>
    <prop name="threshold" type="keyword" values="xs, sm, md, lg"
    >The container width at which items switch between a row and a stack: wider, they all sit side by side; narrower, each takes the full width. xs is 20rem, sm
      is 30rem (also the default), md is 45rem, and lg is 60rem.</prop>
    <prop name="align" type="keyword" values="start, center, end, stretch"
    >How items line up while they sit in a row: stretch (the default) makes them equally tall; start, center, and end align their tops, middles, or
      bottoms.</prop>
    <prop name="limit" type="integer"
    >Most children allowed in a horizontal row. When the count exceeds this value, every child stacks regardless of width. Omit it for no count limit.</prop>
    <state type="boolean" name="overLimit" value="false"></state>
  </defs>
  <div><slot></slot></div>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-switcher-gap {
      syntax: "*";
      inherits: false;
    }
    @property --ui-switcher-threshold {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Hooks do not inherit, so the parts below read them from the root. */
      --_ui-switcher-threshold: var(--ui-switcher-threshold);

      --_switcher-gap: var(--ui-space-4);
      display: flex;
      flex-wrap: wrap;
      gap: var(--ui-switcher-gap, var(--_switcher-gap));
      min-inline-size: 0;
      max-inline-size: 100%;
      margin: 0;
    }

    :host > :slotted(*) {
      min-inline-size: 0;
      flex-grow: 1;
      /* The large multiplier makes the basis flip as a group at the intrinsic threshold. */
      flex-basis: calc((var(--_ui-switcher-threshold, 30rem) - 100%) * 999);
    }

    :host-state([overLimit]) > :slotted(*) {
      flex-basis: 100%;
    }

    :host-state([gap="xs"]) {
      --_switcher-gap: var(--ui-space-2);
    }
    :host-state([gap="s"]) {
      --_switcher-gap: var(--ui-space-3);
    }
    :host-state([gap="m"]) {
      --_switcher-gap: var(--ui-space-4);
    }
    :host-state([gap="l"]) {
      --_switcher-gap: var(--ui-space-5);
    }
    :host-state([gap="xl"]) {
      --_switcher-gap: var(--ui-space-6);
    }
    :host-state([threshold="xs"]) > :slotted(*) {
      flex-basis: calc((var(--_ui-switcher-threshold, 20rem) - 100%) * 999);
    }
    :host-state([threshold="md"]) > :slotted(*) {
      flex-basis: calc((var(--_ui-switcher-threshold, 45rem) - 100%) * 999);
    }
    :host-state([threshold="lg"]) > :slotted(*) {
      flex-basis: calc((var(--_ui-switcher-threshold, 60rem) - 100%) * 999);
    }
    :host-state([align="start"]) {
      align-items: flex-start;
    }
    :host-state([align="center"]) {
      align-items: center;
    }
    :host-state([align="end"]) {
      align-items: flex-end;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
