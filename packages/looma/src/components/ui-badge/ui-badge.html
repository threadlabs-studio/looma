<template component="ui-badge">
  <defs>
    <prop name="variant" type="solid | subtle | outline" default="subtle"
    >Emphasis. subtle sets toned text over a soft wash; solid fills with the tone and uses contrasting text; outline keeps the surface with a toned edge.
      Neutral looks the same in solid and subtle.</prop>
    <prop name="tone" type="neutral | accent | info | success | warning | danger" default="neutral"
    >Which colour the badge speaks in. neutral is a quiet grey for plain labels; accent draws the eye in the accent colour; info, success, warning, and danger
      mark a status, so match the tone to what the badge says. For a category rather than a status, set the --ui-badge-color hook on the badge instead: any CSS
      colour, which overrides the tone.</prop>
    <prop name="shape" type="pill | tag" default="pill"
    >Silhouette. pill is rounded at both ends; tag is a label: flat at the start and coming to a point at the end, for a tag or a chosen chip.</prop>
  </defs>
  <span><slot></slot></span>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-badge-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-color {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-font-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-font-weight {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-line-height {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-min-block-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-padding-block {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-padding-inline {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-point {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-text {
      syntax: "*";
      inherits: false;
    }

    :host {
      --_badge-surface: color-mix(in srgb, var(--ui-surface-subtle) 80%, var(--ui-surface-default));
      --_badge-text: var(--ui-text-secondary);
      /* Sit between the soft fill and its stronger theme ink. */
      --_badge-border: color-mix(in srgb, var(--_badge-surface) 75%, var(--_badge-text) 25%);
      /* --ui-badge-color derives a wash and an ink from one colour, between the tone and the explicit
         surface, text, and border hooks. Each value is invalid, so the tone shows, while it is unset. The
         mixes keep 4.5:1 text contrast for any colour, in a light theme or a dark one. */
      --_ui-badge-color: var(--ui-badge-color);
      --_badge-color-wash: color-mix(in oklab, var(--_ui-badge-color) 13%, var(--ui-surface-default));
      --_badge-color-ink: color-mix(in oklab, var(--_ui-badge-color) 35%, var(--ui-text-primary));
      --_badge-color-surface: var(--_badge-color-wash);
      --_badge-color-border: color-mix(in srgb, var(--_badge-color-wash) 75%, var(--_badge-color-ink) 25%);
      --_badge-color-text: var(--_badge-color-ink);
      --_badge-outline-surface: var(--ui-badge-surface, var(--_badge-color-surface, var(--_badge-surface)));

      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      padding: var(--ui-badge-padding-block, var(--ui-space-0-5)) var(--ui-badge-padding-inline, var(--ui-space-2));
      border: 1px solid var(--ui-badge-border, var(--_badge-color-border, var(--_badge-border)));
      border-radius: var(--ui-radius-round);
      background: var(--_badge-outline-surface);
      color: var(--ui-badge-text, var(--_badge-color-text, var(--_badge-text)));
      font-family: var(--ui-font-family-sans);
      font-size: var(--ui-badge-font-size, var(--ui-font-size-sm));
      font-weight: var(--ui-badge-font-weight, var(--ui-font-medium));
      line-height: var(--ui-badge-line-height, var(--ui-line-height-tight));
      white-space: nowrap;
    }

    /* Centre the glyphs, not the line box: a label without descenders otherwise reads high.
     * Trimming applies to block containers; an inline-block is one and, like the inline-flex it
     * replaces, still sizes to its label rather than filling its container. */
    @supports (text-box-trim: trim-both) {
      :host {
        display: inline-block;
        min-block-size: var(--ui-badge-min-block-size, 1.5rem);
        text-align: center;
        align-content: center;
        text-box-trim: trim-both;
        text-box-edge: cap alphabetic;
      }
    }

    :host-state([tone="accent"]) {
      --_badge-surface: var(--ui-accent-strong-surface, var(--ui-accent-solid));
      --_badge-border: var(--ui-accent-strong-surface, var(--ui-accent-solid));
      --_badge-text: var(--ui-accent-on-strong, var(--ui-text-on-accent));
    }

    :host-state([tone="danger"]) {
      --_badge-surface: var(--ui-danger-strong-surface, var(--ui-danger-solid));
      --_badge-border: var(--ui-danger-strong-surface, var(--ui-danger-solid));
      --_badge-text: var(--ui-danger-on-strong, var(--ui-text-on-accent));
    }

    :host-state([tone="success"]) {
      --_badge-surface: var(--ui-success-strong-surface, var(--ui-success-solid));
      --_badge-border: var(--ui-success-strong-surface, var(--ui-success-solid));
      --_badge-text: var(--ui-success-on-strong, var(--ui-text-on-accent));
    }

    :host-state([tone="warning"]) {
      --_badge-surface: var(--ui-warning-strong-surface, var(--ui-warning-solid));
      --_badge-border: var(--ui-warning-strong-surface, var(--ui-warning-solid));
      --_badge-text: var(--ui-warning-on-strong, var(--ui-text-on-accent));
    }

    :host-state([tone="info"]) {
      --_badge-surface: var(--ui-info-strong-surface, var(--ui-info-solid));
      --_badge-border: var(--ui-info-strong-surface, var(--ui-info-solid));
      --_badge-text: var(--ui-info-on-strong, var(--ui-text-on-accent));
    }

    :host-state([variant="subtle"][tone="accent"]) {
      --_badge-surface: color-mix(in srgb, var(--ui-accent-solid) 19%, var(--ui-surface-default));
      --_badge-border: color-mix(in srgb, var(--ui-accent-solid) 25%, var(--ui-surface-default));
      --_badge-text: var(--ui-accent-subtle-text, var(--ui-accent-solid));
    }

    :host-state([variant="subtle"][tone="danger"]) {
      --_badge-surface: color-mix(in srgb, var(--ui-danger-solid) 19%, var(--ui-surface-default));
      --_badge-border: color-mix(in srgb, var(--ui-danger-solid) 25%, var(--ui-surface-default));
      --_badge-text: var(--ui-danger-subtle-text, var(--ui-danger-solid));
    }

    :host-state([variant="subtle"][tone="success"]) {
      --_badge-surface: color-mix(in srgb, var(--ui-success-solid) 19%, var(--ui-surface-default));
      --_badge-border: color-mix(in srgb, var(--ui-success-solid) 25%, var(--ui-surface-default));
      --_badge-text: var(--ui-success-subtle-text, var(--ui-success-solid));
    }

    :host-state([variant="subtle"][tone="warning"]) {
      --_badge-surface: color-mix(in srgb, var(--ui-warning-solid) 19%, var(--ui-surface-default));
      --_badge-border: color-mix(in srgb, var(--ui-warning-solid) 25%, var(--ui-surface-default));
      --_badge-text: var(--ui-warning-subtle-text, var(--ui-warning-solid));
    }

    :host-state([variant="subtle"][tone="info"]) {
      --_badge-surface: color-mix(in srgb, var(--ui-info-solid) 19%, var(--ui-surface-default));
      --_badge-border: color-mix(in srgb, var(--ui-info-solid) 25%, var(--ui-surface-default));
      --_badge-text: var(--ui-info-subtle-text, var(--ui-info-solid));
    }

    /* A solid colour fills with the ink. Its text is the page surface, mixed at 0% only so that it too is
       invalid while the hook is unset. */
    :host-state([variant="solid"]) {
      --_badge-color-surface: var(--_badge-color-ink);
      --_badge-color-border: var(--_badge-color-ink);
      --_badge-color-text: color-mix(in oklab, var(--_ui-badge-color) 0%, var(--ui-surface-default));
    }

    :host-state([variant="outline"]) {
      --_badge-surface: var(--ui-surface-default);
      --_badge-border: var(--ui-border-strong);
      --_badge-text: var(--ui-text-secondary);
      /* An outline colour keeps the surface and draws its edge and text in the ink. */
      --_badge-color-surface: initial;
      --_badge-color-border: var(--_badge-color-ink);
    }

    :host-state([variant="outline"][tone="accent"]) {
      --_badge-border: var(--ui-accent-solid);
      --_badge-text: var(--ui-accent-subtle-text, var(--ui-accent-solid));
    }

    :host-state([variant="outline"][tone="danger"]) {
      --_badge-border: var(--ui-danger-solid);
      --_badge-text: var(--ui-danger-subtle-text, var(--ui-danger-solid));
    }

    :host-state([variant="outline"][tone="success"]) {
      --_badge-border: var(--ui-success-solid);
      --_badge-text: var(--ui-success-subtle-text, var(--ui-success-solid));
    }

    :host-state([variant="outline"][tone="warning"]) {
      --_badge-border: var(--ui-warning-solid);
      --_badge-text: var(--ui-warning-subtle-text, var(--ui-warning-solid));
    }

    :host-state([variant="outline"][tone="info"]) {
      --_badge-border: var(--ui-info-solid);
      --_badge-text: var(--ui-info-subtle-text, var(--ui-info-solid));
    }

    /* The clipped point needs an inset surface over an outer border-colour shape: a native border
       has no diagonal edge to follow. Keep this edge for every tag variant. */
    :host-state([shape="tag"]) {
      --_badge-point: var(--ui-badge-point, var(--ui-space-2));

      position: relative;
      isolation: isolate;
      border-color: transparent;
      border-radius: 0;
      background: var(--ui-badge-border, var(--_badge-color-border, var(--_badge-border)));
      padding-inline-end: calc(var(--ui-badge-padding-inline, var(--ui-space-2)) + var(--_badge-point));
      clip-path: polygon(0 0, calc(100% - var(--_badge-point)) 0, 100% 50%, calc(100% - var(--_badge-point)) 100%, 0 100%);
    }

    :host-state([shape="tag"])::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--_badge-outline-surface);
      clip-path: polygon(0 0, calc(100% - var(--_badge-point)) 0, 100% 50%, calc(100% - var(--_badge-point)) 100%, 0 100%);
      pointer-events: none;
    }

    :host-state([shape="tag"]):dir(rtl) {
      padding-inline-end: var(--ui-badge-padding-inline, var(--ui-space-2));
      padding-inline-start: calc(var(--ui-badge-padding-inline, var(--ui-space-2)) + var(--_badge-point));
      clip-path: polygon(var(--_badge-point) 0, 100% 0, 100% 100%, var(--_badge-point) 100%, 0 50%);
    }

    :host-state([shape="tag"]):dir(rtl)::before {
      clip-path: polygon(var(--_badge-point) 0, 100% 0, 100% 100%, var(--_badge-point) 100%, 0 50%);
    }

    @media (forced-colors: active) {
      :host-state([shape="tag"]) {
        forced-color-adjust: none;
        background: CanvasText;
        color: CanvasText;
      }

      :host-state([shape="tag"])::before {
        background: Canvas;
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
