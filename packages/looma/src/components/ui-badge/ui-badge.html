<template component="ui-badge">
  <defs>
    <prop name="variant" type="keyword" values="solid, subtle, outline, inverse" default="subtle"
    >Emphasis. subtle sets toned text over a soft wash; solid fills with the tone and uses contrasting text; outline keeps the surface with a toned edge.
      inverse uses a translucent contrasting surface and toned ink for a count or label on a filled control of that tone. Neutral looks the same in solid and
      subtle. When space is constrained, the label truncates with an ellipsis while its full text remains available.</prop>
    <prop name="tone" type="keyword" values="neutral, accent, info, success, warning, danger" default="neutral"
    >Which colour the badge speaks in. neutral is a quiet grey for plain labels; accent draws the eye in the accent colour; info, success, warning, and danger
      mark a status, so match the tone to what the badge says. For a category rather than a status, set the --ui-badge-color hook on the badge instead: any CSS
      colour, which overrides the tone.</prop>
    <prop name="shape" type="keyword" values="pill, tag, dot, square, circle" default="pill"
    >Silhouette. pill is rounded at both ends; tag is a pointed label. dot is a compact circular signal with visually hidden text: include a state label, or set
      aria-hidden when the surrounding control already names that state. square is a fixed rounded square for an icon or single glyph beside a heading; hide a
      decorative icon when adjacent words name it. circle frames a visible glyph, icon or short bounded count in a fixed circle, centered in both
      directions.</prop>
    <prop name="size" type="keyword" values="xs, md, lg" default="md"
    >Scale. xs is compact; md is the usual text badge; lg adds room to fixed marks while retaining the usual text size. A square is 24px at xs, 32px at md and
      40px at lg. A circle is 16px at xs, 24px at md and 32px at lg; use lg for short counts such as 30 or 99+.</prop>
  </defs>
  <span>
    <span class="icon" aria-hidden="true"><slot name="icon"></slot></span>
    <span class="label"><slot></slot></span>
  </span>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-badge-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-square-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-circle-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-dot-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-color {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-font-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-font-weight {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-line-height {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-min-block-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-padding-block {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-padding-inline {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-point {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-badge-text {
      syntax: "*";
      inherits: false;
    }

    :host {
      --_badge-surface: color-mix(in srgb, var(--ui-surface-subtle) 80%, var(--ui-surface-default));
      --_badge-text: var(--ui-text-secondary);
      /* Sit between the soft fill and its stronger theme ink. */
      --_badge-border: color-mix(in srgb, var(--_badge-surface) 75%, var(--_badge-text) 25%);
      /* --ui-badge-color derives a wash and an ink from one colour, between the tone and the explicit
         surface, text, and border hooks. Each value is invalid, so the tone shows, while it is unset. The
         mixes keep 4.5:1 text contrast for any colour, in a light theme or a dark one. */
      --_ui-badge-color: var(--ui-badge-color);
      --_badge-color-wash: color-mix(in oklab, var(--_ui-badge-color) 13%, var(--ui-surface-default));
      --_badge-color-ink: color-mix(in oklab, var(--_ui-badge-color) 35%, var(--ui-text-primary));
      --_badge-color-surface: var(--_badge-color-wash);
      --_badge-color-border: color-mix(in srgb, var(--_badge-color-wash) 75%, var(--_badge-color-ink) 25%);
      --_badge-color-text: var(--_badge-color-ink);
      --_badge-outline-surface: var(--ui-badge-surface, var(--_badge-color-surface, var(--_badge-surface)));

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--ui-space-1);
      box-sizing: border-box;
      min-inline-size: 0;
      max-inline-size: 100%;
      padding: var(--ui-badge-padding-block, var(--ui-space-0-5)) var(--ui-badge-padding-inline, var(--ui-space-2));
      border: var(--ui-border-width) solid var(--ui-badge-border, var(--_badge-color-border, var(--_badge-border)));
      border-radius: var(--ui-radius-round);
      background: var(--_badge-outline-surface);
      color: var(--ui-badge-text, var(--_badge-color-text, var(--_badge-text)));
      font-family: var(--ui-font-family-sans);
      font-size: var(--ui-badge-font-size, var(--ui-font-size-sm));
      font-weight: var(--ui-badge-font-weight, var(--ui-font-medium));
      line-height: var(--ui-badge-line-height, var(--ui-line-height-tight));
      white-space: nowrap;
    }

    /* A constrained badge keeps its surface intact and ellipsizes only its label. The full
       text stays in the DOM for accessible names and consumers' selected values. */
    .label {
      display: block;
      min-inline-size: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .label:empty {
      display: none;
    }

    /* Icon content has its own flex item so label ellipsis never clips its strokes. */
    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .icon:empty {
      display: none;
    }

    .icon :slotted(svg) {
      display: block;
      inline-size: 1em;
      block-size: 1em;
      flex: none;
    }

    /* Ordinary icon-plus-text children keep inline ellipsis, with explicit glyph spacing. */
    .label :slotted(svg) {
      inline-size: 1em;
      block-size: 1em;
      vertical-align: middle;
      margin-inline-end: var(--ui-space-1);
    }

    .label:has(svg) {
      text-box-trim: none;
    }

    /* Center the capital/baseline text box, while clipping only inline overflow for ellipsis.
       Vertical ink remains visible so trimming never cuts off ascenders or descenders. */
    @supports (text-box-trim: trim-both) {
      :host {
        display: inline-block;
        min-block-size: var(--ui-badge-min-block-size, 1.5rem);
        text-align: center;
        align-content: center;
        text-box-trim: none;
      }
      :host:has(.icon:not(:empty)),
      :host:has(.label svg) {
        display: inline-flex;
        text-box-trim: none;
      }
      .label:not(:has(svg)) {
        text-box-trim: trim-both;
        text-box-edge: cap alphabetic;
        overflow-x: clip;
        overflow-y: visible;
      }
    }

    :host([size="xs"]) {
      box-sizing: border-box;
      min-inline-size: 1rem;
      min-block-size: var(--ui-badge-min-block-size, 1rem);
      padding: var(--ui-badge-padding-block, 0) var(--ui-badge-padding-inline, 0.125rem);
      font-size: var(--ui-badge-font-size, var(--ui-font-size-2xs));
      line-height: var(--ui-badge-line-height, 1);
    }

    :host([tone="accent"]) {
      --_badge-surface: var(--ui-accent-strong-surface, var(--ui-accent-solid));
      --_badge-border: var(--ui-accent-strong-surface, var(--ui-accent-solid));
      --_badge-text: var(--ui-accent-on-strong, var(--ui-text-on-accent));
    }

    :host([tone="danger"]) {
      --_badge-surface: var(--ui-danger-strong-surface, var(--ui-danger-solid));
      --_badge-border: var(--ui-danger-strong-surface, var(--ui-danger-solid));
      --_badge-text: var(--ui-danger-on-strong, var(--ui-text-on-accent));
    }

    :host([tone="success"]) {
      --_badge-surface: var(--ui-success-strong-surface, var(--ui-success-solid));
      --_badge-border: var(--ui-success-strong-surface, var(--ui-success-solid));
      --_badge-text: var(--ui-success-on-strong, var(--ui-text-on-accent));
    }

    :host([tone="warning"]) {
      --_badge-surface: var(--ui-warning-strong-surface, var(--ui-warning-solid));
      --_badge-border: var(--ui-warning-strong-surface, var(--ui-warning-solid));
      --_badge-text: var(--ui-warning-on-strong, var(--ui-text-on-accent));
    }

    :host([tone="info"]) {
      --_badge-surface: var(--ui-info-strong-surface, var(--ui-info-solid));
      --_badge-border: var(--ui-info-strong-surface, var(--ui-info-solid));
      --_badge-text: var(--ui-info-on-strong, var(--ui-text-on-accent));
    }

    :host([variant="subtle"][tone="accent"]) {
      --_badge-surface: color-mix(in srgb, var(--ui-accent-solid) 19%, var(--ui-surface-default));
      --_badge-border: color-mix(in srgb, var(--ui-accent-solid) 25%, var(--ui-surface-default));
      --_badge-text: var(--ui-accent-subtle-text, var(--ui-accent-solid));
    }

    :host([variant="subtle"][tone="danger"]) {
      --_badge-surface: color-mix(in srgb, var(--ui-danger-solid) 19%, var(--ui-surface-default));
      --_badge-border: color-mix(in srgb, var(--ui-danger-solid) 25%, var(--ui-surface-default));
      --_badge-text: var(--ui-danger-subtle-text, var(--ui-danger-solid));
    }

    :host([variant="subtle"][tone="success"]) {
      --_badge-surface: color-mix(in srgb, var(--ui-success-solid) 19%, var(--ui-surface-default));
      --_badge-border: color-mix(in srgb, var(--ui-success-solid) 25%, var(--ui-surface-default));
      --_badge-text: var(--ui-success-subtle-text, var(--ui-success-solid));
    }

    :host([variant="subtle"][tone="warning"]) {
      --_badge-surface: color-mix(in srgb, var(--ui-warning-solid) 19%, var(--ui-surface-default));
      --_badge-border: color-mix(in srgb, var(--ui-warning-solid) 25%, var(--ui-surface-default));
      --_badge-text: var(--ui-warning-subtle-text, var(--ui-warning-solid));
    }

    :host([variant="subtle"][tone="info"]) {
      --_badge-surface: color-mix(in srgb, var(--ui-info-solid) 19%, var(--ui-surface-default));
      --_badge-border: color-mix(in srgb, var(--ui-info-solid) 25%, var(--ui-surface-default));
      --_badge-text: var(--ui-info-subtle-text, var(--ui-info-solid));
    }

    /* A solid colour fills with the ink. Its text is the page surface, mixed at 0% only so that it too is
       invalid while the hook is unset. */
    :host([variant="solid"]) {
      --_badge-color-surface: var(--_badge-color-ink);
      --_badge-color-border: var(--_badge-color-ink);
      --_badge-color-text: color-mix(in oklab, var(--_ui-badge-color) 0%, var(--ui-surface-default));
    }

    /* A translucent inverse surface picks up its filled control's tone. Deepen the tone ink
       toward the theme text to retain contrast against that composed surface. */
    :host([variant="inverse"]) {
      --_badge-color-surface: color-mix(in srgb, color-mix(in oklab, var(--_ui-badge-color) 0%, var(--ui-surface-default)) 88%, transparent);
      --_badge-color-border: var(--_badge-color-surface);
      --_badge-color-text: color-mix(in srgb, var(--_badge-color-ink) 85%, var(--ui-text-primary));
      --_badge-outline-surface: var(--ui-badge-surface, var(--_badge-color-surface, color-mix(in srgb, var(--_badge-text) 88%, transparent)));
      border-color: var(--ui-badge-border, var(--_badge-color-border, color-mix(in srgb, var(--_badge-text) 88%, transparent)));
      color: var(--ui-badge-text, var(--_badge-color-text, color-mix(in srgb, var(--_badge-surface) 85%, var(--ui-text-primary))));
      /* Paint each translucent layer once, including the border, without a bright double-painted ring. */
      background-clip: padding-box;
    }

    :host([variant="inverse"][shape="circle"]) {
      box-shadow: var(--ui-shadow-sm);
    }

    /* Neutral reverses a subtle surface/ink pair rather than a strong tone. Keep its original
       surface ink: moving it toward dark-theme primary text would reduce overlay contrast. */
    :host([variant="inverse"][tone="neutral"]) {
      color: var(--ui-badge-text, var(--_badge-color-text, var(--_badge-surface)));
    }

    :host([variant="outline"]) {
      --_badge-surface: var(--ui-surface-default);
      --_badge-border: var(--ui-border-strong);
      --_badge-text: var(--ui-text-secondary);
      /* An outline colour keeps the surface and draws its edge and text in the ink. */
      --_badge-color-surface: initial;
      --_badge-color-border: var(--_badge-color-ink);
    }

    :host([variant="outline"][tone="accent"]) {
      --_badge-border: var(--ui-accent-solid);
      --_badge-text: var(--ui-accent-subtle-text, var(--ui-accent-solid));
    }

    :host([variant="outline"][tone="danger"]) {
      --_badge-border: var(--ui-danger-solid);
      --_badge-text: var(--ui-danger-subtle-text, var(--ui-danger-solid));
    }

    :host([variant="outline"][tone="success"]) {
      --_badge-border: var(--ui-success-solid);
      --_badge-text: var(--ui-success-subtle-text, var(--ui-success-solid));
    }

    :host([variant="outline"][tone="warning"]) {
      --_badge-border: var(--ui-warning-solid);
      --_badge-text: var(--ui-warning-subtle-text, var(--ui-warning-solid));
    }

    :host([variant="outline"][tone="info"]) {
      --_badge-border: var(--ui-info-solid);
      --_badge-text: var(--ui-info-subtle-text, var(--ui-info-solid));
    }

    /* An icon mark keeps the existing tone recipe and follows the global spacing and radius. */
    :host([shape="square"]) {
      --_badge-square-size: var(--ui-badge-square-size, calc(var(--ui-space-4) * 2));
      display: inline-flex;
      box-sizing: border-box;
      flex: none;
      inline-size: var(--_badge-square-size);
      block-size: var(--_badge-square-size);
      min-inline-size: var(--_badge-square-size);
      min-block-size: var(--_badge-square-size);
      padding: 0;
      border-radius: var(--ui-radius-md);
      text-box-trim: none;
    }

    :host([shape="square"][size="xs"]) {
      --_badge-square-size: var(--ui-badge-square-size, calc(var(--ui-space-3) * 2));
    }

    :host([shape="square"][size="lg"]) {
      --_badge-square-size: var(--ui-badge-square-size, calc(var(--ui-space-4) * 2 + var(--ui-space-2)));
    }

    :host([shape="square"]) .label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    :host([shape="square"]) .label :slotted(svg) {
      margin-inline-end: 0;
    }

    :host([shape="square"]) .label:empty {
      display: none;
    }

    /* A visible glyph needs fixed geometry, unlike a content-sized pill or a hidden-label dot. */
    :host([shape="circle"]) {
      --_badge-circle-size: var(--ui-badge-circle-size, calc(var(--ui-space-3) * 2));
      display: inline-flex;
      flex: none;
      inline-size: var(--_badge-circle-size);
      block-size: var(--_badge-circle-size);
      min-inline-size: var(--_badge-circle-size);
      min-block-size: var(--_badge-circle-size);
      padding: 0;
      border-radius: var(--ui-radius-round);
      text-box-trim: none;
    }

    :host([shape="circle"][size="xs"]) {
      --_badge-circle-size: var(--ui-badge-circle-size, var(--ui-space-4));
    }

    :host([shape="circle"][size="lg"]) {
      --_badge-circle-size: var(--ui-badge-circle-size, calc(var(--ui-space-4) * 2));
    }

    :host([shape="circle"]) .label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      text-box-trim: none;
    }

    :host([shape="circle"]) .label :slotted(svg) {
      margin-inline-end: 0;
    }

    :host([shape="circle"]) .label:empty {
      display: none;
    }

    /* Center capital and numeral ink, rather than the font's ascent/descent line box.
       Icon labels retain flex geometry; untrimmed browsers keep that fallback too. */
    @supports (text-box-trim: trim-both) {
      :host([shape="circle"]) .label:not(:has(svg)),
      :host([shape="square"]) .label:not(:has(svg)) {
        display: block;
        text-box-trim: trim-both;
        text-box-edge: cap alphabetic;
        overflow: visible;
      }
    }

    /* A dot uses the badge's tone recipe; only its silhouette and visible label change. */
    :host([shape="dot"]) {
      position: relative;
      box-sizing: border-box;
      flex: none;
      inline-size: var(--ui-badge-dot-size, var(--ui-space-2));
      block-size: var(--ui-badge-dot-size, var(--ui-space-2));
      min-inline-size: var(--ui-badge-dot-size, var(--ui-space-2));
      min-block-size: var(--ui-badge-dot-size, var(--ui-space-2));
      padding: 0;
      border-radius: var(--ui-radius-round);
      text-box-trim: none;
    }

    :host([shape="dot"]) .label {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* The clipped point needs an inset surface over an outer border-colour shape: a native border
       has no diagonal edge to follow. Keep this edge for every tag variant. */
    :host([shape="tag"]) {
      --_badge-point: var(--ui-badge-point, var(--ui-space-2));

      position: relative;
      isolation: isolate;
      border-color: transparent;
      border-radius: 0;
      background: var(--ui-badge-border, var(--_badge-color-border, var(--_badge-border)));
      padding-inline-end: calc(var(--ui-badge-padding-inline, var(--ui-space-2)) + var(--_badge-point));
      clip-path: polygon(0 0, calc(100% - var(--_badge-point)) 0, 100% 50%, calc(100% - var(--_badge-point)) 100%, 0 100%);
    }

    :host([shape="tag"])::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--_badge-outline-surface);
      clip-path: polygon(0 0, calc(100% - var(--_badge-point)) 0, 100% 50%, calc(100% - var(--_badge-point)) 100%, 0 100%);
      pointer-events: none;
    }

    :host([shape="tag"][variant="inverse"]) {
      background: var(--ui-badge-border, var(--_badge-color-border, var(--_badge-text)));
    }

    :host([shape="tag"]):dir(rtl) {
      padding-inline-end: var(--ui-badge-padding-inline, var(--ui-space-2));
      padding-inline-start: calc(var(--ui-badge-padding-inline, var(--ui-space-2)) + var(--_badge-point));
      clip-path: polygon(var(--_badge-point) 0, 100% 0, 100% 100%, var(--_badge-point) 100%, 0 50%);
    }

    :host([shape="tag"]):dir(rtl)::before {
      clip-path: polygon(var(--_badge-point) 0, 100% 0, 100% 100%, var(--_badge-point) 100%, 0 50%);
    }

    @media (forced-colors: active) {
      :host([shape="dot"]) {
        forced-color-adjust: none;
        border-color: CanvasText;
        background: CanvasText;
      }

      :host([shape="tag"]) {
        forced-color-adjust: none;
        background: CanvasText;
        color: CanvasText;
      }

      :host([shape="tag"])::before {
        background: Canvas;
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
