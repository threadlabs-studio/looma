<!--
title: Circular marks
description: A circle centers one visible glyph or icon in fixed geometry. Use a pill for longer text, and name a mark when surrounding words do not already explain it.
-->
<ui-cluster gap="m">
  <ui-badge shape="circle" size="xs" variant="outline" tone="neutral" aria-label="Category A">A</ui-badge>
  <ui-badge shape="circle" variant="outline" tone="accent" aria-label="Category B">B</ui-badge>
  <ui-badge shape="circle" tone="success" role="img" aria-label="Complete"><ui-icon name="check"></ui-icon></ui-badge>
</ui-cluster>
