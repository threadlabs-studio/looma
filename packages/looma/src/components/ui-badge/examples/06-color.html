<!--
title: Custom colour
description: Tones mean a status. For a category, set --ui-badge-color on the badge to any CSS colour; it derives a soft wash and readable text in every variant and theme.
-->
<ui-cluster gap="xs">
  <ui-badge style="--ui-badge-color: teal">Business</ui-badge>
  <ui-badge style="--ui-badge-color: rebeccapurple">Person</ui-badge>
  <ui-badge style="--ui-badge-color: #f59e0b">Location</ui-badge>
  <ui-badge variant="solid" style="--ui-badge-color: teal">Solid</ui-badge>
  <ui-badge variant="outline" shape="tag" style="--ui-badge-color: rebeccapurple">Outline</ui-badge>
</ui-cluster>
