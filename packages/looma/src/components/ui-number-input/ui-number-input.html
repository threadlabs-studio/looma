<link rel="component" href="../ui-input/ui-input.html">
<link rel="component" href="../ui-icon-button/ui-icon-button.html">
<link rel="component" href="../ui-icon/ui-icon.html">
<template component="ui-number-input" module="./ui-number-input.js">
  <defs>
    <state name="display" type="string" from="$value"></state>
    <prop name="value" type="string" default="0"
    >Exact value. Arithmetic is calculated on Enter or blur; the resulting value includes unit. Invalid expressions stay visible and expose invalid
      state.</prop>
    <prop name="unit" type="string" default="">One accepted unit, such as px, rem, ms or %. Bare numbers use this unit. No automatic unit conversion.</prop>
    <prop name="min" type="number" default="-1000000">Inclusive lower bound applied to typing, arithmetic, stepping and external values.</prop>
    <prop name="max" type="number" default="1000000">Inclusive upper bound applied to every editing path.</prop>
    <prop name="step" type="number" default="1">Positive increment used by arrows and step buttons; Shift multiplies it by ten.</prop>
    <prop name="name" type="string" default="">Optional form field name.</prop>
    <prop name="label" type="string" default="Value">Accessible name for the editing control.</prop>
    <prop name="size" type="keyword" values="sm, md, lg" default="md">Shared field and button height.</prop>
    <prop name="compact" type="boolean" default="false"
    >Shows just the exact field, retaining arrow-key stepping and arithmetic without separate step buttons.</prop>
    <prop name="disabled" type="boolean" default="false">Prevents typing, stepping and pointer or keyboard changes while keeping the value visible.</prop>
    <event name="input" type="object"><prop name="value" type="string" required></prop></event>
    <event name="change" type="object"><prop name="value" type="string" required></prop></event>
  </defs>
  <span>
    <ui-icon-button
      data-number-step="decrease"
      from:hidden="$compact"
      match-button
      type="button"
      from:size="$size"
      from:disabled="$disabled"
      from:label="concat('Decrease ', $label)"
    ><ui-icon name="minus"></ui-icon></ui-icon-button>
    <ui-input
      data-ui-field-control
      from:size="$size"
      from:disabled="$disabled"
      from:value="$display"
      from:aria-label="$label"
      from:name="$name"
      inputmode="decimal"
      spellcheck="false"
      aria-description="Enter calculates arithmetic. Arrow keys step; Shift changes ten steps."
    ></ui-input>
    <ui-icon-button
      data-number-step="increase"
      from:hidden="$compact"
      match-button
      type="button"
      from:size="$size"
      from:disabled="$disabled"
      from:label="concat('Increase ', $label)"
    ><ui-icon name="plus"></ui-icon></ui-icon-button>
  </span>
  <style>
    :host {
      display: flex !important;
      align-items: center !important;
      gap: var(--ui-space-1) !important;
      margin: 0 !important;
      padding: 0 !important;
      min-inline-size: 0;
    }
    :host([compact]) {
      inline-size: 5rem;
    }
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
