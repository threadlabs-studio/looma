<link rel="component" href="../ui-icon-button/ui-icon-button.html">
<link rel="component" href="../ui-icon/ui-icon.html">
<template component="ui-toast-region" controller="./ui-toast-region.js">
  <defs>
    <prop name="duration" type="number" default="0"
    >Default milliseconds for toasts added with the show-toast event or command; 0 keeps each until dismissed. Hover or focus pauses a timer.</prop>
    <prop name="placement" type="keyword" values="top, top-start, top-end, bottom, bottom-start, bottom-end" default="top"
    >Screen edge where the stack appears. Start and end follow the writing direction.</prop>
    <state
      name="toasts"
      type="list"
      value="[]"
    >
      <prop type="object">
        <prop name="id" required type="string"></prop>
        <prop name="message" required type="string"></prop>
        <prop name="tone" required type="keyword" values="neutral, info, success, warning, danger"></prop>
        <prop name="role" required type="keyword" values="alert, status"></prop>
        <prop name="closing" required type="boolean"></prop>
      </prop>
    </state>
    <event name="dismiss" type="object">
      <prop name="id" required type="string"></prop>
      <prop name="reason" required type="keyword" values="action, timeout"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
    <event name="show-toast" type="object">
      <prop name="message" required type="string"></prop>
      <prop name="id" type="string"></prop>
      <prop name="tone" type="keyword" values="neutral, info, success, warning, danger"></prop>
      <prop name="duration" type="number"></prop>
    </event>
  </defs>
  <div role="region" aria-label="Notifications" aria-live="polite" popover="manual">
    <slot></slot>
    <div
      $each="toast of $toasts"
      $key="$toast.id"
      class="toast"
      class:closing="$toast.closing"
      from:id="$toast.id"
      from:role="$toast.role"
      from:data-tone="$toast.tone"
    >
      <span class="message">{$toast.message}</span>
      <span class="dismiss" from:data-toast="$toast.id">
        <ui-icon-button size="sm" variant="ghost" from:round="true" from:label="concat('Dismiss ', $toast.message)">
          <ui-icon name="x"></ui-icon>
        </ui-icon-button>
      </span>
    </div>
  </div>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-toast-region-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-toast-region-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-toast-region-radius {
      syntax: "*";
      inherits: false;
    }
    @property --ui-toast-region-shadow {
      syntax: "*";
      inherits: false;
    }
    @property --ui-toast-region-enter-duration {
      syntax: "*";
      inherits: false;
    }
    @property --ui-toast-region-exit-duration {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Hooks do not inherit, so the parts below read them from the root. */
      --_ui-toast-region-surface: var(--ui-toast-region-surface);
      --_ui-toast-region-border: var(--ui-toast-region-border);
      --_ui-toast-region-radius: var(--ui-toast-region-radius);
      --_ui-toast-region-shadow: var(--ui-toast-region-shadow);
      --_ui-toast-region-enter-duration: var(--ui-toast-region-enter-duration);
      --_ui-toast-region-exit-duration: var(--ui-toast-region-exit-duration);

      position: fixed;
      top: calc(var(--ui-space-4) + env(safe-area-inset-top));
      right: auto;
      bottom: auto;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: grid;
      gap: var(--ui-space-2);
      inline-size: min(24rem, calc(100vw - var(--ui-space-4) * 2));
      max-inline-size: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      overflow: visible;
      border: 0;
      outline: 0;
      background: transparent;
      box-shadow: none;
      pointer-events: none;
    }

    :host:not(:popover-open) {
      display: none;
    }

    :host([placement="top-start"]),
    :host([placement="bottom-start"]) {
      left: auto;
      right: auto;
      inset-inline-start: calc(var(--ui-space-4) + env(safe-area-inset-left));
      transform: none;
    }

    :host([placement="top-end"]),
    :host([placement="bottom-end"]) {
      left: auto;
      right: auto;
      inset-inline-end: calc(var(--ui-space-4) + env(safe-area-inset-right));
      transform: none;
    }

    :host([placement="bottom"]),
    :host([placement="bottom-start"]),
    :host([placement="bottom-end"]) {
      top: auto;
      bottom: calc(var(--ui-space-4) + env(safe-area-inset-bottom));
    }

    :host > .toast,
    :host > :slotted(*) {
      pointer-events: auto;
    }

    .toast {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: var(--ui-space-2);
      align-items: start;
      border: var(--ui-border-width) solid var(--_ui-toast-region-border, var(--ui-overlay-border, var(--ui-border-strong)));
      border-radius: var(--_ui-toast-region-radius, var(--ui-overlay-radius, var(--ui-radius-lg)));
      padding: var(--ui-space-3) var(--ui-space-4);
      background: var(--_ui-toast-region-surface, var(--ui-overlay-surface, var(--ui-surface-elevated)));
      color: var(--ui-text-primary);
      box-shadow: var(--_ui-toast-region-shadow, var(--ui-overlay-shadow, var(--ui-elevation-overlay, var(--ui-shadow-lg))));
      animation: ui-toast-enter var(--_ui-toast-region-enter-duration, 0.32s) var(--ui-motion-ease-out, cubic-bezier(0.16, 1, 0.3, 1)) both;
    }

    .toast[data-tone="info"] {
      border-inline-start: var(--ui-accent-line-width) solid var(--ui-info-solid);
    }
    .toast[data-tone="success"] {
      border-inline-start: var(--ui-accent-line-width) solid var(--ui-success-solid);
    }
    .toast[data-tone="warning"] {
      border-inline-start: var(--ui-accent-line-width) solid var(--ui-warning-solid);
    }
    .toast[data-tone="danger"] {
      border-inline-start: var(--ui-accent-line-width) solid var(--ui-danger-solid);
    }

    /* Leaving slides on down and fades; the controller removes the toast when this ends. */
    .toast.closing {
      animation: ui-toast-exit var(--_ui-toast-region-exit-duration, 0.22s) var(--ui-motion-ease) both;
      pointer-events: none;
    }

    :is(:host([placement="bottom"]), :host([placement="bottom-start"]), :host([placement="bottom-end"])) .toast {
      animation-name: ui-toast-enter-bottom;
    }

    :is(:host([placement="bottom"]), :host([placement="bottom-start"]), :host([placement="bottom-end"])) .toast.closing {
      animation-name: ui-toast-exit-bottom;
    }

    @keyframes ui-toast-enter {
      from {
        opacity: 0;
        transform: translateY(-1rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes ui-toast-exit {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(0.75rem);
      }
    }

    @keyframes ui-toast-enter-bottom {
      from {
        opacity: 0;
        transform: translateY(1rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes ui-toast-exit-bottom {
      from {
        opacity: 1;
        transform: translateY(0);
      }
      to {
        opacity: 0;
        transform: translateY(-0.75rem);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast, .toast.closing {
        animation: none;
      }
    }

    .message {
      min-inline-size: 0;
      align-self: center;
    }

    .dismiss {
      align-self: center;
      margin-inline-end: calc(var(--ui-space-2) * -1);
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
