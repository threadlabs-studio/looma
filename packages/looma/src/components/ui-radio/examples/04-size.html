<!--
title: size
description: size="sm" keeps the radio's box and centres its label in the small control height, in the small controls' type size, so it lines up with a small button.
-->
<ui-cluster gap="s" align="center">
  <ui-radio size="sm">Radio</ui-radio>
  <ui-button size="sm">Small button</ui-button>
</ui-cluster>
