<template component="ui-radio" module="./ui-radio.js">
  <defs>
    <prop name="checked" type="boolean" default="false"
    >Whether the radio is checked initially or when set externally. A form reset returns it to this. Inside a ui-radio-group the group's value decides
      instead.</prop>
    <prop name="disabled" type="boolean" default="false">Disables the native radio, so it cannot be chosen, focused, or reached with the arrow keys.</prop>
    <prop name="name" type="string" default=""
    >The native name that groups radios: of the radios that share a name, only one can be checked, and the arrow keys move between them. Inside a ui-radio-group
      the group sets the name, so leave this empty there.</prop>
    <prop name="required" type="boolean" default="false"
    >Marks the native radio required, so native form validation fails until a radio with the same name is checked.</prop>
    <prop name="value" type="string" default="on"
    >The value this radio stands for: submitted with a form, reported in its change event, and matched against a ui-radio-group's value to decide which radio is
      checked.</prop>
    <prop name="size" type="keyword" values="sm, md, lg" default="md"
    >Aligns the radio with fields and buttons of the same size. It keeps its box size; the label takes that size's field type size and its first line centres in
      that control height (sm 2rem, lg 3rem by default), so in a row of inputs, selects, and buttons of one size it shares their height and their text baseline.
      Touch input keeps the same visible alignment. md is the standard layout.</prop>
    <state type="boolean" name="internalChecked" value="false"></state>
    <event name="change" type="object">
      <prop name="checked" required type="boolean"></prop>
      <prop name="value" required type="string"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
  </defs>
  <label>
    <input type="radio" $ref="input" .checked="$internalChecked" from:disabled="$disabled" from:required="$required" from:value="$value" from:name="$name">
    <span class="text">
      <span class="label"><slot></slot></span>
      <span class="description" $ref="description" aria-hidden="true"><slot name="description"></slot></span>
    </span>
  </label>
  <style>
    :host {
      /* Resolve shared part values at the component root. */
      --_ui-radio-size: var(--ui-radio-size, var(--ui-choice-mark-size));

      display: inline-flex !important;
      align-items: flex-start !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      padding: 0 !important;
      line-height: var(--ui-line-height-md) !important;
      gap: var(--ui-radio-gap, var(--ui-space-2)) !important;
      max-inline-size: 100%;
      color: var(--ui-text-primary);
      cursor: pointer;
    }

    /* The label, and under it an optional line saying what the choice means. */
    .text {
      font: inherit !important;
      align-self: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      gap: var(--ui-space-1) !important;
      min-inline-size: 0;
    }

    .label {
      min-inline-size: 0;
      font: inherit !important;
      line-height: var(--ui-line-height-md) !important;
      padding-block: max(0px, calc((var(--_ui-radio-size, 1.125rem) - 1lh) / 2)) !important;
    }

    .description {
      color: var(--ui-text-secondary);
      font-size: var(--ui-font-size-sm);
      line-height: var(--ui-line-height);
    }

    .description:empty {
      display: none !important;
    }

    input {
      font: inherit !important;
      box-sizing: border-box !important;
      align-self: auto !important;
      flex: 0 0 auto;
      inline-size: var(--_ui-radio-size, 1.125rem);
      block-size: var(--_ui-radio-size, 1.125rem);
      margin: max(0px, calc((1lh - var(--_ui-radio-size, 1.125rem)) / 2)) 0 0 !important;
      -webkit-appearance: none;
      appearance: none;
      position: relative;
      border: var(--ui-border-width) solid var(--ui-control-border, var(--ui-border-strong));
      border-radius: var(--ui-radius-round);
      background-color: var(--ui-control-surface, var(--ui-surface-default));
      background-image: var(--ui-surface-highlight, none);
      box-shadow: var(--ui-control-inset);
      cursor: pointer;
    }

    /* The native radio retains grouping, validation and keyboard behavior.
       Its empty well recedes; the filled selection and its dot stay crisp. */
    input::after {
      content: "";
      position: absolute;
      inset: 28%;
      border-radius: var(--ui-radius-round);
      background-color: var(--ui-text-on-accent);
      opacity: 0;
      transition: opacity var(--ui-motion-fast) var(--ui-motion-ease);
    }

    input:checked {
      background-color: var(--ui-accent-solid);
      background-image: none;
      border-color: var(--ui-accent-solid);
      box-shadow: none;
    }

    input:checked::after {
      opacity: 1;
    }

    @media (hover: hover) and (forced-colors: none) {
      :host:hover input:enabled {
        --_choice-hover-wash: var(--ui-neutral-wash-hover);
        background-image:
          linear-gradient(var(--_choice-hover-wash), var(--_choice-hover-wash)),
          var(--ui-surface-highlight, linear-gradient(transparent, transparent));
      }

      :host:hover input:enabled:not([aria-invalid="true"]) {
        border-color: var(--ui-control-border-hover, var(--ui-border-strong));
      }

      :host:hover input:enabled:checked {
        background-color: var(--ui-choice-hover-surface);
        background-image: none;
      }

      :host:hover input:enabled:checked:not([aria-invalid="true"]) {
        border-color: var(--ui-choice-hover-surface);
      }
    }

    input:focus-visible {
      outline: var(--ui-focus-width) solid var(--ui-focus-ring, var(--ui-accent-solid));
      outline-offset: var(--ui-focus-width);
    }

    :host([disabled]) {
      color: var(--ui-disabled-text);
      cursor: not-allowed;
    }
    :host([disabled]) .description {
      color: var(--ui-disabled-text);
    }
    :host([disabled]) input {
      border-color: var(--ui-disabled-border);
      background-color: var(--ui-disabled-surface);
      background-image: none;
      box-shadow: none;
      cursor: not-allowed;
    }

    :host([disabled]) input::after {
      background-color: var(--ui-disabled-text);
    }

    @media (prefers-reduced-motion: reduce) {
      input::after {
        transition: none;
      }
    }

    @media (forced-colors: active) {
      input {
        -webkit-appearance: auto;
        appearance: auto;
        background: none;
        box-shadow: none;
      }
      input::after {
        display: none !important;
      }
    }

    /* A sized choice keeps its box and aligns instead: the label takes that size's field type size,
       and the first line centres in that control height, so the label shares a row's baseline.
       Multi-line labels and descriptions still grow downward from that first line. */
    :host([size="sm"]) {
      --_font: var(--ui-font-size-sm);
      --_row: var(--ui-control-size-sm);
    }

    :host([size="lg"]) {
      --_font: var(--ui-font-size-md);
      --_row: var(--ui-control-size-lg);
    }

    :host([size="sm"]),
    :host([size="lg"]) {
      --_line: calc(var(--_font) * var(--ui-line-height-md));
      font-size: var(--_font);
      padding-block: max(0px, calc((var(--_row) - max(var(--_line), var(--_ui-radio-size, 1.125rem))) / 2)) !important;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
