<!--
title: Narrow
description: More controls than room keeps one row. It scrolls sideways, and each edge that hides controls fades into the toolbar's colour; a row that fits shows no fade.
-->
<div style="max-width: 260px">
  <ui-editor-toolbar aria-label="Formatting">
    <ui-button type="button" variant="ghost" size="sm">Bold</ui-button>
    <ui-button type="button" variant="ghost" size="sm">Italic</ui-button>
    <ui-button type="button" variant="ghost" size="sm">Underline</ui-button>
    <ui-button type="button" variant="ghost" size="sm">Strike</ui-button>
    <ui-button type="button" variant="ghost" size="sm">Highlight</ui-button>
    <ui-button type="button" variant="ghost" size="sm">Code</ui-button>
    <ui-button type="button" variant="ghost" size="sm">Heading</ui-button>
    <ui-button type="button" variant="ghost" size="sm">Quote</ui-button>
  </ui-editor-toolbar>
</div>
