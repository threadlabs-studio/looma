<!--
title: Prefix and suffix
description: Static text inside the field, before and after the typed value. Only the typed value is submitted; the affixes are read as the input's description.
-->
<ui-form-field>
  <label slot="label">Site address</label>
  <ui-input-group prefix="https://" suffix=".example.com">
    <ui-input name="site" placeholder="docs"> </ui-input>
  </ui-input-group>
  <small slot="help">Letters, numbers, and hyphens.</small>
</ui-form-field>
