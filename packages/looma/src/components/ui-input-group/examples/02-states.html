<!--
title: invalid, readonly, and disabled
description: The group shows the state of the Input inside it, with the same border, surface, and focus ring as a lone Input.
-->
<ui-stack gap="s">
  <ui-input-group suffix=".example.com"><ui-input invalid value="not valid" aria-label="Invalid"> </ui-input></ui-input-group>
  <ui-input-group suffix=".example.com"><ui-input readonly value="docs" aria-label="Read only"> </ui-input></ui-input-group>
  <ui-input-group suffix=".example.com"><ui-input disabled value="docs" aria-label="Disabled"> </ui-input></ui-input-group>
</ui-stack>
