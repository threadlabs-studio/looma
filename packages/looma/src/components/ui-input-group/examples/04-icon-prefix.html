<!--
title: Icon prefix
description: An icon shares the input surface with one compact gap to the value; text affixes keep their separate framing.
-->
<ui-form-field>
  <label slot="label" for="destination">Destination</label>
  <ui-input-group prefix-kind="icon">
    <ui-icon slot="prefix" name="search"></ui-icon>
    <ui-input id="destination" placeholder="Search or paste a URL…"></ui-input>
  </ui-input-group>
</ui-form-field>
