<template component="ui-input-group" controller="./ui-input-group.js">
  <defs>
    <prop name="multiline" type="boolean" default="false">Groups a Textarea with an action below its text inside the shared frame.</prop>
    <prop name="actionPosition" type="keyword" values="below, top-end" default="below"
    >In a multiline group, below keeps the action under the text. top-end places it inside the textarea at its upper end and reserves text padding for its
      measured width.</prop>
    <prop name="prefixKind" type="keyword" values="text, icon" default="text"
    >Text affixes have their own framing. An icon prefix shares the field surface and uses one compact icon-to-value gap.</prop>
    <prop name="disabled" type="boolean" default="false">Fades the group's framing to match a disabled input inside it. Disable the input itself too.</prop>
  </defs>
  <div>
    <span class="affix"><slot name="prefix"></slot></span>
    <span class="field"><slot></slot></span>
    <span class="affix"><slot name="suffix"></slot></span>
    <span class="action"><slot name="action"></slot></span>
  </div>
  <style>
    @property --ui-input-group-radius {
      syntax: "*";
      inherits: false;
    }
    @property --ui-input-group-invalid-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-input-group-invalid-focus-shadow {
      syntax: "*";
      inherits: false;
    }
    /* An input with fixed text before or after it, such as a domain after a site's name
       ("acme" + ".example.com") or slashes around a path. The group draws the field's border and
       focus ring around the input and its affixes together; the input inside drops its own through
       its custom properties, so it is still the one ui-input, with its form behaviour intact. The
       affixes are plain text beside the input, so name the input with a label that says what the
       whole value is. The action slot takes one button at the end, inside the border, for the one
       thing the field is for ("Continue" after a site's address), so it reads as the field's action
       and not the form's. */
    :host {
      /* The group's own border and height stand for the input's, so the group is a lone Input's height.
         Hooks do not inherit, so these are defaults for the input; its own hooks still win. */
      --_ui-default-input-border-width: 0;
      --_ui-default-input-min-block-size: 0;
      --_ui-default-input-border: transparent;
      --_ui-default-input-border-hover: transparent;
      --_ui-default-input-focus-border: transparent;
      --_ui-default-input-invalid-border: transparent;
      --_ui-default-input-invalid-focus-shadow: none;
      --_ui-default-input-shadow: none;
      --_ui-default-input-focus-shadow: none;
      --_ui-default-input-focus-outline: none;
      --_ui-default-input-radius: 0;
      --_ui-default-input-surface: transparent;
      --_ui-default-textarea-border-width: 0;
      --_ui-default-textarea-border: transparent;
      --_ui-default-textarea-border-hover: transparent;
      --_ui-default-textarea-focus-border: transparent;
      --_ui-default-textarea-invalid-border: transparent;
      --_ui-default-textarea-invalid-focus-shadow: none;
      --_ui-default-textarea-shadow: none;
      --_ui-default-textarea-focus-shadow: none;
      --_ui-default-textarea-focus-outline: none;
      --_ui-default-textarea-radius: 0;
      --_ui-default-textarea-surface: transparent;

      display: flex;
      align-items: stretch;
      box-sizing: border-box;
      inline-size: 100%;
      min-inline-size: 0;
      min-block-size: var(--ui-control-size-md);
      /* The frame reads the shared control tokens with a lone Input's fallbacks, so the two match. */
      border: var(--ui-border-width) solid var(--ui-control-border, var(--ui-border-strong));
      border-radius: var(--ui-input-group-radius, var(--ui-field-radius, var(--ui-radius-md)));
      background: var(--ui-control-surface, var(--ui-surface-elevated));
      box-shadow: var(--ui-control-inset);
      overflow: hidden;
      /* A press anywhere in the frame focuses the input. */
      cursor: text;
      transition: border-color var(--ui-motion-fast) var(--ui-motion-ease), box-shadow var(--ui-motion-fast) var(--ui-motion-ease);
    }

    /* The frame takes its input's size, so a small group lines up with small buttons and fields. */
    :host:has(.field [data-ui-input-state~="size=sm"]) {
      min-block-size: var(--ui-control-size-sm);
    }

    :host:has(.field [data-ui-input-state~="size=lg"]) {
      min-block-size: var(--ui-control-size-lg);
    }

    @media (pointer: coarse) {
      :host:has(.field [data-ui-input-state~="size=sm"]) {
        min-block-size: var(--ui-control-min-block-size);
      }
    }

    :host:hover:not(:has(:is(input, textarea):focus, :is(input, textarea):disabled, :is(input, textarea):read-only, [aria-invalid="true"], :user-invalid)) {
      border-color: var(--ui-control-border-hover, var(--ui-text-secondary));
    }

    /* The ring shows when the field's input would show its own: when it is focus-visible, which a
       text input is for a pointer as well as a keyboard. A focused action button draws its own. */
    :host:has(.field :is(input, textarea):focus-visible) {
      border-color: var(--ui-control-focus, var(--ui-accent-solid));
      box-shadow:
        var(--ui-control-inset),
        var(--ui-control-focus-halo-shadow);
    }

    :host:has([aria-invalid="true"], :user-invalid) {
      border-color: var(--ui-input-group-invalid-border, var(--ui-field-danger, var(--ui-danger-solid)));
    }

    :host:has(:is(input, textarea):is([aria-invalid="true"], :user-invalid):focus-visible) {
      box-shadow: var(
        --ui-input-group-invalid-focus-shadow,
        var(--ui-control-inset),
        0 0 0 calc(var(--ui-focus-width) * 1.5) color-mix(
          in srgb,
          var(--ui-input-group-invalid-border, var(--ui-field-danger, var(--ui-danger-solid))) 22%,
          transparent
        )
      );
    }

    /* Forced colors drop box shadows, so the focus ring becomes an outline. */
    @media (forced-colors: active) {
      :host:has(:is(input, textarea):focus-visible) {
        outline: var(--ui-focus-width) solid Highlight;
        outline-offset: var(--ui-border-width);
      }
    }

    :host([disabled]),
    :host:has(:is(input, textarea):disabled) {
      background: var(--ui-control-surface-disabled, var(--ui-surface-muted));
      box-shadow: none;
      cursor: not-allowed;
    }

    .field {
      display: flex;
      flex: 1;
      min-inline-size: 0;
    }

    .affix {
      display: inline-flex;
      flex: none;
      align-items: center;
      padding-inline: var(--ui-space-2);
      color: var(--ui-text-muted);
      font-family: var(--ui-font-family-mono);
      font-size: var(--ui-font-size-sm);
      white-space: nowrap;
    }

    /* Fixed text is part of the value, but should not look editable. */
    .affix:has([slot="prefix"]),
    .affix:has([slot="suffix"]) {
      background: var(--ui-surface-muted);
    }

    .affix:has([slot="prefix"]) {
      border-inline-end: var(--ui-border-width) solid var(--ui-border-divider);
    }

    .affix:has([slot="suffix"]) {
      border-inline-start: var(--ui-border-width) solid var(--ui-border-divider);
    }

    :host([prefixKind="icon"]) {
      --_ui-default-input-padding-inline-start: var(--ui-space-2);
    }
    :host([prefixKind="icon"]) .affix:first-child {
      padding-inline-end: 0;
      border-inline-end: 0;
      background: transparent;
    }

    /* Centred rather than padded above and below: the group is exactly a lone Input's height, so a
       small button sits inside it with the difference split evenly, and the field keeps its height. */
    .action {
      display: flex;
      flex: none;
      align-items: center;
      padding-inline: var(--ui-space-1);
    }

    /* Multiline text owns the first row; its action remains inside the same frame below it. */
    :host([multiline]) {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
    }

    :host([multiline]) .field {
      grid-column: 2;
    }

    :host([multiline]) .action {
      grid-column: 1 / -1;
      justify-content: end;
      padding: var(--ui-space-2);
      padding-block-start: 0;
    }

    /* The same textarea keeps its full resizeable box. Its text reserves the action's live width,
       so a translated label or pending indicator cannot cover what the person types. */
    :host([multiline][actionPosition="top-end"]) {
      --_ui-default-textarea-padding-inline-end: calc(var(--_ui-input-group-action-inline-size, 7rem) + var(--ui-space-3));
    }

    :host([multiline][actionPosition="top-end"]) .field {
      grid-row: 1;
    }

    :host([multiline][actionPosition="top-end"]) .action {
      grid-column: 2;
      grid-row: 1;
      align-self: start;
      justify-self: end;
      padding: var(--ui-space-2);
    }

    .affix:empty,
    .action:empty {
      display: none;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
