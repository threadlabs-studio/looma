<template component="ui-tabs" controller="./ui-tabs.js">
  <defs>
    <prop name="density" type="comfortable | compact" default="comfortable">Compact trades padding and type size for rows that fit more on screen.</prop>
    <prop name="label" type="string" default="Tabs"
    >The tab list's accessible name, announced when focus enters the list. Name what the tabs switch between.</prop>
    <prop name="value" type="string" default=""
    >The id of the selected panel, initially or when set externally; empty selects the first panel. Choosing a tab updates it from there and reports a select
      event. A panel without an id is given a generated one.</prop>
    <prop name="orientation" type="horizontal | vertical" default="horizontal"
    >horizontal puts the tabs in a row above the panels, moved between with the Left and Right arrow keys; vertical puts them in a column beside the panels,
      moved between with Up and Down.</prop>
    <prop name="stretch" type="boolean" default="false">Share the full width of the tab list equally between tabs instead of sizing each to its label.</prop>
    <state name="internalValue" :value="''"></state>
    <state name="tabs" type="list(object({ id: string, label: string }))" :value="[]"></state>
    <event name="select" type="object({ value: string, previousValue: string, trigger: keyboard | pointer | programmatic })"></event>
  </defs>
  <div>
    <div class="list" $ref="list" role="tablist" :aria-label="label" :aria-orientation="orientation">
      <button
        $each="tab of tabs"
        $key="tab.id"
        type="button"
        role="tab"
        :id="format('%s-tab', tab.id)"
        :value="tab.id"
        :aria-controls="tab.id"
        :aria-selected="tab.id = internalValue"
        $value="tab.label"
      >
      </button>
    </div>
    <div class="panels" $ref="panels"><slot></slot></div>
  </div>
  <style>
    /* Density resolves into the tab row's own values; the public tokens still override them. */
    :host {
      --_tab-min-block-size: var(--ui-control-size);
      --_tab-padding-block: var(--ui-space-2);
      --_tab-padding-inline: var(--ui-space-3);
    }

    :host-state([density="compact"]) {
      --_tab-min-block-size: var(--ui-control-size-sm);
      --_tab-padding-block: var(--ui-space-1);
      --_tab-padding-inline: var(--ui-space-2);
    }

    :host {
      display: grid;
      inline-size: 100%;
      min-inline-size: 0;
    }

    .list {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: max-content;
      justify-content: start;
      inline-size: 100%;
      max-inline-size: 100%;
      /* Tabs that do not fit scroll sideways rather than wrapping or squeezing. */
      overflow-x: auto;
      /* overflow-x: auto would make the block axis scrollable too; a sideways swipe must not scroll the
         strip or the page vertically. */
      overflow-y: hidden;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      border-block-end: 1px solid var(--ui-border-default);
    }

    .list button {
      min-block-size: var(--ui-tabs-tab-min-block-size, var(--_tab-min-block-size));
      margin: 0 0 -1px;
      padding: var(--ui-tabs-tab-padding-block, var(--_tab-padding-block)) var(--ui-tabs-tab-padding-inline, var(--_tab-padding-inline));
      border: 0;
      border-block-end: 2px solid transparent;
      background: transparent;
      color: var(--ui-text-secondary);
      font: inherit;
      font-size: var(--ui-font-size-sm);
      font-weight: var(--ui-font-medium);
      cursor: pointer;
      transition:
        color var(--ui-motion-fast) var(--ui-motion-ease),
        background-color var(--ui-motion-fast) var(--ui-motion-ease),
        border-color var(--ui-motion-fast) var(--ui-motion-ease);
    }

    /* Centre the glyphs, not the line box: a label without descenders otherwise reads high. */
    /* Centre the glyphs, not the line box: a label without descenders otherwise reads high.
     * Trimming applies to block containers, so the box is a block with centred content. */
    @supports (text-box-trim: trim-both) {
      .list button {
        display: block;
        text-align: center;
        align-content: center;
        text-box-trim: trim-both;
        text-box-edge: cap alphabetic;
      }
    }

    :host-state([stretch]) .list {
      grid-auto-columns: minmax(max-content, 1fr);
    }

    .list button {
      white-space: nowrap;
    }

    .list button:hover {
      color: var(--ui-text-primary);
      background: var(--ui-surface-muted);
    }
    .list button[aria-selected="true"] {
      color: var(--ui-accent-solid);
      border-block-end-color: var(--ui-accent-solid);
    }
    .list button:focus-visible {
      position: relative;
      outline: none;
      box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ui-focus-ring) 45%, transparent);
      border-radius: var(--ui-radius-sm);
    }

    .panels {
      min-inline-size: 0;
    }
    :slotted(*) {
      padding: var(--ui-space-4);
    }

    :host-state([orientation="vertical"]) {
      grid-template-columns: max-content minmax(0, 1fr);
      align-items: start;
    }

    :host-state([orientation="vertical"]) .list {
      grid-auto-flow: row;
      grid-auto-columns: auto;
      border-block-end: 0;
      border-inline-end: 1px solid var(--ui-border-default);
    }

    :host-state([orientation="vertical"]) .list button {
      margin: 0 -1px 0 0;
      border-block-end: 0;
      border-inline-end: 2px solid transparent;
      text-align: start;
    }

    :host-state([orientation="vertical"]) .list button[aria-selected="true"] {
      border-inline-end-color: var(--ui-accent-solid);
    }

    @media (prefers-reduced-motion: reduce) {
      .list button {
        transition: none;
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
