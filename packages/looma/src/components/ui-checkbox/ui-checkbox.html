<template component="ui-checkbox" controller="./ui-checkbox.js">
  <defs>
    <prop name="checked" type="boolean" default="false"
    >Whether the checkbox is checked initially or when set externally. A form reset returns it to this.</prop>
    <prop name="disabled" type="boolean" default="false">Disables the native checkbox, so it cannot be toggled or focused.</prop>
    <prop name="indeterminate" type="boolean" default="false"
    >Shows the mixed state, for a checkbox that summarises a group whose items are partly checked. It sets the native indeterminate property, which is
      independent of checked, so update it as the group changes.</prop>
    <prop name="required" type="boolean" default="false"
    >Marks the native checkbox required, so native form validation treats it as invalid until it is checked.</prop>
    <prop name="name" type="string" default=""
    >The native name the checkbox submits under: a form that contains it sends name=value while it is checked, and nothing while it is unchecked, as a native
      checkbox does. Left empty, it takes no part in form submission.</prop>
    <prop name="value" type="string" default="on"
    >The value a form submits under name while the checkbox is checked, also reported in the change event's detail so one handler can tell checkboxes apart. on
      by default, as on a native checkbox.</prop>
    <prop name="size" type="sm | md" default="md"
    >Aligns the checkbox with fields and buttons of the same size. It keeps its box size; sm sets the label in the small controls' type size and centres its
      first line in the small control height (2rem by default), so in a row of small inputs, selects, and buttons it shares their height and their text
      baseline. Under a coarse pointer the row grows to the 44px touch minimum, as they do. md is the standard layout.</prop>
    <state name="internalChecked" :value="false"></state>
    <event name="change" type="object({ checked: boolean, value: string, trigger: keyboard | pointer | programmatic })"></event>
  </defs>
  <label>
    <input
      type="checkbox"
      $ref="input"
      .checked="internalChecked"
      .indeterminate="indeterminate"
      :disabled="disabled"
      :required="required"
      :name="name"
      :value="value"
    >
    <span class="text">
      <span class="label"><slot></slot></span>
      <span class="description" $ref="description" aria-hidden="true"><slot name="description"></slot></span>
    </span>
  </label>
  <style>
    :host {
      display: inline-flex;
      align-items: flex-start;
      gap: var(--ui-checkbox-gap, var(--ui-space-2));
      max-inline-size: 100%;
      color: var(--ui-text-primary);
      cursor: pointer;
    }

    /* The label, and under it an optional line saying what the choice means. */
    .text {
      display: flex;
      flex-direction: column;
      gap: var(--ui-space-1);
      min-inline-size: 0;
    }

    .label {
      min-inline-size: 0;
      line-height: var(--ui-line-height-md);
    }

    .description {
      color: var(--ui-text-secondary);
      font-size: var(--ui-font-size-sm);
      line-height: var(--ui-line-height);
    }

    .description:empty {
      display: none;
    }

    input {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      flex: 0 0 auto;
      inline-size: var(--ui-checkbox-size, 1.125rem);
      block-size: var(--ui-checkbox-size, 1.125rem);
      margin: 0.125em 0 0;
      border: 1px solid var(--ui-control-border-hover, var(--ui-border-strong));
      border-radius: var(--ui-radius-sm);
      background: var(--ui-control-surface, var(--ui-surface-default));
      box-shadow: inset 0 1px 2px color-mix(in srgb, var(--ui-text-primary) 8%, transparent);
      cursor: pointer;
      transition:
        background-color var(--ui-motion-fast) var(--ui-motion-ease),
        border-color var(--ui-motion-fast) var(--ui-motion-ease),
        box-shadow var(--ui-motion-fast) var(--ui-motion-ease);
    }

    input::after {
      content: "";
      position: absolute;
      opacity: 0;
    }

    input:checked,
    input:indeterminate {
      border-color: var(--ui-accent-solid);
      background: var(--ui-accent-solid);
      box-shadow: inset 0 1px 2px color-mix(in srgb, #000 16%, transparent);
    }

    /* Centre the tick's box, then lift it: a rotated L's ink sits ~0.11rem below its box centre. */
    input:checked::after {
      inset: 0;
      margin: auto;
      inline-size: 0.32rem;
      block-size: 0.58rem;
      /* Longhands, not `border: solid var(...)`: lowering drops a shorthand that omits a
         component, which left the tick with no style and no colour. */
      border-style: solid;
      border-color: var(--ui-text-on-accent);
      border-width: 0 0.125rem 0.125rem 0;
      opacity: 1;
      transform: translateY(-0.11rem) rotate(45deg);
    }

    input:indeterminate::after {
      inset: 50% 0.23rem auto;
      block-size: 0.125rem;
      border-radius: var(--ui-radius-round);
      background: var(--ui-text-on-accent);
      opacity: 1;
      transform: translateY(-50%);
    }

    input:hover:enabled {
      border-color: var(--ui-accent-solid);
    }

    input:focus-visible {
      outline: 2px solid var(--ui-focus-ring, var(--ui-accent-solid));
      outline-offset: 2px;
    }

    :host-state([disabled]) {
      color: var(--ui-disabled-text);
      cursor: not-allowed;
    }
    :host-state([disabled]) input {
      border-color: var(--ui-border-default);
      background: var(--ui-control-surface-disabled, var(--ui-surface-muted));
      cursor: not-allowed;
    }

    /* A small choice keeps its box and aligns instead: the label takes the small controls' type size,
       and the first line centres in their height, so the label shares their baseline in a row.
       Multi-line labels and descriptions still grow downward from that first line. */
    :host-state([size="sm"]) {
      --_line: calc(var(--ui-font-size-sm) * var(--ui-line-height-md));
      --_row: var(--ui-control-size-sm);
      font-size: var(--ui-font-size-sm);
      padding-block: calc((var(--_row) - var(--_line)) / 2);
    }

    :host-state([size="sm"]) input {
      margin-top: calc((var(--_line) - var(--ui-checkbox-size, 1.125rem)) / 2);
    }

    @media (pointer: coarse) {
      :host-state([size="sm"]) {
        --_row: var(--ui-control-min-block-size);
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
