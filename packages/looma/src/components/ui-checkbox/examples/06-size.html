<!--
title: size
description: size="sm" keeps the checkbox's box and centres its label in the small control height, in the small controls' type size, so it lines up with a small button.
-->
<ui-cluster gap="s" align="center">
  <ui-checkbox size="sm">Checkbox</ui-checkbox>
  <ui-button size="sm">Small button</ui-button>
</ui-cluster>
