<template component="ui-container">
  <defs>
    <prop name="measure" type="narrow | wide"
    >The container's maximum width, in characters of the current font: narrow is 45ch, wide is 80ch, and unset is 65ch, a comfortable reading line. The
      container centres itself when its parent is wider. The --ui-container-measure custom property, when set, overrides it.</prop>
    <prop name="gutters" type="s | m | l"
    >Inline padding on both sides, which keeps content off the edges of a narrow screen: s is 0.75rem, m is 1rem (also the default), and l is 1.5rem.</prop>
  </defs>
  <div><slot></slot></div>
  <style>
    :host {
      --_container-measure: 65ch;
      --_container-gutters: var(--ui-space-4);
      display: block;
      inline-size: 100%;
      max-inline-size: var(--ui-container-measure, var(--_container-measure));
      margin-inline: auto;
      padding-inline: var(--ui-container-gutters, var(--_container-gutters));
    }

    :host-state([measure="narrow"]) {
      --_container-measure: 45ch;
    }
    :host-state([measure="wide"]) {
      --_container-measure: 80ch;
    }
    :host-state([gutters="s"]) {
      --_container-gutters: var(--ui-space-3);
    }
    :host-state([gutters="m"]) {
      --_container-gutters: var(--ui-space-4);
    }
    :host-state([gutters="l"]) {
      --_container-gutters: var(--ui-space-5);
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
