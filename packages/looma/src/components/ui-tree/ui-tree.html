<link rel="component" href="../ui-tree-item/ui-tree-item.html">
<template component="ui-tree" controller="./ui-tree.js">
  <defs>
    <prop name="density" type="comfortable | compact" default="comfortable">Compact trades padding and type size for rows that fit more on screen.</prop>
    <prop name="label" type="string" default="Tree">The tree's accessible name, announced when focus enters it. Name what the tree holds.</prop>
    <prop name="hoverExpandDelay" type="number" default="700"
    >How long, in milliseconds, a dragged item must hover over the middle of a collapsed branch before the branch opens to receive it. 0 opens it at
      once.</prop>
    <prop name="maxDepth" type="number" default="0"
    >The deepest level a drag may produce, counting the top level as 1. A drop that would place the dragged item, or any item beneath it, deeper than this is
      refused and reported as reorder-rejected. 0 means no limit.</prop>
    <prop name="marquee" type="boolean" default="false"
    >Scrolls a name too long for its row while that row is hovered or focused, then puts it back. Off by default: a tree of names that fit should not move. An
      item may set its own marquee to opt in or out on its own.</prop>
    <event
      name="reorder"
      type="object({ sourceId: string, targetId: string, position: before | inside | after, sourceType: string, targetType: string, sourceScope: string, targetScope: string, trigger: keyboard | pointer | programmatic })"
    ></event>
    <event
      name="reorder-rejected"
      type="object({ sourceId: string, targetId: string, position: before | inside | after, reason: max-depth, maxDepth: integer, resultingDepth: integer, trigger: keyboard | pointer | programmatic })"
    ></event>
  </defs>
  <div role="tree"><slot></slot></div>
  <style>
    /* Reaches the items the way density does, so the setting lives on the tree the way a reader
       thinks about it: this list scrolls its long names. */
    :host-state([marquee]) {
      --ui-tree-item-marquee: 1;
    }

    :host-state([density="compact"]) {
      --ui-tree-item-min-block-size: var(--ui-control-size-sm);
      --ui-tree-item-font-size: var(--ui-font-size-sm);
      --ui-tree-item-label-padding-block: 0;
    }

    :host {
      display: block;
      min-inline-size: 0;
      padding-inline-start: var(--ui-tree-gutter, 0px);
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
