<template component="ui-separator">
  <defs>
    <prop name="emphasis" type="keyword" values="normal, strong" default="normal"
    >Normal uses the decorative divider color; strong uses the stronger enclosing-edge color for clearer separation.</prop>
    <prop name="orientation" type="keyword" values="horizontal, vertical" default="horizontal"
    >Whether the separator divides stacked content (horizontal) or inline content (vertical).</prop>
    <prop name="selectable" type="boolean" default="false">Gives a document divider a pointer-sized hit area. The editor owns selection and deletion.</prop>
    <prop name="selected" type="boolean" default="false">Shows the selected document divider. Selection does not change separator semantics.</prop>
  </defs>
  <hr from:aria-orientation="orientation">
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-separator-color {
      syntax: "*";
      inherits: false;
    }

    /* The root is the hr, so the rules name :host; a bare hr matches only a descendant. */
    :host {
      box-sizing: border-box;
      align-self: stretch;
      margin: 0;
      border: 0;
      border-block-start: var(--ui-border-width) solid var(--ui-separator-color, var(--_separator-color, var(--ui-border-divider)));
    }

    :host-state([emphasis="strong"]) {
      --_separator-color: var(--ui-border-strong);
    }

    :host[aria-orientation="vertical"] {
      block-size: auto;
      border-block-start: 0;
      border-inline-start: var(--ui-border-width) solid var(--ui-separator-color, var(--_separator-color, var(--ui-border-divider)));
    }

    :host-state([selectable]) {
      min-block-size: var(--ui-control-size-sm);
      border: 0;
      background: linear-gradient(var(--ui-separator-color, var(--ui-border-divider)), var(--ui-separator-color, var(--ui-border-divider))) center / 100%
        var(--ui-border-width) no-repeat;
      cursor: pointer;
    }
    :host-state([selectable]):hover {
      background-color: var(--ui-surface-hover);
    }
    :host-state([selected]) {
      outline: var(--ui-focus-width) solid var(--ui-focus-ring);
      outline-offset: var(--ui-focus-width);
      border-radius: var(--ui-radius-sm);
    }
  </style>
</template>
