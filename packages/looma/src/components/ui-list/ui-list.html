<template component="ui-list">
  <defs>
    <prop name="layout" type="rows | grid" default="rows"
    >How the items are laid out. Rows stack the items one per line, for a list read top to bottom. Grid sets them in as many columns as fit, each at least
      --ui-list-min-item-width (14rem) wide, for card items such as pinned or featured entries.</prop>
  </defs>
  <ul role="list"><slot></slot></ul>
  <style>
    /* A list of items (ui-list-item). It owns the spacing between them, so a view never sets it. The
       explicit list role keeps the list announced as one: some browsers drop it from a list with no
       markers. */
    :host {
      display: flex;
      flex-direction: column;
      gap: var(--ui-list-gap, var(--ui-space-1));
      min-inline-size: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    :host-state([layout="grid"]) {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--ui-list-min-item-width, 14rem)), 1fr));
      gap: var(--ui-list-gap, var(--ui-space-3));
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
