<template component="ui-segmented-control" module="../ui-radio-group/ui-radio-group.js">
  <defs>
    <prop name="items" required type="list">
      A short set of mutually exclusive choices. Values must be unique; labels remain visible.
      <prop type="object">
        <prop name="value" required type="string"></prop>
        <prop name="label" required type="string"></prop>
        <prop name="disabled" type="boolean"></prop>
      </prop>
    </prop>
    <prop name="value" type="string" default="">The selected value, initially or when changed externally. A native form reset returns to this value. Empty selects none.</prop>
    <prop name="name" type="string" default="">The native radio name used for form submission. Supply a unique name for each group so it also works before JavaScript connects.</prop>
    <prop name="form" type="string">Associate the native radios with this form ID. Omit it to use their containing form.</prop>
    <prop name="label" type="string" default="Options">The question answered by the choices, used as the group's legend and accessible name.</prop>
    <prop name="labelVisibility" type="keyword" values="visible, sr-only" default="visible">Hide the legend visually only when the surrounding content already names the choice.</prop>
    <prop name="size" type="keyword" values="sm, md, lg" default="md">Match the height and type size of nearby form controls.</prop>
    <prop name="disabled" type="boolean" default="false">Disable the group and exclude its value from form submission. Individually disabled choices retain their own state.</prop>
    <prop name="required" type="boolean" default="false">Require one native radio selection for form validation.</prop>
    <prop name="invalid" type="boolean" default="false">Expose validation failure on the group and its visible boundary.</prop>
    <state name="internalValue" type="string" from="$value"></state>
    <event name="select" type="object">
      <prop name="value" required type="string"></prop>
      <prop name="previousValue" required type="string"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
    <event name="change" type="object">
      <prop name="checked" required type="boolean"></prop>
      <prop name="value" required type="string"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
  </defs>
  <fieldset role="radiogroup" from:disabled="$disabled" from:form="$form" from:aria-required="$required" from:aria-invalid="$invalid">
    <legend class:sr-only="$labelVisibility = 'sr-only'">{$label}</legend>
    <div class="segments">
      <label $each="item of $items" $key="$item.value">
        <input type="radio" from:name="$name" from:value="$item.value" from:form="$form" from:disabled="$item.disabled = true" from:required="$required" .checked="$item.value = $internalValue">
        <span class="choice">{$item.label}</span>
      </label>
    </div>
  </fieldset>
  <style>
    :host {
      --_segmented-size: var(--ui-control-size-md);
      --_segmented-inset: var(--ui-control-inset-inline-md, var(--ui-space-3));
      --_segmented-font-size: var(--ui-font-size-md);
      --_segmented-padding: var(--ui-space-1) !important;
      --_segmented-radius: var(--ui-field-radius, var(--ui-radius-md));
      display: inline-grid !important;
      gap: var(--ui-space-2) !important;
      inline-size: fit-content;
      max-inline-size: 100%;
      min-inline-size: 0;
      margin: 0 !important;
      padding: 0 !important;
      border: 0;
      color: var(--ui-text-primary);
      font: inherit;
    }
    legend {
      float: inline-start;
      inline-size: 100%;
      margin: 0 0 var(--ui-space-2) !important;
      padding: 0 !important;
      font-weight: var(--ui-font-medium);
    }
    legend.sr-only,
    input {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      margin: -1px !important;
      padding: 0 !important;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .segments {
      display: inline-grid !important;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      min-inline-size: 0;
      padding: var(--_segmented-padding) !important;
      border: var(--ui-border-width) solid var(--ui-segmented-control-border, var(--ui-control-border));
      border-radius: var(--ui-segmented-control-radius, var(--_segmented-radius));
      background: var(--ui-segmented-control-track, var(--ui-surface-sunken));
      box-shadow: var(--ui-shadow-inset, none);
    }
    label { position: relative; display: grid !important; min-inline-size: 0; cursor: pointer; }
    .choice {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      box-sizing: border-box !important;
      min-block-size: var(--_segmented-size);
      min-inline-size: 0;
      padding: var(--ui-space-1) var(--_segmented-inset) !important;
      border: var(--ui-border-width) solid transparent;
      border-radius: max(0px, calc(var(--ui-segmented-control-radius, var(--_segmented-radius)) - var(--_segmented-padding)));
      color: var(--ui-text-secondary);
      font: inherit;
      font-size: var(--_segmented-font-size);
      line-height: var(--ui-line-height-tight);
      text-align: center;
      overflow-wrap: anywhere;
      transition: background-color var(--ui-motion-fast) var(--ui-motion-ease), box-shadow var(--ui-motion-fast) var(--ui-motion-ease);
    }
    input:checked + .choice {
      color: var(--ui-text-primary);
      background: var(--ui-segmented-control-selected-surface, var(--ui-surface-raised));
      border-color: var(--ui-segmented-control-selected-border, var(--ui-border));
      box-shadow: var(--ui-shadow-sm);
    }
    label:has(input:not(:disabled)):hover .choice { color: var(--ui-text-primary); }
    input:focus-visible + .choice { outline: var(--ui-focus-width) solid var(--ui-focus-ring); outline-offset: var(--ui-focus-width); }
    input:disabled + .choice { opacity: var(--ui-disabled-opacity, 0.5); cursor: not-allowed; }
    :host([invalid]) .segments { border-color: var(--ui-field-danger, var(--ui-danger-solid)); }
    :host([invalid]) legend { color: var(--ui-field-danger, var(--ui-danger-solid)); }
    :host([size="sm"]) { --_segmented-size: var(--ui-control-size-sm); --_segmented-inset: var(--ui-space-2); --_segmented-font-size: var(--ui-font-size-sm); }
    :host([size="lg"]) { --_segmented-size: var(--ui-control-size-lg); --_segmented-inset: var(--ui-space-4); --_segmented-font-size: var(--ui-font-size-lg); }
    :host[hidden] { display: none !important; }
    @media (forced-colors: active) {
      .segments { border-color: ButtonText; }
      input:checked + .choice { color: HighlightText; background: Highlight; border-color: Highlight; forced-color-adjust: none; }
      input:focus-visible + .choice { outline-color: Highlight; }
    }
  </style>
</template>
