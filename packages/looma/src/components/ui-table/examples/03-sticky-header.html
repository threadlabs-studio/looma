<!--
title: Sticky header
description: sticky-header keeps the header row in view while the rows scroll beneath it. The table scrolls inside its own box, so it needs a bounded height.
-->
<ui-table sticky-header style="block-size: 12rem">
  <table>
    <caption>Deliveries</caption>
    <thead>
      <tr>
        <th scope="col">Day</th>
        <th scope="col" data-ui-align="end">Parcels</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Monday</th>
        <td data-ui-align="end">142</td>
      </tr>
      <tr>
        <th scope="row">Tuesday</th>
        <td data-ui-align="end">98</td>
      </tr>
      <tr>
        <th scope="row">Wednesday</th>
        <td data-ui-align="end">121</td>
      </tr>
      <tr>
        <th scope="row">Thursday</th>
        <td data-ui-align="end">87</td>
      </tr>
      <tr>
        <th scope="row">Friday</th>
        <td data-ui-align="end">163</td>
      </tr>
      <tr>
        <th scope="row">Saturday</th>
        <td data-ui-align="end">54</td>
      </tr>
      <tr>
        <th scope="row">Sunday</th>
        <td data-ui-align="end">12</td>
      </tr>
    </tbody>
  </table>
</ui-table>
