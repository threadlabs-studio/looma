<!--
title: Column alignment
description: data-align on a <col> aligns every cell in its column, header included, and span="2" covers two columns. A cell's own data-align overrides its column, and a cell spanning columns takes their alignment only when they agree, so the Total, spanning a text column and figures, stays at the start. Column alignment is applied once the component upgrades; data-align on a cell works before JavaScript.
-->
<ui-table>
  <table>
    <caption>Invoice lines</caption>
    <colgroup>
      <col>
      <col data-align="end" span="2">
      <col data-align="end">
    </colgroup>
    <thead>
      <tr>
        <th scope="col">Item</th>
        <th scope="col">Qty</th>
        <th scope="col">Unit price</th>
        <th scope="col">Amount</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">Design review</th>
        <td>2</td>
        <td>$400.00</td>
        <td>$800.00</td>
      </tr>
      <tr>
        <th scope="row">Hosting</th>
        <td>12</td>
        <td>$20.00</td>
        <td>$240.00</td>
      </tr>
      <tr>
        <th scope="row">Onboarding</th>
        <td colspan="2" data-align="start">Included with the plan</td>
        <td>$0.00</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <th scope="row" colspan="3">Total</th>
        <td>$1,040.00</td>
      </tr>
    </tfoot>
  </table>
</ui-table>
