<template component="ui-disclosure" controller="./ui-disclosure.js">
  <defs>
    <prop name="density" type="comfortable | compact" default="comfortable">Compact trades padding and type size for rows that fit more on screen.</prop>
    <prop name="summary" type="string" default="Details"
    >The text of the trigger row that opens and closes the disclosure. It is the trigger button's accessible name, so name what the content is.</prop>
    <prop name="open" type="boolean" default="false"
    >Whether the disclosure is open initially or when set externally. The trigger toggles it from there, reporting each change as an open or close event.</prop>
    <prop name="disabled" type="boolean" default="false"
    >Disables the trigger and mutes its text, so the disclosure keeps its current state and the user cannot toggle it.</prop>
    <state name="internalOpen" :value="false"></state>
    <state name="contentId" :value="''"></state>
    <event
      name="open"
      type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"
    ></event>
    <event
      name="close"
      type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"
    ></event>
  </defs>
  <div>
    <button class="trigger" type="button" $ref="trigger" :aria-controls="contentId" :aria-expanded="internalOpen" :disabled="disabled">
      <span $value="summary"></span>
      <span class="chevron" aria-hidden="true"></span>
    </button>
    <div class="panel" :id="contentId" :inert="not internalOpen"><div class="panel-inner"><slot></slot></div></div>
  </div>
  <style>
    /* Density resolves into the summary row's own values; the public tokens still override them. */
    :host {
      --_trigger-min-block-size: var(--ui-control-size);
      --_trigger-padding-block: var(--ui-space-2);
      --_trigger-padding-inline: var(--ui-space-3);
    }

    :host-state([density="compact"]) {
      --_trigger-min-block-size: var(--ui-control-size-sm);
      --_trigger-padding-block: var(--ui-space-1);
      --_trigger-padding-inline: var(--ui-space-2);
    }

    /* An accordion row, not a field: no enclosing box, just a divider, so it never reads as a
     * select or combobox. Stacked disclosures share their dividers. */
    :host {
      display: block;
      inline-size: 100%;
      overflow: clip;
      border-block-end: 1px solid var(--ui-border-default);
      color: var(--ui-text-primary);
    }

    .trigger {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--ui-space-3);
      align-items: center;
      inline-size: 100%;
      min-block-size: var(--ui-disclosure-trigger-min-block-size, var(--_trigger-min-block-size));
      padding: var(--ui-disclosure-trigger-padding-block, var(--_trigger-padding-block))
        var(--ui-disclosure-trigger-padding-inline, var(--_trigger-padding-inline));
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-weight: var(--ui-font-semibold);
      text-align: start;
      cursor: pointer;
      border-radius: var(--ui-radius-sm);
      transition: background-color var(--ui-motion-fast) var(--ui-motion-ease);
    }

    .trigger:hover:not(:disabled) {
      background: var(--ui-surface-muted);
    }
    .trigger:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ui-focus-ring) 45%, transparent);
    }
    .trigger:disabled {
      color: var(--ui-text-muted);
      cursor: not-allowed;
    }

    .chevron {
      inline-size: 0.5rem;
      block-size: 0.5rem;
      border-inline-end: 2px solid currentColor;
      border-block-end: 2px solid currentColor;
      transform: rotate(45deg) translate(-1px, -1px);
      transition: transform var(--ui-motion-fast) var(--ui-motion-ease);
    }

    .panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows var(--ui-motion-fast) var(--ui-motion-ease-out, var(--ui-motion-ease));
    }

    .panel-inner {
      min-block-size: 0;
      overflow: hidden;
      padding-inline: var(--ui-space-3);
    }

    :host-state([internalOpen]) .panel {
      grid-template-rows: 1fr;
    }
    :host-state([internalOpen]) .panel-inner {
      padding-block: 0 var(--ui-space-3);
    }
    :host-state([internalOpen]) .chevron {
      transform: rotate(225deg) translate(-1px, -1px);
    }

    @media (prefers-reduced-motion: reduce) {
      .panel,
      .chevron {
        transition: none;
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
