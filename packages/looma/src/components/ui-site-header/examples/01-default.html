<!--
title: Site navigation
description: A full-width header keeps its logo visible, places desktop navigation beside it, and puts search and account controls at the trailing edge. Below 64rem, the header automatically supplies a hamburger beside the logo and opens the same navigation in a full-height, scrollable drawer with a dark backdrop. No menu trigger, duplicate links, IDs, or event wiring are needed. Pass actions individually so the header reserves their adjustable hit areas.
-->
<ui-site-header>
  <a slot="brand" href="#home" aria-label="Folio home"><ui-icon name="compass"></ui-icon>Folio</a>
  <a slot="navigation" href="#guide" aria-current="page">Guide</a>
  <a slot="navigation" href="#components">Components</a>
  <a slot="navigation" href="#journal">Journal</a>
  <ui-icon-button slot="actions" id="site-header-search-trigger" size="sm" label="Search pages"><ui-icon name="search"></ui-icon></ui-icon-button>
  <ui-icon-button slot="actions" id="site-header-account-trigger" size="sm" label="Account"><ui-icon name="user-round"></ui-icon></ui-icon-button>
</ui-site-header>
<ui-popover for="site-header-search-trigger"><ui-form-field>
    <label slot="label" for="site-header-search">Search pages</label><ui-input id="site-header-search" type="search" placeholder="Find a page"></ui-input>
  </ui-form-field></ui-popover>
<ui-popover for="site-header-account-trigger"><nav aria-label="Account">
    <ui-stack gap="s"><a href="#profile">Your profile</a><a href="#settings">Settings</a></ui-stack>
  </nav></ui-popover>
