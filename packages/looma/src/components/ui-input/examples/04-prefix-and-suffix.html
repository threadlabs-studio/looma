<!--
title: Prefix and suffix
description: An Input Group shows fixed text inside the field, before and after the typed value. Only the typed value is submitted; the affixes are read as the input's description.
-->
<ui-input-group prefix="https://" suffix=".example.com">
  <ui-input name="site" aria-label="Site address" placeholder="docs"> </ui-input>
</ui-input-group>
