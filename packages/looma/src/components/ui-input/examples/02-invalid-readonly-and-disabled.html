title: invalid, readonly, and disabled
description: These properties configure validation and availability on the native input Looma renders.
-->
<ui-stack gap="s">
  <ui-input invalid value="Invalid" aria-label="Invalid"> </ui-input>
  <ui-input readonly value="Read only" aria-label="Read only"> </ui-input>
  <ui-input disabled value="Disabled" aria-label="Disabled"> </ui-input>
</ui-stack>
