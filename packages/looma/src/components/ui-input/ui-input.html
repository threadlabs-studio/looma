<template component="ui-input" controller="./ui-input.js">
  <defs>
    <prop name="value" type="string"
    >The input's text. Setting or changing it replaces the live text; between changes the user's typing stands, so follow input events to keep it in step. It is
      also the input's default, so a form reset returns to it.</prop>
    <prop name="disabled" type="boolean" default="false">Prevents editing and form submission.</prop>
    <prop name="invalid" type="boolean" default="false">Exposes invalid state to assistive technology and styling.</prop>
    <prop name="readonly" type="boolean" default="false">Allows selection without allowing edits.</prop>
    <prop name="required" type="boolean" default="false">Marks the control as required for form validation.</prop>
    <prop name="size" type="sm | md | lg" default="md"
    >Height, padding, and type size, matching Button's sizes so a field and a button of one size share a row. sm is the small control height (2rem by default)
      with smaller text, for compact rows such as a table row or a filter bar; md is the standard control height; lg is taller with roomier padding. Under a
      coarse pointer, sm grows to the 44px touch minimum and keeps body-size text.</prop>
  </defs>
  <input :value="value" :disabled="disabled" :readonly="readonly" :required="required" :aria-invalid="invalid">
  <style>
    :host {
      box-sizing: border-box;
      display: inline-block;
      inline-size: 100%;
      min-inline-size: 0;
      min-block-size: var(--ui-control-size-md);
      margin: 0;
      padding: var(--ui-space-2) var(--ui-space-3);
      appearance: none;
      border: 1px solid var(--ui-input-border, var(--ui-control-border, var(--ui-border-strong)));
      border-radius: var(--ui-input-radius, var(--ui-radius-md));
      background: var(--ui-input-surface, var(--ui-control-surface, var(--ui-surface-elevated)));
      color: var(--ui-text-primary);
      font: inherit;
      line-height: var(--ui-line-height-md);
      box-shadow: var(--ui-input-shadow, var(--ui-control-inset));
      transition:
        border-color var(--ui-motion-fast) var(--ui-motion-ease),
        box-shadow var(--ui-motion-fast) var(--ui-motion-ease),
        background-color var(--ui-motion-fast) var(--ui-motion-ease);
    }

    :host-state([size="sm"]) {
      min-block-size: var(--ui-control-size-sm);
      padding: var(--ui-space-1) var(--ui-space-2);
      font-size: var(--ui-font-size-sm);
    }

    :host-state([size="lg"]) {
      min-block-size: var(--ui-control-size-lg);
      padding: var(--ui-space-3) var(--ui-space-4);
      font-size: var(--ui-font-size-md);
    }

    /* Under touch a small field is still a touch-sized target, as a small button is, and keeps
       body-size text: below 16px, iOS zooms the page into the focused field. */
    @media (pointer: coarse) {
      :host-state([size="sm"]) {
        min-block-size: var(--ui-control-min-block-size);
        font-size: inherit;
      }
    }

    /* Tabbing into a field selects its text; tint that selection softly instead of the page highlight. */
    :host::selection {
      background: color-mix(in srgb, var(--ui-accent-solid) 20%, transparent);
      color: inherit;
    }

    :host::placeholder {
      color: var(--ui-control-placeholder, var(--ui-text-secondary));
      opacity: 1;
    }

    :host:hover:not(:focus):not(:disabled) {
      border-color: var(--ui-input-border-hover, var(--ui-control-border-hover, var(--ui-text-secondary)));
    }

    :host:focus-visible {
      border-color: var(--ui-input-focus-border, var(--ui-control-focus, var(--ui-accent-solid)));
      outline: none;
      box-shadow: var(--ui-input-focus-shadow, var(--ui-control-inset), var(--ui-control-focus-halo-shadow));
    }

    /* The app's invalid flag, or the browser's own verdict once the user has left an invalid field. */
    :host[aria-invalid="true"],
    :host:user-invalid {
      border-color: var(--ui-input-invalid-border, var(--ui-danger-solid));
    }

    :host:is([aria-invalid="true"], :user-invalid):focus-visible {
      box-shadow: var(
        --ui-input-invalid-focus-shadow,
        var(--ui-control-inset),
        0 0 0 3px color-mix(in srgb, var(--ui-danger-solid) 22%, transparent)
      );
    }

    :host:disabled {
      background: var(--ui-control-surface-disabled, var(--ui-surface-muted));
      color: var(--ui-text-muted);
      box-shadow: none;
      cursor: not-allowed;
    }

    /* No text-box-trim here: trimming a native input's line box below its line height lets the text
     * scroll vertically inside the field. Native inputs already center their single line. */

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
