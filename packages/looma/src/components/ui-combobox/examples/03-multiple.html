<!--
title: multiple
description: Multiple collects several selections in one scrolling field row. With name, a form submits one entry per chosen item's value (here teams=design, teams=docs), never the labels.
-->
<ui-combobox label="Teams" name="teams" multiple disclosure placeholder="Add a team…">
  <option value="design" selected>Design</option>
  <option value="docs" selected>Docs</option>
  <option value="platform">Platform</option>
</ui-combobox>
