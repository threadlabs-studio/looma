<!--
title: Browse-first suggestions
description: Open the list on focus and leave authored results visible while the consumer controls which options are supplied.
-->
<ui-combobox label="Fruit" open-on-focus filter="none">
  <option value="apple">Apple</option>
  <option value="pear">Pear</option>
  <span slot="empty">No fruit found</span>
</ui-combobox>
