<!--
title: Wrap selected items before scrolling
description: maxRows lets a multiple field grow through three rows before additional selections scroll vertically inside the field. The input remains reachable by keyboard.
-->
<ui-container fill>
  <ui-combobox label="Topics" multiple max-rows="3" disclosure placeholder="Add a topic…">
    <option value="research" selected>Research and discovery</option>
    <option value="design" selected>Interface design</option>
    <option value="content" selected>Content strategy</option>
    <option value="accessibility" selected>Accessibility review</option>
    <option value="delivery">Delivery</option>
  </ui-combobox>
</ui-container>
