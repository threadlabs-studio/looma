<!--
title: size
description: Each size matches Button's (sm 32px, md 40px, lg 48px); sm also takes smaller text and a smaller chevron.
-->
<ui-stack gap="s" style="max-inline-size: 14rem">
  <ui-select size="sm" aria-label="Small">
    <option>Small</option>
  </ui-select>
  <ui-select aria-label="Medium">
    <option>Medium</option>
  </ui-select>
  <ui-select size="lg" aria-label="Large">
    <option>Large</option>
  </ui-select>
</ui-stack>
