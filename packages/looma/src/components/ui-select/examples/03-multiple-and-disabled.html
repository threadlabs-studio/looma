<!--
title: multiple and disabled
description: Multiple shows a list that accepts several selections (and keeps the native list appearance); disabled makes a select unavailable.
-->
<ui-stack gap="s">
  <ui-select aria-label="Channels" multiple>
    <option selected>Email</option>
    <option>SMS</option>
    <option selected>Push</option>
  </ui-select>
  <ui-select aria-label="Disabled" disabled>
    <option>Unavailable</option>
  </ui-select>
</ui-stack>
