<!--
title: Row actions
description: A menu opened from a row handle keeps row structure actions and hides column structure actions.
-->
<ui-editor-table-context-menu
  open
  scope="row"
  actions='["add-row-before","add-column-before","move-row-up","move-column-left","delete-row","delete-column","toggle-header-row"]'
  header-row
>
</ui-editor-table-context-menu>
