<!--
title: Actions
description: The actions property contains the exact commands supported by the current selection; unsupported commands are absent.
bind: actions=tableActions
-->
<ui-editor-table-context-menu
  id="context-menu-actions"
  actions='["align-left","align-center","align-right","background-none","background-yellow","add-row-before","add-row-after","add-column-before","add-column-after","toggle-header-row","toggle-header-column","move-row-down","move-column-right","merge-cells","delete-table"]'
  open
  cell-background="#fef3c7"
  header-row
>
</ui-editor-table-context-menu>
