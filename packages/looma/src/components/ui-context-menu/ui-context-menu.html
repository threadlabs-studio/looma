<template component="ui-context-menu" controller="./ui-context-menu.js">
  <defs>
    <prop name="open" type="boolean" default="false">Whether the context menu is open initially or when set externally.</prop>
    <prop name="for" type="string" default="">ID of the element whose context click (right-click, long-press, Shift+F10, or the Menu key) opens the menu.</prop>
    <state name="internalOpen" :value="false"></state>
    <event
      name="open"
      type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"
    ></event>
    <event
      name="close"
      type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"
    ></event>
    <event name="select" type="object({ value: string, checked?: boolean, trigger: keyboard | pointer | programmatic })"></event>
  </defs>
  <span><div class="menu" $ref="menu" role="menu" aria-orientation="vertical"><slot></slot></div></span>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-context-menu-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-context-menu-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-context-menu-radius {
      syntax: "*";
      inherits: false;
    }
    @property --ui-context-menu-shadow {
      syntax: "*";
      inherits: false;
    }
    @property --ui-context-menu-z-index {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Hooks do not inherit, so the parts below read them from the root. */
      --_ui-context-menu-surface: var(--ui-context-menu-surface);
      --_ui-context-menu-border: var(--ui-context-menu-border);
      --_ui-context-menu-radius: var(--ui-context-menu-radius);
      --_ui-context-menu-shadow: var(--ui-context-menu-shadow);
      --_ui-context-menu-z-index: var(--ui-context-menu-z-index);

      display: contents;
    }

    .menu {
      position: fixed;
      inset: auto;
      margin: 0;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: var(--ui-space-1);
      background: var(--_ui-context-menu-surface, var(--ui-overlay-surface, var(--ui-surface-elevated)));
      border: 1px solid var(--_ui-context-menu-border, var(--ui-overlay-border, var(--ui-border-strong)));
      border-radius: var(--_ui-context-menu-radius, var(--ui-overlay-radius, var(--ui-radius-lg)));
      box-shadow: var(--_ui-context-menu-shadow, var(--ui-overlay-shadow, var(--ui-elevation-overlay, var(--ui-shadow-lg))));
      outline: 0;
      overflow: auto;
      z-index: var(--_ui-context-menu-z-index, 1000);
      min-width: 12rem;
      opacity: 0;
      transform: translateY(-4px) scale(0.99);
      transition:
        opacity var(--ui-motion-fast) var(--ui-motion-ease),
        transform var(--ui-motion-fast) var(--ui-motion-ease),
        display var(--ui-motion-fast) allow-discrete,
        overlay var(--ui-motion-fast) allow-discrete;
    }

    .menu hr {
      align-self: stretch;
      block-size: 0;
      margin: var(--ui-space-1) 0;
      border: 0;
      border-block-start: 1px solid var(--ui-border-divider);
    }

    .menu:popover-open {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @starting-style {
      .menu:popover-open {
        opacity: 0;
        transform: translateY(-4px) scale(0.99);
      }
    }

    .menu[hidden],
    .menu[popover]:not(:popover-open) {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .menu {
        transition: none;
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
