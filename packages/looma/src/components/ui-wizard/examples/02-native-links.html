title: Native destinations
description: Visited stages retain ordinary link navigation before JavaScript. Disabled future stages have no destination.
-->
<ui-wizard
  value="review"
  label="Review progress"
  steps='[{"value":"details","label":"Details","complete":true,"href":"#details"},{"value":"review","label":"Review","href":"#review"},{"value":"finish","label":"Finish","disabled":true,"href":"#finish"}]'
>

  <ui-button slot="secondary" href="#details">Back</ui-button>
  <ui-button slot="primary" preset="primary">Finish</ui-button>
</ui-wizard>
