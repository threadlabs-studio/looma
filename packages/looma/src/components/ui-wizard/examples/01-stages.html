<!--
title: Staged workflow
description: The host marks completed and inaccessible stages, supplies the current stage content, and owns the Back and Continue actions.
-->
<ui-wizard
  value="details"
  label="Setup progress"
  steps='[{"value":"start","label":"Start","complete":true},{"value":"details","label":"Details"},{"value":"review","label":"Review","disabled":true},{"value":"finish","label":"Finish","disabled":true}]'
>
  <ui-stack gap="sm"><ui-text as="h2" size="lg">Add details</ui-text><ui-text>Enter the details for this stage, then continue to review.</ui-text><ui-input
      label="Display name"
      value="Example workspace"
    ></ui-input></ui-stack>
  <ui-button slot="secondary">Back</ui-button>
  <ui-button slot="primary" preset="primary">Continue</ui-button>
</ui-wizard>
