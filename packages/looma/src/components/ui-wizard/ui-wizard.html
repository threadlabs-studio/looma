<link rel="component" href="../ui-button/ui-button.html">
<link rel="component" href="../ui-icon/ui-icon.html">
<link rel="component" href="../ui-action-bar/ui-action-bar.html">
<template component="ui-wizard" module="./ui-wizard.js">
  <defs>
    <prop name="value" type="string" default="">Current stage value. Consumer controlled; navigation reports intent without changing it.</prop>
    <prop name="steps" type="list" default="[]">Stages in their reading order. Mark inaccessible stages disabled; availability and completion belong to the
      host.
      <prop type="object">
        <prop name="value" type="string" required>Unique stage value.</prop>
        <prop name="label" type="string" required>Stage name.</prop>
        <prop name="complete" type="boolean">Shows a check and announces Completed.</prop>
        <prop name="disabled" type="boolean">Prevents activation and removes a native destination.</prop>
        <prop name="href" type="string">Optional native destination, usable before JavaScript.</prop>
      </prop>
    </prop>
    <prop name="label" type="string" default="Progress">Accessible name of the step navigation.</prop>
    <prop name="disabled" type="boolean" default="false">Disables step navigation. The host controls availability of its slotted actions and content.</prop>
    <event name="navigate" type="object">
      <prop name="value" type="string" required></prop>
      <prop name="previousValue" type="string" required></prop>
      <prop name="trigger" type="keyword" values="keyboard, pointer, programmatic" required></prop>
    </event>
  </defs>
  <div>
    <nav from:aria-label="$label">
      <ol>
        <li
          $each="step, index of $steps"
          $key="$step.value"
          from:data-state="{ true: 'current', false: { true: 'complete', false: 'upcoming' }[concat(default($step.complete, false))] }[concat($step.value = $value)]"
        >
          <ui-button
            variant="ghost"
            align="start"
            stretch
            from:selected="$step.value = $value"
            from:disabled="$disabled or default($step.disabled, false)"
            from:href="$step.href"
            from:aria-current="{ true: 'step', false: null }[concat($step.value = $value)]"
            from:data-wizard-value="$step.value"
          >
            <span
              class="marker"
              aria-hidden="true"
              from:data-current="concat($step.value = $value)"
              from:data-complete="concat(default($step.complete, false) and $step.value != $value)"
            ><ui-icon $if="$step.complete and $step.value != $value" name="check"></ui-icon><span $if="not $step.complete or $step.value = $value"
              >{format($index + 1, 'number')}</span></span>
            <span class="step-label"><span $if="$step.complete and $step.value != $value" class="status">Completed: </span>{$step.label}</span>
          </ui-button>
        </li>
      </ol>
    </nav>
    <div class="content"><slot></slot></div>
    <ui-action-bar><template slot="secondary"><slot name="secondary"></slot></template><template slot="primary"><slot
          name="primary"
        ></slot></template></ui-action-bar>
  </div>
  <style>
    :host {
      display: flex !important;
      flex-direction: column !important;
      gap: var(--ui-space-4) !important;
      min-inline-size: 0;
      color: var(--ui-text-primary);
    }

    ol {
      display: flex !important;
      flex-wrap: wrap !important;
      gap: var(--ui-space-2) !important;
      margin: 0 !important;
      padding: 0 !important;
      list-style: none;
    }

    li {
      flex: 1 1 10rem;
      min-inline-size: 0;
    }

    .marker {
      display: inline-flex !important;
      flex: none;
      align-items: center !important;
      justify-content: center !important;
      box-sizing: border-box !important;
      inline-size: 1.75em;
      block-size: 1.75em;
      border: var(--ui-border-width) solid var(--ui-border-strong);
      border-radius: 50%;
      color: var(--ui-text-secondary);
      font-size: var(--ui-font-size-sm);
      line-height: var(--ui-line-height-tight);
    }

    .marker[data-current="true"] {
      border-color: var(--ui-accent-solid);
      background: var(--ui-accent-solid);
      color: var(--ui-on-accent);
    }

    .marker[data-complete="true"] {
      border-color: var(--ui-selection-border);
      background: var(--ui-selection-surface);
      color: var(--ui-selection-text);
    }

    .step-label {
      min-inline-size: 0;
      white-space: normal;
      overflow-wrap: anywhere;
      text-align: start;
    }

    .content {
      min-inline-size: 0;
    }

    .status {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }

    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
