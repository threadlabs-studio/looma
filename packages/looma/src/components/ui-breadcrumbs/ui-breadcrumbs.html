<template component="ui-breadcrumbs">
  <defs>
    <prop name="label" type="string" default="Breadcrumb">The navigation landmark's accessible name.</prop>
  </defs>
  <nav :aria-label="label"><ol role="list"><slot></slot></ol></nav>
  <style>
    /* Where a view sits: a trail of ui-breadcrumb-item, from the top down to the current view. It wraps
       rather than scrolls, so every step stays reachable. */
    :host {
      display: block;
      min-inline-size: 0;
      color: var(--ui-text-muted);
      font-size: var(--ui-font-size-sm);
    }

    ol {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--ui-space-1) var(--ui-space-2);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
