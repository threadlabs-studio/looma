<template component="ui-spinner">
  <defs>
    <prop name="label" type="string" default=""
    >What is loading, for assistive technology ("Loading pages"). With a label the spinner is a status that is announced; without one it is decoration, for a
      spinner beside visible text that already says so.</prop>
    <prop name="size" type="keyword" values="sm, md" default="md">sm fits inside a button or a line of small text; md sits beside body text.</prop>
  </defs>
  <span
    class="ring"
    :role="{ true: 'status', false: null }[format('%s', label != '')]"
    :aria-label="{ true: label, false: null }[format('%s', label != '')]"
    :aria-live="{ true: 'polite', false: null }[format('%s', label != '')]"
    :aria-hidden="{ true: null, false: 'true' }[format('%s', label != '')]"
  >
    <svg viewBox="0 0 50 50" fill="none" aria-hidden="true" focusable="false">
      <circle class="track" cx="25" cy="25" r="20"></circle>
      <circle class="arc" cx="25" cy="25" r="20"></circle>
    </svg>
  </span>
  <style>
    /* A rounded SVG arc grows and recedes over a quiet full-circle track. */
    :host {
      display: inline-flex;
      flex: none;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      inline-size: 1em;
      block-size: 1em;
      color: currentColor;
      font-size: var(--ui-font-size-lg);
      line-height: 1;
    }

    :host-state([size="sm"]) {
      font-size: var(--ui-font-size-md);
    }

    svg {
      display: block;
      inline-size: 100%;
      block-size: 100%;
      animation: ui-spinner-rotate 2s linear infinite;
    }

    circle {
      stroke-width: 3;
      stroke-linecap: round;
    }

    .track {
      stroke: color-mix(in srgb, currentColor 16%, transparent);
    }

    .arc {
      stroke: currentColor;
      stroke-dasharray: 90, 150;
      stroke-dashoffset: 0;
      animation: ui-spinner-dash 1.5s ease-in-out infinite;
    }

    @keyframes ui-spinner-rotate {
      100% {
        transform: rotate(1turn);
      }
    }

    @keyframes ui-spinner-dash {
      0% {
        stroke-dasharray: 1, 150;
        stroke-dashoffset: 0;
      }
      50% {
        stroke-dasharray: 90, 150;
        stroke-dashoffset: -35;
      }
      100% {
        stroke-dasharray: 90, 150;
        stroke-dashoffset: -124;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      svg,
      .arc {
        animation: none;
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
