<!--
title: Danger alert
description: A danger toast uses an assertive alert role. Keep important alerts persistent until a person can act on them. Clearing hidden shows it, and it hides itself when dismissed.
-->
<ui-button id="show-failed-toast">Show alert</ui-button>
<ui-toast-region placement="bottom">
  <ui-toast id="failed-toast" tone="danger" hidden>The upload failed. Check the connection and try again.</ui-toast>
</ui-toast-region>
