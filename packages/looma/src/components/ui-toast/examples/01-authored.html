<!--
title: Authored status and action
description: A toast can carry a semantic tone and an authored action. The application handles the action and removes the toast after its dismiss event.
-->
<ui-toast-region placement="top-end">
  <ui-toast id="saved-toast" tone="success">
    Draft saved.
    <button slot="action" type="button">Undo</button>
  </ui-toast>
</ui-toast-region>
