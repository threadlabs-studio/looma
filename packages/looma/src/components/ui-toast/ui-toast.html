<link rel="component" href="../ui-icon-button/ui-icon-button.html">
<link rel="component" href="../ui-icon/ui-icon.html">
<template component="ui-toast" module="./ui-toast.js">
  <defs>
    <prop name="tone" type="keyword" values="neutral, info, success, warning, danger" default="neutral"
    >Semantic accent for this message. Danger uses an assertive alert role; the other tones use polite status semantics.</prop>
    <prop name="duration" type="number" default="0"
    >Milliseconds the toast is shown before it dismisses itself; 0 keeps it until an action dismisses it. The timer starts when the toast is shown, starts again
      each time it is shown, and pauses on hover or focus.</prop>
    <event name="dismiss" type="object">
      <prop name="id" required type="string"></prop>
      <prop name="reason" required type="keyword" values="action, timeout"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
  </defs>
  <div from:role="{ neutral: 'status', info: 'status', success: 'status', warning: 'status', danger: 'alert' }[$tone]">
    <div class="message"><slot></slot></div>
    <div class="action" $ref="action"><slot name="action"></slot></div>
    <ui-icon-button class="dismiss" size="sm" variant="ghost" from:round="true" label="Dismiss notification">
      <ui-icon name="x"></ui-icon>
    </ui-icon-button>
  </div>
  <style>
    /* Component hooks stay on this toast; group overlay values may inherit from the region. */

    :host {
      --_ui-toast-accent: var(--ui-overlay-border, var(--ui-border-strong));
      --_ui-surface-text: var(--ui-text-primary);
      --_ui-toast-surface: var(--ui-overlay-surface, var(--ui-surface-muted));

      display: flex !important;
      align-items: center !important;
      gap: var(--ui-space-2) !important;
      box-sizing: border-box !important;
      inline-size: 100%;
      margin: 0 !important;
      padding: var(--ui-space-3) var(--ui-space-4) !important;
      /* The close button's internal space supplies the rest of the trailing inset. */
      padding-inline-end: var(--ui-space-2) !important;
      border: var(--ui-border-width) solid var(--ui-toast-border, var(--ui-overlay-border, var(--ui-toast-accent, var(--_ui-toast-accent))));
      border-radius: var(--ui-toast-radius, var(--ui-overlay-radius, var(--ui-radius-lg)));
      background: var(--ui-toast-surface, var(--ui-overlay-surface, var(--_ui-toast-surface)));
      color: var(--_ui-surface-text);
      font-family: var(--ui-font-family-sans);
      font-size: var(--ui-font-size-sm);
      font-weight: var(--ui-font-normal);
      line-height: var(--ui-line-height-md);
      box-shadow: var(--ui-toast-shadow, var(--ui-overlay-shadow, var(--ui-elevation-overlay, var(--ui-shadow-lg))));
      pointer-events: auto;
    }

    :host([tone="info"]) {
      --_ui-toast-accent: var(--ui-info-soft-border);
      --_ui-surface-text: var(--ui-info-subtle-text);
      --_ui-toast-surface: var(--ui-info-soft);
    }
    :host([tone="success"]) {
      --_ui-toast-accent: var(--ui-success-soft-border);
      --_ui-surface-text: var(--ui-success-subtle-text);
      --_ui-toast-surface: var(--ui-success-soft);
    }
    :host([tone="warning"]) {
      --_ui-toast-accent: var(--ui-warning-soft-border);
      --_ui-surface-text: var(--ui-warning-subtle-text);
      --_ui-toast-surface: var(--ui-warning-soft);
    }
    :host([tone="danger"]) {
      --_ui-toast-accent: var(--ui-danger-soft-border);
      --_ui-surface-text: var(--ui-danger-subtle-text);
      --_ui-toast-surface: var(--ui-danger-soft);
    }

    .message {
      min-inline-size: 0;
      flex: 1;
    }
    .action:not(:has(> *)) {
      display: none !important;
    }
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
