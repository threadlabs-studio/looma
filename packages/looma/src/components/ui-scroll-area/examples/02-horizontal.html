<!--
title: Horizontal
description: orientation="horizontal" scrolls sideways. Nothing inside can take focus, so the area is a labelled region with tabindex="0" that the arrow keys can scroll.
-->
<ui-scroll-area orientation="horizontal" role="region" aria-label="Wide content" tabindex="0">
  <p style="inline-size: 60rem">A single line far wider than the area, so the area scrolls sideways and fades its end edge until the line's end is in view.</p>
</ui-scroll-area>
