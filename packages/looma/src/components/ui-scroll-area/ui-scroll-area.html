<template component="ui-scroll-area" controller="./ui-scroll-area.js">
  <defs>
    <prop name="fill" type="boolean" default="false">Grows into remaining space within a flex layout while keeping content independently scrollable.</prop>
    <prop name="size" type="keyword" values="content, sm, md, lg" default="content"
    >Optional height preset. content keeps intrinsic sizing; sm fits three compact 3.125rem result rows before the overflow fade, md is 20rem, and lg is
      30rem.</prop>
    <prop name="orientation" type="keyword" values="vertical, horizontal" default="vertical"
    >The direction the content scrolls. Vertical scrolls up and down and clips sideways overflow; horizontal scrolls sideways and clips vertical
      overflow.</prop>
    <prop name="trim" type="boolean" default="false"
    >Removes the outer block margins of the first and last projected items. Use when the surrounding panel owns its edge padding; margins between items remain
      intact.</prop>
  </defs>
  <div><div class="content" $ref="content"><slot></slot></div></div>
  <style>
    /* The controller sets each fade length from overflow and scroll position. The mask blends
       into whatever is behind the area without needing to know its colour. Before upgrade, its
       zero-length defaults leave the authored scroll area fully visible. */
    :host([fill]) {
      flex: 1;
    }

    :host {
      display: block;
      box-sizing: border-box;
      min-block-size: 0;
      min-inline-size: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      --_ui-scroll-fade-direction: to bottom;
      --_ui-scroll-fade-inline: to right;
      --_ui-scroll-fade-size: var(--ui-scroll-fade-size, 24px);
      mask-image: linear-gradient(
        var(--_ui-scroll-fade-direction),
        transparent,
        #000 var(--_ui-scroll-fade-start),
        #000 calc(100% - var(--_ui-scroll-fade-end)),
        transparent
      );
    }

    .content {
      display: flow-root;
    }

    /* Only the projected edges are trimmed; content inside an item keeps its own spacing. */
    :host([trim]) .content > :slotted(:first-child) {
      margin-block-start: 0;
    }

    :host([trim]) .content > :slotted(:last-child) {
      margin-block-end: 0;
    }

    :host([orientation="horizontal"]) {
      overflow-x: auto;
      overflow-y: hidden;
      --_ui-scroll-fade-direction: var(--_ui-scroll-fade-inline);
    }

    :host:dir(rtl) {
      --_ui-scroll-fade-inline: to left;
    }

    :host([size="sm"]) {
      max-block-size: calc(9.375rem + var(--ui-scroll-fade-size, 24px));
    }
    :host([size="md"]) {
      max-block-size: 20rem;
    }
    :host([size="lg"]) {
      max-block-size: 30rem;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
