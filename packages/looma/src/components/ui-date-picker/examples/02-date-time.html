<!--
title: Preserve a local time
description: Calendar navigation preserves the existing clock and fractional precision. The time blocks and clock choices remain directly editable; the bound value retains its space separator.
-->
<ui-date-picker
  type="datetime-local"
  value-format="space"
  label="Date and time"
  name="appointment"
  value="2026-10-30 14:30:45.125"
  locale="en-US"
></ui-date-picker>
