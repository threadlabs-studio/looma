<!--
title: Keep the appointment's zone
description: A zoned binding saves the date, clock, offset and region together. Its bracketed zone supplies the editing zone, so no separate time-zone prop is needed. Date-only fields omit type and save just YYYY-MM-DD.
-->
<ui-date-picker
  type="zoned"
  label="Appointment"
  name="appointment"
  value="2026-10-30T09:00-07:00[America/Vancouver]"
  locale="en-US"
></ui-date-picker>
