<template component="ui-section">
  <defs>
    <prop name="heading" type="string" default=""
    >The section's heading, an h2. Leave it empty for a section with no visible heading, and name the section with aria-label.</prop>
    <prop name="variant" type="keyword" values="plain, card, divided, fieldset" default="plain"
    >How the section is set apart. plain is a heading and content in the flow of the page; card sits it on a bordered surface, for a settings group; divided
      rules it off from the section before it, for a long form. fieldset joins the heading to a bordered frame using a native legend.</prop>
    <prop name="tone" type="keyword" values="neutral, danger" default="neutral"
    >danger marks a section of destructive actions (a danger zone): its heading and a framed section's border take the danger colour.</prop>
  </defs>
  <template $match>
    <fieldset $when="$variant = 'fieldset'">
      <legend class="legend" from:hidden="not $heading"><h2 class="heading">{$heading}</h2></legend>
      <span class="content">
        <span class="head">
          <span class="copy"><span class="description"><slot name="description"></slot></span></span>
          <span class="actions"><slot name="actions"></slot></span>
        </span>
        <span class="body"><slot></slot></span>
      </span>
    </fieldset>
    <section $else>
      <span class="head">
        <span class="copy">
          <h2 class="heading" from:hidden="not $heading">{$heading}</h2>
          <span class="description"><slot name="description"></slot></span>
        </span>
        <span class="actions"><slot name="actions"></slot></span>
      </span>
      <span class="body"><slot></slot></span>
    </section>
  </template>
  <style>
    /* A part of a view: a heading, an optional line under it, actions for the whole section at its
       end, and the content. Sections space themselves out through the Stack around them. */
    :host {
      display: flex !important;
      flex-direction: column !important;
      gap: var(--ui-space-4) !important;
      min-inline-size: 0;
    }

    :host([variant="card"]),
    :host([variant="fieldset"]) {
      --_ui-selection-context-surface: initial;
      --_ui-selection-context-border: initial;
      --_ui-selection-context-text: initial;
      padding: var(--ui-space-5) !important;
      border: var(--ui-border-width) solid var(--ui-border-strong);
      border-radius: var(--ui-radius-lg);
      background: var(--ui-surface-raised);
    }

    :host([variant="fieldset"]) {
      display: block !important;
      box-sizing: border-box !important;
      margin: 0 !important;
      padding-block-start: var(--ui-space-4) !important;
      padding-inline: calc(var(--ui-space-5) - var(--ui-space-2)) !important;
    }

    .legend {
      max-inline-size: 100%;
      box-sizing: border-box !important;
      padding-inline: var(--ui-space-2) !important;
      margin: 0 !important;
      overflow-wrap: anywhere;
    }

    .legend .heading {
      transform: translateY(-1px);
    }

    .content {
      display: flex !important;
      flex-direction: column !important;
      gap: var(--ui-space-4) !important;
      padding-inline: var(--ui-space-2) !important;
      min-inline-size: 0;
    }

    :host([variant="fieldset"]) .body {
      display: contents !important;
    }

    :host([variant="fieldset"]) .head:has(.description:empty):has(.actions:empty) {
      display: none !important;
    }

    :host([variant="divided"]) {
      padding-block-start: var(--ui-space-6) !important;
      border-block-start: var(--ui-border-width) solid var(--ui-border-divider);
    }

    :host([variant="card"][tone="danger"]),
    :host([variant="fieldset"][tone="danger"]) {
      border-color: color-mix(in srgb, var(--ui-danger) 45%, var(--ui-border-default));
    }

    :host([variant="card"][tone="danger"]) {
      --_ui-selection-context-surface: light-dark(
        oklch(from var(--ui-danger-soft) calc(l - 0.045) calc(max(c, min(0.045, c * 3))) h),
        oklch(from var(--ui-danger-soft) calc(l + 0.045) calc(max(c, min(0.045, c * 3))) h)
      );
      --_ui-selection-context-border: light-dark(
        oklch(from var(--ui-danger-soft) calc(l - 0.085) calc(max(c, min(0.045, c * 3))) h),
        oklch(from var(--ui-danger-soft) calc(l + 0.085) calc(max(c, min(0.045, c * 3))) h)
      );
      --_ui-selection-context-text: var(--ui-text-primary);
      border-inline-start: var(--ui-accent-line-width) solid var(--ui-danger);
      /* An accent edge keeps the corners on its side straight. */
      border-start-start-radius: 0;
      border-end-start-radius: 0;
      background: var(--ui-danger-soft);
    }

    .head {
      display: flex !important;
      flex-wrap: wrap !important;
      align-items: flex-start !important;
      justify-content: space-between !important;
      gap: var(--ui-space-2) var(--ui-space-4) !important;
    }

    .copy {
      display: flex !important;
      flex: 1 1 16rem;
      flex-direction: column !important;
      gap: var(--ui-space-1) !important;
      min-inline-size: 0;
    }

    .heading {
      font-family: var(--ui-font-display, inherit);
      margin: 0 !important;
      color: var(--ui-text-primary);
      font-size: var(--ui-font-size-lg);
      font-weight: var(--ui-font-semibold);
      line-height: var(--ui-line-height-tight);
    }

    :host([tone="danger"]) .heading {
      color: var(--ui-danger-subtle-text);
    }

    .description {
      color: var(--ui-text-secondary);
      font-size: var(--ui-font-size-sm);
      line-height: var(--ui-line-height);
    }

    .actions {
      display: inline-flex !important;
      flex-wrap: wrap !important;
      gap: var(--ui-space-2) !important;
    }

    .body {
      display: flex !important;
      flex-direction: column !important;
      gap: var(--ui-space-4) !important;
      min-inline-size: 0;
    }

    .description:empty,
    .actions:empty {
      display: none !important;
    }

    .head:has(.heading[hidden]):has(.description:empty):has(.actions:empty) {
      display: none !important;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
