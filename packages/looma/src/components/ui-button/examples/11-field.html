<!--
title: Value picker
description: A custom value picker shares Input and Select's quiet edge and height, with a slight resting lift.
-->
<ui-cluster>
  <ui-input aria-label="Name" value="General"></ui-input>
  <ui-select aria-label="Category"><option>General</option></ui-select>
  <ui-button variant="field" aria-label="Choose a color" aria-expanded="false">Choose color <ui-icon name="chevron-down"></ui-icon></ui-button>
</ui-cluster>
