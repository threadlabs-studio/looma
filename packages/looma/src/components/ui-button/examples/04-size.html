<!--
title: size
description: Size changes the control's height and padding (xs 24px, sm 32px, md 40px, lg 48px), not just its text. Use xs for a control that sits inside a line of small text.
-->
<ui-cluster gap="s" align="center">
  <ui-button size="xs">Extra small</ui-button>
  <ui-button size="sm">Small</ui-button>
  <ui-button>Medium</ui-button>
  <ui-button size="lg">Large</ui-button>
</ui-cluster>
