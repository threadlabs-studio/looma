<!--
title: Interaction emphasis
description: Keep a choice neutral at rest, then use accent on hover and press. Interaction tone and variant inherit the resting settings unless supplied; pressed feedback remains stronger than hover.
-->
<ui-stack gap="s">
  <ui-button tone="neutral" variant="outline" interaction-tone="accent" align="start" stretch>
    Choose a project
  </ui-button>
  <ui-button tone="neutral" variant="ghost" interaction-tone="accent" interaction-variant="outline">
    Browse projects
  </ui-button>
</ui-stack>
