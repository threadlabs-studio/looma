<!--
title: Appearance and tone
description: Appearance controls emphasis; tone expresses intent. The same six tones work as solid, outline and quiet actions, including solid neutral. Icon actions use the same palette.
-->
<ui-stack>
  <ui-cluster>
    <ui-button variant="solid" tone="accent">Send memo</ui-button>
    <ui-button variant="solid" tone="neutral">File notes</ui-button>
    <ui-button variant="solid" tone="danger">Delete draft</ui-button>
    <ui-button variant="solid" tone="success">Approve leave</ui-button>
    <ui-button variant="solid" tone="warning">Review route</ui-button>
    <ui-button variant="solid" tone="info">See briefing</ui-button>
  </ui-cluster>
  <ui-cluster>
    <ui-button variant="outline" tone="accent">Send memo</ui-button>
    <ui-button variant="outline" tone="neutral">File notes</ui-button>
    <ui-button variant="outline" tone="danger">Delete draft</ui-button>
    <ui-button variant="outline" tone="success">Approve leave</ui-button>
    <ui-button variant="outline" tone="warning">Review route</ui-button>
    <ui-button variant="outline" tone="info">See briefing</ui-button>
  </ui-cluster>
  <ui-cluster>
    <ui-button variant="ghost" tone="accent">Send memo</ui-button>
    <ui-button variant="ghost" tone="neutral">File notes</ui-button>
    <ui-button variant="ghost" tone="danger">Delete draft</ui-button>
    <ui-button variant="ghost" tone="success">Approve leave</ui-button>
    <ui-button variant="ghost" tone="warning">Review route</ui-button>
    <ui-button variant="ghost" tone="info">See briefing</ui-button>
  </ui-cluster>
  <ui-cluster>
    <ui-icon-button preset="primary" match-button label="Send memo"><ui-icon name="check"></ui-icon></ui-icon-button>
    <ui-icon-button preset="standard" match-button label="File notes"><ui-icon name="check"></ui-icon></ui-icon-button>
    <ui-icon-button preset="destructive" match-button label="Delete draft"><ui-icon name="check"></ui-icon></ui-icon-button>
    <ui-icon-button variant="solid" tone="success" match-button label="Approve leave"><ui-icon name="check"></ui-icon></ui-icon-button>
    <ui-icon-button variant="solid" tone="warning" match-button label="Review route"><ui-icon name="check"></ui-icon></ui-icon-button>
    <ui-icon-button variant="solid" tone="info" match-button label="See briefing"><ui-icon name="check"></ui-icon></ui-icon-button>
  </ui-cluster>
</ui-stack>
