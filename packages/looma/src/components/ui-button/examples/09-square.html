<!--
title: Square minimum size
description: Short numeric and icon actions share the control's minimum height and width. Longer labels grow naturally; the ordinary Button default stays content-sized.
-->
<ui-cluster gap="xs"><ui-button square size="sm" variant="ghost" tone="neutral" aria-label="Previous"><ui-icon
      name="chevron-left"
    ></ui-icon></ui-button><ui-button square size="sm" variant="ghost" tone="neutral">1</ui-button><ui-button square size="sm" variant="solid"
  >2</ui-button><ui-button square size="sm" variant="ghost" tone="neutral">10</ui-button><ui-button
    square
    size="sm"
    variant="ghost"
    tone="neutral"
    aria-label="Next"
  ><ui-icon name="chevron-right"></ui-icon></ui-button></ui-cluster>
