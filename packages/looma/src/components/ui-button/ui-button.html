<template component="ui-button">
  <defs>
    <prop name="variant" type="outline | solid | danger | ghost | link" default="outline"
    >Visual emphasis and semantic intent. link is an inline text action that reads as a link.</prop>
    <prop name="size" type="sm | md | lg" default="md">Control size.</prop>
    <prop name="disabled" type="boolean" default="false">disabled token.</prop>
    <prop name="align" type="center | start" default="center"
    >Content alignment. start lays the content out like a list option: from the start edge, with start-aligned text.</prop>
    <prop name="stretch" type="boolean" default="false">Fills the inline size of its container.</prop>
  </defs>
  <button type="button" :disabled="disabled"><slot></slot></button>
  <style>
    :host {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      color: var(--ui-action-secondary-text, var(--ui-text-primary));
    }

    :host-state([variant="solid"]) {
      color: var(--ui-action-primary-text, var(--ui-text-on-accent));
    }

    :host-state([align="start"]) {
      justify-content: flex-start;
      text-align: start;
    }

    :host-state([stretch]) {
      display: flex;
      inline-size: 100%;
    }

    :host {
      appearance: none;
      min-block-size: var(--ui-button-min-block-size, var(--ui-control-size-md, 2.5rem));
      border: 1px solid var(--ui-button-border, var(--ui-border-strong));
      border-radius: var(--ui-button-radius, var(--ui-radius-2));
      background: var(--ui-button-surface, var(--ui-surface-elevated));
      color: var(--ui-button-text, var(--ui-action-secondary-text, var(--ui-text-primary)));
      font: inherit;
      font-weight: var(--ui-font-medium, 500);
      line-height: var(--ui-line-height-tight);
      padding: var(--ui-space-2) var(--ui-space-3);
      background-image: var(--ui-raised-highlight, none);
      box-shadow: var(--ui-button-shadow, var(--ui-raised, var(--ui-shadow-xs)));
      cursor: pointer;
      transition:
        background-color var(--ui-motion-fast) var(--ui-motion-ease),
        border-color var(--ui-motion-fast) var(--ui-motion-ease),
        color var(--ui-motion-fast) var(--ui-motion-ease),
        box-shadow var(--ui-motion-fast) var(--ui-motion-ease),
        transform var(--ui-motion-fast) var(--ui-motion-ease);
      margin: 0;
    }

    @supports (text-box-trim: trim-both) {
      :host {
        text-box-trim: trim-both;
        text-box-edge: cap alphabetic;
      }
    }

    :host-state([size="sm"]) {
      min-block-size: var(--ui-control-size-sm, 2rem);
      padding: var(--ui-space-1) var(--ui-space-2);
      font-size: 0.875rem;
    }

    :host-state([size="lg"]) {
      min-block-size: var(--ui-control-size-lg, 3rem);
      padding: var(--ui-space-3) var(--ui-space-4);
      font-size: 1rem;
    }

    :host:hover:enabled {
      background: var(--ui-action-secondary-surface-hover, var(--ui-surface-muted));
      border-color: var(--ui-control-border-hover, var(--ui-border-strong));
    }

    :host:active:enabled {
      background: var(--ui-surface-subtle);
    }

    :host-state([variant="solid"]) {
      border-color: var(--ui-action-primary-surface, var(--ui-accent-solid));
      background: var(--ui-action-primary-surface, var(--ui-accent-solid));
      color: var(--ui-action-primary-text, var(--ui-text-on-accent));
      box-shadow: var(--ui-button-solid-shadow, inset 0 1px rgb(255 255 255 / 0.16), var(--ui-shadow-xs));
    }

    :host-state([variant="solid"]):hover:enabled {
      background: var(--ui-action-primary-surface-hover, var(--ui-accent-hover));
      border-color: var(--ui-action-primary-surface-hover, var(--ui-accent-hover));
      box-shadow: var(--ui-shadow-sm);
      transform: translateY(-1px);
    }

    :host-state([variant="solid"]):active:enabled {
      background: var(--ui-action-primary-surface-active, var(--ui-accent-active));
      border-color: var(--ui-action-primary-surface-active, var(--ui-accent-active));
      box-shadow: none;
      transform: translateY(0);
    }

    :host-state([variant="danger"]) {
      border-color: var(--ui-danger-solid);
      background: var(--ui-danger-solid);
      color: var(--ui-text-on-accent);
      box-shadow: var(--ui-button-danger-shadow, inset 0 1px rgb(255 255 255 / 0.14), var(--ui-shadow-xs));
    }

    :host-state([variant="danger"]):hover:enabled {
      background: var(--ui-danger-hover);
      border-color: var(--ui-danger-hover);
      box-shadow: var(--ui-shadow-sm);
      transform: translateY(-1px);
    }

    :host-state([variant="danger"]):active:enabled {
      box-shadow: none;
      transform: translateY(0);
    }

    :host-state([variant="ghost"]) {
      border-color: transparent;
      background: transparent;
      box-shadow: none;
      color: var(--ui-button-ghost-text, var(--ui-action-secondary-text, var(--ui-text-primary)));
    }

    /* Tints derive from the text colour, not a surface token, so hover and press show on any background. */
    :host-state([variant="ghost"]):hover:enabled {
      background: var(--ui-button-ghost-hover, color-mix(in srgb, currentColor 8%, transparent));
      border-color: transparent;
    }

    :host-state([variant="ghost"]):active:enabled {
      background: var(--ui-button-ghost-active, color-mix(in srgb, currentColor 14%, transparent));
      border-color: transparent;
    }

    /* A soft halo that transitions in with the other box-shadow changes, layered on the raised shadow. */
    :host:focus-visible {
      outline: none;
      box-shadow:
        var(--ui-button-shadow, var(--ui-raised, var(--ui-shadow-xs))),
        var(--ui-focus-halo);
    }

    :host-state([variant="solid"]):focus-visible {
      box-shadow:
        var(--ui-button-solid-shadow, inset 0 1px rgb(255 255 255 / 0.16), var(--ui-shadow-xs)),
        var(--ui-focus-halo);
    }

    /* Disabled colours fall back to each variant's own; ghost and link take only the text colour. */
    :host:disabled {
      opacity: var(--ui-button-disabled-opacity, 0.6);
      cursor: not-allowed;
      border-color: var(--ui-button-disabled-border, var(--ui-button-border, var(--ui-border-strong)));
      background-color: var(--ui-button-disabled-surface, var(--ui-button-surface, var(--ui-surface-elevated)));
      color: var(--ui-button-disabled-text, var(--ui-button-text, var(--ui-action-secondary-text, var(--ui-text-primary))));
    }

    :host-state([variant="solid"]):disabled {
      border-color: var(--ui-button-disabled-border, var(--ui-action-primary-surface, var(--ui-accent-solid)));
      background-color: var(--ui-button-disabled-surface, var(--ui-action-primary-surface, var(--ui-accent-solid)));
      color: var(--ui-button-disabled-text, var(--ui-action-primary-text, var(--ui-text-on-accent)));
    }

    :host-state([variant="danger"]):disabled {
      border-color: var(--ui-button-disabled-border, var(--ui-danger-solid));
      background-color: var(--ui-button-disabled-surface, var(--ui-danger-solid));
      color: var(--ui-button-disabled-text, var(--ui-text-on-accent));
    }

    :host-state([variant="ghost"]):disabled {
      border-color: transparent;
      background-color: transparent;
      color: var(--ui-button-disabled-text, var(--ui-button-ghost-text, var(--ui-action-secondary-text, var(--ui-text-primary))));
    }

    @media (pointer: coarse) {
      :host {
        min-block-size: var(--ui-control-min-block-size, 2.75rem);
      }
    }

    /* Link: an inline text action. No box, padding, or minimum height (inline targets are exempt under
       WCAG 2.5.8); the inherited font; an underline that strengthens on hover; a visible focus ring. */
    :host-state([variant="link"]) {
      display: inline;
      min-block-size: 0;
      padding: 0;
      border: 0;
      border-radius: var(--ui-radius-sm, 4px);
      background: none;
      box-shadow: none;
      font: inherit;
      color: var(--ui-button-link-color, var(--ui-text-secondary));
      text-decoration-line: underline;
      text-decoration-thickness: 1px;
      text-decoration-color: color-mix(in srgb, currentColor 40%, transparent);
      text-underline-offset: 0.2em;
      transition: color var(--ui-motion-fast) var(--ui-motion-ease), text-decoration-color var(--ui-motion-fast) var(--ui-motion-ease);
    }

    :host-state([variant="link"]):hover:enabled {
      color: var(--ui-button-link-hover-color, var(--ui-text-primary));
      text-decoration-color: currentColor;
      background: none;
      transform: none;
    }

    :host-state([variant="link"]):active:enabled {
      background: none;
      transform: none;
    }

    :host-state([variant="link"]):disabled {
      background: none;
      color: var(--ui-button-disabled-text, var(--ui-button-link-color, var(--ui-text-secondary)));
    }

    :host-state([variant="link"]):focus-visible {
      box-shadow: none;
      /* Fallback keeps the ring if the token is missing: an unresolved var() would void the outline. */
      outline: 2px solid var(--ui-focus-ring, currentColor);
      outline-offset: 2px;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
