<link rel="component" href="../ui-spinner/ui-spinner.html">
<link rel="component" href="../ui-icon/ui-icon.html">
<template component="ui-button" controller="./ui-button.js">
  <defs>
    <prop name="variant" type="keyword" values="outline, solid, danger, ghost, link, card" default="outline"
    >Emphasis: how loudly the button asks. solid fills with its tone, outline draws its tone at the edge over a wash of it, ghost carries only text until it is
      hovered, and link is an inline text action that reads as a link. danger is solid in the danger tone, kept for the call sites that name it. card uses the
      same tone on a full-width action with an icon slot, wrapping content, and a centered action slot.</prop>
    <prop name="size" type="keyword" values="xs, sm, md, lg" default="md"
    >Height, padding, and type size. xs is 1.5rem with the smallest text, for a control inside a line of small text; sm is the small control height (2rem by
      default) with tighter padding and smaller text, md is the standard control height (2.5rem), and lg is taller (3rem) with roomier padding. Under touch, sm
      grows to the touch minimum, while xs keeps its size inside its line and gains an invisible touch-sized hit area.</prop>
    <prop name="shape" type="keyword" values="rounded, pill" default="rounded"
    >rounded uses the theme's action radius; pill rounds the ends fully, for a compact choice such as a status or a person.</prop>
    <prop name="tone" type="keyword" values="accent, neutral, danger, success, warning, info" default="accent"
    >Which colour the button speaks in. It applies to every variant, so an outline, a ghost, and a solid in the same tone are the same action at three volumes:
      tone="danger" variant="outline" is a destructive secondary action. neutral is the quiet one, for a button that should not claim a colour.</prop>
    <prop name="disabled" type="boolean" default="false"
    >Makes the button unavailable: it cannot be pressed, uses a flat neutral palette, and loses its raised look. A disabled link (as="a" with href) drops its
      href and states aria-disabled="true" instead, because a link has no native disabled state.</prop>
    <prop name="loading" type="boolean" default="false"
    >Keeps the action focusable and its label visible while work is in progress. It shows a decorative spinner, states aria-disabled and aria-busy, and prevents
      activation or form submission until cleared.</prop>
    <prop name="pending" type="boolean" default="false">Deprecated alias for loading.</prop>
    <prop name="align" type="keyword" values="center, start" default="center"
    >Content alignment. start lays the content out like a list option: from the start edge, with start-aligned text.</prop>
    <prop name="stretch" type="boolean" default="false">Fills the inline size of its container.</prop>
    <prop name="type" type="keyword" values="button, submit, reset" default="button"
    >The button's type, as on a native button. button by default, so it never submits a form by accident. A link has no type.</prop>
    <prop name="href" type="string"
    >The link's destination. Pair it with as="a" so the button renders as a real link that navigates. A disabled link drops its href and states
      aria-disabled="true", so it cannot be followed.</prop>
    <prop name="target" type="string">Where a link opens, as on a native link. Only meaningful with as="a".</prop>
    <prop name="rel" type="string">The link's relationship to its destination, as on a native link. Only meaningful with as="a".</prop>
    <prop name="as" type="keyword" values="button, a" default="button"
    >The native element the button renders: a button, or a link (a) that navigates to href.</prop>
    <!-- Each root carries only its own attributes: a link has no type or disabled, and a disabled link
         loses its href and states aria-disabled instead. The language has no conditional expression, so a
         table keyed by a boolean's text picks each value, and null leaves the attribute off. -->
  </defs>
  <template $match>
    <a
      $when="$variant = 'card' and $as = 'a'"
      from:href="{ true: null, false: $href }[concat($disabled or $loading or $pending)]"
      from:target="$target"
      from:rel="$rel"
      from:aria-disabled="{ true: 'true', false: null }[concat($disabled or $loading or $pending)]"
      from:aria-busy="$loading or $pending"
      from:tabindex="{ true: '0', false: null }[concat(($loading or $pending) and not $disabled)]"
    >
      <span class="card-icon"><ui-spinner $if="$loading or $pending" size="sm"></ui-spinner><template $if="not ($loading or $pending)"><slot
            name="icon"
          ></slot></template></span>
      <span class="card-content"><slot></slot></span>
      <span class="card-action"><slot name="action"><ui-icon name="chevron-right" aria-hidden="true"></ui-icon></slot></span>
    </a>
    <button
      $when="$variant = 'card'"
      from:type="$type"
      from:disabled="$disabled"
      from:aria-disabled="{ true: 'true', false: null }[concat($loading or $pending)]"
      from:aria-busy="$loading or $pending"
    >
      <span class="card-icon"><ui-spinner $if="$loading or $pending" size="sm"></ui-spinner><template $if="not ($loading or $pending)"><slot
            name="icon"
          ></slot></template></span>
      <span class="card-content"><slot></slot></span>
      <span class="card-action"><slot name="action"><ui-icon name="chevron-right" aria-hidden="true"></ui-icon></slot></span>
    </button>
    <a
      $when="$as = 'a'"
      from:href="{ true: null, false: $href }[concat($disabled or $loading or $pending)]"
      from:target="$target"
      from:rel="$rel"
      from:aria-disabled="{ true: 'true', false: null }[concat($disabled or $loading or $pending)]"
      from:aria-busy="$loading or $pending"
      from:tabindex="{ true: '0', false: null }[concat(($loading or $pending) and not $disabled)]"
    >
      <span $if="$loading or $pending" class="spinner-wrap"><ui-spinner size="sm"></ui-spinner></span>
      <slot></slot>
      <span class="badge"><slot name="badge"></slot></span>
    </a>
    <button
      $else
      from:type="$type"
      from:disabled="$disabled"
      from:aria-disabled="{ true: 'true', false: null }[concat($loading or $pending)]"
      from:aria-busy="$loading or $pending"
    >
      <span $if="$loading or $pending" class="spinner-wrap"><ui-spinner size="sm"></ui-spinner></span>
      <slot></slot>
      <span class="badge"><slot name="badge"></slot></span>
    </button>
  </template>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-button-active-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-disabled-filter {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-disabled-opacity {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-ghost-active-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-ghost-hover-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-ghost-text {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-hover-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-hover-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-link-hover-text {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-link-text {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-min-block-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-radius {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-shadow {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-solid-shadow {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-text {
      syntax: "*";
      inherits: false;
    }
    @property --ui-button-white-space {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Optional inherited action-group values keep text and icon actions under the same light.
         One fine top/start highlight follows the bottom/end lowlight at a joined action seam. */
      --_ui-action-start: 1px;
      --_ui-action-edge: var(
        --ui-action-edge,
        inset var(--_ui-action-start) 1px 0 light-dark(rgb(255 255 255 / 0.16), rgb(255 255 255 / 0.08)),
        inset calc(-1 * var(--_ui-action-start)) -1px 0 light-dark(rgb(0 0 0 / 0.16), rgb(0 0 0 / 0.10))
      );
      --_ui-action-shadow: var(--_ui-action-edge), var(--ui-raised);
      --_hue: var(--ui-accent);
      --_hue-hover: var(--ui-accent-hover);
      --_hue-active: var(--ui-accent-active);
      --_hue-text: var(--ui-accent-active);
      --_on-hue: var(--ui-on-accent);

      --_tone: var(--_hue);
      --_tone-hover: var(--_hue-hover);
      --_tone-active: var(--_hue-active);
      --_tone-text: var(--_hue-text);
      --_on-tone: var(--_on-hue);

      display: inline-flex;
      align-items: center;
      justify-content: center;
      column-gap: var(--ui-space-2);
      vertical-align: middle;
      color: var(--_tone-text);
    }

    :host:dir(rtl) {
      --_ui-action-start: -1px;
    }

    :host([align="start"]) {
      justify-content: flex-start;
      text-align: start;
    }

    :host([stretch]) {
      display: flex;
      inline-size: 100%;
    }

    :host {
      appearance: none;
      min-block-size: var(--ui-button-min-block-size, var(--ui-control-size-md));
      border-style: solid;
      border-width: var(--ui-border-width);
      border-color: var(--ui-button-border, var(--_tone));
      border-radius: var(--ui-button-radius, var(--ui-action-radius, var(--ui-radius-md)));
      background-color: var(--ui-button-surface, oklch(from var(--_tone) l c h / 5%));
      color: var(--ui-button-text, var(--_tone-text));
      font: inherit;
      font-weight: var(--ui-font-medium);
      text-decoration: none;
      /* Unset, a button wraps as its container does. */
      white-space: var(--ui-button-white-space, inherit);
      line-height: var(--ui-line-height-tight);
      padding: var(--ui-space-2) var(--ui-space-3);
      background-image: var(--ui-raised-highlight);
      box-shadow: var(--ui-button-shadow, var(--ui-action-shadow, var(--_ui-action-shadow)));
      cursor: pointer;
      transition:
        background-color var(--ui-motion-fast) var(--ui-motion-ease),
        border-color var(--ui-motion-fast) var(--ui-motion-ease),
        color var(--ui-motion-fast) var(--ui-motion-ease),
        box-shadow var(--ui-motion-base) var(--ui-motion-ease);
      margin: 0;
    }

    /* An anchor keeps the boxed button look even when an app styles ordinary links. */
    :host:is(a) {
      text-decoration: none;
    }

    .spinner-wrap {
      display: inline-flex;
      flex: none;
      vertical-align: middle;
    }

    /* A count is an adornment, not another line of label text. Keep the standard control height
       with enough inset for a 24px mark; large content can still grow the button naturally. */
    :host:not([variant="link"]):has(.badge:not(:empty)) {
      padding-block: var(--ui-space-0-5);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      flex: none;
    }

    .badge:empty {
      display: none;
    }

    @supports (text-box-trim: trim-both) {
      :host {
        text-box-trim: trim-both;
        text-box-edge: cap alphabetic;
      }
    }

    :host([size="xs"]) {
      min-block-size: 1.5rem;
      padding: calc(var(--ui-space-0-5) * 1.5) calc(var(--ui-space-1) * 1.25);
      font-size: var(--ui-font-size-xs);
    }

    :host([shape="pill"]) {
      border-radius: var(--ui-button-radius, var(--ui-radius-round));
    }

    :host([size="sm"]) {
      min-block-size: var(--ui-control-size-sm);
      padding: var(--ui-space-1) var(--ui-space-2);
      font-size: var(--ui-font-size-sm);
    }

    :host([size="lg"]) {
      min-block-size: var(--ui-control-size-lg);
      padding: var(--ui-space-3) var(--ui-space-4);
      font-size: var(--ui-font-size-md);
    }

    /* Card actions inherit Button's palette and behavior; only their shared layout changes.
       The icon may contain any decorative composition. Empty icons remove their column. */
    :host([variant="card"]) {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-content: center;
      align-items: start;
      gap: var(--ui-space-3);
      inline-size: 100%;
      min-block-size: max(var(--ui-control-min-block-size), var(--ui-control-size-md));
      text-align: start;
      white-space: normal;
      box-shadow: none;
      background-image: none;
    }
    :host([variant="card"][size="lg"]) {
      min-block-size: max(var(--ui-control-min-block-size), var(--ui-control-size-lg));
    }
    :host([variant="card"]):has(.card-icon:empty) {
      grid-template-columns: minmax(0, 1fr) auto;
    }
    .card-icon {
      display: flex;
      align-items: flex-start;
    }
    .card-icon:empty {
      display: none;
    }
    .card-content {
      min-inline-size: 0;
    }
    .card-action {
      display: flex;
      align-items: center;
      align-self: center;
    }

    /* A link is never :enabled, so interactive states test "not unavailable" instead: for a button that
       is exactly :enabled, at the same specificity, and it also matches a link that can be followed. */
    :host:hover:not(:disabled, [aria-disabled="true"]) {
      border-color: var(--ui-button-hover-border, var(--_tone-hover));
      background-color: var(--ui-button-hover-surface, oklch(from var(--_tone) l c h / 12%));
    }

    /* A neutral card encloses content quietly; ordinary outlines keep their action-tone edge. */
    :host([variant="card"][tone="neutral"]) {
      border-color: var(--ui-button-border, var(--ui-border));
    }

    :host([variant="card"][tone="neutral"]):hover:not(:disabled, [aria-disabled="true"]) {
      border-color: var(--ui-button-hover-border, var(--ui-border-strong));
    }

    /* Pressed reads as pressed in: the highlight goes, and the shadow moves inside. */
    :host:active:not(:disabled, [aria-disabled="true"]) {
      background-color: var(--ui-button-active-surface, oklch(from var(--_tone) l c h / 18%));
      background-image: none;
      box-shadow: var(--ui-pressed);
    }

    :host([variant="solid"]), :host([variant="danger"]) {
      border-color: var(--_tone);
      background-color: var(--_tone);
      color: var(--_on-tone);
      box-shadow: var(--ui-button-solid-shadow, var(--ui-action-shadow, var(--_ui-action-shadow)));
    }

    :is(:host([variant="solid"]), :host([variant="danger"])):hover:not(:disabled, [aria-disabled="true"]) {
      background-color: var(--_tone-hover);
      border-color: var(--_tone-hover);
    }

    :is(:host([variant="solid"]), :host([variant="danger"])):active:not(:disabled, [aria-disabled="true"]) {
      background-color: var(--_tone-active);
      border-color: var(--_tone-active);
      background-image: none;
      box-shadow: var(--ui-pressed);
    }

    /* Tone is the colour, variant is the volume. Every pairing works: a danger outline is a
       destructive secondary action, not a special case. */
    :host([tone="neutral"]) {
      --_hue: var(--ui-text);
      --_hue-hover: var(--ui-text);
      --_hue-active: var(--ui-text);
      --_hue-text: var(--ui-text);
      --_on-hue: var(--ui-surface);
    }

    :host([tone="danger"]), :host([variant="danger"]) {
      --_hue: var(--ui-danger);
      --_hue-hover: var(--ui-danger-hover);
      --_hue-active: var(--ui-danger-hover);
      --_hue-text: var(--ui-danger-hover);
      --_on-hue: var(--ui-on-danger);
    }

    :host([tone="success"]) {
      --_hue: var(--ui-success);
      --_hue-hover: color-mix(in srgb, var(--ui-success) 85%, #000);
      --_hue-active: color-mix(in srgb, var(--ui-success) 75%, #000);
      --_hue-text: color-mix(in srgb, var(--ui-success) 85%, #000);
      --_on-hue: var(--ui-surface);
    }

    :host([tone="warning"]) {
      --_hue: var(--ui-warning);
      --_hue-hover: color-mix(in srgb, var(--ui-warning) 85%, #000);
      --_hue-active: color-mix(in srgb, var(--ui-warning) 75%, #000);
      --_hue-text: color-mix(in srgb, var(--ui-warning) 85%, #000);
      --_on-hue: var(--ui-surface);
    }

    :host([tone="info"]) {
      --_hue: var(--ui-info);
      --_hue-hover: color-mix(in srgb, var(--ui-info) 85%, #000);
      --_hue-active: color-mix(in srgb, var(--ui-info) 75%, #000);
      --_hue-text: color-mix(in srgb, var(--ui-info) 85%, #000);
      --_on-hue: var(--ui-surface);
    }

    :host([variant="ghost"]) {
      border-color: transparent;
      background: transparent;
      box-shadow: none;
      color: var(--ui-button-ghost-text, var(--_tone-text));
    }

    /* Tints derive from the text colour, not a surface token, so hover and press show on any background. */
    :host([variant="ghost"]):hover:not(:disabled, [aria-disabled="true"]) {
      background-color: var(--ui-button-ghost-hover-surface, oklch(from var(--_tone) l c h / 10%));
      border-color: transparent;
    }

    /* Pressed, or holding its menu open, a ghost button sinks slightly: a light surface with a faint
       edge and a soft inner shadow. Lighter than hover, so an open menu's trigger never reads as heavy. */
    :host([variant="ghost"]):is(:active, [aria-expanded="true"]):not(:disabled, [aria-disabled="true"]) {
      background-color: var(--ui-button-ghost-active-surface, color-mix(in oklch, var(--ui-surface), var(--_tone) 3%));
      border-color: transparent;
      box-shadow: inset 0 0 0 1px oklch(from var(--_tone) l c h / 10%), inset 0 1px 2px oklch(from var(--_tone) l c h / 8%);
    }

    /* A soft halo that transitions in with the other box-shadow changes, layered on the raised shadow. */
    :host:focus-visible {
      outline: none;
      box-shadow:
        var(--ui-button-shadow, var(--ui-action-shadow, var(--_ui-action-shadow))),
        var(--ui-focus-halo);
    }

    :host([variant="solid"]):focus-visible {
      box-shadow:
        var(--ui-button-solid-shadow, var(--ui-action-shadow, var(--_ui-action-shadow))),
        var(--ui-focus-halo);
    }

    :is(:host([variant="ghost"]), :host([variant="link"]), :host([variant="card"])):focus-visible {
      box-shadow: var(--ui-focus-halo);
    }

    /* A loading action stays visually active; only an explicitly disabled action takes the
       neutral disabled palette. Its flat surface and muted ink make the state unambiguous. */
    :host:is(:disabled, [aria-disabled="true"]:not([aria-busy="true"])) {
      border-color: var(--ui-disabled-border);
      background-color: var(--ui-disabled-surface);
      color: var(--ui-disabled-text);
      filter: var(--ui-button-disabled-filter, var(--ui-disabled-filter));
      opacity: var(--ui-button-disabled-opacity, 1);
      cursor: not-allowed;
      background-image: none;
      box-shadow: none;
    }

    :is(:host([loading]), :host([pending])):focus-visible {
      box-shadow: var(--ui-focus-halo);
    }

    /* Ghost keeps no border, but gains the same neutral surface as other disabled buttons. */
    :host([variant="ghost"]):is(:disabled, [aria-disabled="true"]:not([aria-busy="true"])) {
      background-color: var(--ui-disabled-surface);
      border-color: transparent;
    }

    /* The size states outrank :host, so sm is named too, or a small button would stay small. */
    @media (pointer: coarse) {
      :host, :host([size="sm"]) {
        min-block-size: var(--ui-control-min-block-size);
      }
    }

    /* Under touch, a link-style button's press lands within the control minimum: an invisible hit
       area, centred on it, like IconButton's. A boxed button grows to the minimum itself (below);
       a link-style one keeps its text size, so a standalone one ("See all" under a list) needs the
       area. xs sits inside a line of text the same way, so it keeps its size and gains the area too.
       Only these need it: a hit area on every button would reach over its neighbours. */
    html[data-ui-input-modality="touch"] :host([variant="link"]),
    html[data-ui-input-modality="touch"] :host([size="xs"]) {
      position: relative;
    }

    html[data-ui-input-modality="touch"] :host([variant="link"])::after,
    html[data-ui-input-modality="touch"] :host([size="xs"])::after {
      position: absolute;
      inset: 50% auto auto 50%;
      inline-size: max(100%, var(--ui-control-min-block-size));
      block-size: max(100%, var(--ui-control-min-block-size));
      transform: translate(-50%, -50%);
      content: "";
    }

    /* Link: an inline text action. No box, padding, or minimum height (inline targets are exempt under
       WCAG 2.5.8); the inherited font; an underline that strengthens on hover; a visible focus ring. */
    :host([variant="link"]) {
      display: inline;
      min-block-size: 0;
      padding: 0;
      border: 0;
      border-radius: var(--ui-radius-sm);
      background: none;
      box-shadow: none;
      font: inherit;
      color: var(--ui-button-link-text, var(--ui-text-secondary));
      text-decoration-line: underline;
      text-decoration-thickness: 1px;
      text-decoration-color: color-mix(in srgb, currentColor 40%, transparent);
      text-underline-offset: 0.2em;
      transition: color var(--ui-motion-fast) var(--ui-motion-ease), text-decoration-color var(--ui-motion-fast) var(--ui-motion-ease);
    }

    :host([variant="link"]):hover:not(:disabled, [aria-disabled="true"]) {
      color: var(--ui-button-link-hover-text, var(--ui-text-primary));
      text-decoration-color: currentColor;
      background: none;
      transform: none;
    }

    :host([variant="link"]):active:not(:disabled, [aria-disabled="true"]) {
      background: none;
      transform: none;
    }

    :host([variant="link"]):is(:disabled, [aria-disabled="true"]:not([aria-busy="true"])) {
      background: none;
      border-color: transparent;
    }

    :host([variant="link"]):focus-visible {
      box-shadow: none;
      /* Fallback keeps the ring if the token is missing: an unresolved var() would void the outline. */
      outline: var(--ui-focus-width) solid var(--ui-focus-ring);
      outline-offset: var(--ui-focus-width);
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
