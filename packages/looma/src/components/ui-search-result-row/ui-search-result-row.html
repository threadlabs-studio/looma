<template component="ui-search-result-row">
  <defs>
    <prop name="disabled" type="boolean" default="false">Disables the row's button, so it cannot be chosen or focused, and fades it to 60% opacity.</prop>
    <prop name="selected" type="boolean" default="false"
    >Marks the row as the current result: it gets the hover surface and aria-current="true", which assistive technology announces as current. Set it on one row
      at a time, such as the result the arrow keys have moved to.</prop>
  </defs>
  <button type="button" :disabled="disabled" :aria-current="selected">
    <span class="leading"><slot name="leading"></slot></span>
    <span class="content">
      <span class="title"><slot name="title"></slot></span>
      <span class="meta"><slot name="meta"></slot></span>
      <span class="excerpt"><slot name="excerpt"></slot></span>
    </span>
    <span class="trailing"><slot name="trailing"></slot></span>
  </button>
  <style>
    :host {
      appearance: none;
      inline-size: 100%;
      min-block-size: var(--ui-search-result-row-min-height, 56px);
      margin: 0;
      padding-block: var(--ui-search-result-row-padding-block, var(--ui-space-3));
      padding-inline: var(--ui-search-result-row-padding-inline, var(--ui-space-4));
      display: flex;
      align-items: flex-start;
      gap: var(--ui-search-result-row-gap, var(--ui-space-3));
      background: var(--ui-search-result-row-surface, transparent);
      border: none;
      border-block-end: 1px solid var(--ui-search-result-row-border, var(--ui-border));
      color: inherit;
      cursor: pointer;
      text-align: left;
      transition: background-color var(--ui-motion-fast) var(--ui-motion-ease);
    }

    :host:last-child {
      border-block-end: none;
    }

    :host:hover:enabled {
      background: var(--ui-search-result-row-hover-surface, color-mix(in srgb, var(--ui-surface) 85%, black 3%));
    }

    :host-state([selected]) {
      background: var(
        --ui-search-result-row-selected-bg,
        var(--ui-search-result-row-hover-surface, color-mix(in srgb, var(--ui-surface) 85%, black 3%))
      );
    }

    :host:focus-visible {
      outline: 2px solid var(--ui-focus-ring);
      outline-offset: -2px;
    }

    :host:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .leading,
    .trailing {
      display: inline-flex;
      align-items: flex-start;
      flex-shrink: 0;
    }

    .content {
      min-inline-size: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .title,
    .meta,
    .excerpt {
      display: block;
      min-inline-size: 0;
    }

    /* An unused region takes no space. */
    .leading:empty,
    .meta:empty,
    .excerpt:empty,
    .trailing:empty {
      display: none;
    }

    :slotted([slot="title"]),
    :slotted([slot="meta"]),
    :slotted([slot="excerpt"]) {
      display: block;
      margin: 0;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
