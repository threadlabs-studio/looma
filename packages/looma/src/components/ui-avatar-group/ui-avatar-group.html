<template component="ui-avatar-group" controller="./ui-avatar-group.js">
  <defs>
    <prop name="max" type="number" default="5"
    >How many avatars to show. The rest are hidden and counted in a +N badge after the last visible one. Fractions round down, and 0 hides every avatar behind
      the badge.</prop>
    <prop name="label" type="string" default="People"
    >The group's accessible name, announced for the set of avatars as a whole. Name who they are rather than repeating the default.</prop>
    <prop name="size" type="sm | md" default="md"
    >The size of the avatars inside, matched by the +N badge and the overlap. Give each Avatar the same size.</prop>
    <state name="overflowCount" :value="0"></state>
  </defs>
  <div role="group" :aria-label="label">
    <slot></slot>
    <span class="overflow" $ref="overflow" role="img" :hidden="not overflowCount" :aria-label="format('%s more', overflowCount)"><template
        $value="format('+%s', overflowCount)"
      ></template></span>
  </div>
  <style>
    :host {
      /* Each avatar is ringed in the surface colour, so where one overlaps the next it reads as a
       * whole circle set on top, not a shape cut into the one beneath. */
      --_overlap-shadow: 0 0 0 0 transparent;
      --_edge-ring: 0 0 0 2px var(--ui-surface);

      display: flex;
      align-items: center;
      flex-direction: row;
      gap: 0;
    }

    /* Overlap and the separating shadow are applied by the controller: slotted avatars are nested
     * component roots outside this style scope. */
    :slotted(*) {
      margin-inline-start: -0.5rem;
      flex-shrink: 0;
      border-radius: 999px;
    }

    :slotted(*:first-child) {
      margin-inline-start: 0;
    }

    .overflow {
      margin-inline-start: -0.5rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      inline-size: 2.5rem;
      block-size: 2.5rem;
      border-radius: 999px;
      border: 1px solid var(--ui-border-strong);
      background: var(--ui-surface-elevated);
      color: var(--ui-text-primary);
      box-shadow:
        var(--ui-avatar-group-overlap-shadow, var(--_overlap-shadow)),
        var(--ui-avatar-group-edge-ring, var(--_edge-ring));
      font: inherit;
      font-size: var(--ui-font-size-xs);
      font-weight: 600;
      flex-shrink: 0;
    }

    :host-state([size="sm"]) .overflow {
      margin-inline-start: -0.25rem;
      inline-size: 1.75rem;
      block-size: 1.75rem;
    }

    .overflow[hidden] {
      display: none;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
