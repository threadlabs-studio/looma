<template component="ui-avatar-group" controller="./ui-avatar-group.js">
  <defs>
    <prop name="max" type="number" default="5"
    >How many avatars to show. The rest are hidden and counted in a +N badge after the last visible one. Fractions round down, and 0 hides every avatar behind
      the badge.</prop>
    <prop name="total" type="integer"
    >The true number of people when only some avatars are authored. The overflow badge counts the people beyond the visible avatars; it never counts fewer than
      the authored avatars.</prop>
    <prop name="overflowLabel" type="string" default="{count} more"
    >Accessible label for the overflow badge. Replace {count} with the number of people beyond the visible avatars.</prop>
    <prop name="label" type="string" default="People"
    >The group's accessible name, announced for the set of avatars as a whole. Name who they are rather than repeating the default.</prop>
    <prop name="size" type="keyword" values="xs, sm, md" default="md"
    >The size of the avatars inside, matched by the +N badge and the overlap. Give each Avatar the same size. xs suits a group inside a line of small text, such
      as the people listed under a title.</prop>
    <state type="integer" name="overflowCount" value="0"></state>
    <state type="string" name="overflowAnnouncement" value=""></state>
  </defs>
  <div role="group" from:aria-label="label">
    <slot></slot>
    <span class="overflow" $ref="overflow" role="img" from:hidden="not overflowCount" from:aria-label="overflowAnnouncement"><template
        $value="format('+%s', overflowCount)"
      ></template></span>
  </div>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-avatar-group-edge-ring {
      syntax: "*";
      inherits: false;
    }
    @property --ui-avatar-group-overlap-shadow {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Hooks do not inherit, so the parts below read them from the root. */
      --_ui-avatar-group-overlap-shadow: var(--ui-avatar-group-overlap-shadow);
      --_ui-avatar-group-edge-ring: var(--ui-avatar-group-edge-ring);

      /* A one-pixel shadow on the leading edge separates overlapping circles without cutting
       * a white gap out of the avatar underneath. */
      --_overlap-shadow: -1px 0 0 0 rgb(0 0 0 / 0.22);

      display: flex;
      align-items: center;
      flex-direction: row;
      gap: 0;
    }

    /* Overlap and the separating shadow are applied by the controller: slotted avatars are nested
     * component roots outside this style scope. */
    :slotted(*) {
      margin-inline-start: -0.5rem;
      flex-shrink: 0;
    }

    :slotted(*:first-child) {
      margin-inline-start: 0;
    }

    :host:dir(rtl) {
      --_overlap-shadow: 1px 0 0 0 rgb(0 0 0 / 0.22);
    }

    .overflow {
      margin-inline-start: -0.5rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      inline-size: 2.5rem;
      block-size: 2.5rem;
      border-radius: var(--ui-radius-round);
      border: var(--ui-border-width) solid var(--ui-border-strong);
      background: var(--ui-surface-elevated);
      color: var(--ui-text-primary);
      box-shadow:
        var(--_ui-avatar-group-overlap-shadow, var(--_overlap-shadow)),
        var(--_ui-avatar-group-edge-ring, 0 0 0 0 transparent);
      font: inherit;
      font-size: var(--ui-font-size-xs);
      font-weight: 600;
      flex-shrink: 0;
    }

    :host-state([size="sm"]) .overflow {
      margin-inline-start: -0.25rem;
      inline-size: 1.75rem;
      block-size: 1.75rem;
    }

    :host-state([size="xs"]) .overflow {
      margin-inline-start: -0.1875rem;
      inline-size: 1.25rem;
      block-size: 1.25rem;
      /* Matches the xs Avatar's initials. */
      font-size: calc(var(--ui-font-size) * 0.5625);
      line-height: 1;
    }

    .overflow[hidden] {
      display: none;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
