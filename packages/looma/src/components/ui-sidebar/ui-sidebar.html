<template component="ui-sidebar" controller="./ui-sidebar.js">
  <defs>
    <prop name="side" type="keyword" values="start, end" default="start">The edge the sidebar sits on. The page places it beside its main content.</prop>
    <prop name="width" type="number" default="0">Docked width in pixels. 0 uses --ui-sidebar-width (280px by default); dragging the handle updates it.</prop>
    <prop name="minWidth" type="number" default="200">The narrowest width the resize handle allows, in pixels.</prop>
    <prop name="maxWidth" type="number" default="480">The widest width the resize handle allows, in pixels.</prop>
    <prop name="resizable" type="boolean" default="false">Adds a resize handle on the inner edge (drag, or arrow keys, Home, and End).</prop>
    <prop name="resizeStep" type="number" default="16">Arrow-key resize step in pixels.</prop>
    <prop name="resizeLabel" type="string" default="Resize sidebar">Accessible name of the resize handle.</prop>
    <prop name="collapsed" type="boolean" default="false">Whether the docked sidebar is collapsed.</prop>
    <prop name="breakpoint" type="keyword" values="sm, md, lg" default="md"
    >Below this viewport width (40rem, 48rem, 64rem) the sidebar becomes an off-canvas drawer, closed until toggled.</prop>
    <state type="boolean" name="internalCollapsed" value="false"></state>
    <state type="boolean" name="drawer" value="false"></state>
    <state type="boolean" name="resizing" value="false"></state>
    <event name="resize" type="object">
      <prop name="width" required type="number"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
    <event name="toggle" type="object">
      <prop name="open" required type="boolean"></prop>
      <prop name="mode" required type="keyword" values="docked, drawer"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
  </defs>
  <aside>
    <div class="viewport"><div class="content"><slot></slot></div></div>
    <div
      class="resizer"
      $ref="resizer"
      role="separator"
      aria-orientation="vertical"
      tabindex="0"
      data-ui-affordance="resize"
      from:aria-label="resizeLabel"
      from:hidden="not resizable or drawer or internalCollapsed"
    >
      <span class="guide" aria-hidden="true"></span>
    </div>
  </aside>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-sidebar-backdrop {
      syntax: "*";
      inherits: false;
    }
    @property --ui-sidebar-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-sidebar-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-sidebar-width {
      syntax: "*";
      inherits: false;
    }
    @property --ui-sidebar-collapsed-width {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Hooks do not inherit, so the parts below read them from the root. */
      --_ui-sidebar-backdrop: var(--ui-sidebar-backdrop);
      --_ui-sidebar-expanded-width: var(--_sidebar-width, var(--ui-sidebar-width, 280px));

      position: relative;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      flex: none;
      inline-size: var(--_sidebar-width, var(--ui-sidebar-width, 280px));
      max-inline-size: 100%;
      min-block-size: 0;
      background: var(--ui-sidebar-surface, var(--ui-surface-default));
      border-inline-end: var(--ui-border-width) solid var(--ui-sidebar-border, var(--ui-border-divider));
      transition: inline-size var(--ui-motion-layout) var(--ui-motion-layout-ease), visibility var(--ui-motion-layout);
    }

    :host([side="end"]) {
      border-inline-end: 0;
      border-inline-start: var(--ui-border-width) solid var(--ui-sidebar-border, var(--ui-border-divider));
    }

    /* The panel's content scrolls, and each edge that hides content fades: the scroll fade every
       Looma scroller uses (see ui-scroll-area). */
    .viewport {
      flex: 1;
      min-block-size: 0;
      overflow: clip;
    }
    .content {
      block-size: 100%;
      inline-size: calc(var(--_ui-sidebar-expanded-width) - var(--ui-border-width));
      min-block-size: 0;
      overflow: auto;
      transition: transform var(--ui-motion-layout) var(--ui-motion-layout-ease);
      --_ui-scroll-fade-direction: to bottom;
      --_ui-scroll-fade-size: var(--ui-scroll-fade-size, 24px);
      mask-image: linear-gradient(
        var(--_ui-scroll-fade-direction),
        transparent,
        #000 var(--_ui-scroll-fade-start),
        #000 calc(100% - var(--_ui-scroll-fade-end)),
        transparent
      );
      animation: ui-scroll-fade-start linear, ui-scroll-fade-start-hold linear, ui-scroll-fade-end-hold linear, ui-scroll-fade-end linear;
      animation-timeline: scroll(self block);
      animation-range:
        0 var(--_ui-scroll-fade-size),
        var(--_ui-scroll-fade-size) calc(100% + 1px),
        -1px calc(100% - var(--_ui-scroll-fade-size)),
        calc(100% - var(--_ui-scroll-fade-size)) 100%;
    }

    /* Collapsed while docked. */
    :host-state([internalCollapsed]):not([popover]) {
      inline-size: var(--ui-sidebar-collapsed-width, 0px);
      visibility: hidden;
    }
    :host-state([resizing]) {
      transition: none;
    }
    :host-state([internalCollapsed]):not([popover]) .content {
      transform: translateX(-100%);
    }
    :host([side="end"]):host-state([internalCollapsed]):not([popover]) .content {
      transform: translateX(100%);
    }

    .resizer {
      position: absolute;
      z-index: 1;
      inset-block: 0;
      /* On the panel's inner edge: the end edge of a start sidebar. */
      inset-inline-end: 0;
      inline-size: 8px;
      min-inline-size: 8px;
      transform: translateX(50%);
      cursor: col-resize;
      touch-action: none;
      outline: none;
    }

    .resizer[hidden] {
      display: none;
    }

    :host([side="end"]) .resizer {
      inset-inline-end: auto;
      inset-inline-start: 0;
      transform: translateX(-50%);
    }

    .resizer::after {
      content: "";
      position: absolute;
      inset-block: 0;
      inset-inline-start: 3px;
      inline-size: 2px;
      background: color-mix(in srgb, var(--ui-affordance-guide-color, var(--ui-border-strong)) 45%, transparent);
      opacity: calc(var(--ui-affordance-guide-opacity) * var(--ui-affordance-scope-guide, 1));
      transition:
        background-color var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease),
        opacity var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease);
    }

    .guide {
      position: absolute;
      inset-block-start: 50%;
      inset-inline-start: 50%;
      inline-size: 6px;
      block-size: 22px;
      border: var(--ui-border-width) solid var(--ui-border-strong);
      border-radius: var(--ui-radius-round);
      background: var(--ui-surface-elevated);
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: opacity var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease);
      pointer-events: none;
    }

    .resizer:is(:hover, :focus-visible)::after {
      background: var(--ui-affordance-direct-color, var(--ui-accent-solid, var(--ui-focus-ring)));
      opacity: 1;
    }

    .resizer:is(:hover, :focus-visible) > .guide {
      opacity: 1;
    }

    /* Drawer: a popover in the top layer, sliding in from its edge. Closed popovers are hidden by the UA. */
    :host[popover] {
      position: fixed;
      inset-block: 0;
      inset-inline-start: 0;
      inset-inline-end: auto;
      margin: 0;
      padding: 0;
      inline-size: min(var(--_sidebar-width, var(--ui-sidebar-width, 280px)), 85vw);
      max-block-size: none;
      block-size: 100dvh;
      border-block: 0;
      box-shadow: var(--ui-elevation-overlay, var(--ui-shadow-lg));
      transform: translateX(0);
      transition:
        transform var(--ui-motion-reveal) var(--ui-motion-reveal-ease),
        display var(--ui-motion-reveal) allow-discrete,
        overlay var(--ui-motion-reveal) allow-discrete;
    }

    /* The author display above would otherwise override the UA rule that hides a closed popover. */
    :host[popover]:not(:popover-open) {
      display: none;
      transform: translateX(-100%);
    }

    :host([side="end"])[popover] {
      inset-inline-start: auto;
      inset-inline-end: 0;
    }

    :host([side="end"])[popover]:not(:popover-open) {
      transform: translateX(100%);
    }

    @starting-style {
      :host[popover]:popover-open {
        transform: translateX(-100%);
      }
      :host([side="end"])[popover]:popover-open {
        transform: translateX(100%);
      }
    }

    :host[popover]::backdrop {
      background: var(--_ui-sidebar-backdrop, rgb(0 0 0 / 0.32));
    }
    :host[popover] .content {
      inline-size: 100%;
    }

    @media (prefers-reduced-motion: reduce) {
      :host,
      :host[popover],
      .content {
        transition: none;
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
