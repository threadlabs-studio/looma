<!--
title: Match a text button
description: A companion icon button follows the text button's control height, including theme and touch sizes.
-->
<ui-cluster gap="xs" align="stretch" wrap="nowrap">
  <ui-button size="sm">Save changes</ui-button>
  <ui-icon-button size="sm" variant="outline" match-button label="More save options">
    <ui-icon name="chevron-down"></ui-icon>
  </ui-icon-button>
</ui-cluster>
