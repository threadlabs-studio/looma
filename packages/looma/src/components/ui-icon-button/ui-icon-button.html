<template component="ui-icon-button" controller="./ui-icon-button.js">
  <defs>
    <prop name="disabled" type="boolean" default="false">disabled token.</prop>
    <prop name="label" type="string">Accessible name for the icon.</prop>
    <prop name="size" type="sm | md | lg" default="md">size token.</prop>
    <prop name="variant" type="ghost | outline | solid" default="ghost">variant token.</prop>
    <prop name="anticipatory" type="boolean" default="false">anticipatory token.</prop>
    <prop name="round" type="boolean" default="false">Use a fully circular shape.</prop>
  </defs>
  <button :disabled="disabled" type="button" :aria-label="label"><slot></slot></button>
  <style>:host {
  display: inline-flex;
  color: var(--ui-text-secondary);
}

:host-state([anticipatory]) {
  position: relative;
}

:host-state([anticipatory])::before {
  content: '';
  position: absolute;
  inset: 50% auto auto 50%;
  z-index: 1;
  inline-size: var(--ui-affordance-guide-size, 0.25rem);
  block-size: var(--ui-affordance-guide-size, 0.25rem);
  border-radius: var(--ui-radius-round, 999px);
  background: var(--ui-affordance-guide-color, var(--ui-border-strong));
  opacity: var(--ui-affordance-guide-opacity, 0.42);
  transform: translate(-50%, -50%);
  transition: opacity var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease);
  pointer-events: none;
}

/* At rest an anticipatory button shows only its guide dot; proximity, hover, or focus reveals the
 * surface and icon. The root is the native button, so hiding it outright would hide the dot
 * too, and slotted icons sit outside this scope; `color: transparent` hides currentColor icons. */
@media (hover: hover) and (pointer: fine) {
  :host-state([anticipatory]):not(:host-state([variant="solid"]), [data-ui-proximity='near'], :hover, :focus-visible) {
    border-color: transparent;
    background: transparent;
    box-shadow: none;
    color: transparent;
  }
}

:host-state([anticipatory]):is(:host-state([variant="solid"]), [data-ui-proximity='near'], :hover, :focus-visible)::before {
  opacity: 0;
}

:host {
  appearance: none;
  inline-size: var(--ui-icon-button-size, 2rem);
  block-size: var(--ui-icon-button-size, 2rem);
  min-inline-size: var(--ui-icon-button-size, 2rem);
  min-block-size: var(--ui-icon-button-size, 2rem);
  padding: 0;
  margin: 0;
  border: 1px solid transparent;
  border-radius: var(--ui-icon-button-radius, var(--ui-radius-2));
  background: var(--ui-icon-button-bg, transparent);
  color: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition:
    background-color var(--ui-motion-fast) var(--ui-motion-ease),
    border-color var(--ui-motion-fast) var(--ui-motion-ease),
    color var(--ui-motion-fast) var(--ui-motion-ease),
    box-shadow var(--ui-motion-fast) var(--ui-motion-ease),
    transform var(--ui-motion-fast) var(--ui-motion-ease);
}

@media (hover: none), (pointer: coarse) {
  :host-state([anticipatory])::before {
    opacity: 0;
  }
}

:host-state([size="sm"]) {
  inline-size: var(--ui-icon-button-size-sm, 1.75rem);
  block-size: var(--ui-icon-button-size-sm, 1.75rem);
  min-inline-size: var(--ui-icon-button-size-sm, 1.75rem);
  min-block-size: var(--ui-icon-button-size-sm, 1.75rem);
}

:host-state([size="lg"]) {
  inline-size: var(--ui-icon-button-size-lg, 2.5rem);
  block-size: var(--ui-icon-button-size-lg, 2.5rem);
  min-inline-size: var(--ui-icon-button-size-lg, 2.5rem);
  min-block-size: var(--ui-icon-button-size-lg, 2.5rem);
}

:host-state([round]) {
  border-radius: var(--ui-radius-round, 999px);
}

:host-state([variant="outline"]) {
  border-color: var(--ui-icon-button-border, var(--ui-border-default));
  background: var(--ui-icon-button-outline-bg, var(--ui-surface-default));
  color: var(--ui-icon-button-outline-color, var(--ui-text-primary));
}

:host-state([variant="solid"]) {
  background: var(--ui-icon-button-solid-bg, var(--ui-accent-solid));
  color: var(--ui-icon-button-solid-color, var(--ui-text-on-accent));
  box-shadow: var(
    --ui-icon-button-solid-shadow,
    0 1px 2px color-mix(in srgb, var(--ui-accent-solid) 18%, transparent)
  );
}

:host:hover:enabled {
  /* Derived from the text colour so the ghost hover shows on any background. */
  background: var(--ui-icon-button-hover-bg, color-mix(in srgb, currentColor 8%, transparent));
  color: var(--ui-icon-button-hover-color, var(--ui-text-primary));
}

:host-state([variant="outline"]):hover:enabled {
  border-color: var(--ui-icon-button-hover-border, var(--ui-border-strong));
}

:host-state([variant="solid"]):hover:enabled {
  background: var(--ui-icon-button-solid-hover-bg, var(--ui-accent-hover));
}

:host:active:enabled {
  transform: scale(var(--ui-icon-button-active-scale, 0.96));
}

:host:focus-visible {
  outline: none;
  box-shadow: var(--ui-focus-halo);
}

:host:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

:host {
  --_icon-button-icon-default: var(--ui-icon-size-md, 1.25rem);
}

:host-state([size="sm"]) {
  --_icon-button-icon-default: var(--ui-icon-size-sm, 1rem);
}

:host-state([size="lg"]) {
  --_icon-button-icon-default: var(--ui-icon-size-lg, 1.5rem);
}

:slotted(svg) {
  inline-size: var(--ui-icon-button-icon-size, var(--_icon-button-icon-default));
  block-size: var(--ui-icon-button-icon-size, var(--_icon-button-icon-default));
  flex-shrink: 0;
  stroke-width: var(--ui-icon-button-icon-stroke-width, 1.75);
}

/* A component that sets its display still honours the hidden attribute on its root. */
:host[hidden] {
  display: none;
}
</style>
</template>
