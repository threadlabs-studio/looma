<link rel="component" href="../ui-spinner/ui-spinner.html">
<template component="ui-icon-button" controller="./ui-icon-button.js">
  <defs>
    <prop name="disabled" type="boolean" default="false"
    >Disables the button, so it cannot be pressed or focused, and gives it a flat neutral surface and muted icon.</prop>
    <prop name="loading" type="boolean" default="false"
    >Keeps the button focusable and named while work is in progress. It shows a spinner, states aria-disabled and aria-busy, and prevents activation until
      cleared.</prop>
    <prop name="pending" type="boolean" default="false">Deprecated alias for loading.</prop>
    <prop name="label" type="string">Accessible name for the icon.</prop>
    <prop name="size" type="keyword" values="sm, md, lg" default="md"
    >Button and icon size together: sm is 1.75rem with a small icon, md is 2rem, and lg is 2.5rem with a large icon. On touch, every size gets an invisible hit
      area of at least 44px.</prop>
    <prop name="matchButton" type="boolean" default="false"
    >Matches a boxed Button of the same size when the two share a flex row. Uses the control-size theme tokens and stretches to the row's height, including
      touch-sized controls. Leave it off for compact toolbar and inline icon buttons.</prop>
    <prop name="variant" type="keyword" values="ghost, outline, solid" default="ghost"
    >Emphasis. ghost shows only the icon until it is hovered, for toolbars and dense rows; outline adds a border on the default surface; solid fills with the
      accent colour, for the one primary action in a group.</prop>
    <prop name="tone" type="keyword" values="accent, neutral"
    >Colour for every variant. When omitted, ghost and outline keep their neutral appearance and solid keeps its accent fill. Set accent for a coloured action
      or neutral for a quiet one. Native aria-pressed="true" keeps an outline toggle visibly pressed; the consumer owns that state.</prop>
    <prop name="anticipatory" type="boolean" default="false"
    >Keeps the button out of sight until it is wanted: at rest a fine pointer sees only a small guide dot, and the button appears on hover, on focus, or when
      the pointer comes near inside a ui-affordance-scope. Touch devices and the solid variant always show it.</prop>
    <prop name="round" type="boolean" default="false">Use a fully circular shape.</prop>
  </defs>
  <button
    from:disabled="$disabled"
    type="button"
    from:aria-label="$label"
    from:data-match-button="$matchButton"
    from:aria-disabled="{ true: 'true', false: null }[concat($loading or $pending)]"
    from:aria-busy="$loading or $pending"
  >
    <ui-spinner $if="$loading or $pending" size="sm"></ui-spinner>
    <span class="content"><slot></slot></span>
  </button>

    }

      inherits: false;

      syntax: "*";
      inherits: false;

      syntax: "*";
      inherits: false;
    }

      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-icon-stroke-width {

      inherits: false;
    }
    @property --ui-icon-button-outline-surface {

      inherits: false;

    @property --ui-icon-button-outline-text {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-radius {

      inherits: false;
    }
    @property --ui-icon-button-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-solid-hover-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-solid-shadow {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-solid-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-solid-text {
      syntax: "*";
      inherits: false;

    @property --ui-icon-button-surface {
      syntax: "*";
      inherits: false;

      --_ui-icon-button-icon-size: var(--ui-icon-button-icon-size);
      --_ui-icon-button-icon-stroke-width: var(--ui-icon-button-icon-stroke-width);

      color: var(--ui-text-secondary);

    :host([tone="accent"]) {

    :host([anticipatory])::before {

      position: absolute;
      inset: 50% auto auto 50%;
      z-index: 1;
      inline-size: var(--ui-affordance-guide-size);
      block-size: var(--ui-affordance-guide-size);
      border-radius: var(--ui-radius-round);

      pointer-events: none;

    :host([anticipatory]):disabled::before {

    :host([anticipatory]):is(:host([variant="solid"]), [aria-pressed="true"], [data-ui-proximity="near"], :hover, :focus-visible)::before {
      opacity: 0;
    }

      /* The size prop resolves here; --ui-icon-button-size overrides it on an element. */
      --_size: 2rem;
      appearance: none;

      block-size: var(--ui-icon-button-size, var(--_size));
      min-inline-size: var(--ui-icon-button-size, var(--_size));
      min-block-size: var(--ui-icon-button-size, var(--_size));
      padding: 0;
      margin: 0;

      border-radius: var(--ui-icon-button-radius, var(--ui-action-radius, var(--ui-radius-md)));
      background-color: var(--ui-icon-button-surface, transparent);
      color: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition:
        background-color var(--ui-motion-fast) var(--ui-motion-ease),
        border-color var(--ui-motion-fast) var(--ui-motion-ease),
        color var(--ui-motion-fast) var(--ui-motion-ease),
        box-shadow var(--ui-motion-base) var(--ui-motion-ease),
        transform var(--ui-motion-fast) var(--ui-motion-ease);
    }

    @media (hover: none), (pointer: coarse) {
      :host([anticipatory])::before {
        opacity: 0;
      }

    /* A touch target without a bigger button: an invisible hit area, at least the control
       minimum, centred on the button (::before is the anticipatory guide). */

      :host {
        position: relative;
      }

      :host::after {
        content: "";
        position: absolute;
        inset: 50% auto auto 50%;
        inline-size: max(100%, var(--ui-control-min-block-size));
        block-size: max(100%, var(--ui-control-min-block-size));
        transform: translate(-50%, -50%);
      }
    }

    html[data-ui-input-modality="touch"] :host {
      position: relative;
    }

    html[data-ui-input-modality="touch"] :host::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      inline-size: max(100%, var(--ui-control-min-block-size));
      block-size: max(100%, var(--ui-control-min-block-size));
      transform: translate(-50%, -50%);
    }

      inline-size: var(--ui-icon-button-size, var(--_size));
      block-size: var(--ui-icon-button-size, var(--_size));
      min-inline-size: var(--ui-icon-button-size, var(--_size));
      min-block-size: var(--ui-icon-button-size, var(--_size));

      min-inline-size: var(--ui-icon-button-size, var(--_size));
      min-block-size: var(--ui-icon-button-size, var(--_size));

      block-size: auto;
      align-self: stretch;

    }

      --_size: var(--ui-control-size-lg);
    }

        min-inline-size: max(var(--ui-icon-button-size, var(--_size)), var(--ui-control-min-block-size));

    }

    .content {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    :is(:host([loading]), :host([pending])) .content {

    }

    @media (prefers-reduced-motion: reduce) {
      :host([anticipatory]) .content {

      border-color: var(--ui-disabled-border);
      background-color: var(--ui-disabled-surface);
      color: var(--ui-disabled-text);

      box-shadow: none;
