<template component="ui-icon-button" controller="./ui-icon-button.js">
  <defs>
    <prop name="disabled" type="boolean" default="false"
    >Disables the button, so it cannot be pressed or focused, and washes it out: the same shape, with less colour and contrast (--ui-disabled-filter).</prop>
    <prop name="label" type="string">Accessible name for the icon.</prop>
    <prop name="size" type="sm | md | lg" default="md"
    >Button and icon size together: sm is 1.75rem with a small icon, md is 2rem, and lg is 2.5rem with a large icon. On touch, every size gets an invisible hit
      area of at least 44px.</prop>
    <prop name="variant" type="ghost | outline | solid" default="ghost"
    >Emphasis. ghost shows only the icon until it is hovered, for toolbars and dense rows; outline adds a border on the default surface; solid fills with the
      accent colour, for the one primary action in a group.</prop>
    <prop name="anticipatory" type="boolean" default="false"
    >Keeps the button out of sight until it is wanted: at rest a fine pointer sees only a small guide dot, and the button appears on hover, on focus, or when
      the pointer comes near inside a ui-affordance-scope. Touch devices and the solid variant always show it.</prop>
    <prop name="round" type="boolean" default="false">Use a fully circular shape.</prop>
  </defs>
  <button :disabled="disabled" type="button" :aria-label="label"><slot></slot></button>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-icon-button-active-scale {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-disabled-filter {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-disabled-opacity {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-hover-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-hover-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-hover-text {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-icon-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-icon-stroke-width {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-outline-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-outline-text {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-radius {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-size {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-solid-hover-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-solid-shadow {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-solid-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-solid-text {
      syntax: "*";
      inherits: false;
    }
    @property --ui-icon-button-surface {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Hooks do not inherit, so the parts below read them from the root. */
      --_ui-icon-button-icon-size: var(--ui-icon-button-icon-size);
      --_ui-icon-button-icon-stroke-width: var(--ui-icon-button-icon-stroke-width);

      display: inline-flex;
      color: var(--ui-text-secondary);
    }

    :host-state([anticipatory]) {
      position: relative;
    }

    :host-state([anticipatory])::before {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      z-index: 1;
      inline-size: var(--ui-affordance-guide-size);
      block-size: var(--ui-affordance-guide-size);
      border-radius: var(--ui-radius-round);
      background: var(--ui-affordance-guide-color, var(--ui-border-strong));
      opacity: var(--ui-affordance-guide-opacity);
      transform: translate(-50%, -50%);
      transition: opacity var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease);
      pointer-events: none;
    }

    /* At rest an anticipatory button shows only its guide dot; proximity, hover, or focus reveals the
     * surface and icon. The root is the native button, so hiding it outright would hide the dot
     * too, and slotted icons sit outside this scope; `color: transparent` hides currentColor icons. */
    @media (hover: hover) and (pointer: fine) {
      :host-state([anticipatory]):not(:host-state([variant="solid"]), [data-ui-proximity="near"], :hover, :focus-visible) {
        border-color: transparent;
        background: transparent;
        box-shadow: none;
        color: transparent;
      }
    }

    :host-state([anticipatory]):is(:host-state([variant="solid"]), [data-ui-proximity="near"], :hover, :focus-visible)::before {
      opacity: 0;
    }

    :host {
      /* The size prop resolves here; --ui-icon-button-size overrides it on an element. */
      --_size: 2rem;
      appearance: none;
      inline-size: var(--ui-icon-button-size, var(--_size));
      block-size: var(--ui-icon-button-size, var(--_size));
      min-inline-size: var(--ui-icon-button-size, var(--_size));
      min-block-size: var(--ui-icon-button-size, var(--_size));
      padding: 0;
      margin: 0;
      border: 1px solid transparent;
      border-radius: var(--ui-icon-button-radius, var(--ui-radius-md));
      background: var(--ui-icon-button-surface, transparent);
      color: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition:
        background-color var(--ui-motion-fast) var(--ui-motion-ease),
        border-color var(--ui-motion-fast) var(--ui-motion-ease),
        color var(--ui-motion-fast) var(--ui-motion-ease),
        box-shadow var(--ui-motion-fast) var(--ui-motion-ease),
        transform var(--ui-motion-fast) var(--ui-motion-ease);
    }

    @media (hover: none), (pointer: coarse) {
      :host-state([anticipatory])::before {
        opacity: 0;
      }
    }

    /* A touch target without a bigger button: an invisible hit area, at least the control
       minimum, centred on the button (::before is the anticipatory guide). */
    @media (pointer: coarse) {
      :host {
        position: relative;
      }

      :host::after {
        content: "";
        position: absolute;
        inset: 50% auto auto 50%;
        inline-size: max(100%, var(--ui-control-min-block-size));
        block-size: max(100%, var(--ui-control-min-block-size));
        transform: translate(-50%, -50%);
      }
    }

    html[data-ui-input-modality="touch"] :host {
      position: relative;
    }

    html[data-ui-input-modality="touch"] :host::after {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      inline-size: max(100%, var(--ui-control-min-block-size));
      block-size: max(100%, var(--ui-control-min-block-size));
      transform: translate(-50%, -50%);
    }

    :host-state([size="sm"]) {
      --_size: 1.75rem;
      inline-size: var(--ui-icon-button-size, var(--_size));
      block-size: var(--ui-icon-button-size, var(--_size));
      min-inline-size: var(--ui-icon-button-size, var(--_size));
      min-block-size: var(--ui-icon-button-size, var(--_size));
    }

    :host-state([size="lg"]) {
      --_size: 2.5rem;
      inline-size: var(--ui-icon-button-size, var(--_size));
      block-size: var(--ui-icon-button-size, var(--_size));
      min-inline-size: var(--ui-icon-button-size, var(--_size));
      min-block-size: var(--ui-icon-button-size, var(--_size));
    }

    :host-state([round]) {
      border-radius: var(--ui-radius-round);
    }

    :host-state([variant="outline"]) {
      border-color: var(--ui-icon-button-border, var(--ui-border-default));
      background: var(--ui-icon-button-outline-surface, var(--ui-surface-default));
      color: var(--ui-icon-button-outline-text, var(--ui-text-primary));
    }

    :host-state([variant="solid"]) {
      background: var(--ui-icon-button-solid-surface, var(--ui-accent-solid));
      color: var(--ui-icon-button-solid-text, var(--ui-text-on-accent));
      box-shadow: var(
        --ui-icon-button-solid-shadow,
        0 1px 2px color-mix(in srgb, var(--ui-accent-solid) 18%, transparent)
      );
    }

    :host:hover:enabled {
      /* Derived from the text colour so the ghost hover shows on any background. */
      background: var(--ui-icon-button-hover-surface, color-mix(in srgb, currentColor 8%, transparent));
      color: var(--ui-icon-button-hover-text, var(--ui-text-primary));
    }

    :host-state([variant="outline"]):hover:enabled {
      border-color: var(--ui-icon-button-hover-border, var(--ui-border-strong));
    }

    :host-state([variant="solid"]):hover:enabled {
      background: var(--ui-icon-button-solid-hover-surface, var(--ui-accent-hover));
    }

    :host:active:enabled {
      transform: scale(var(--ui-icon-button-active-scale, 0.96));
    }

    :host:focus-visible {
      outline: none;
      box-shadow: var(--ui-focus-halo);
    }

    /* Disabled colours fall back to each variant's own; ghost takes only the icon colour. */
    /* Disabled washes the button out the way Button does: the same shape, one filter. */
    :host:disabled {
      filter: var(--ui-icon-button-disabled-filter, var(--ui-disabled-filter));
      opacity: var(--ui-icon-button-disabled-opacity, 1);
      cursor: not-allowed;
      box-shadow: none;
    }

    :host {
      --_icon-button-icon-default: var(--ui-icon-size-md);
      /* A slotted ui-icon is its own component, out of reach of the svg rule below; it reads these. */
      --ui-icon-size: var(--ui-icon-button-icon-size, var(--_icon-button-icon-default));
      --ui-icon-stroke-width: var(--ui-icon-button-icon-stroke-width, 1.75);
    }

    :host-state([size="sm"]) {
      --_icon-button-icon-default: var(--ui-icon-size-sm);
    }

    :host-state([size="lg"]) {
      --_icon-button-icon-default: var(--ui-icon-size-lg);
    }

    :slotted(svg) {
      inline-size: var(--_ui-icon-button-icon-size, var(--_icon-button-icon-default));
      block-size: var(--_ui-icon-button-icon-size, var(--_icon-button-icon-default));
      flex-shrink: 0;
      stroke-width: var(--_ui-icon-button-icon-stroke-width, 1.75);
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
