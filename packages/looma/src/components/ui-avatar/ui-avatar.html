<link rel="component" href="../ui-icon/ui-icon.html">
<template component="ui-avatar" controller="./ui-avatar.js">
  <defs>
    <prop name="src" type="string"
    >The image to show, cropped to fill the circle. Until it loads, or if it fails, the avatar shows initials instead. An img element authored inside the avatar
      takes precedence over src.</prop>
    <prop name="alt" type="string" default=""
    >The avatar's accessible name, announced for it as an image. When empty, name is used, then "Avatar". Initials come from name first, so alt supplies them
      only when name is empty. An authored img carries its own alt instead.</prop>
    <prop name="name" type="string" default=""
    >The person's name. The initials are drawn from it: the first letters of the first two words, or the first two letters of a single word. It is also the
      accessible name when alt is empty.</prop>
    <prop name="fallback" type="string" default=""
    >Text shown instead of the initials derived from name or alt, whenever there is no image. It is uppercased; keep it to a couple of characters, because the
      circle clips anything wider.</prop>
    <prop name="size" type="keyword" values="xs, sm, md" default="md"
    >md is 2.5rem, for a person on their own (a profile, a comment); sm is 1.75rem with smaller initials, for a row of people in a toolbar or header; xs is
      1.25rem with small initials, for a person named inline in a line of small text.</prop>
    <prop name="shape" type="keyword" values="circle, square" default="circle"
    >Circle by default, with a shallow shadow; square uses the theme's medium radius.</prop>
    <prop name="decorative" type="boolean" default="false">Hides the avatar from assistive technology when adjacent text already identifies the person.</prop>
    <prop name="active" type="boolean" default="false"
    >Marks the person as active now, such as editing the same page: a fine accent ring around the avatar. The ring is not announced, so say what it means in alt
      ("Ada Lovelace, editing").</prop>
    <state type="boolean" name="hasImage" value="false"></state>
    <state type="boolean" name="hasAuthoredImage" value="false"></state>
    <state type="string" name="initials" value="?"></state>
    <state type="boolean" name="showGlyph" value="false"></state>
  </defs>
  <span>
    <slot></slot>
    <img class="image" $ref="image" from:src="$src" alt="" aria-hidden="true" from:hidden="$hasAuthoredImage or not $hasImage">
    <span class="fallback" from:aria-hidden="$hasImage" from:hidden="$hasImage">
      <span from:hidden="$showGlyph">{$initials}</span>
      <span from:hidden="not $showGlyph"><ui-icon name="user-round"></ui-icon></span>
    </span>
  </span>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-avatar-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-avatar-radius {
      syntax: "*";
      inherits: false;
    }
    @property --ui-avatar-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-avatar-text {
      syntax: "*";
      inherits: false;
    }
    @property --ui-avatar-active-ring {
      syntax: "*";
      inherits: false;
    }

    :host {
      --_ui-default-icon-size: 1.25rem;
      display: inline-grid;
      place-items: center;
      overflow: hidden;
      inline-size: 2.5rem;
      block-size: 2.5rem;
      border-radius: var(--ui-avatar-radius, var(--ui-radius-round));
      border: var(--ui-border-width) solid var(--ui-avatar-border, color-mix(in srgb, var(--ui-accent-solid) 35%, var(--ui-surface-default)));
      background: var(--ui-avatar-surface, var(--ui-accent-soft));
      color: var(--ui-avatar-text, var(--ui-accent-subtle-text, var(--ui-accent-solid)));
      font: inherit;
      font-size: var(--ui-font-size-sm);
      font-weight: 600;
      /* The initials centre in the circle wherever it sits, whatever line height surrounds it. */
      line-height: 1;
      text-transform: uppercase;
    }

    :host([size="sm"]) {
      --_ui-default-icon-size: 1rem;
      inline-size: 1.75rem;
      block-size: 1.75rem;
      font-size: var(--ui-font-size-xs);
    }

    :host([size="xs"]) {
      --_ui-default-icon-size: 0.75rem;
      inline-size: 1.25rem;
      block-size: 1.25rem;
      /* Below the type scale on purpose: two initials need room inside a 1.25rem circle. */
      font-size: calc(var(--ui-font-size) * 0.5625);
      letter-spacing: 0.02em;
    }

    :host-state([hasImage]) {
      border-color: var(--ui-avatar-border, var(--ui-border-strong));
    }

    :host([shape="circle"]) {
      box-shadow: var(--ui-shadow-sm);
    }

    :host([shape="square"]) {
      border-radius: var(--ui-avatar-radius, var(--ui-radius-md));
    }

    /* An outline, not a dot: the avatar clips its content to the circle, and an outline is drawn
       outside the box, so the ring survives the clip and the overlap in an Avatar Group. */
    :host([active]) {
      outline: var(--ui-border-width) solid var(--ui-avatar-active-ring, var(--ui-accent-solid));
      outline-offset: var(--ui-border-width);
    }

    .image,
    :slotted(img) {
      grid-area: 1 / 1;
      inline-size: 100%;
      block-size: 100%;
      object-fit: cover;
    }

    .fallback {
      grid-area: 1 / 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      inline-size: 100%;
      block-size: 100%;
    }

    /* Centre the glyphs, not the line box: a label without descenders otherwise reads high. */
    /* Centre the glyphs, not the line box: a label without descenders otherwise reads high.
     * Trimming applies to block containers, so the box is a block with centred content. */
    @supports (text-box-trim: trim-both) {
      .fallback {
        display: block;
        text-align: center;
        align-content: center;
        text-box-trim: trim-both;
        text-box-edge: cap alphabetic;
      }
    }

    [hidden] {
      display: none;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
