<template component="ui-avatar" controller="./ui-avatar.js">
  <defs>
    <prop name="src" type="string"
    >The image to show, cropped to fill the circle. Until it loads, or if it fails, the avatar shows initials instead. An img element authored inside the avatar
      takes precedence over src.</prop>
    <prop name="alt" type="string" default=""
    >The avatar's accessible name, announced for it as an image. When empty, name is used, then "Avatar". Initials come from name first, so alt supplies them
      only when name is empty. An authored img carries its own alt instead.</prop>
    <prop name="name" type="string" default=""
    >The person's name. The initials are drawn from it: the first letters of the first two words, or the first two letters of a single word. It is also the
      accessible name when alt is empty.</prop>
    <prop name="fallback" type="string" default=""
    >Text shown instead of the initials derived from name or alt, whenever there is no image. It is uppercased; keep it to a couple of characters, because the
      circle clips anything wider.</prop>
    <state name="hasImage" :value="false"></state>
    <state name="hasAuthoredImage" :value="false"></state>
    <state name="initials" :value="'?'"></state>
  </defs>
  <span>
    <slot></slot>
    <img class="image" $ref="image" :src="src" alt="" aria-hidden="true" :hidden="hasAuthoredImage or not hasImage">
    <span class="fallback" :aria-hidden="hasImage" :hidden="hasImage" $value="initials"></span>
  </span>
  <style>
    :host {
      display: inline-grid;
      place-items: center;
      overflow: hidden;
      inline-size: 2.5rem;
      block-size: 2.5rem;
      border-radius: 999px;
      border: 1px solid var(--ui-avatar-border, var(--ui-border-strong));
      background: var(--ui-avatar-surface, var(--ui-accent-soft));
      color: var(--ui-avatar-text, var(--ui-accent-subtle-text, var(--ui-accent-solid)));
      font: inherit;
      font-size: var(--ui-font-size-sm);
      font-weight: 600;
      text-transform: uppercase;
    }

    .image,
    :slotted(img) {
      grid-area: 1 / 1;
      inline-size: 100%;
      block-size: 100%;
      object-fit: cover;
    }

    .fallback {
      grid-area: 1 / 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      inline-size: 100%;
      block-size: 100%;
    }

    /* Centre the glyphs, not the line box: a label without descenders otherwise reads high. */
    /* Centre the glyphs, not the line box: a label without descenders otherwise reads high.
     * Trimming applies to block containers, so the box is a block with centred content. */
    @supports (text-box-trim: trim-both) {
      .fallback {
        display: block;
        text-align: center;
        align-content: center;
        text-box-trim: trim-both;
        text-box-edge: cap alphabetic;
      }
    }

    [hidden] {
      display: none;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
