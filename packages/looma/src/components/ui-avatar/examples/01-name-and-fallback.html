<!--
title: Name, fallback, and sizes
description: The name supplies the accessible identity and fallback supplies visible initials when no image is available. md stands alone, sm sits in a row of people, and xs names someone inline in small text.
-->
<ui-avatar name="Maya Chen"> </ui-avatar>
<ui-avatar name="Maya Chen" size="sm"> </ui-avatar>
<ui-avatar name="Maya Chen" size="xs"> </ui-avatar>
