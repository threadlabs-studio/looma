<template component="ui-popover" module="./ui-popover.js">
  <defs>
    <prop name="bare" type="boolean" default="false"
    >Delegates the surface to its content, with no padding, border, background, shadow, or overflow clipping.</prop>
    <prop name="size" type="keyword" values="content, sm, md, lg" default="content"
    >Optional size preset. content keeps the existing intrinsic sizing; the other sizes constrain the surface for compact, medium, or large content. Shared
      surface separation adapts to popover purpose and rendered size.</prop>
    <prop name="open" type="boolean" default="false">Whether the popover is open initially or when set externally.</prop>
    <prop name="for" type="string" default="">ID of the control that toggles and anchors the popover.</prop>
    <prop
      name="placement"
      type="keyword"
      values="top, top-start, top-end, bottom, bottom-start, bottom-end, left, left-start, left-end, right, right-start, right-end"
      default="bottom-start"
    >Positions the surface around its trigger. Start and end on top or bottom follow the writing direction.</prop>
    <state type="boolean" name="internalOpen" value="false"></state>
    <event
      name="open"
      type="object"
    >
      <prop name="open" required type="boolean"></prop>
      <prop name="reason" required type="keyword" values="action, programmatic, light-dismiss, escape"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
    <event
      name="close"
      type="object"
    >
      <prop name="open" required type="boolean"></prop>
      <prop name="reason" required type="keyword" values="action, programmatic, light-dismiss, escape"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
  </defs>
  <span><div class="surface"><slot></slot></div></span>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-popover-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-popover-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-popover-radius {
      syntax: "*";
      inherits: false;
    }
    @property --ui-popover-shadow {
      syntax: "*";
      inherits: false;
    }
    @property --ui-popover-viewport-gap {
      syntax: "*";
      inherits: false;
    }
    @property --ui-popover-offset {
      syntax: "*";
      inherits: false;
    }
    @property --ui-popover-padding {
      syntax: "*";
      inherits: false;
    }

    :host {
      --_ui-material-scale: 0.55;
      --_ui-popover-surface: var(--ui-popover-surface);
      --_ui-popover-border: var(--ui-popover-border);
      --_ui-popover-radius: var(--ui-popover-radius);
      --_ui-popover-shadow: var(--ui-popover-shadow);
      --_ui-popover-padding: var(--ui-popover-padding);
      box-sizing: border-box !important;
      max-inline-size: min(
        20rem,
        calc(100vw - var(--ui-popover-viewport-gap, var(--ui-space-2)) * 2)
      );
      max-block-size: calc(100dvh - var(--ui-popover-viewport-gap, var(--ui-space-2)) * 2);
      overflow: visible;
      padding: 0 !important;
      border: 0;
      outline: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .surface {
      box-sizing: border-box !important;
      max-inline-size: inherit;
      max-block-size: inherit;
      overflow: auto;
      padding: var(--_ui-popover-padding, var(--ui-space-3)) !important;
      background: var(--_ui-popover-surface, var(--ui-overlay-surface, var(--ui-surface-elevated)));
      border: var(--ui-border-width) solid var(--_ui-popover-border, var(--ui-overlay-border, var(--ui-border-strong)));
      border-radius: var(--_ui-popover-radius, var(--ui-overlay-radius, var(--ui-radius-lg)));
      box-shadow: var(--_ui-popover-shadow, var(--ui-overlay-shadow, var(--ui-elevation-overlay, var(--ui-shadow-lg))));
    }

    /* Purpose and measured size shape one shared separation lever. The content plane stays opaque;
       transparency, saturation and edge light belong to the surrounding decorative material. */
    .surface {
      --_ui-material-glassiness: calc(clamp(0, var(--ui-glassiness, 0), 1) + 2 * pow(clamp(0, var(--ui-glassiness, 0), 1), 4));
      --_ui-material-separation: clamp(0, var(--ui-surface-separation, 0), 1);
      --_ui-material-active: clamp(0, calc((var(--_ui-material-glassiness) + var(--_ui-material-separation)) * 100000), 1);
      --_ui-material-rim: calc((var(--_ui-material-separation) + var(--_ui-material-glassiness) * 0.25) * var(--_ui-material-scale, 0.55) * 8px);
      --_ui-material-content-color: var(--_ui-popover-surface, var(--ui-material-content, var(--ui-overlay-surface, var(--ui-surface-elevated))));
      --_ui-material-rim-color: color-mix(in srgb, var(--ui-material-glass, var(--ui-surface-elevated)) calc(var(--_ui-material-active) * 100%), transparent);
      background:
        var(--ui-surface-highlight, linear-gradient(transparent, transparent)) padding-box,
        linear-gradient(var(--_ui-material-content-color), var(--_ui-material-content-color)) padding-box,
        linear-gradient(var(--_ui-material-rim-color), var(--_ui-material-rim-color)) border-box,
        var(--_ui-material-content-color) padding-box;
      border-width: calc(var(--ui-border-width) + var(--_ui-material-rim));
      border-color: var(
        --_ui-popover-border,
        color-mix(in oklab, var(--ui-overlay-border, var(--ui-border-strong)) calc((1 - var(--_ui-material-active)) * 100%), transparent)
      );
      box-shadow: var(
        --_ui-popover-shadow,
        var(
          --ui-overlay-shadow,
          0 calc(var(--_ui-material-separation) * var(--_ui-material-scale, 0.55) * 8px) calc(
            var(--_ui-material-separation) * var(--_ui-material-scale, 0.55) * 24px
          ) color-mix(in oklab, var(--ui-text-primary) 15%, transparent),
          var(--ui-material-glow, 0 0 transparent),
          inset 0 0 0 calc(var(--_ui-material-active) * var(--ui-border-width)) var(--ui-material-edge, var(--ui-border-strong)),
          var(--ui-elevation-overlay, var(--ui-shadow-lg))
        )
      );
      backdrop-filter: blur(calc(var(--_ui-material-glassiness) * var(--_ui-material-scale, 0.55) * 18px))
        saturate(calc(1 + var(--_ui-material-glassiness) * var(--_ui-material-scale, 0.55) * 0.18));
      -webkit-backdrop-filter: blur(calc(var(--_ui-material-glassiness) * var(--_ui-material-scale, 0.55) * 18px))
        saturate(calc(1 + var(--_ui-material-glassiness) * var(--_ui-material-scale, 0.55) * 0.18));
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .surface {
        background: var(--_ui-material-content-color);
      }
    }

    @media (prefers-reduced-transparency: reduce) {
      .surface {
        background: var(--_ui-material-content-color);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }

    @media (forced-colors: active) {
      .surface {
        background: Canvas;
        border-color: CanvasText;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }

    /* A toolbar or card can supply its own surface, including an unclipped shadow. */
    :host([bare]) .surface {
      overflow: visible;
      padding: 0 !important;
      border: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    :host(:not(:state(internalOpen))) {
      display: none !important;
    }

    :host[popover] {
      position: fixed;
      inset: auto;
      margin: 0 !important;
      opacity: 0;
      transform: translateY(-4px) scale(0.99);
      transition:
        opacity var(--ui-motion-fast) var(--ui-motion-ease),
        transform var(--ui-motion-fast) var(--ui-motion-ease),
        display var(--ui-motion-fast) allow-discrete,
        overlay var(--ui-motion-fast) allow-discrete;
    }

    :host[popover]:popover-open {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @starting-style {
      :host[popover]:popover-open {
        opacity: 0;
        transform: translateY(-4px) scale(0.99);
      }
    }

    :host([size="sm"]) {
      inline-size: min(22rem, calc(100vw - var(--ui-space-2) * 2));
      max-inline-size: min(22rem, calc(100vw - var(--ui-space-2) * 2));
    }
    :host([size="md"]) {
      inline-size: min(28rem, calc(100vw - var(--ui-space-2) * 2));
      max-inline-size: min(28rem, calc(100vw - var(--ui-space-2) * 2));
    }
    :host([size="lg"]) {
      inline-size: min(36rem, calc(100vw - var(--ui-space-2) * 2));
      max-inline-size: min(36rem, calc(100vw - var(--ui-space-2) * 2));
    }

    :host[hidden] {
      display: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      :host[popover] {
        transition: none;
      }
    }
  </style>
</template>
