<template component="ui-popover" controller="./ui-popover.js">
  <defs>
    <prop name="open" type="boolean" default="false">Whether the popover is open initially or when set externally.</prop>
    <prop name="for" type="string" default="">ID of the control that toggles and anchors the popover.</prop>
    <prop
      name="placement"
      type="top | top-start | top-end | bottom | bottom-start | bottom-end | left | left-start | left-end | right | right-start | right-end"
      default="bottom-start"
    >Positions the surface around its trigger. Start and end on top or bottom follow the writing direction.</prop>
    <state name="internalOpen" :value="false"></state>
    <event
      name="open"
      type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"
    ></event>
    <event
      name="close"
      type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"
    ></event>
  </defs>
  <span><div class="surface"><slot></slot></div></span>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-popover-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-popover-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-popover-radius {
      syntax: "*";
      inherits: false;
    }
    @property --ui-popover-shadow {
      syntax: "*";
      inherits: false;
    }
    @property --ui-popover-viewport-gap {
      syntax: "*";
      inherits: false;
    }
    @property --ui-popover-offset {
      syntax: "*";
      inherits: false;
    }
    @property --ui-popover-padding {
      syntax: "*";
      inherits: false;
    }

    :host {
      --_ui-popover-surface: var(--ui-popover-surface);
      --_ui-popover-border: var(--ui-popover-border);
      --_ui-popover-radius: var(--ui-popover-radius);
      --_ui-popover-shadow: var(--ui-popover-shadow);
      --_ui-popover-padding: var(--ui-popover-padding);
      box-sizing: border-box;
      max-inline-size: min(
        20rem,
        calc(100vw - var(--ui-popover-viewport-gap, var(--ui-space-2)) * 2)
      );
      max-block-size: calc(100dvh - var(--ui-popover-viewport-gap, var(--ui-space-2)) * 2);
      overflow: visible;
      padding: 0;
      border: 0;
      outline: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .surface {
      box-sizing: border-box;
      max-inline-size: inherit;
      max-block-size: inherit;
      overflow: auto;
      padding: var(--_ui-popover-padding, var(--ui-space-3));
      background: var(--_ui-popover-surface, var(--ui-overlay-surface, var(--ui-surface-elevated)));
      border: 1px solid var(--_ui-popover-border, var(--ui-overlay-border, var(--ui-border-strong)));
      border-radius: var(--_ui-popover-radius, var(--ui-overlay-radius, var(--ui-radius-lg)));
      box-shadow: var(--_ui-popover-shadow, var(--ui-overlay-shadow, var(--ui-elevation-overlay, var(--ui-shadow-lg))));
    }

    :host:not(:host-state([internalOpen])) {
      display: none;
    }

    :host[popover] {
      position: fixed;
      inset: auto;
      margin: 0;
      opacity: 0;
      transform: translateY(-4px) scale(0.99);
      transition:
        opacity var(--ui-motion-fast) var(--ui-motion-ease),
        transform var(--ui-motion-fast) var(--ui-motion-ease),
        display var(--ui-motion-fast) allow-discrete,
        overlay var(--ui-motion-fast) allow-discrete;
    }

    :host[popover]:popover-open {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @starting-style {
      :host[popover]:popover-open {
        opacity: 0;
        transform: translateY(-4px) scale(0.99);
      }
    }

    :host[hidden] {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      :host[popover] {
        transition: none;
      }
    }
  </style>
</template>
