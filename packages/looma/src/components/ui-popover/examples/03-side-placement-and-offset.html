<!--
title: Side placement and offset
description: Use a side placement and a local offset when one popover needs more space from its trigger.
-->
<ui-button id="side-popover-trigger">Open details</ui-button>
<ui-popover for="side-popover-trigger" placement="right-start" style="--ui-popover-offset: 0.75rem">
  <strong>Details</strong>
  <p>This surface prefers the right side and flips when it cannot fit there.</p>
</ui-popover>
