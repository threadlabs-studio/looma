<template component="ui-editor-insert-table-grid" controller="./ui-editor-insert-table-grid.js">
  <defs>
    <prop name="open" type="boolean" default="false">Whether the grid is shown.</prop>
    <prop name="maxRows" type="integer" default="8">The most rows the grid offers (at most 10).</prop>
    <prop name="maxCols" type="integer" default="8">The most columns the grid offers (at most 10).</prop>
    <prop name="headerRow" type="boolean" default="false">Whether table insertion initially includes a header row.</prop>
    <state
      name="cells"
      type="list(object({ key: string, row: integer, col: integer, label: string, selected: boolean, tabIndex: integer }))"
      value="[]"
    ></state>
    <state type="integer" name="rows" value="8"></state>
    <state type="integer" name="cols" value="8"></state>
    <state type="string" name="hint" value=""></state>
    <state type="boolean" name="withHeaderRow" value="false"></state>
    <event name="insert" type="object({ rows: integer, cols: integer, withHeaderRow: boolean })"></event>
  </defs>
  <div from:hidden="not $open">
    <p class="hint">{$hint}</p>
    <div class="grid" $ref="grid" role="group" aria-label="Table dimensions" style:--_rows="$rows" style:--_cols="$cols">
      <button
        $each="cell of $cells"
        $key="$cell.key"
        type="button"
        class="cell"
        class:selected="$cell.selected"
        from:data-row="$cell.row"
        from:data-col="$cell.col"
        from:aria-label="$cell.label"
        from:aria-pressed="$cell.selected"
        from:tabindex="$cell.tabIndex"
      >
      </button>
    </div>
    <label class="header"><input type="checkbox" $ref="header" .checked="$withHeaderRow"> Header row</label>
  </div>
  <style>
    :host {
      padding: var(--ui-space-3);
      background: var(--ui-surface);
      border: var(--ui-border-width) solid var(--ui-border-strong);
      border-radius: var(--ui-radius-md);
      box-shadow: var(--ui-shadow-lg, 0 10px 15px -3px rgb(0 0 0 / 0.1));
    }

    .hint {
      margin: 0 0 var(--ui-space-2);
      font-size: var(--ui-font-size-sm);
      color: var(--ui-text-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(var(--_cols, 8), 1.25rem);
      grid-template-rows: repeat(var(--_rows, 8), 1.25rem);
      gap: 2px;
      margin-bottom: var(--ui-space-2);
      max-inline-size: 100%;
      overflow: auto;
      --_ui-scroll-fade-direction: to right;
      --_ui-scroll-fade-size: var(--ui-scroll-fade-size, 24px);
      mask-image: linear-gradient(
        var(--_ui-scroll-fade-direction),
        transparent,
        #000 var(--_ui-scroll-fade-start),
        #000 calc(100% - var(--_ui-scroll-fade-end)),
        transparent
      );
      animation: ui-scroll-fade-start linear, ui-scroll-fade-start-hold linear, ui-scroll-fade-end-hold linear, ui-scroll-fade-end linear;
      animation-timeline: scroll(self inline);
      animation-range:
        0 var(--_ui-scroll-fade-size),
        var(--_ui-scroll-fade-size) calc(100% + 1px),
        -1px calc(100% - var(--_ui-scroll-fade-size)),
        calc(100% - var(--_ui-scroll-fade-size)) 100%;
    }

    :host:dir(rtl) .grid {
      --_ui-scroll-fade-direction: to left;
    }

    .cell {
      width: 1.25rem;
      height: 1.25rem;
      padding: 0;
      border: var(--ui-border-width) solid var(--ui-control-border);
      border-radius: var(--ui-radius-sm);
      background: var(--ui-surface);
      cursor: pointer;
    }

    .cell.selected {
      background: var(--ui-accent-solid, var(--ui-accent));
      border-color: var(--ui-accent-solid, var(--ui-accent));
    }

    .cell:focus-visible {
      outline: var(--ui-focus-width) solid var(--ui-focus-ring);
      outline-offset: calc(-1 * var(--ui-focus-width));
    }

    .header {
      display: block;
      margin-bottom: var(--ui-space-2);
      font-size: var(--ui-font-size-sm);
      cursor: pointer;
    }

    @media (pointer: coarse) {
      .grid {
        grid-template-columns: repeat(var(--_cols, 8), 44px);
        grid-template-rows: repeat(var(--_rows, 8), 44px);
      }

      .cell {
        width: 44px;
        height: 44px;
      }
    }

    @media (forced-colors: active) {
      .cell:focus-visible {
        outline-color: Highlight;
      }
    }

    :host[hidden] {
      display: none;
    }
  </style>
</template>
