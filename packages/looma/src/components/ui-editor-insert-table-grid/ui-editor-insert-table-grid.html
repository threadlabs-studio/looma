<template component="ui-editor-insert-table-grid" controller="./ui-editor-insert-table-grid.js">
  <defs>
    <prop name="open" type="boolean" default="false">Whether the grid is shown.</prop>
    <prop name="maxRows" type="integer" default="8">The most rows the grid offers (at most 10).</prop>
    <prop name="maxCols" type="integer" default="8">The most columns the grid offers (at most 10).</prop>
    <prop name="headerRow" type="boolean" default="false">Whether table insertion initially includes a header row.</prop>
    <state name="cells" :value="[]"></state>
    <state name="rows" :value="8"></state>
    <state name="cols" :value="8"></state>
    <state name="hint" :value="''"></state>
    <state name="withHeaderRow" :value="false"></state>
    <event name="insert" type="object({ rows: integer, cols: integer, withHeaderRow: boolean })"></event>
  </defs>
  <div :hidden="not open">
    <p class="hint" $value="hint"></p>
    <div class="grid" role="group" aria-label="Table dimensions" style:--ui-editor-table-grid-rows="rows" style:--ui-editor-table-grid-cols="cols">
      <button $each="cell of cells" $key="cell.key" type="button" class="cell" class:selected="cell.selected" :data-row="cell.row" :data-col="cell.col" :aria-label="cell.label" :aria-pressed="cell.selected"></button>
    </div>
    <label class="header"><input type="checkbox" $ref="header" .checked="withHeaderRow"> Header row</label>
    <button type="button" class="insert" $ref="insert">Insert table</button>
  </div>
  <style>
:host {
  padding: var(--ui-space-3, 12px);
  background: var(--ui-surface, #fff);
  border: 1px solid var(--ui-border, #e5e7eb);
  border-radius: var(--ui-radius-md, 6px);
  box-shadow: var(--ui-shadow-lg, 0 10px 15px -3px rgb(0 0 0 / 0.1));
}

.hint {
  margin: 0 0 var(--ui-space-2, 8px);
  font-size: var(--ui-text-sm, 0.875rem);
  color: var(--ui-text-muted, #6b7280);
}

.grid {
  display: grid;
  grid-template-columns: repeat(var(--ui-editor-table-grid-cols, 8), 1.25rem);
  grid-template-rows: repeat(var(--ui-editor-table-grid-rows, 8), 1.25rem);
  gap: 2px;
  margin-bottom: var(--ui-space-2, 8px);
}

.cell {
  width: 1.25rem;
  height: 1.25rem;
  padding: 0;
  border: 1px solid var(--ui-border, #e5e7eb);
  border-radius: 2px;
  background: var(--ui-surface, #fff);
  cursor: pointer;
}

.cell.selected {
  background: var(--ui-accent-solid, var(--ui-accent, #0066cc));
  border-color: var(--ui-accent-solid, var(--ui-accent, #0066cc));
}

.header {
  display: block;
  margin-bottom: var(--ui-space-2, 8px);
  font-size: var(--ui-text-sm, 0.875rem);
  cursor: pointer;
}

:host .insert {
  width: 100%;
  padding: var(--ui-space-2, 8px) var(--ui-space-3, 12px);
  border: 1px solid var(--ui-border, #e5e7eb);
  border-radius: var(--ui-radius-sm, 4px);
  background: var(--ui-accent-solid, var(--ui-accent, #0066cc));
  color: var(--ui-accent-contrast, #fff);
  font-size: var(--ui-text-sm, 0.875rem);
  cursor: pointer;
}

:host .insert:hover {
  filter: brightness(1.05);
}

:host[hidden] {
  display: none;
}
  </style>
</template>
