<template component="ui-stack">
  <defs>
    <prop name="gap" type="xs | s | m | l | xl"
    >Space between items, on the spacing scale: xs is 0.5rem, s 0.75rem, m 1rem (also the default), l 1.5rem, and xl 2rem. The --ui-stack-gap custom property,
      set on the stack itself, overrides it; set on an ancestor, it does nothing.</prop>
    <prop name="align" type="start | center | end | stretch"
    >How items sit across the stack: stretch (the default) makes each fill the stack's width; start, center, and end keep each at its own width, against the
      start, in the middle, or against the end.</prop>
    <prop name="justify" type="start | center | end | between"
    >Where items sit along a stack that is taller than its content: start (the default), center, end, or between, which spreads the spare space between items.
      It has no effect unless the stack is given a height or stretched to one.</prop>
  </defs>
  <div><slot></slot></div>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-stack-gap {
      syntax: "*";
      inherits: false;
    }

    :host {
      --_layout-gap: var(--ui-space-4);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: var(--ui-stack-gap, var(--_layout-gap));
      min-inline-size: 0;
      max-inline-size: 100%;
      margin: 0;
    }

    :host-state([gap="xs"]) {
      --_layout-gap: var(--ui-space-2);
    }
    :host-state([gap="s"]) {
      --_layout-gap: var(--ui-space-3);
    }
    :host-state([gap="m"]) {
      --_layout-gap: var(--ui-space-4);
    }
    :host-state([gap="l"]) {
      --_layout-gap: var(--ui-space-5);
    }
    :host-state([gap="xl"]) {
      --_layout-gap: var(--ui-space-6);
    }
    :host-state([align="start"]) {
      align-items: flex-start;
    }
    :host-state([align="center"]) {
      align-items: center;
    }
    :host-state([align="end"]) {
      align-items: flex-end;
    }
    :host-state([justify="center"]) {
      justify-content: center;
    }
    :host-state([justify="end"]) {
      justify-content: flex-end;
    }
    :host-state([justify="between"]) {
      justify-content: space-between;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
