<template component="ui-stack">
  <defs>
    <prop name="fill" type="boolean" default="false">Grows into the remaining space of a flex layout and allows its scrolling children to shrink.</prop>
    <prop name="height" type="number">An optional measured height in CSS pixels, for a viewport-bounded composition. Omit it to retain intrinsic sizing.</prop>
    <prop name="gap" type="keyword" values="none, xs, s, m, l, xl"
    >Space between items, on the spacing scale: none is zero, xs is 0.5rem, s 0.75rem, m 1rem (also the default), l 1.5rem, and xl 2rem. The --ui-stack-gap
      custom property, set on :root, an ancestor, or the component itself, overrides it. Theme rhythm scales these vertical gaps, while an explicit gap override
      stays exact.</prop>
    <prop name="align" type="keyword" values="start, center, end, stretch"
    >How items sit across the stack: stretch (the default) makes each fill the stack's width; start, center, and end keep each at its own width, against the
      start, in the middle, or against the end.</prop>
    <prop name="justify" type="keyword" values="start, center, end, between"
    >Where items sit along a stack that is taller than its content: start (the default), center, end, or between, which spreads the spare space between items.
      It has no effect unless the stack is given a height or stretched to one.</prop>
  </defs>
  <div style:--_ui-stack-height="$height"><slot></slot></div>
  <style>
    @property --_ui-stack-height {
      syntax: "*";
      inherits: false;
    }

    :host {
      --_layout-gap: var(--ui-space-4);
      display: flex !important;
      flex-direction: column !important;
      align-items: stretch !important;
      gap: var(--ui-stack-gap, calc(var(--_layout-gap) * clamp(0.75, var(--ui-rhythm, 1), 1.5))) !important;
      min-inline-size: 0;
      max-inline-size: 100%;
      margin: 0 !important;
    }

    :host([fill]) {
      flex: 1;
      min-block-size: 0;
    }
    :host([height]) {
      block-size: calc(var(--_ui-stack-height, 0) * 1px);
      min-block-size: 0;
    }

    :host([gap="none"]) {
      --_layout-gap: 0px;
    }
    :host([gap="xs"]) {
      --_layout-gap: var(--ui-space-2);
    }
    :host([gap="s"]) {
      --_layout-gap: var(--ui-space-3);
    }
    :host([gap="m"]) {
      --_layout-gap: var(--ui-space-4);
    }
    :host([gap="l"]) {
      --_layout-gap: var(--ui-space-5);
    }
    :host([gap="xl"]) {
      --_layout-gap: var(--ui-space-6);
    }
    :host([align="start"]) {
      align-items: flex-start !important;
    }
    :host([align="center"]) {
      align-items: center !important;
    }
    :host([align="end"]) {
      align-items: flex-end !important;
    }
    :host([justify="center"]) {
      justify-content: center !important;
    }
    :host([justify="end"]) {
      justify-content: flex-end !important;
    }
    :host([justify="between"]) {
      justify-content: space-between !important;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
