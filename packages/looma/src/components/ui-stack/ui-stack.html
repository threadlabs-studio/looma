<template component="ui-stack">
  <defs>
    <prop name="gap" type="xs | s | m | l | xl">gap token.</prop>
    <prop name="align" type="start | center | end | stretch">align token.</prop>
    <prop name="justify" type="start | center | end | between">justify token.</prop>
  </defs>
  <div><slot></slot></div>
  <style>
    :host {
      --_layout-gap: var(--ui-space-4);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: var(--ui-stack-gap, var(--_layout-gap));
      min-inline-size: 0;
      max-inline-size: 100%;
      margin: 0;
    }

    :host-state([gap="xs"]) {
      --_layout-gap: var(--ui-space-2);
    }
    :host-state([gap="s"]) {
      --_layout-gap: var(--ui-space-3);
    }
    :host-state([gap="m"]) {
      --_layout-gap: var(--ui-space-4);
    }
    :host-state([gap="l"]) {
      --_layout-gap: var(--ui-space-5);
    }
    :host-state([gap="xl"]) {
      --_layout-gap: var(--ui-space-6);
    }
    :host-state([align="start"]) {
      align-items: flex-start;
    }
    :host-state([align="center"]) {
      align-items: center;
    }
    :host-state([align="end"]) {
      align-items: flex-end;
    }
    :host-state([justify="center"]) {
      justify-content: center;
    }
    :host-state([justify="end"]) {
      justify-content: flex-end;
    }
    :host-state([justify="between"]) {
      justify-content: space-between;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
