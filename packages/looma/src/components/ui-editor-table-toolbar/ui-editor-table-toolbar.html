<template component="ui-editor-table-toolbar" controller="./ui-editor-table-toolbar.js">
  <defs>
    <prop name="open" type="boolean" default="false">Shows the toolbar while a table selection is active.</prop>
    <prop name="cellAlignment" type="left | center | right" default="left">Marks the alignment command that is active for the current cell.</prop>
    <prop name="cellBackground" type="string" default="">Identifies the background choice that is active for the current cell.</prop>
    <prop name="actions" type="list(align-left | align-center | align-right | background-none | background-gray | background-yellow | background-blue | background-green | background-red | add-row-before | add-row-after | add-column-before | add-column-after | clear-cells | merge-cells | split-cell | delete-row | delete-column | delete-table)">The complete set of commands the current selection permits; omitted commands are not rendered.</prop>
    <event name="action" type="object({ action: string })"></event>
  </defs>
  <div></div>
</template>
