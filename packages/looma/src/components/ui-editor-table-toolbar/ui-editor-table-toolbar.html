<link rel="component" href="../ui-icon/ui-icon.html">
<template component="ui-editor-table-toolbar" controller="./ui-editor-table-toolbar.js">
  <defs>
    <prop name="open" type="boolean" default="false">Shows the toolbar while a table selection is active.</prop>
    <prop name="cellAlignment" type="keyword" values="left, center, right" default="left"
    >Marks the alignment command that is active for the current cell.</prop>
    <prop name="cellBackground" type="string" default="">Identifies the background choice that is active for the current cell.</prop>
    <prop name="headerRow" type="boolean" default="false">Whether the table's first row currently uses header cells.</prop>
    <prop name="headerColumn" type="boolean" default="false">Whether the table's first column currently uses header cells.</prop>
    <prop
      name="actions"
      type="array"
    >
      <prop
        type="keyword"
        values="align-left, align-center, align-right, background-none, background-gray, background-yellow, background-blue, background-green, background-red, add-row-before, add-row-after, add-column-before, add-column-after, toggle-header-row, toggle-header-column, move-row-up, move-row-down, move-column-left, move-column-right, clear-cells, merge-cells, split-cell, delete-row, delete-column, delete-table"
      ></prop>
      The complete set of commands the current selection permits.
    </prop>
    <state name="alignments" type="array" :value="[]">
      <prop type="object">
        <prop name="action" required type="keyword" values="align-left, align-center, align-right"></prop>
        <prop name="label" required type="string"></prop>
        <prop name="active" required type="boolean"></prop>
      </prop>
    </state>
    <state name="structure" type="array" :value="[]">
      <prop type="object">
        <prop name="action" required type="keyword" values="add-row-after, add-column-after"></prop>
        <prop name="label" required type="string"></prop>
        <prop name="icon" required type="string"></prop>
      </prop>
    </state>
    <state name="swatches" type="list(object({ action: string, label: string, color: string, selected: boolean }))" :value="[]"></state>
    <state
      name="sections"
      type="list(object({ heading: string, items: list(object({ action: string, label: string, icon: string, danger: boolean, checkable: boolean, checked: boolean })) }))"
      :value="[]"
    ></state>
    <state name="hasOverflow" :value="false"></state>
    <state name="overflowOpen" :value="false"></state>
    <event
      name="action"
      type="object"
    >
      <prop
        name="action"
        required
        type="keyword"
        values="align-left, align-center, align-right, background-none, background-gray, background-yellow, background-blue, background-green, background-red, add-row-before, add-row-after, add-column-before, add-column-after, toggle-header-row, toggle-header-column, move-row-up, move-row-down, move-column-left, move-column-right, clear-cells, merge-cells, split-cell, delete-row, delete-column, delete-table"
      ></prop>
    </event>
  </defs>
  <div role="toolbar" aria-label="Table actions" :hidden="not open">
    <div $if="alignments" class="group" role="group" aria-label="Cell alignment">
      <button
        $each="item of alignments"
        $key="item.action"
        type="button"
        class="icon-button"
        class:active="item.active"
        :data-action="item.action"
        :aria-label="item.label"
        :title="item.label"
        :aria-pressed="item.active"
      >
        <ui-icon :name="item.action"></ui-icon>
      </button>
    </div>
    <div $if="alignments and structure" class="sep" aria-hidden="true"></div>
    <div $if="structure" class="group" role="group" aria-label="Table structure">
      <button $each="item of structure" $key="item.action" type="button" :data-action="item.action">
        <ui-icon :name="item.icon"></ui-icon>
        <span $value="item.label"></span>
      </button>
    </div>
    <div $if="(alignments or structure) and hasOverflow" class="sep" aria-hidden="true"></div>
    <div $if="hasOverflow" class="overflow">
      <button type="button" class="more" data-action="toggle-overflow" aria-haspopup="menu" :aria-expanded="overflowOpen">
        <ui-icon name="table"></ui-icon>
        <span>Table options</span>
        <span class="chevron"><ui-icon name="chevron-down"></ui-icon></span>
      </button>
      <div $if="overflowOpen" class="menu" role="menu" aria-label="More table actions">
        <div $if="swatches" class="menu-section" role="none">
          <div class="menu-heading" role="presentation">Background</div>
          <div class="swatches" role="group" aria-label="Cell background">
            <button
              $each="swatch of swatches"
              $key="swatch.action"
              type="button"
              class="swatch-button"
              class:selected="swatch.selected"
              role="menuitemradio"
              :aria-checked="swatch.selected"
              :data-action="swatch.action"
            >
              <span class="swatch" class:default="not swatch.color" style:--_swatch="swatch.color"></span>
              <span $value="swatch.label"></span>
            </button>
          </div>
        </div>
        <div $each="section of sections" $key="section.heading" class="menu-section divided" role="none">
          <div class="menu-heading" role="presentation" $value="section.heading"></div>
          <button
            $each="item of section.items"
            $key="item.action"
            type="button"
            :role="{ true: 'menuitemcheckbox', false: 'menuitem' }[format('%s', item.checkable)]"
            :aria-checked="{ true: item.checked, false: null }[format('%s', item.checkable)]"
            class:danger="item.danger"
            :data-action="item.action"
          >
            <ui-icon :name="item.icon"></ui-icon>
            <span $value="item.label"></span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <style>
    .looma-editor__mobile-toolbar-shell :host {
      min-width: max-content;
      min-height: 100%;
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      backdrop-filter: none;
    }

    .looma-editor__mobile-toolbar-shell :host button {
      min-height: 44px;
      background: transparent;
    }

    .looma-editor__mobile-toolbar-shell :host button.active,
    .looma-editor__mobile-toolbar-shell :host button.selected {
      background: var(--ui-accent-soft, var(--ui-accent-subtle));
    }

    .looma-editor__mobile-toolbar-shell :host .menu {
      top: auto;
      right: 0;
      bottom: calc(100% + var(--ui-space-2));
      max-height: min(50dvh, 22rem);
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    :host {
      display: inline-flex;
      align-items: center;
      gap: var(--ui-space-1);
      padding: var(--ui-space-1);
      background: color-mix(in srgb, var(--ui-surface) 94%, transparent);
      border: 1px solid var(--ui-border-strong);
      border-radius: calc(var(--ui-radius-md) + 2px);
      box-shadow: var(--ui-shadow-lg, 0 10px 15px -3px rgb(0 0 0 / 0.1));
      backdrop-filter: blur(10px);
    }

    .group {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      overflow: hidden;
    }

    .sep {
      width: 1px;
      align-self: stretch;
      background: var(--ui-border-divider);
    }

    .overflow {
      position: relative;
    }

    :host button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--ui-space-2);
      min-height: 32px;
      border: 0;
      border-radius: var(--ui-radius-sm);
      background: transparent;
      color: var(--ui-text-primary);
      cursor: pointer;
      font-size: var(--ui-font-size-sm);
      font-weight: 500;
      line-height: 1;
      padding: var(--ui-space-2) var(--ui-space-2);
      white-space: nowrap;
    }

    :host button:hover {
      background: var(--ui-surface-hover);
    }

    :host button.active {
      background: var(--ui-accent-soft, var(--ui-accent-subtle));
      color: var(--ui-accent-active);
    }

    .group button {
      border-radius: var(--ui-radius-sm);
    }

    .group button + button {
      border-left: 0;
    }

    :host .more {
      border: 0;
      border-radius: var(--ui-radius-sm);
    }

    :host button.danger {
      color: var(--ui-danger);
    }

    :host {
      --_ui-default-icon-size: var(--ui-editor-toolbar-icon-size, 1rem);
      --_ui-default-icon-stroke-width: var(--ui-editor-toolbar-icon-stroke-width, 1.75);
    }

    .chevron {
      display: inline-flex;
      --_ui-default-icon-size: 0.875rem;
    }

    :host .icon-button {
      width: 32px;
      padding-inline: 0;
    }

    .menu {
      box-sizing: border-box;
      position: absolute;
      top: calc(100% + var(--ui-space-2));
      right: 0;
      min-width: 12rem;
      max-width: min(17rem, calc(100vw - 24px));
      padding: var(--ui-space-1);
      background: var(--ui-surface);
      border: 1px solid var(--ui-border-strong);
      border-radius: var(--ui-radius-md);
      box-shadow: var(--ui-shadow-lg, 0 10px 15px -3px rgb(0 0 0 / 0.1));
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 2;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    .menu-section + .menu-section {
      margin-top: var(--ui-space-1);
      padding-top: var(--ui-space-1);
      border-top: 1px solid var(--ui-border-divider);
    }

    .menu-heading {
      padding: var(--ui-space-1) var(--ui-space-2);
      font-size: var(--ui-font-size-2xs);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ui-text-muted);
    }

    .menu button {
      display: flex;
      justify-content: flex-start;
      width: 100%;
      text-align: left;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2px;
    }

    :host .swatch-button {
      gap: var(--ui-space-1);
      justify-content: flex-start;
    }

    .swatch {
      width: 14px;
      height: 14px;
      flex: 0 0 14px;
      border: 1px solid color-mix(in srgb, var(--ui-border) 80%, #000);
      border-radius: var(--ui-radius-round);
      background: var(--_swatch);
    }

    .swatch.default {
      background:
        linear-gradient(135deg, transparent 44%, var(--ui-danger) 46% 54%, transparent 56%),
        var(--ui-surface);
    }

    .swatch-button.selected {
      background: var(--ui-accent-soft, var(--ui-accent-subtle));
    }

    :host[hidden] {
      display: none;
    }
  </style>
</template>
