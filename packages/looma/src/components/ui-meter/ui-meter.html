<template component="ui-meter">
  <defs>
    <prop name="variant" type="keyword" values="progress, distribution" default="progress"
    >progress measures one value against max. distribution shows mutually exclusive parts of a whole as a full-width proportional bar; it uses parts rather than
      value/max and is an image, not a progress reading.</prop>
    <prop name="parts" type="list" default="[]">Categories in display order for distribution. Positive finite values determine each share without rounding; zero
      and negative values draw nothing. Supply label and valueText to describe every category, and a visible text legend so colour is never the only
      explanation.
      <prop type="object">
        <prop name="value" required type="number"></prop>
        <prop name="color" required type="string"
        >A CSS category colour, including a theme variable. This names category identity independently of status tones.</prop>
      </prop>
    </prop>
    <prop name="value" type="number" default="0"
    >How far along, from 0 to max. A value outside that range draws at the nearer end: below 0 is an empty track, above max a full bar.</prop>
    <prop name="max" type="number" default="1"
    >The value of a full bar, as on a native meter: 1 for a fraction, or the whole amount (a total, a count of items) with value as the part of it. Must be
      above 0; otherwise the bar is empty.</prop>
    <prop name="tone" type="keyword" values="neutral, accent, accent-secondary, accent-tertiary, info, success, warning, danger" default="neutral"
    >Which colour the filled part speaks in, as on Badge: neutral is a quiet grey, accent draws the eye, and info, success, warning, and danger mark a state
      (such as nothing yet, partial, complete, or needs attention). Colour alone says nothing to assistive technology or in forced colours, so say the state in
      valueText or in text beside the meter too. Supporting brand families use accent-secondary and accent-tertiary; their usable colors derive from the theme,
      and unset families follow the primary accent.</prop>
    <prop name="size" type="keyword" values="sm, md" default="md"
    >Thickness. sm is a thin bar that sits in a line of text, such as a table cell beside an amount; md stands on its own.</prop>
    <prop name="segments" type="number" default="0"
    >How many equal segments to draw the bar as, from 2 to 12, for a count of steps: set max to the same number and value to the steps done, so whole segments
      fill, and say the step in valueText ("Shipped, step 4 of 6"). A value between steps fills part of a segment. 0 draws one continuous bar, as does any other
      number.</prop>
    <prop name="label" type="string" default=""
    >What the meter measures, as its accessible name ("Collected"). Leave it empty only when aria-labelledby names the meter from visible text.</prop>
    <prop name="valueText" type="string" default=""
    >The value as assistive technology reads it ("$750 of $1,240 collected", "3 of 5 done, overdue"). Empty reads the whole percentage in the current
      locale.</prop>
    <!-- Derived as it renders, so every render path, a server render included, draws the bar and states its value without JavaScript. -->
    <computed name="amount" from="clamp(0, $value, $max)"></computed>
    <computed name="percent" from="{ true: $amount / $max * 100, false: 0 }[concat($max > 0)]"></computed>
  </defs>
  <span
    from:role="{ true: 'img', false: 'meter' }[concat($variant = 'distribution')]"
    from:aria-valuemin="{ true: null, false: 0 }[concat($variant = 'distribution')]"
    from:aria-valuemax="{ true: null, false: $max }[concat($variant = 'distribution')]"
    from:aria-valuenow="{ true: null, false: $amount }[concat($variant = 'distribution')]"
    from:aria-valuetext="{ true: null, false: { true: $valueText, false: format($percent / 100, 'percent', { maximumFractionDigits: 0 }) }[concat($valueText != '')] }[concat($variant = 'distribution')]"
    from:aria-label="{ true: { true: concat($label, ': ', $valueText), false: $label }[concat($variant = 'distribution' and $valueText != '')], false: null }[concat($label != '')]"
    from:data-ui-meter-segments="{ true: $segments, false: null }[concat($variant = 'progress' and $segments > 1)]"
  >
    <span $if="$variant = 'progress'" class="fill" style:inline-size="concat($percent, '%')"></span>
    <template $if="$variant = 'distribution'">
      <template $each="part of $parts">
        <span
          $if="$part.value > 0 and $part.value - $part.value = 0"
          class="part"
          aria-hidden="true"
          style:flex-grow="$part.value"
          style:background-color="$part.color"
        ></span>
      </template>
    </template>
  </span>
  <style>
    /* How far along something is: a track, filled from the start in the tone's colour. The track is a
       quiet border colour, so an empty meter still shows; every tone's fill keeps 3:1 against the
       track and the page. */

    :host {
      --_meter-fill: var(--ui-text-muted);

      display: inline-block !important;
      flex: none;
      vertical-align: middle;
      inline-size: var(--ui-meter-inline-size, 8rem);
      max-inline-size: 100%;
      block-size: var(--ui-space-2);
      overflow: hidden;
      border-radius: var(--ui-radius-round);
      background: var(--ui-border);
      box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.1), inset 0 -1px rgb(255 255 255 / 0.22);
      /* Unseen until forced colours draw it, where the track's own colour is gone. */
      outline: var(--ui-border-width) solid transparent;
    }

    :host([size="sm"]) {
      inline-size: var(--ui-meter-inline-size, 5rem);
      block-size: var(--ui-space-1);
    }

    .fill {
      display: block !important;
      block-size: 100%;
      background-color: var(--_meter-fill);
      background-image: linear-gradient(to bottom, rgb(255 255 255 / 0.26), transparent 70%);
      box-shadow: inset 0 1px rgb(255 255 255 / 0.26), inset 0 -1px rgb(0 0 0 / 0.1);
    }

    :host([tone="accent-secondary"]) {
      --_meter-fill: var(--ui-accent-secondary-subtle-text);
    }

    :host([tone="accent-tertiary"]) {
      --_meter-fill: var(--ui-accent-tertiary-subtle-text);
    }

    :host([tone="accent"]) {
      --_meter-fill: var(--ui-accent-subtle-text);
    }

    :host([tone="info"]) {
      --_meter-fill: var(--ui-info-subtle-text);
    }

    :host([tone="success"]) {
      --_meter-fill: var(--ui-success-subtle-text);
    }

    :host([tone="warning"]) {
      --_meter-fill: var(--ui-warning-subtle-text);
    }

    :host([tone="danger"]) {
      --_meter-fill: var(--ui-danger-subtle-text);
    }

    /* Segments: the track and its fill show through a mask of equal segments with a gap between them.
       A mask over the whole meter, rather than one element per segment, because the expression
       language has no range to render N elements from, and one mask lines the fill up with the track
       for free. Each period is a segment and the gap after it; N periods span the track plus one
       trailing gap, so the segments sit symmetrically and right to left needs nothing of its own.
       The count arrives as an attribute, not an inline custom property (which would add a style
       attribute to every meter), so a continuous meter renders exactly as before, and the rules below
       turn it into a number. That caps it at 12, until attr() with a type reads any count in every engine. */
    :host[data-ui-meter-segments="2"] {
      --_segments: 2;
    }

    :host[data-ui-meter-segments="3"] {
      --_segments: 3;
    }

    :host[data-ui-meter-segments="4"] {
      --_segments: 4;
    }

    :host[data-ui-meter-segments="5"] {
      --_segments: 5;
    }

    :host[data-ui-meter-segments="6"] {
      --_segments: 6;
    }

    :host[data-ui-meter-segments="7"] {
      --_segments: 7;
    }

    :host[data-ui-meter-segments="8"] {
      --_segments: 8;
    }

    :host[data-ui-meter-segments="9"] {
      --_segments: 9;
    }

    :host[data-ui-meter-segments="10"] {
      --_segments: 10;
    }

    :host[data-ui-meter-segments="11"] {
      --_segments: 11;
    }

    :host[data-ui-meter-segments="12"] {
      --_segments: 12;
    }

    :host[data-ui-meter-segments] {
      --_meter-gap: var(--ui-space-1);
      --_meter-period: calc((100% + var(--_meter-gap)) / var(--_segments));
      --_meter-segment: calc(var(--_meter-period) - var(--_meter-gap));

      mask-image: repeating-linear-gradient(to right, #000 0 var(--_meter-segment), transparent 0 var(--_meter-period));
    }

    :host([size="sm"])[data-ui-meter-segments] {
      --_meter-gap: var(--ui-space-0-5);
    }

    /* A categorical distribution uses flex ratios, avoiding rounded percentages and retaining
       identical geometry before hydration. It has no progress mask or growing-value animation. */
    :host([variant="distribution"]) {
      display: flex !important;
      inline-size: 100%;
      block-size: var(--ui-space-4);
      gap: var(--ui-space-0-5) !important;
    }

    :host([variant="distribution"])[size="sm"] {
      block-size: var(--ui-space-2);
    }

    .part {
      flex-basis: 0;
      min-inline-size: 0;
      block-size: 100%;
    }

    @media (forced-colors: active) {
      .part {
        forced-color-adjust: none;
        background: CanvasText !important;
        outline: var(--ui-border-width) solid Canvas;
        outline-offset: calc(-1 * var(--ui-border-width));
      }
    }

    /* Forced colours drop backgrounds: draw the fill in the text colour inside the outlined track. */
    @media (forced-colors: active) {
      .fill {
        forced-color-adjust: none;
        background: CanvasText;
      }

      /* The mask clips the track's outline, so each segment draws its own: the inset shadow draws the
         top and bottom edges and the gradient the ends. */
      :host[data-ui-meter-segments] {
        forced-color-adjust: none;
        background: repeating-linear-gradient(
          to right,
          CanvasText 0 1px,
          Canvas 0 calc(var(--_meter-segment) - 1px),
          CanvasText 0 var(--_meter-segment),
          transparent 0 var(--_meter-period)
        );
        box-shadow: inset 0 0 0 1px CanvasText;
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
