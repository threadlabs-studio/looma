<link rel="component" href="../ui-icon/ui-icon.html">
<template component="ui-editor-table-overlay" controller="./ui-editor-table-overlay.js">
  <defs>
    <prop name="open" type="boolean" default="false">Shows the controls after the editor has supplied current geometry.</prop>
    <prop
      name="geometry"
      type="object"
    >
      <prop name="rowBoundaries" required type="array">
        <prop type="number"></prop>
      </prop>
      <prop name="columnBoundaries" required type="array">
        <prop type="number"></prop>
      </prop>
      <prop name="activeCell" required nullable type="object">
        <prop name="left" required type="number"></prop>
        <prop name="top" required type="number"></prop>
        <prop name="width" required type="number"></prop>
        <prop name="height" required type="number"></prop>
        <prop name="rowIndex" required type="integer"></prop>
        <prop name="columnIndex" required type="integer"></prop>
      </prop>
      <prop name="hoveredCell" nullable type="object">
        <prop name="left" required type="number"></prop>
        <prop name="top" required type="number"></prop>
        <prop name="width" required type="number"></prop>
        <prop name="height" required type="number"></prop>
        <prop name="rowIndex" required type="integer"></prop>
        <prop name="columnIndex" required type="integer"></prop>
      </prop>
      The authoritative editor-measured table boundaries and active or hovered cell rectangles.
    </prop>
    <state
      name="rows"
      type="array"
      :value="[]"
    >
      <prop type="object">
        <prop name="key" required type="string"></prop>
        <prop name="index" required type="integer"></prop>
        <prop name="offset" required type="string"></prop>
        <prop name="affordance" required type="keyword" values="insert-row, insert-column"></prop>
        <prop name="action" required type="keyword" values="add-row-before, add-row-after, add-column-before, add-column-after"></prop>
        <prop name="label" required type="string"></prop>
      </prop>
    </state>
    <state
      name="cols"
      type="array"
      :value="[]"
    >
      <prop type="object">
        <prop name="key" required type="string"></prop>
        <prop name="index" required type="integer"></prop>
        <prop name="offset" required type="string"></prop>
        <prop name="affordance" required type="keyword" values="insert-row, insert-column"></prop>
        <prop name="action" required type="keyword" values="add-row-before, add-row-after, add-column-before, add-column-after"></prop>
        <prop name="label" required type="string"></prop>
      </prop>
    </state>
    <state
      name="hovered"
      type="object"
      :value="null"
      nullable
    >
      <prop name="left" required type="number"></prop>
      <prop name="top" required type="number"></prop>
      <prop name="width" required type="number"></prop>
      <prop name="height" required type="number"></prop>
      <prop name="rowIndex" required type="integer"></prop>
      <prop name="columnIndex" required type="integer"></prop>
      <prop name="rowOffset" required type="string"></prop>
      <prop name="columnOffset" required type="string"></prop>
    </state>
    <state
      name="active"
      type="object"
      :value="null"
      nullable
    >
      <prop name="left" required type="number"></prop>
      <prop name="top" required type="number"></prop>
      <prop name="width" required type="number"></prop>
      <prop name="height" required type="number"></prop>
      <prop name="rowIndex" required type="integer"></prop>
      <prop name="columnIndex" required type="integer"></prop>
      <prop name="menuLeft" required type="string"></prop>
      <prop name="menuTop" required type="string"></prop>
    </state>
    <state name="activeKey" :value="''"></state>
    <event name="add-row-before" type="object({ boundaryIndex: integer })"></event>
    <event name="add-row-after" type="object({ boundaryIndex: integer })"></event>
    <event name="add-column-before" type="object({ boundaryIndex: integer })"></event>
    <event name="add-column-after" type="object({ boundaryIndex: integer })"></event>
    <event name="select-row" type="object({ rowIndex: integer, columnIndex: integer })"></event>
    <event name="select-column" type="object({ rowIndex: integer, columnIndex: integer })"></event>
    <event name="reorder-row" type="object({ fromIndex: integer, toIndex: integer })"></event>
    <event name="reorder-column" type="object({ fromIndex: integer, toIndex: integer })"></event>
    <event
      name="open-cell-menu"
      type="object({ rowIndex: integer, columnIndex: integer, anchor: object({ left: number, top: number, right: number, bottom: number }) })"
    ></event>
    <event
      name="open-row-menu"
      type="object({ rowIndex: integer, columnIndex: integer, anchor: object({ left: number, top: number, right: number, bottom: number }) })"
    ></event>
    <event
      name="open-column-menu"
      type="object({ rowIndex: integer, columnIndex: integer, anchor: object({ left: number, top: number, right: number, bottom: number }) })"
    ></event>
  </defs>
  <div aria-label="Table controls" :hidden="not open">
    <div class="rows">
      <div
        $each="control of rows"
        $key="control.key"
        class="control row"
        class:active="control.key = activeKey"
        style:top="control.offset"
        :data-control-key="control.key"
      >
        <span class="line" aria-hidden="true"></span>
        <span class="guide" data-ui-guide aria-hidden="true"></span>
        <button
          type="button"
          class="handle"
          :data-ui-affordance="control.affordance"
          :data-action="control.action"
          :data-boundary-index="control.index"
          :aria-label="control.label"
        >
          <ui-icon name="plus"></ui-icon>
          <span class="tooltip" role="tooltip" $value="control.label"></span>
        </button>
      </div>
    </div>
    <div class="cols">
      <div
        $each="control of cols"
        $key="control.key"
        class="control col"
        class:active="control.key = activeKey"
        style:left="control.offset"
        :data-control-key="control.key"
      >
        <span class="line" aria-hidden="true"></span>
        <span class="guide" data-ui-guide aria-hidden="true"></span>
        <button
          type="button"
          class="handle"
          :data-ui-affordance="control.affordance"
          :data-action="control.action"
          :data-boundary-index="control.index"
          :aria-label="control.label"
        >
          <ui-icon name="plus"></ui-icon>
          <span class="tooltip" role="tooltip" $value="control.label"></span>
        </button>
      </div>
    </div>
    <template $if="hovered">
      <button
        type="button"
        class="selector row"
        style:top="hovered.rowOffset"
        data-action="select-row"
        :data-row-index="hovered.rowIndex"
        :data-column-index="hovered.columnIndex"
        title="Drag row to reorder; click for actions"
        aria-label="Row actions"
      >
        <span class="glyph"><ui-icon name="grip-vertical"></ui-icon></span>
      </button>
      <button
        type="button"
        class="selector column"
        style:left="hovered.columnOffset"
        data-action="select-column"
        :data-row-index="hovered.rowIndex"
        :data-column-index="hovered.columnIndex"
        title="Drag column to reorder; click for actions"
        aria-label="Column actions"
      >
        <span class="glyph"><ui-icon name="grip-horizontal"></ui-icon></span>
      </button>
    </template>
    <button
      $if="active"
      type="button"
      class="cell-menu"
      style:left="active.menuLeft"
      style:top="active.menuTop"
      data-action="open-cell-menu"
      :data-row-index="active.rowIndex"
      :data-column-index="active.columnIndex"
      title="Cell actions"
      aria-label="Cell actions"
    >
      <ui-icon name="chevron-down"></ui-icon>
    </button>
    <span class="drop-indicator" data-drop-indicator hidden aria-hidden="true"></span>
  </div>
  <style>
    :host {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    :host {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .rows,
    .cols {
      pointer-events: none;
      position: absolute;
    }

    .rows {
      inset: 0;
      width: 100%;
    }

    .cols {
      inset: 0;
      height: 100%;
    }

    .control {
      position: absolute;
      z-index: 1;
      pointer-events: none;
    }

    .handle {
      position: absolute;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--ui-affordance-near-color, var(--ui-border-strong));
      border-radius: var(--ui-radius-round);
      background: color-mix(in srgb, var(--ui-surface-elevated) 96%, transparent);
      color: var(--ui-affordance-near-color, var(--ui-text-secondary));
      font: inherit;
      font-size: 16px;
      line-height: 1;
      box-shadow: var(--ui-shadow-xs, 0 1px 2px rgb(0 0 0 / 0.05));
      opacity: 0;
      scale: 0.72;
      transition:
        opacity var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease),
        scale var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease),
        color var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease),
        background-color var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease),
        border-color var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease);
      pointer-events: auto;
      cursor: pointer;
    }

    .handle {
      --_ui-default-icon-size: 14px;
      --_ui-default-icon-stroke-width: 2;
    }

    .handle[data-ui-proximity="near"],
    .control.active .handle,
    .handle:focus-visible {
      opacity: 1;
      scale: 1;
    }

    .control.active .handle,
    .handle:focus-visible {
      border-color: var(--ui-affordance-direct-color, var(--ui-accent-solid));
      background: var(--ui-affordance-direct-color, var(--ui-accent-solid));
      color: var(--ui-text-on-accent);
      box-shadow: var(--ui-shadow-sm, 0 1px 3px rgb(0 0 0 / 0.1));
    }

    .handle:focus-visible,
    .selector:focus-visible,
    .cell-menu:focus-visible {
      outline: 2px solid var(--ui-focus-ring);
      outline-offset: 2px;
    }

    .control.row {
      left: 0;
      width: 100%;
      height: 0;
    }

    .control.row .handle {
      top: -12px;
      left: -30px;
    }

    .control.col {
      top: 0;
      width: 0;
      height: 100%;
    }

    .control.col .handle {
      top: -30px;
      left: -12px;
    }

    .line {
      position: absolute;
      background: var(--ui-affordance-direct-color, var(--ui-accent-solid));
      opacity: 0;
      transition: opacity var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease);
    }

    .control.row .line {
      inset: -1px 0 auto;
      height: 2px;
    }

    .control.col .line {
      inset: 0 auto 0 -1px;
      width: 2px;
    }

    .control.active .line {
      opacity: 0.8;
    }

    .guide {
      position: absolute;
      width: var(--ui-affordance-guide-size);
      height: var(--ui-affordance-guide-size);
      border-radius: var(--ui-radius-round);
      background: var(--ui-affordance-guide-color, var(--ui-border-strong));
      opacity: calc(var(--ui-affordance-guide-opacity) * var(--ui-affordance-scope-guide, 1));
      transition: opacity var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease);
    }

    .control.row .guide {
      left: -10px;
      top: -2px;
    }

    .control.col .guide {
      left: -2px;
      top: -10px;
    }

    .control:has(.handle[data-ui-proximity="near"]) .guide,
    .control.active .guide {
      opacity: 0;
    }

    .tooltip {
      position: absolute;
      z-index: 2;
      top: calc(100% + 6px);
      left: 50%;
      width: max-content;
      max-width: 14rem;
      padding: var(--ui-space-1) var(--ui-space-2);
      border-radius: var(--ui-radius-sm);
      background: var(--ui-text-primary);
      color: var(--ui-surface-elevated);
      font-size: var(--ui-font-size-xs);
      font-weight: var(--ui-font-medium);
      line-height: var(--ui-line-height-md);
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease);
      pointer-events: none;
    }

    .control.row .tooltip {
      top: 50%;
      left: auto;
      right: calc(100% + 8px);
      transform: translateY(-50%);
    }

    .control.active .tooltip,
    .handle:focus-visible .tooltip {
      opacity: 1;
    }

    .selector,
    .cell-menu {
      position: absolute;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ui-text-secondary);
      box-shadow: none;
      pointer-events: auto;
      cursor: pointer;
      transition:
        color var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease),
        background-color var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease),
        border-color var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease),
        box-shadow var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease);
    }

    .selector:hover,
    .cell-menu:hover {
      background: var(--ui-surface-muted);
      color: var(--ui-text-primary);
      box-shadow: var(--ui-shadow-xs, 0 1px 2px rgb(0 0 0 / 0.05));
    }

    .selector {
      border-radius: var(--ui-radius-round);
      touch-action: none;
      cursor: grab;
    }

    .selector:active {
      cursor: grabbing;
    }

    .selector::before {
      content: "";
      position: absolute;
      inset: 50% auto auto 50%;
      border-radius: var(--ui-radius-round);
      background: var(--ui-affordance-guide-color, var(--ui-border-strong));
      opacity: calc(var(--ui-affordance-guide-opacity) * var(--ui-affordance-scope-guide, 1));
      transform: translate(-50%, -50%);
      transition: opacity var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease);
      pointer-events: none;
    }

    .selector .glyph {
      display: block;
      width: 14px;
      height: 14px;
      --_ui-default-icon-size: 14px;
      --_ui-default-icon-stroke-width: 2;
      opacity: 0;
      transform: scale(0.72);
      transition:
        opacity var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease),
        transform var(--ui-affordance-motion, var(--ui-motion-fast)) var(--ui-motion-ease);
    }

    .selector:hover::before,
    .selector:focus-visible::before {
      opacity: 0;
    }

    .selector:hover .glyph,
    .selector:focus-visible .glyph {
      opacity: 1;
      transform: scale(1);
    }

    .selector.row {
      left: -9px;
      width: 18px;
      height: 32px;
      transform: translateY(-50%);
    }

    .selector.row::before {
      width: 2px;
      height: 16px;
    }

    .selector.column {
      top: -9px;
      width: 32px;
      height: 18px;
      transform: translateX(-50%);
    }

    .selector.column::before {
      width: 16px;
      height: 2px;
    }

    @media (hover: none), (pointer: coarse) {
      .selector::before {
        opacity: 0;
      }

      .selector .glyph {
        opacity: 1;
        transform: none;
      }
    }

    .cell-menu {
      width: 24px;
      height: 24px;
      border-radius: var(--ui-radius-sm);
      background: color-mix(in srgb, var(--ui-surface-muted) 78%, transparent);
    }

    .cell-menu {
      --_ui-default-icon-size: 15px;
      --_ui-default-icon-stroke-width: 2;
    }

    .drop-indicator {
      position: absolute;
      z-index: 3;
      background: var(--ui-accent-solid);
      box-shadow: 0 0 0 2px var(--ui-surface);
      pointer-events: none;
    }

    .drop-indicator.row {
      left: 0;
      width: 100%;
      height: 2px;
    }

    .drop-indicator.column {
      top: 0;
      width: 2px;
      height: 100%;
    }

    .drop-indicator[hidden] {
      display: none;
    }

    :host[hidden] {
      display: none;
    }
  </style>
</template>
