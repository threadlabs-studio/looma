<!--
title: Cell content
description: A column's cell template renders once per row and reads the row as $row. A header slot replaces the header text with markup.
-->
<ui-data-table caption="Team" rows="[{ id: 1, name: 'Ada Park', role: 'Design', active: true }, { id: 2, name: 'Ben Ortiz', role: 'Engineering', active: false }]">
  <ui-column field="name" header="Name"></ui-column>
  <ui-column field="role" header="Role"></ui-column>
  <ui-column>
    <abbr slot="header" title="Signed in this week">Active</abbr>
    <template slot="cell"><ui-badge from:tone="$row.active ? 'success' : 'neutral'">{$row.active ? 'Active' : 'Away'}</ui-badge></template>
  </ui-column>
</ui-data-table>
