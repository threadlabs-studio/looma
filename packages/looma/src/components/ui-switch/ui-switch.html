<template component="ui-switch" controller="./ui-switch.js">
  <defs>
    <prop name="checked" type="boolean" default="false">Whether the switch is checked initially or when set externally. A form reset returns it to this.</prop>
    <prop name="disabled" type="boolean" default="false">Disables the native switch, so it cannot be toggled or focused.</prop>
    <prop name="required" type="boolean" default="false">Marks the native switch required, so native form validation treats it as invalid until it is on.</prop>
    <prop name="name" type="string" default=""
    >The native name the switch submits under: a form that contains it sends name=value while it is on, and nothing while it is off, as a native checkbox does.
      Left empty, it takes no part in form submission.</prop>
    <prop name="value" type="string" default="on"
    >The value a form submits under name while the switch is on, also reported in the change event's detail so one handler can tell switches apart. on by
      default, as on a native checkbox.</prop>
    <prop name="size" type="sm | md | lg" default="md"
    >Aligns the switch with fields and buttons of the same size. It keeps its track size; the label takes that size's field type size and its first line centres
      in that control height (sm 2rem, lg 3rem by default), so in a row of inputs, selects, and buttons of one size it shares their height and their text
      baseline. Under a coarse pointer an sm row grows to the 44px touch minimum, as they do. md is the standard layout.</prop>
    <state name="internalChecked" :value="false"></state>
    <event name="change" type="object({ checked: boolean, value: string, trigger: keyboard | pointer | programmatic })"></event>
  </defs>
  <label>
    <input type="checkbox" role="switch" $ref="input" .checked="internalChecked" :disabled="disabled" :required="required" :name="name" :value="value">
    <span class="text">
      <span class="label"><slot></slot></span>
      <span class="description" $ref="description" aria-hidden="true"><slot name="description"></slot></span>
    </span>
  </label>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-switch-gap {
      syntax: "*";
      inherits: false;
    }
    @property --ui-switch-track-height {
      syntax: "*";
      inherits: false;
    }
    @property --ui-switch-track-width {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Hooks do not inherit, so the parts below read them from the root. */
      --_ui-switch-track-width: var(--ui-switch-track-width);
      --_ui-switch-track-height: var(--ui-switch-track-height);

      display: inline-flex;
      align-items: flex-start;
      gap: var(--ui-switch-gap, var(--ui-space-2));
      max-inline-size: 100%;
      color: var(--ui-text-primary);
      cursor: pointer;
    }

    /* The label, and under it an optional line saying what the choice means. */
    .text {
      display: flex;
      flex-direction: column;
      gap: var(--ui-space-1);
      min-inline-size: 0;
    }

    .label {
      min-inline-size: 0;
      line-height: var(--ui-line-height-md);
    }

    .description {
      color: var(--ui-text-secondary);
      font-size: var(--ui-font-size-sm);
      line-height: var(--ui-line-height);
    }

    .description:empty {
      display: none;
    }

    input {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      flex: 0 0 auto;
      width: var(--_ui-switch-track-width, 2.5rem);
      height: var(--_ui-switch-track-height, 1.5rem);
      padding: 0;
      border: 1px solid var(--ui-control-border-hover, var(--ui-border-strong));
      border-radius: 999px;
      background: var(--ui-control-surface, var(--ui-surface-default));
      box-shadow: inset 0 1px 2px color-mix(in srgb, var(--ui-text-primary) 10%, transparent);
      cursor: pointer;
      transition: background-color var(--ui-motion-fast) var(--ui-motion-ease), border-color var(--ui-motion-fast) var(--ui-motion-ease);
      margin: 0;
    }

    input::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 1rem;
      height: 1rem;
      border-radius: 999px;
      background: var(--ui-text-secondary);
      box-shadow: var(--ui-shadow-xs);
      transition: transform var(--ui-motion-fast) var(--ui-motion-ease);
    }

    input:checked {
      background: var(--ui-accent-solid);
      border-color: var(--ui-accent-solid);
    }

    input:checked::after {
      transform: translateX(1rem);
      background: var(--ui-text-on-accent);
    }

    input:focus-visible {
      outline: 2px solid var(--ui-focus-ring, var(--ui-accent-solid));
      outline-offset: 2px;
    }

    :host-state([disabled]) {
      color: var(--ui-disabled-text);
      cursor: not-allowed;
    }
    :host-state([disabled]) input {
      border-color: var(--ui-border-default);
      background: var(--ui-control-surface-disabled, var(--ui-surface-muted));
      cursor: not-allowed;
    }

    @media (prefers-reduced-motion: reduce) {
      input, input::after {
        transition: none;
      }
    }

    /* A sized switch keeps its track and aligns instead: the label takes that size's field type size,
       and the first line centres in that control height, so the label shares a row's baseline.
       Multi-line labels and descriptions still grow downward from that first line. */
    :host-state([size="sm"]) {
      --_font: var(--ui-font-size-sm);
      --_row: var(--ui-control-size-sm);
    }

    :host-state([size="lg"]) {
      --_font: var(--ui-font-size-md);
      --_row: var(--ui-control-size-lg);
    }

    :host-state([size="sm"]),
    :host-state([size="lg"]) {
      --_line: calc(var(--_font) * var(--ui-line-height-md));
      font-size: var(--_font);
      padding-block: calc((var(--_row) - var(--ui-switch-track-height, 1.5rem)) / 2);
    }

    /* The label centres on the track. */
    :host-state([size="sm"]) .text,
    :host-state([size="lg"]) .text {
      margin-top: calc((var(--_ui-switch-track-height, 1.5rem) - var(--_line)) / 2);
    }

    @media (pointer: coarse) {
      :host-state([size="sm"]) {
        --_row: var(--ui-control-min-block-size);
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
