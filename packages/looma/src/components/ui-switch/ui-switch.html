<template component="ui-switch" module="./ui-switch.js">
  <defs>
    <prop name="checked" type="boolean" default="false">Whether the switch is checked initially or when set externally. A form reset returns it to this.</prop>
    <prop name="disabled" type="boolean" default="false">Disables the native switch, so it cannot be toggled or focused.</prop>
    <prop name="required" type="boolean" default="false">Marks the native switch required, so native form validation treats it as invalid until it is on.</prop>
    <prop name="name" type="string" default=""
    >The native name the switch submits under: a form that contains it sends name=value while it is on, and nothing while it is off, as a native checkbox does.
      Left empty, it takes no part in form submission.</prop>
    <prop name="value" type="string" default="on"
    >The value a form submits under name while the switch is on, also reported in the change event's detail so one handler can tell switches apart. on by
      default, as on a native checkbox.</prop>
    <prop name="size" type="keyword" values="sm, md, lg" default="md"
    >Aligns the switch with fields and buttons of the same size. It keeps its track size; the label takes that size's field type size and its first line centres
      in that control height (sm 2rem, lg 3rem by default), so in a row of inputs, selects, and buttons of one size it shares their height and their text
      baseline. Touch input keeps the same visible alignment. md is the standard layout.</prop>
    <state type="boolean" name="internalChecked" value="false"></state>
    <event name="change" type="object">
      <prop name="checked" required type="boolean"></prop>
      <prop name="value" required type="string"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
  </defs>
  <label>
    <input
      type="checkbox"
      role="switch"
      $ref="input"
      .checked="$internalChecked"
      from:disabled="$disabled"
      from:required="$required"
      from:name="$name"
      from:value="$value"
    >
    <span class="text">
      <span class="label"><slot></slot></span>
      <span class="description" $ref="description" aria-hidden="true"><slot name="description"></slot></span>
    </span>
  </label>
  <style>
    :host {
      /* Resolve shared part values at the component root. */
      --_ui-switch-track-width: var(--ui-switch-track-width, var(--ui-choice-track-width));
      --_ui-switch-track-height: var(--ui-switch-track-height, var(--ui-choice-track-height));

      --_thumb: calc(var(--_ui-switch-track-height) * 2 / 3);
      --_inset: calc((var(--_ui-switch-track-height) - var(--_thumb)) / 2 - var(--ui-border-width));

      display: inline-flex !important;
      align-items: flex-start !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      padding: 0 !important;
      line-height: var(--ui-line-height-md) !important;
      gap: var(--ui-switch-gap, var(--ui-space-2)) !important;
      max-inline-size: 100%;
      color: var(--ui-text-primary);
      cursor: pointer;
    }

    /* The label, and under it an optional line saying what the choice means. */
    .text {
      font: inherit !important;
      align-self: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      gap: var(--ui-space-1) !important;
      min-inline-size: 0;
    }

    .label {
      min-inline-size: 0;
      font: inherit !important;
      line-height: var(--ui-line-height-md) !important;
      padding-block: max(0px, calc((var(--_ui-switch-track-height, 1.5rem) - 1lh) / 2)) !important;
    }

    .description {
      color: var(--ui-text-secondary);
      font-size: var(--ui-font-size-sm);
      line-height: var(--ui-line-height);
    }

    .description:empty {
      display: none !important;
    }

    input {
      font: inherit !important;
      box-sizing: border-box !important;
      align-self: auto !important;
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      flex: 0 0 auto;
      width: var(--_ui-switch-track-width, 2.5rem);
      height: var(--_ui-switch-track-height, 1.5rem);
      padding: 0 !important;
      border: var(--ui-border-width) solid var(--ui-control-border, var(--ui-border-strong));
      border-radius: var(--ui-radius-round);
      background-color: var(--ui-control-surface, var(--ui-surface-default));
      background-image: var(--ui-surface-highlight, none);
      box-shadow: var(--ui-control-inset);
      cursor: pointer;
      transition: background-color var(--ui-motion-base) var(--ui-motion-ease), border-color var(--ui-motion-base) var(--ui-motion-ease);
      margin: max(0px, calc((1lh - var(--_ui-switch-track-height, 1.5rem)) / 2)) 0 0 !important;
    }

    input::after {
      content: "";
      position: absolute;
      top: var(--_inset);
      left: var(--_inset);
      width: var(--_thumb);
      height: var(--_thumb);
      border-radius: var(--ui-radius-round);
      background-color: var(--ui-text-secondary);
      background-image: var(--ui-knob-highlight, none);
      box-shadow: var(--ui-shadow-xs);
      transition: transform var(--ui-motion-base) var(--ui-motion-ease), background-color var(--ui-motion-base) var(--ui-motion-ease);
    }

    input:checked {
      background-color: var(--ui-accent-solid);
      background-image: var(--ui-accent-highlight, none);
      border-color: var(--ui-accent-solid);
    }

    input:checked::after {
      transform: translateX(calc(var(--_ui-switch-track-width) - var(--_ui-switch-track-height)));
      background-color: var(--ui-text-on-accent);
      background-image: var(--ui-knob-on-accent-highlight, none);
    }

    @media (hover: hover) and (forced-colors: none) {
      :host:hover input:enabled {
        --_choice-hover-wash: var(--ui-neutral-wash-hover);
        background-image:
          linear-gradient(var(--_choice-hover-wash), var(--_choice-hover-wash)),
          var(--ui-surface-highlight, linear-gradient(transparent, transparent));
      }

      :host:hover input:enabled:not([aria-invalid="true"]) {
        border-color: var(--ui-control-border-hover, var(--ui-border-strong));
      }

      :host:hover input:enabled:checked {
        background-color: var(--ui-choice-hover-surface);
        background-image: var(--ui-choice-hover-highlight, none);
      }

      :host:hover input:enabled:checked:not([aria-invalid="true"]) {
        border-color: var(--ui-choice-hover-surface);
      }
    }

    input:focus-visible {
      outline: var(--ui-focus-width) solid var(--ui-focus-ring, var(--ui-accent-solid));
      outline-offset: var(--ui-focus-width);
    }

    :host([disabled]) {
      color: var(--ui-disabled-text);
      cursor: not-allowed;
    }
    :host([disabled]) .description {
      color: var(--ui-disabled-text);
    }
    :host([disabled]) input {
      border-color: var(--ui-disabled-border);
      background-color: var(--ui-disabled-surface);
      background-image: none;
      box-shadow: none;
      cursor: not-allowed;
    }

    :host([disabled]) input::after {
      background-color: var(--ui-disabled-text);
      background-image: none;
      box-shadow: none;
    }

    @media (prefers-reduced-motion: reduce) {
      input, input::after {
        transition: none;
      }
    }

    /* A sized switch keeps its track and aligns instead: the label takes that size's field type size,
       and the first line centres in that control height, so the label shares a row's baseline.
       Multi-line labels and descriptions still grow downward from that first line. */
    :host([size="sm"]) {
      --_font: var(--ui-font-size-sm);
      --_row: var(--ui-control-size-sm);
    }

    :host([size="lg"]) {
      --_font: var(--ui-font-size-md);
      --_row: var(--ui-control-size-lg);
    }

    :host([size="sm"]),
    :host([size="lg"]) {
      --_line: calc(var(--_font) * var(--ui-line-height-md));
      font-size: var(--_font);
      padding-block: max(0px, calc((var(--_row) - max(var(--_line), var(--_ui-switch-track-height, 1.5rem))) / 2)) !important;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
