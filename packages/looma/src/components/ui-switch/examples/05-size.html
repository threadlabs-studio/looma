<!--
title: size
description: size="sm" keeps the switch's track and centres its label in the small control height, in the small controls' type size, so it lines up with a small button.
-->
<ui-cluster gap="s" align="center">
  <ui-switch size="sm">Switch</ui-switch>
  <ui-button size="sm">Small button</ui-button>
</ui-cluster>
