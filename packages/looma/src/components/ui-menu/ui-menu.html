<template component="ui-menu" module="./ui-menu.js">
  <defs>
    <prop name="density" type="keyword" values="comfortable, compact" default="comfortable"
    >Compact trades padding and type size for rows that fit more on screen.</prop>
    <prop name="icons" type="boolean" default="false"
    >Reserves a fixed icon column in every item, including items without an icon. Supply item icons through their icon slot.</prop>
    <prop name="size" type="keyword" values="sm, md" default="md"
    >sm sizes the menu to a small trigger, such as an xs or sm button: smallest text, short rows, a small check, and a narrower minimum width. md is the
      standard size.</prop>
    <prop name="open" type="boolean" default="false">Whether the menu is open initially or when set externally.</prop>
    <prop name="inline" type="boolean" default="false">Displays the menu in the page flow without an overlay or trigger, for an embedded list of actions.</prop>
    <prop name="for" type="string" default="">ID of the control that toggles and anchors the menu.</prop>
    <prop name="placement" type="string" default="bottom-start">Positions an associated menu relative to its trigger.</prop>
    <state type="boolean" name="internalOpen" value="false"></state>
    <event name="select" type="object">
      <prop name="value" required type="string"></prop>
      <prop name="checked" type="boolean"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
    <event name="open" type="object">
      <prop name="open" required type="boolean"></prop>
      <prop name="reason" required type="keyword" values="action, programmatic"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
    <event
      name="close"
      type="object"
    >
      <prop name="open" required type="boolean"></prop>
      <prop name="reason" required type="keyword" values="action, programmatic, light-dismiss, escape"></prop>
      <prop name="trigger" required type="keyword" values="keyboard, pointer, programmatic"></prop>
    </event>
  </defs>
  <div role="menu" aria-orientation="vertical"><div class="surface"><slot></slot></div></div>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-menu-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-menu-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-menu-radius {
      syntax: "*";
      inherits: false;
    }
    @property --ui-menu-shadow {
      syntax: "*";
      inherits: false;
    }
    @property --ui-menu-viewport-gap {
      syntax: "*";
      inherits: false;
    }

    /* Compact sets its items' defaults, so nothing has to rescale a global; an item's own hooks
       still win. */
    :host([density="compact"]) {
      --_ui-default-menu-item-padding-block: var(--ui-space-1);
      --_ui-default-menu-item-padding-inline: var(--ui-space-2);
      --_ui-default-menu-item-font-size: var(--ui-font-size-sm);
      --_ui-default-menu-item-radius: var(--ui-radius-sm);
      padding: var(--ui-space-1) !important;
      gap: 0 !important;
    }

    /* Small follows its trigger down: an item's own hooks still win. */
    :host([size="sm"]) {
      --_ui-default-menu-item-padding-block: var(--ui-space-0-5);
      --_ui-default-menu-item-padding-inline: var(--ui-space-2);
      --_ui-default-menu-item-font-size: var(--ui-font-size-xs);
      --_ui-default-menu-item-radius: var(--ui-radius-sm);
      --_ui-default-menu-item-min-block-size: 1.5rem;
      --_ui-default-menu-indicator-size: 0.75rem;
      min-inline-size: min(8rem, calc(100vw - var(--ui-menu-viewport-gap, var(--ui-space-2)) * 2));
      padding: var(--ui-space-1) !important;
      gap: 0 !important;
    }

    :host([icons]) {
      --_ui-default-menu-icon-display: inline-flex;
    }

    :host {
      --_ui-material-scale: 0.28;
      --_ui-menu-surface: var(--ui-menu-surface);
      --_ui-menu-border: var(--ui-menu-border);
      --_ui-menu-radius: var(--ui-menu-radius);
      --_ui-menu-shadow: var(--ui-menu-shadow);
      /* A menu nested in a compact one starts again from its own density. */
      --_ui-default-menu-item-padding-block: initial;
      --_ui-default-menu-item-padding-inline: initial;
      --_ui-default-menu-item-font-size: initial;
      --_ui-default-menu-item-radius: initial;
      --_ui-default-menu-item-min-block-size: initial;
      --_ui-default-menu-indicator-size: initial;
      --_ui-default-menu-icon-display: none;
      display: flex !important;
      flex-direction: column !important;
      box-sizing: border-box !important;
      inline-size: max-content;
      min-inline-size: min(12rem, calc(100vw - var(--ui-menu-viewport-gap, var(--ui-space-2)) * 2));
      max-inline-size: calc(100vw - var(--ui-menu-viewport-gap, var(--ui-space-2)) * 2);
      padding: 0 !important;
      border: 0;
      outline: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }

    .surface {
      display: flex !important;
      flex-direction: column !important;
      box-sizing: border-box !important;
      max-inline-size: inherit;
      padding: var(--ui-space-1) !important;
      background: var(--_ui-menu-surface, var(--ui-overlay-surface, var(--ui-surface-elevated)));
      border: var(--ui-border-width) solid var(--_ui-menu-border, var(--ui-overlay-border, var(--ui-border-strong)));
      border-radius: var(--_ui-menu-radius, var(--ui-overlay-radius, var(--ui-radius-lg)));
      box-shadow: var(--_ui-menu-shadow, var(--ui-overlay-shadow, var(--ui-elevation-overlay, var(--ui-shadow-lg))));
      max-block-size: inherit;
      overflow: auto;
    }

    /* Purpose and measured size shape one shared separation lever. The content plane stays opaque;
       transparency, saturation and edge light belong to the surrounding decorative material. */
    :host:not([inline]) .surface {
      --_ui-material-glassiness: clamp(0, var(--ui-glassiness, 0), 1);
      --_ui-material-separation: clamp(0, var(--ui-surface-separation, 0), 1);
      --_ui-material-active: clamp(0, calc((var(--_ui-material-glassiness) + var(--_ui-material-separation)) * 100000), 1);
      --_ui-material-rim: calc((var(--_ui-material-separation) + var(--_ui-material-glassiness) * 0.25) * var(--_ui-material-scale, 0.28) * 8px);
      --_ui-material-content-color: var(--_ui-menu-surface, var(--ui-material-content, var(--ui-overlay-surface, var(--ui-surface-elevated))));
      --_ui-material-rim-color: color-mix(in srgb, var(--ui-material-glass, var(--ui-surface-elevated)) calc(var(--_ui-material-active) * 100%), transparent);
      background:
        linear-gradient(var(--_ui-material-content-color), var(--_ui-material-content-color)) padding-box,
        linear-gradient(var(--_ui-material-rim-color), var(--_ui-material-rim-color)) border-box,
        var(--_ui-material-content-color) padding-box;
      border-width: calc(var(--ui-border-width) + var(--_ui-material-rim));
      border-color: var(
        --_ui-menu-border,
        color-mix(in oklab, var(--ui-overlay-border, var(--ui-border-strong)) calc((1 - var(--_ui-material-active)) * 100%), transparent)
      );
      box-shadow: var(
        --_ui-menu-shadow,
        var(
          --ui-overlay-shadow,
          0 calc(var(--_ui-material-separation) * var(--_ui-material-scale, 0.28) * 8px) calc(
            var(--_ui-material-separation) * var(--_ui-material-scale, 0.28) * 24px
          ) color-mix(in oklab, var(--ui-text-primary) 15%, transparent),
          inset 0 0 0 calc(var(--_ui-material-active) * var(--ui-border-width)) var(--ui-material-edge, var(--ui-border-strong)),
          var(--ui-elevation-overlay, var(--ui-shadow-lg))
        )
      );
      backdrop-filter: blur(calc(var(--_ui-material-glassiness) * var(--_ui-material-scale, 0.28) * 18px))
        saturate(calc(1 + var(--_ui-material-glassiness) * var(--_ui-material-scale, 0.28) * 0.18));
      -webkit-backdrop-filter: blur(calc(var(--_ui-material-glassiness) * var(--_ui-material-scale, 0.28) * 18px))
        saturate(calc(1 + var(--_ui-material-glassiness) * var(--_ui-material-scale, 0.28) * 0.18));
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      :host:not([inline]) .surface {
        background: var(--_ui-material-content-color);
      }
    }

    @media (prefers-reduced-transparency: reduce) {
      :host:not([inline]) .surface {
        background: var(--_ui-material-content-color);
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }

    @media (forced-colors: active) {
      :host:not([inline]) .surface {
        background: Canvas;
        border-color: CanvasText;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }

    .surface hr {
      align-self: stretch;
      block-size: 0;
      margin: var(--ui-space-1) 0 !important;
      border: 0;
      border-block-start: var(--ui-border-width) solid var(--ui-border-divider);
    }

    :host(:not(:state(internalOpen))):not(:host([inline])) {
      display: none !important;
    }

    :host[popover] {
      position: fixed;
      inset: auto;
      margin: 0 !important;
      overflow: visible;
      max-block-size: calc(100dvh - var(--ui-menu-viewport-gap, var(--ui-space-2)) * 2);
      opacity: 0;
      transform: translateY(-4px) scale(0.99);
      transition:
        opacity var(--ui-motion-fast) var(--ui-motion-ease),
        transform var(--ui-motion-fast) var(--ui-motion-ease),
        display var(--ui-motion-fast) allow-discrete,
        overlay var(--ui-motion-fast) allow-discrete;
    }

    :host[popover]:popover-open {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @starting-style {
      :host[popover]:popover-open {
        opacity: 0;
        transform: translateY(-4px) scale(0.99);
      }
    }

    :host[hidden] {
      display: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      :host[popover] {
        transition: none;
      }
    }
  </style>
</template>
