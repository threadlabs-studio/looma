<template component="ui-menu" controller="./ui-menu.js">
  <defs>
    <prop name="density" type="comfortable | compact" default="comfortable">Compact trades padding and type size for rows that fit more on screen.</prop>
    <prop name="open" type="boolean" default="false">Whether the menu is open initially or when set externally.</prop>
    <prop name="inline" type="boolean" default="false">Displays the menu in the page flow without an overlay or trigger, for an embedded list of actions.</prop>
    <prop name="for" type="string" default="">ID of the control that toggles and anchors the menu.</prop>
    <prop name="placement" type="string" default="bottom-start">Positions an associated menu relative to its trigger.</prop>
    <state name="internalOpen" :value="false"></state>
    <event name="select" type="object({ value: string, checked?: boolean, trigger: keyboard | pointer | programmatic })"></event>
    <event name="open" type="object({ open: boolean, reason: action | programmatic, trigger: keyboard | pointer | programmatic })"></event>
    <event
      name="close"
      type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"
    ></event>
  </defs>
  <div role="menu" aria-orientation="vertical"><div class="surface"><slot></slot></div></div>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-menu-surface {
      syntax: "*";
      inherits: false;
    }
    @property --ui-menu-border {
      syntax: "*";
      inherits: false;
    }
    @property --ui-menu-radius {
      syntax: "*";
      inherits: false;
    }
    @property --ui-menu-shadow {
      syntax: "*";
      inherits: false;
    }
    @property --ui-menu-viewport-gap {
      syntax: "*";
      inherits: false;
    }

    /* Compact sets its items' defaults, so nothing has to rescale a global; an item's own hooks
       still win. */
    :host-state([density="compact"]) {
      --_ui-default-menu-item-padding-block: var(--ui-space-1);
      --_ui-default-menu-item-padding-inline: var(--ui-space-2);
      --_ui-default-menu-item-font-size: var(--ui-font-size-sm);
      --_ui-default-menu-item-radius: var(--ui-radius-sm);
      padding: var(--ui-space-1);
      gap: 0;
    }

    :host {
      --_ui-menu-surface: var(--ui-menu-surface);
      --_ui-menu-border: var(--ui-menu-border);
      --_ui-menu-radius: var(--ui-menu-radius);
      --_ui-menu-shadow: var(--ui-menu-shadow);
      /* A menu nested in a compact one starts again from its own density. */
      --_ui-default-menu-item-padding-block: initial;
      --_ui-default-menu-item-padding-inline: initial;
      --_ui-default-menu-item-font-size: initial;
      --_ui-default-menu-item-radius: initial;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      inline-size: max-content;
      min-inline-size: min(12rem, calc(100vw - var(--ui-menu-viewport-gap, var(--ui-space-2)) * 2));
      max-inline-size: calc(100vw - var(--ui-menu-viewport-gap, var(--ui-space-2)) * 2);
      padding: 0;
      border: 0;
      outline: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      overflow: visible;
    }

    .surface {
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      max-inline-size: inherit;
      padding: var(--ui-space-1);
      background: var(--_ui-menu-surface, var(--ui-overlay-surface, var(--ui-surface-elevated)));
      border: 1px solid var(--_ui-menu-border, var(--ui-overlay-border, var(--ui-border-strong)));
      border-radius: var(--_ui-menu-radius, var(--ui-overlay-radius, var(--ui-radius-lg)));
      box-shadow: var(--_ui-menu-shadow, var(--ui-overlay-shadow, var(--ui-elevation-overlay, var(--ui-shadow-lg))));
      max-block-size: inherit;
      overflow: auto;
    }

    .surface hr {
      align-self: stretch;
      block-size: 0;
      margin: var(--ui-space-1) 0;
      border: 0;
      border-block-start: 1px solid var(--ui-border-divider);
    }

    :host:not(:host-state([internalOpen])):not(:host-state([inline])) {
      display: none;
    }

    :host[popover] {
      position: fixed;
      inset: auto;
      margin: 0;
      overflow: visible;
      max-block-size: calc(100dvh - var(--ui-menu-viewport-gap, var(--ui-space-2)) * 2);
      opacity: 0;
      transform: translateY(-4px) scale(0.99);
      transition:
        opacity var(--ui-motion-fast) var(--ui-motion-ease),
        transform var(--ui-motion-fast) var(--ui-motion-ease),
        display var(--ui-motion-fast) allow-discrete,
        overlay var(--ui-motion-fast) allow-discrete;
    }

    :host[popover]:popover-open {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    @starting-style {
      :host[popover]:popover-open {
        opacity: 0;
        transform: translateY(-4px) scale(0.99);
      }
    }

    :host[hidden] {
      display: none;
    }

    @media (prefers-reduced-motion: reduce) {
      :host[popover] {
        transition: none;
      }
    }
  </style>
</template>
