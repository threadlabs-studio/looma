<!--
title: Shapes and shared sizes
description: Square by default, circular with round. Each swatch matches the adjacent field. Click again or press Escape to close.
-->
<ui-stack>
  <ui-cluster wrap="nowrap"><ui-color-picker size="sm" value="#7c3aed" label="Small colour"></ui-color-picker><ui-input
      size="sm"
      value="#7c3aed"
      aria-label="Small field"
    ></ui-input></ui-cluster>
  <ui-cluster wrap="nowrap"><ui-color-picker value="#16a34a" label="Medium colour"></ui-color-picker><ui-input
      value="#16a34a"
      aria-label="Medium field"
    ></ui-input></ui-cluster>
  <ui-cluster wrap="nowrap"><ui-color-picker size="lg" round value="#2563eb" label="Large circular colour"></ui-color-picker><ui-input
      size="lg"
      value="#2563eb"
      aria-label="Large field"
    ></ui-input></ui-cluster>
</ui-stack>
