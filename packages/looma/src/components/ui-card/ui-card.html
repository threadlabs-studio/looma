<template component="ui-card">
  <defs>
    <prop name="variant" type="outlined | subtle | elevated" default="outlined"
    >The surface. outlined is a bordered panel on the page; subtle is a quiet filled one with no border, for supporting details set apart from the flow;
      elevated floats above the page with a shadow, for a view's one card, such as sign-in.</prop>
    <prop name="padding" type="sm | md | lg" default="md"
    >The space inside the card: sm is snug (0.75rem), md is the default (1.5rem), and lg is roomy (2rem).</prop>
    <prop name="tone" type="neutral | danger" default="neutral">danger draws an outlined card's border in the danger colour.</prop>
  </defs>
  <div as="div|section|article|aside"><slot></slot></div>
  <style>
    /* A surface that groups content. Its children stack with even space between them, so a card
       needs no layout of its own. */
    :host {
      display: flex;
      flex-direction: column;
      gap: var(--ui-space-4);
      box-sizing: border-box;
      min-inline-size: 0;
      padding: var(--ui-space-5);
      border: 1px solid var(--ui-border-default);
      border-radius: var(--ui-radius-lg);
      background: var(--ui-surface-raised);
      color: var(--ui-text-primary);
    }

    :host-state([padding="sm"]) {
      gap: var(--ui-space-2);
      padding: var(--ui-space-3);
    }

    :host-state([padding="lg"]) {
      padding: var(--ui-space-6);
    }

    :host-state([variant="subtle"]) {
      border-color: transparent;
      background: var(--ui-surface-muted);
    }

    :host-state([variant="elevated"]) {
      border-color: var(--ui-border-subtle);
      box-shadow: var(--ui-shadow-lg);
    }

    :host-state([tone="danger"]) {
      border-color: var(--ui-danger);
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
