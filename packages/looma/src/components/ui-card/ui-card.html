<template component="ui-card">
  <defs>
    <prop name="size" type="keyword" values="content, sm, md, lg" default="content"
    >Optional size preset. content keeps the existing intrinsic sizing; the other sizes constrain the surface for compact, medium, or large content.</prop>
    <prop name="variant" type="keyword" values="outlined, subtle, elevated" default="outlined"
    >The surface. outlined is a bordered panel on the page; subtle is a quiet filled one with no border, for supporting details set apart from the flow;
      elevated adds a subtle lift above the page, for a view's one card, such as sign-in. Treatment independently controls decorative material.</prop>
    <prop name="treatment" type="keyword" values="standard, expressive" default="standard"
    >How much of the theme's decorative material the surface expresses. standard preserves its restrained treatment; expressive uses the full material
      treatment. Its glass rim can transmit and frost the surrounding scene while content stays nearly opaque. Surface separation controls the rim,
      independently of frosting. This does not add elevation or require glass.</prop>
    <prop name="padding" type="keyword" values="xs, sm, md, lg" default="md"
    >The space inside the card: xs is compact (0.5rem), sm is snug (0.75rem), md is the default (1.5rem), and lg is roomy (2rem).</prop>
    <prop name="tone" type="keyword" values="neutral, accent, accent-secondary, accent-tertiary, info, success, warning, danger" default="neutral"
    >accent, info, success, warning and danger add a quiet semantic surface without changing card geometry. Row highlights follow the surface hue; action
      controls retain their own intent. Supporting brand families use accent-secondary and accent-tertiary; their usable colors derive from the theme, and unset
      families follow the primary accent.</prop>
    <prop name="as" type="keyword" values="div, section, article, aside" default="div"
    >The native element the card renders. Choose the one that names the content: a section of a page, a self-contained article, or an aside.</prop>
  </defs>
  <template $match>
    <section $when="$as = 'section'"><slot></slot></section>
    <article $when="$as = 'article'"><slot></slot></article>
    <aside $when="$as = 'aside'"><slot></slot></aside>
    <div $else><slot></slot></div>
  </template>
  <style>
    /* A surface that groups content. Its children stack with even space between them, so a card
       needs no layout of its own. */
    :host {
      --_ui-card-surface: var(--ui-surface-raised);
      --_ui-surface-text: initial;
      --_ui-card-elevation: 0 0 0 transparent;
      --_ui-selection-context-surface: initial;
      --_ui-selection-context-border: initial;
      --_ui-selection-context-text: initial;
      display: flex !important;
      flex-direction: column !important;
      gap: var(--ui-space-4) !important;
      box-sizing: border-box !important;
      min-inline-size: 0;
      padding: var(--ui-space-5) !important;
      border: var(--ui-border-width) solid var(--ui-border-strong);
      border-radius: var(--ui-radius-lg);
      background: var(--_ui-card-surface);
      color: var(--_ui-surface-text, var(--ui-text-primary));
    }

    :host([padding="xs"]) {
      gap: var(--ui-space-1) !important;
      padding: var(--ui-space-2) !important;
    }
    :host([padding="sm"]) {
      gap: var(--ui-space-2) !important;
      padding: var(--ui-space-3) !important;
    }

    :host([padding="lg"]) {
      padding: var(--ui-space-6) !important;
    }

    :host([variant="subtle"]) {
      border-color: transparent;
      --_ui-card-surface: var(--ui-surface-muted);
    }

    :host([variant="elevated"]) {
      --_ui-card-elevation: var(--ui-shadow-lg);
      border-color: var(--ui-border-subtle);
      box-shadow: var(--ui-shadow-lg);
    }

    :host([treatment="expressive"]) {
      --_ui-card-material-content: color-mix(in srgb, var(--_ui-card-surface) calc(var(--_ui-material-content-alpha, 1) * 100%), transparent);
      --_ui-panel-glass: clamp(0, var(--ui-glassiness, 0), 1);
      --_ui-panel-separation: clamp(0, var(--ui-surface-separation, 0), 1);
      --_ui-panel-rim: calc(var(--_ui-panel-separation) * 8px);
      border-width: calc(var(--ui-border-width) + var(--_ui-panel-rim));
      border-color: transparent;
      background:
        var(--ui-material-highlight, var(--ui-surface-highlight, linear-gradient(transparent, transparent))) padding-box,
        linear-gradient(var(--_ui-card-material-content), var(--_ui-card-material-content)) padding-box,
        linear-gradient(var(--ui-material-glass, var(--ui-surface-raised)), var(--ui-material-glass, var(--ui-surface-raised))) border-box;
      box-shadow:
        var(--_ui-card-elevation),
        var(--ui-material-glow, 0 0 transparent),
        inset 0 0 0 var(--ui-border-width) var(--ui-material-edge, var(--ui-border-strong));
      -webkit-backdrop-filter: blur(calc(var(--_ui-panel-glass) * 32px));
      backdrop-filter: blur(calc(var(--_ui-panel-glass) * 32px));
    }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      :host([treatment="expressive"]) {
        background: var(--_ui-card-surface);
      }
    }
    @media (prefers-reduced-transparency: reduce) {
      :host([treatment="expressive"]) {
        background: var(--_ui-card-surface);
        border-width: var(--ui-border-width);
        border-color: var(--ui-border-strong);
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }
    @media (forced-colors: active) {
      :host([treatment="expressive"]) {
        background: Canvas;
        color: CanvasText;
        border: var(--ui-border-width) solid CanvasText;
        box-shadow: none;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
    }

    :host([tone="accent-secondary"]) {
      border-color: var(--ui-accent-secondary-soft-border);
      --_ui-card-surface: var(--ui-accent-secondary-soft);
      --_ui-surface-text: var(--ui-accent-secondary-subtle-text);
    }

    :host([tone="accent-tertiary"]) {
      border-color: var(--ui-accent-tertiary-soft-border);
      --_ui-card-surface: var(--ui-accent-tertiary-soft);
      --_ui-surface-text: var(--ui-accent-tertiary-subtle-text);
    }

    :host([tone="accent"]) {
      border-color: var(--ui-accent-soft-border);
      --_ui-card-surface: var(--ui-accent-soft);
      --_ui-surface-text: var(--ui-accent-subtle-text);
    }

    :host([tone="info"]) {
      border-color: var(--ui-info-soft-border);
      --_ui-card-surface: var(--ui-info-soft);
      --_ui-surface-text: var(--ui-info-subtle-text);
    }

    :host([tone="success"]) {
      border-color: var(--ui-success-soft-border);
      --_ui-card-surface: var(--ui-success-soft);
      --_ui-surface-text: var(--ui-success-subtle-text);
    }

    :host([tone="warning"]) {
      border-color: var(--ui-warning-soft-border);
      --_ui-card-surface: var(--ui-warning-soft);
      --_ui-surface-text: var(--ui-warning-subtle-text);
    }

    :host([variant="subtle"]:is([tone="accent"], [tone="accent-secondary"], [tone="accent-tertiary"], [tone="info"], [tone="success"], [tone="warning"])) {
      border-color: transparent;
    }

    :host([tone="danger"]) {
      border-color: var(--ui-danger-soft-border);
      --_ui-card-surface: var(--ui-danger-soft);
      --_ui-surface-text: var(--ui-danger-subtle-text);
    }

    /* A colored panel shades rows in its own hue, without changing button intent. */
    :host([tone="accent"]),
    :host([tone="accent-secondary"]),
    :host([tone="accent-tertiary"]),
    :host([tone="info"]),
    :host([tone="success"]),
    :host([tone="warning"]),
    :host([tone="danger"]) {
      --_ui-selection-context-surface: light-dark(
        oklch(from var(--_ui-card-surface) calc(l - 0.045) calc(max(c, min(0.045, c * 3))) h),
        oklch(from var(--_ui-card-surface) calc(l + 0.045) calc(max(c, min(0.045, c * 3))) h)
      );
      --_ui-selection-context-border: light-dark(
        oklch(from var(--_ui-card-surface) calc(l - 0.085) calc(max(c, min(0.045, c * 3))) h),
        oklch(from var(--_ui-card-surface) calc(l + 0.085) calc(max(c, min(0.045, c * 3))) h)
      );
      --_ui-selection-context-text: var(--ui-text-primary);
    }

    :host([size="sm"]) {
      inline-size: min(22rem, 100%, calc(100vw - var(--ui-space-2) * 2));
      max-inline-size: min(22rem, 100%, calc(100vw - var(--ui-space-2) * 2));
    }
    :host([size="md"]) {
      inline-size: min(28rem, 100%, calc(100vw - var(--ui-space-2) * 2));
      max-inline-size: min(28rem, 100%, calc(100vw - var(--ui-space-2) * 2));
    }
    :host([size="lg"]) {
      inline-size: min(36rem, 100%, calc(100vw - var(--ui-space-2) * 2));
      max-inline-size: min(36rem, 100%, calc(100vw - var(--ui-space-2) * 2));
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
