<template component="ui-card">
  <defs>
    <prop name="size" type="keyword" values="content, sm, md, lg" default="content"
    >Optional size preset. content keeps the existing intrinsic sizing; the other sizes constrain the surface for compact, medium, or large content.</prop>
    <prop name="variant" type="keyword" values="outlined, subtle, elevated" default="outlined"
    >The surface. outlined is a bordered panel on the page; subtle is a quiet filled one with no border, for supporting details set apart from the flow;
      elevated floats above the page with a shadow, for a view's one card, such as sign-in.</prop>
    <prop name="padding" type="keyword" values="xs, sm, md, lg" default="md"
    >The space inside the card: xs is compact (0.5rem), sm is snug (0.75rem), md is the default (1.5rem), and lg is roomy (2rem).</prop>
    <prop name="tone" type="keyword" values="neutral, accent, info, success, warning, danger" default="neutral"
    >accent, info, success and warning add a quiet semantic surface. danger retains its strong leading edge for consequential content. Row highlights follow the
      surface hue; action controls retain their own intent.</prop>
    <prop name="as" type="keyword" values="div, section, article, aside" default="div"
    >The native element the card renders. Choose the one that names the content: a section of a page, a self-contained article, or an aside.</prop>
  </defs>
  <template $match>
    <section $when="$as = 'section'"><slot></slot></section>
    <article $when="$as = 'article'"><slot></slot></article>
    <aside $when="$as = 'aside'"><slot></slot></aside>
    <div $else><slot></slot></div>
  </template>
  <style>
    /* A surface that groups content. Its children stack with even space between them, so a card
       needs no layout of its own. */
    :host {
      --_ui-card-surface: var(--ui-surface-raised);
      --_ui-selection-context-surface: initial;
      --_ui-selection-context-border: initial;
      --_ui-selection-context-text: initial;
      display: flex;
      flex-direction: column;
      gap: var(--ui-space-4);
      box-sizing: border-box;
      min-inline-size: 0;
      padding: var(--ui-space-5);
      border: var(--ui-border-width) solid var(--ui-border-strong);
      border-radius: var(--ui-radius-lg);
      background: var(--_ui-card-surface);
      color: var(--ui-text-primary);
    }

    :host([padding="xs"]) {
      gap: var(--ui-space-1);
      padding: var(--ui-space-2);
    }
    :host([padding="sm"]) {
      gap: var(--ui-space-2);
      padding: var(--ui-space-3);
    }

    :host([padding="lg"]) {
      padding: var(--ui-space-6);
    }

    :host([variant="subtle"]) {
      border-color: transparent;
      --_ui-card-surface: var(--ui-surface-muted);
    }

    :host([variant="elevated"]) {
      border-color: var(--ui-border-subtle);
      box-shadow: var(--ui-shadow-lg);
    }

    :host([tone="accent"]) {
      border-color: color-mix(in srgb, var(--ui-accent) 25%, var(--ui-border-default));
      --_ui-card-surface: color-mix(in srgb, var(--ui-accent) 6%, var(--ui-surface-default));
    }

    :host([tone="info"]) {
      border-color: color-mix(in srgb, var(--ui-info) 25%, var(--ui-border-default));
      --_ui-card-surface: color-mix(in srgb, var(--ui-info) 6%, var(--ui-surface-default));
    }

    :host([tone="success"]) {
      border-color: color-mix(in srgb, var(--ui-success) 25%, var(--ui-border-default));
      --_ui-card-surface: color-mix(in srgb, var(--ui-success) 6%, var(--ui-surface-default));
    }

    :host([tone="warning"]) {
      border-color: color-mix(in srgb, var(--ui-warning) 25%, var(--ui-border-default));
      --_ui-card-surface: color-mix(in srgb, var(--ui-warning) 6%, var(--ui-surface-default));
    }

    :host([variant="subtle"]:is([tone="accent"], [tone="info"], [tone="success"], [tone="warning"])) {
      border-color: transparent;
    }

    :host([tone="danger"]) {
      border-color: color-mix(in srgb, var(--ui-danger) 45%, var(--ui-border-default));
      border-inline-start: var(--ui-accent-line-width) solid var(--ui-danger);
      --_ui-card-surface: var(--ui-danger-soft);
    }

    /* A colored panel shades rows in its own hue, without changing button intent. */
    :host([tone="accent"]), :host([tone="info"]), :host([tone="success"]), :host([tone="warning"]), :host([tone="danger"]) {
      --_ui-selection-context-surface: light-dark(
        oklch(from var(--_ui-card-surface) calc(l - 0.045) calc(max(c, min(0.045, c * 3))) h),
        oklch(from var(--_ui-card-surface) calc(l + 0.045) calc(max(c, min(0.045, c * 3))) h)
      );
      --_ui-selection-context-border: light-dark(
        oklch(from var(--_ui-card-surface) calc(l - 0.085) calc(max(c, min(0.045, c * 3))) h),
        oklch(from var(--_ui-card-surface) calc(l + 0.085) calc(max(c, min(0.045, c * 3))) h)
      );
      --_ui-selection-context-text: var(--ui-text-primary);
    }

    :host([size="sm"]) {
      inline-size: min(22rem, calc(100vw - var(--ui-space-2) * 2));
      max-inline-size: min(22rem, calc(100vw - var(--ui-space-2) * 2));
    }
    :host([size="md"]) {
      inline-size: min(28rem, calc(100vw - var(--ui-space-2) * 2));
      max-inline-size: min(28rem, calc(100vw - var(--ui-space-2) * 2));
    }
    :host([size="lg"]) {
      inline-size: min(36rem, calc(100vw - var(--ui-space-2) * 2));
      max-inline-size: min(36rem, calc(100vw - var(--ui-space-2) * 2));
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
