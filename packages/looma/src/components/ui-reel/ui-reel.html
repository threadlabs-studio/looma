<template component="ui-reel">
  <defs>
    <prop name="gap" type="xs | s | m | l | xl"
    >Space between items, on the spacing scale: xs is 0.5rem, s 0.75rem, m 1rem (also the default), l 1.5rem, and xl 2rem. The --ui-reel-gap custom property,
      set on the reel itself, overrides it; set on an ancestor, it does nothing.</prop>
    <prop name="itemWidth" type="sm | md | lg"
    >A fixed width for every item: sm is 12rem, md is 16rem, and lg is 20rem. Unset, each item keeps its content's width. Items never shrink to fit, so the reel
      scrolls sideways once they overflow.</prop>
    <prop name="snap" type="start | center"
    >Snaps scrolling to items: start comes to rest with an item's start edge at the reel's start, and center with an item centred in the reel. Unset, the reel
      scrolls freely.</prop>
  </defs>
  <div role="region" tabindex="0"><slot></slot></div>
  <style>
    /* This component's hooks style the element they are set on, and never a nested one. */
    @property --ui-reel-gap {
      syntax: "*";
      inherits: false;
    }
    @property --ui-reel-item-width {
      syntax: "*";
      inherits: false;
    }

    :host {
      /* Hooks do not inherit, so the parts below read them from the root. */
      --_ui-reel-item-width: var(--ui-reel-item-width);

      --_reel-gap: var(--ui-space-4);
      --_reel-item-width: auto;
      display: flex;
      inline-size: 100%;
      gap: var(--ui-reel-gap, var(--_reel-gap));
      min-inline-size: 0;
      max-inline-size: 100%;
      margin: 0;
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-inline: contain;
    }

    /* Each end that hides items fades: the scroll fade every Looma scroller uses (see ui-scroll-area). */
    :host {
      --_ui-scroll-fade-direction: to right;
      --_ui-scroll-fade-size: var(--ui-scroll-fade-size, 24px);
      mask-image: linear-gradient(
        var(--_ui-scroll-fade-direction),
        transparent,
        #000 var(--_ui-scroll-fade-start),
        #000 calc(100% - var(--_ui-scroll-fade-end)),
        transparent
      );
      animation: ui-scroll-fade-start linear, ui-scroll-fade-start-hold linear, ui-scroll-fade-end-hold linear, ui-scroll-fade-end linear;
      animation-timeline: scroll(self inline);
      animation-range:
        0 var(--_ui-scroll-fade-size),
        var(--_ui-scroll-fade-size) calc(100% + 1px),
        -1px calc(100% - var(--_ui-scroll-fade-size)),
        calc(100% - var(--_ui-scroll-fade-size)) 100%;
    }

    :host:dir(rtl) {
      --_ui-scroll-fade-direction: to left;
    }

    :host > :slotted(*) {
      min-inline-size: 0;
      flex: 0 0 var(--_ui-reel-item-width, var(--_reel-item-width));
    }

    :host-state([gap="xs"]) {
      --_reel-gap: var(--ui-space-2);
    }
    :host-state([gap="s"]) {
      --_reel-gap: var(--ui-space-3);
    }
    :host-state([gap="m"]) {
      --_reel-gap: var(--ui-space-4);
    }
    :host-state([gap="l"]) {
      --_reel-gap: var(--ui-space-5);
    }
    :host-state([gap="xl"]) {
      --_reel-gap: var(--ui-space-6);
    }
    :host-state([itemWidth="sm"]) {
      --_reel-item-width: 12rem;
    }
    :host-state([itemWidth="md"]) {
      --_reel-item-width: 16rem;
    }
    :host-state([itemWidth="lg"]) {
      --_reel-item-width: 20rem;
    }
    :host-state([snap]) {
      scroll-snap-type: inline mandatory;
    }
    :host-state([snap="start"]) > :slotted(*) {
      scroll-snap-align: start;
    }
    :host-state([snap="center"]) > :slotted(*) {
      scroll-snap-align: center;
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
