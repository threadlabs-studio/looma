<link rel="component" href="../ui-icon-button/ui-icon-button.html">
<link rel="component" href="../ui-icon/ui-icon.html">
<template component="ui-cycle-button" module="./ui-cycle-button.js">
  <defs>
    <prop name="items" type="list(object({ value: string, label: string, icon: string }))" required
    >Ordered states with a value, readable label and Looma icon name. Activation advances to the next state and wraps.</prop>
    <prop name="index" type="number" default="0">Initial or externally selected zero-based state. The first state is the default.</prop>
    <prop name="label" type="string" default="State">What the button changes, such as Appearance. The selected state is included in its accessible name.</prop>
    <prop name="size" type="keyword" values="sm, md, lg" default="md">Uses IconButton's compact visible sizes and adjustable invisible touch area.</prop>
    <prop name="variant" type="keyword" values="ghost, outline, solid" default="outline">Uses IconButton's standard emphasis.</prop>
    <prop name="disabled" type="boolean" default="false">Prevents cycling while keeping the selected state visible.</prop>
    <state name="current" type="number" from="$index"></state>
    <computed name="selected" from="default($items[default($current, 0)], $items[0])"></computed>
    <event name="change" type="object"><prop name="value" type="string" required></prop><prop name="index" type="number" required></prop></event>
  </defs>
  <span><ui-icon-button
      from:label="concat($label, ': ', default($selected.label, 'No choices'))"
      from:title="concat($label, ': ', default($selected.label, 'No choices'))"
      from:size="$size"
      from:variant="$variant"
      from:disabled="$disabled or $items.length &lt; 2"
      tone="neutral"
      aria-description="Activate to choose the next state."
    >
      <ui-icon from:name="default($selected.icon, '')"></ui-icon>
    </ui-icon-button></span>
  <style>
    :host {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      vertical-align: middle;
    }
    :host[hidden] {
      display: none !important;
    }
  </style>
</template>
