<template component="ui-search-shell" controller="./ui-search-shell.js">
  <defs>
    <prop name="open" type="boolean" default="false">Shows the search surface.</prop>
    <prop name="modal" type="boolean" default="false">Makes the rest of the page inert while the search surface is open.</prop>
    <prop name="dismissible" type="boolean" default="false">Allows Escape and backdrop activation to close the search surface.</prop>
    <prop name="label" type="string" default="Search">Provides the native dialog's accessible name.</prop>
    <state name="internalOpen" :value="false"></state>
    <event
      name="close"
      type="object({ open: boolean, reason: action | programmatic | light-dismiss | escape, trigger: keyboard | pointer | programmatic })"
    ></event>
  </defs>
  <div>
    <dialog $ref="dialog" :aria-label="label">
      <div class="panel">
        <div class="search"><slot name="search"></slot></div>
        <div class="status"><slot name="status"></slot></div>
        <div class="body"><slot name="body"></slot></div>
        <div class="footer"><slot name="footer"></slot></div>
      </div>
    </dialog>
  </div>
  <style>
    :host {
      display: contents;
    }

    dialog {
      position: fixed;
      inset: 0;
      z-index: var(--ui-search-shell-z-index, 400);
      box-sizing: border-box;
      inline-size: 100%;
      max-inline-size: none;
      block-size: 100%;
      max-block-size: none;
      margin: 0;
      padding: var(--ui-search-shell-padding-top, 10vh) var(--ui-search-shell-viewport-gap, var(--ui-space-4))
        var(--ui-search-shell-viewport-gap, var(--ui-space-4));
      overflow: auto;
      border: 0;
      background: var(--ui-overlay-backdrop);
      color: var(--ui-text-primary);
    }

    dialog::backdrop {
      background: var(--ui-overlay-backdrop);
    }

    .panel {
      position: relative;
      display: flex;
      flex-direction: column;
      inline-size: min(100%, var(--ui-search-shell-max-width, 40rem));
      max-block-size: var(--ui-search-shell-max-height, 80vh);
      margin-inline: auto;
      overflow: hidden;
      background: var(--ui-search-shell-surface, var(--ui-surface-elevated));
      border: 1px solid var(--ui-search-shell-border, var(--ui-border-default));
      border-radius: var(--ui-search-shell-radius, var(--ui-radius-dialog));
      box-shadow: var(--ui-search-shell-shadow, var(--ui-elevation-dialog, var(--ui-shadow-xl)));
    }

    .search {
      padding: var(--ui-space-3);
      border-block-end: 1px solid var(--ui-border-default);
      transition: border-color var(--ui-motion-fast) var(--ui-motion-ease), box-shadow var(--ui-motion-fast) var(--ui-motion-ease);
    }

    /* The search region shows where typing goes, whatever the author put in it. */
    .search:focus-within {
      border-block-end-color: var(--ui-search-shell-focus-color, var(--ui-control-focus));
      box-shadow: inset 0 -1px 0 var(--ui-search-shell-focus-color, var(--ui-control-focus));
    }

    :slotted(input[slot="search"]) {
      box-sizing: border-box;
      inline-size: 100%;
      min-block-size: var(--ui-control-min-block-size);
      padding: var(--ui-space-2) var(--ui-space-3);
      border: 1px solid var(--ui-control-border);
      border-radius: var(--ui-radius-md);
      background: var(--ui-control-surface);
      color: var(--ui-text-primary);
      font: inherit;
      box-shadow: var(--ui-shadow-xs);
    }

    :slotted(input[slot="search"]:focus-visible) {
      border-color: var(--ui-control-focus);
      outline: 2px solid var(--ui-focus-ring);
      outline-offset: 2px;
    }

    .status,
    .footer {
      flex-shrink: 0;
      padding: var(--ui-space-2) var(--ui-space-4);
      color: var(--ui-text-secondary);
      font-size: var(--ui-font-size-sm);
    }

    .status {
      border-block-end: 1px solid var(--ui-border-default);
    }

    /* Laid out like the dialog's action row: actions right-aligned, spaced as buttons, no fill. */
    .footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: var(--ui-space-2);
      padding: var(--ui-space-3) var(--ui-space-4);
      border-block-start: 1px solid var(--ui-border-default);
    }

    .status:empty,
    .footer:empty {
      display: none;
    }

    .body {
      flex: 1;
      min-block-size: 0;
      overflow: auto;
      padding: var(--ui-space-2);
      /* Each edge that hides content fades: the scroll fade every Looma scroller uses (see ui-scroll-area). */
      --_ui-scroll-fade-direction: to bottom;
      --_ui-scroll-fade-size: var(--ui-scroll-fade-size, 24px);
      mask-image: linear-gradient(
        var(--_ui-scroll-fade-direction),
        transparent,
        #000 var(--_ui-scroll-fade-start),
        #000 calc(100% - var(--_ui-scroll-fade-end)),
        transparent
      );
      animation: ui-scroll-fade-start linear, ui-scroll-fade-start-hold linear, ui-scroll-fade-end-hold linear, ui-scroll-fade-end linear;
      animation-timeline: scroll(self block);
      animation-range:
        0 var(--_ui-scroll-fade-size),
        var(--_ui-scroll-fade-size) calc(100% + 1px),
        -1px calc(100% - var(--_ui-scroll-fade-size)),
        calc(100% - var(--_ui-scroll-fade-size)) 100%;
    }

    @media (max-width: 47.9375rem) {
      dialog {
        padding: 0;
      }

      .panel {
        inline-size: 100%;
        min-block-size: 100dvh;
        max-block-size: none;
        border: 0;
        border-radius: 0;
      }
    }

    /* A component that sets its display still honours the hidden attribute on its root. */
    :host[hidden] {
      display: none;
    }
  </style>
</template>
