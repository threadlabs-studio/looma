<link rel="component" href="../ui-textarea/ui-textarea.html">
<template component="ui-editor-footnote-editor" module="./ui-editor-footnote-editor.js">
  <defs>
    <prop name="note" type="string" default="">Content for the default plain-text field. Supply rich editing content through the default slot.</prop>
    <event name="text" type="object"><prop name="text" required type="string"></prop>The default text field changed.</event>
    <event name="done" type="object">An unhandled Escape closes the editor and returns to the reference.</event>
  </defs>
  <div role="dialog" aria-label="Edit footnote">
    <slot><ui-textarea data-footnote-note aria-label="Footnote" rows="3" autosize placeholder="Write the note" from:value="$note"></ui-textarea></slot>
  </div>
</template>
