<!--
title: Floating note
 description: Edit the note's content in a floating surface. The document assigns reference numbers automatically.
-->
<ui-button id="edit-footnote">Edit footnote</ui-button>
<ui-popover data-note-popover for="edit-footnote"><ui-editor-footnote-editor
    data-note-editor
    note="The figures are from the 2024 survey."
  ></ui-editor-footnote-editor></ui-popover>
