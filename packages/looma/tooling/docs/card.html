<link rel="component" href="@threadlabs/looma/components/ui-form-field/ui-form-field.html">
<link rel="component" href="@threadlabs/looma/components/ui-input/ui-input.html">
<link rel="component" href="@threadlabs/looma/components/ui-button/ui-button.html">
<template component="looma-example-card" module="./card.js">
  <defs>
    <prop name="identity" type="string" default="">Stable catalog example identity.</prop>
    <prop name="title" type="string" default="Example">The documented component name.</prop>
    <prop name="description" type="string" default="">The component's authored description.</prop>
    <prop name="exampleTitle" type="string" default="">The selected authored example.</prop>
    <prop name="src" type="string" default="">The compiled isolated example page.</prop>
    <prop name="resizable" type="boolean" default="false">Expose a width control for responsive examples.</prop>
    <prop name="category" type="string" default="forms">The shared category identity.</prop>
    <prop name="tag" type="string" default="">The component's authored tag.</prop>
    <prop name="packageName" type="string" default="">The package that owns this component.</prop>
    <prop name="nativeRoot" type="string" default="">The component's semantic native root.</prop>
    <prop name="href" type="string" default="">The component reference page.</prop>
    <prop name="removable" type="boolean" default="false">Offer removal when this card is selected in the customizer.</prop>
    <prop name="loading" type="keyword" values="lazy, eager" default="lazy">Load visible catalog cards lazily; selected customizer cards eagerly.</prop>
  </defs>
  <article from:data-example-card="$identity" from:data-component-card="$tag" from:data-category="$category">
    <div class="preview"><iframe $ref="frame" from:title="$title" from:src="$src" sandbox="allow-scripts" from:loading="$loading" width="100%" height="208"></iframe></div>
    <div class="body">
      <div class="meta"><span>{$category}</span><code>{$nativeRoot}</code></div>
      <h3><a from:href="$href">{$title}</a></h3>
      <p class="description">{$description}</p>
      <p class="owner" $if="$packageName">{$packageName}</p>
      <p class="example-caption" $if="$exampleTitle">{$exampleTitle}</p>
      <ui-form-field $if="$resizable"><label slot="label">Preview width</label><span slot="help">Explore the example at a narrower width.</span><ui-input $ref="width" type="number" min="240" max="1600" value="720" aria-label="Preview width in pixels" size="sm"></ui-input></ui-form-field>
      <footer><ui-button $if="$href" as="a" from:href="$href" variant="link" size="sm">View component</ui-button><ui-button $if="$removable" $ref="remove" variant="ghost" size="sm">Remove</ui-button><slot name="actions"></slot></footer>
    </div>
  </article>
  <style>
    /* The existing documentation catalog card, shared by the directory, reference and customizer. */
    :host {
      --_card-accent: var(--ui-accent);
      position: relative;
      overflow: hidden;
      background: var(--ui-surface-raised);
      border: var(--ui-border-width) solid var(--ui-border);
      border-radius: var(--ui-radius-lg);
      box-shadow: var(--ui-shadow-sm);
      transition: border-color var(--ui-motion-fast) var(--ui-motion-ease), box-shadow var(--ui-motion-fast) var(--ui-motion-ease), transform var(--ui-motion-fast) var(--ui-motion-ease);
    }
    :host([category="display"]) { --_card-accent: var(--ui-success); }
    :host([category="overlay"]) { --_card-accent: var(--ui-danger); }
    :host([category="layout"]) { --_card-accent: var(--ui-info); }
    :host([category="editor"]) { --_card-accent: var(--ui-warning); }
    :host:hover { border-color: color-mix(in srgb, var(--_card-accent) 45%, var(--ui-border)); box-shadow: var(--ui-shadow-md); transform: translateY(-2px); }
    .preview { position: relative; min-block-size: 13rem; overflow: hidden; border-block-end: var(--ui-border-width) solid var(--ui-border); background: color-mix(in srgb, var(--_card-accent) 5%, var(--ui-surface)); }
    .preview::before { position: absolute; inset-block-start: 0; inset-inline-start: 0; inline-size: 3.5rem; block-size: 3px; background: var(--_card-accent); content: ""; z-index: 1; }
    iframe { display: block !important; max-inline-size: 100%; border: 0; }
    footer { display: flex !important; align-items: center !important; justify-content: space-between !important; gap: var(--ui-space-2) !important; }
    .body { padding: var(--ui-space-5) !important; }
    .meta { display: flex !important; align-items: center !important; justify-content: space-between !important; gap: var(--ui-space-2) !important; margin-block-end: var(--ui-space-2) !important; color: var(--ui-text-secondary); font-size: var(--ui-font-size-xs); font-weight: var(--ui-font-bold); letter-spacing: .09em; text-transform: uppercase; }
    .meta code { padding: 0 !important; background: transparent; color: inherit; text-transform: none; }
    h3 { margin: 0 !important; padding: 0 !important; font-size: var(--ui-font-size-lg); letter-spacing: -.035em; }
    h3 a { color: var(--ui-text); text-decoration: none; }
    .description { margin: var(--ui-space-2) 0 !important; color: var(--ui-text-secondary); font-size: var(--ui-font-size-sm); line-height: var(--ui-line-height); }
    .owner { margin: var(--ui-space-2) 0 !important; color: var(--ui-text-secondary); font-size: var(--ui-font-size-xs); overflow-wrap: anywhere; }
    .example-caption { margin: var(--ui-space-2) 0 !important; color: var(--ui-text-secondary); font-size: var(--ui-font-size-xs); }
    @media (prefers-reduced-motion: reduce) { :host { transition: none; } :host:hover { transform: none; } }
  </style>
</template>
