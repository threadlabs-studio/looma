<template component="ui-sidebar" status="early" summary="Looma ui-sidebar layout primitive." controller="./controllers/ui-sidebar.js">
  <defs>
    <prop name="gap" type="xs | s | m | l | xl">gap token.</prop>
    <prop name="side" type="start | end" default="start">side token.</prop>
    <prop name="width" type="narrow | default | wide" default="default">width token.</prop>
    <prop name="align" type="start | center | end | stretch">align token.</prop>
    <prop name="resizable" type="boolean" default="false">resizable token.</prop>
    <prop name="storageKey" type="string">storageKey token.</prop>
    <prop name="minWidth" type="number" default="176">minWidth token.</prop>
    <prop name="maxWidth" type="number" default="480">maxWidth token.</prop>
    <prop name="resizeStep" type="number" default="16">resizeStep token.</prop>
    <prop name="resizeLabel" type="string" default="Resize sidebar">resizeLabel token.</prop>
    <event name="resize" type="object({ width: number, trigger: keyboard | pointer | programmatic })"></event>
  </defs>
  <div><slot></slot></div>
</template>
