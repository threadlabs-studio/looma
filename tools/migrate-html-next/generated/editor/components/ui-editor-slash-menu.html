<template component="ui-editor-slash-menu" status="early" summary="Looma ui-editor-slash-menu editor surface." controller="./controllers/ui-editor-slash-menu.js">
  <defs>
    <prop name="open" type="boolean" default="false">open value.</prop>
    <prop name="query" type="string" default="">query value.</prop>
    <prop name="items" type="list(unknown)">items value.</prop>
    <prop name="selectedIndex" type="integer" default="0">selectedIndex value.</prop>
    <prop name="anchorRect" type="unknown">anchorRect value.</prop>
    <event name="looma-editor-slash-menu-highlight" type="object({ index: integer })"></event>
    <event name="looma-editor-slash-menu-select" type="object({ index: integer })"></event>
  </defs>
  <div .items="items" .anchorRect="anchorRect"></div>
</template>
