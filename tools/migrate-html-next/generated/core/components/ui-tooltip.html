<template component="ui-tooltip" controller="./controllers/ui-tooltip.js" status="early" summary="Migrated Looma ui-tooltip component.">
  <defs>
    <prop name="for" type="string" default="">for token.</prop>
    <prop name="open" type="boolean">open token.</prop>
    <prop name="defaultOpen" type="boolean" default="false">defaultOpen token.</prop>
    <prop name="placement" type="string" default="top-start">placement token.</prop>
    <prop name="showDelay" type="number" default="500">showDelay token.</prop>
    <prop name="hideDelay" type="number" default="100">hideDelay token.</prop>
    <prop name="toggleOnClick" type="boolean" default="false">toggleOnClick token.</prop>
    <state name="internalOpen" :value="false"></state>
  </defs>
  <span role="tooltip" :hidden="not internalOpen" :data-open="internalOpen"><div class="tooltip__surface"><slot></slot></div></span>
  <style>:scope {
  position: fixed;
  inset: auto;
  margin: 0;
  display: inline-block;
  box-sizing: border-box;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  opacity: 0;
  transform: translateY(4px);
  transition:
    opacity var(--ui-motion-fast) var(--ui-motion-ease),
    transform var(--ui-motion-fast) var(--ui-motion-ease),
    display var(--ui-motion-fast) allow-discrete,
    overlay var(--ui-motion-fast) allow-discrete;
}

.tooltip__surface {
  box-sizing: border-box;
  border: 1px solid var(--ui-border-default);
  border-radius: var(--ui-radius-2);
  background: var(--ui-surface-elevated);
  color: var(--ui-text-primary);
  padding: var(--ui-space-2) var(--ui-space-3);
  font-size: var(--ui-font-size-sm);
  box-shadow: var(--ui-shadow-md);
}

:scope:popover-open { opacity: 1; transform: translateY(0); }

@starting-style {
  :scope:popover-open { opacity: 0; transform: translateY(4px); }
}

:scope[hidden] {
  display: none !important;
}

@media (prefers-reduced-motion: reduce) {
  :scope { transition: none; }
}
</style>
</template>
