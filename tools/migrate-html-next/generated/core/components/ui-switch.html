<template component="ui-switch" controller="./controllers/ui-switch.js" status="early" summary="Migrated Looma ui-switch component.">
  <defs>
    <prop name="checked" type="boolean">checked token.</prop>
    <prop name="defaultChecked" type="boolean" default="false">defaultChecked token.</prop>
    <prop name="disabled" type="boolean" default="false">disabled token.</prop>
    <prop name="required" type="boolean" default="false">required token.</prop>
    <prop name="value" type="string" default="on">value token.</prop>
    <state name="internalChecked" :value="false"></state>
    <event name="change" type="object({ checked: boolean, value: string, trigger: keyboard | pointer | programmatic })"></event>
  </defs>
  <span role="switch" :data-disabled="disabled"><input type="checkbox" :checked="internalChecked" :required="required" :value="value" aria-hidden="true"></input><slot></slot></span>
  <style>:scope {
  display: inline-flex;
  align-items: center;
  gap: var(--ui-space-2);
  color: var(--ui-text-primary);
}

:scope[aria-disabled='true'],
:scope[data-disabled='true'] {
  opacity: 0.6;
  cursor: not-allowed;
}

:scope[role='switch'] {
  cursor: pointer;
}

:scope input[type='checkbox'] {
  appearance: none;
  -webkit-appearance: none;
  display: block;
  position: relative;
  width: 2.25rem;
  height: 1.25rem;
  padding: 0;
  border: 1px solid var(--ui-border-default);
  border-radius: 999px;
  background: var(--ui-surface-muted);
  cursor: pointer;
  transition:
    background-color var(--ui-motion-fast) var(--ui-motion-ease),
    border-color var(--ui-motion-fast) var(--ui-motion-ease);
  margin: 0;
}

:scope input[type='checkbox']::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 0.875rem;
  height: 0.875rem;
  border-radius: 999px;
  background: var(--ui-surface-default);
  border: 1px solid var(--ui-border-default);
  transition: transform var(--ui-motion-fast) var(--ui-motion-ease);
}

:scope input[type='checkbox']:checked {
  background: var(--ui-accent-solid);
  border-color: var(--ui-accent-solid);
}

:scope input[type='checkbox']:checked::after {
  transform: translateX(calc(2.25rem - 0.875rem - 4px));
  background: var(--ui-text-on-accent);
  border-color: var(--ui-text-on-accent);
}

:scope input[type='checkbox']:focus-visible {
  outline: 2px solid var(--ui-accent-solid);
  outline-offset: 2px;
}
</style>
</template>
