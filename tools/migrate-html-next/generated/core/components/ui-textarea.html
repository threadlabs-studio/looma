<template component="ui-textarea" controller="./controllers/ui-textarea.js" status="early" summary="Migrated Looma ui-textarea component.">
  <defs>
    <prop name="value" type="string">value token.</prop>
    <prop name="defaultValue" type="string">defaultValue token.</prop>
    <prop name="disabled" type="boolean">disabled token.</prop>
    <prop name="invalid" type="boolean">invalid token.</prop>
    <prop name="readOnly" type="boolean">readOnly token.</prop>
    <prop name="rows" type="number">rows token.</prop>
    <state name="internalValue" :value="''"></state>
  </defs>
  <span :data-invalid="invalid"><slot></slot></span>
  <style>:scope {
  display: inline-flex;
  min-inline-size: 0;
  color: var(--ui-text-primary);
}

:slotted(textarea) {
  width: 100%;
  appearance: none;
  border: 1px solid var(--ui-control-border, var(--ui-border-default));
  border-radius: var(--ui-radius-2);
  background: var(--ui-control-surface, var(--ui-surface-default));
  color: inherit;
  font: inherit;
  line-height: var(--ui-line-height-md);
  min-block-size: calc(var(--ui-space-12, 3rem) * 2);
  padding: var(--ui-space-2) var(--ui-space-3);
  margin: 0;
  resize: vertical;
  transition:
    border-color var(--ui-motion-fast) var(--ui-motion-ease),
    box-shadow var(--ui-motion-fast) var(--ui-motion-ease),
    background-color var(--ui-motion-fast) var(--ui-motion-ease);
}

:slotted(textarea:hover:not(:focus):not(:disabled)) {
  border-color: var(--ui-control-border-hover, var(--ui-border-strong));
}

:slotted(textarea:focus) {
  border-color: var(--ui-control-focus, var(--ui-focus-ring));
  box-shadow: 0 0 0 3px var(--ui-control-focus-halo, var(--ui-accent-soft));
}

:scope[data-invalid='true']:slotted(textarea),
:slotted(textarea[aria-invalid='true']) {
  border-color: var(--ui-accent-active);
}

:slotted(textarea:disabled) {
  background: var(--ui-control-surface-disabled, var(--ui-surface-muted));
  color: var(--ui-text-muted);
  cursor: not-allowed;
}

:slotted(textarea:focus-visible) {
  outline: 2px solid var(--ui-focus-ring);
  outline-offset: 2px;
}
</style>
</template>
