<template component="ui-combobox" controller="./controllers/ui-combobox.js" status="early" summary="Migrated Looma ui-combobox component.">
  <defs>
    <prop name="label" type="string" default="">label token.</prop>
    <prop name="placeholder" type="string" default="">placeholder token.</prop>
    <prop name="name" type="string" default="">name token.</prop>
    <prop name="value" type="string | null | list(unknown)">value token.</prop>
    <prop name="defaultValue" type="string">defaultValue token.</prop>
    <prop name="multiple" type="boolean" default="false">multiple token.</prop>
    <prop name="tokenSeparators" type="list(string)">tokenSeparators token.</prop>
    <prop name="query" type="string">query token.</prop>
    <prop name="defaultQuery" type="string" default="">defaultQuery token.</prop>
    <prop name="config" type="unknown">config token.</prop>
    <prop name="disabled" type="boolean" default="false">disabled token.</prop>
    <prop name="readOnly" type="boolean" default="false">readOnly token.</prop>
    <prop name="required" type="boolean" default="false">required token.</prop>
    <prop name="size" type="string" default="md">size token.</prop>
    <prop name="labelVisibility" type="string" default="visible">labelVisibility token.</prop>
    <prop name="disclosure" type="boolean" default="false">disclosure token.</prop>
    <prop name="clearable" type="boolean" default="false">clearable token.</prop>
    <prop name="help" type="string" default="">help token.</prop>
    <state name="raw" :value="''"></state>
    <state name="display" :value="''"></state>
    <state name="selected" :value="null"></state>
    <state name="expanded" :value="false"></state>
    <state name="rows" :value="[]"></state>
    <state name="active" :value="-1"></state>
    <state name="loading" :value="false"></state>
    <state name="helpOpen" :value="false"></state>
    <state name="lookupError" :value="''"></state>
    <state name="validation" :value="{ status: 'pristine', touched: false, dirty: false, issues: [] }"></state>
    <method name="validate" export="validate" returns="promise(unknown)"></method>
    <method name="focusInput" export="focusInput" returns="promise(undefined)"></method>
  </defs>
  <div .value="value" .config="config" :data-size="size"><label for="input" part="label"><template $value="label"></template></label><div class="field" part="field"><slot name="start"></slot><div $if="multiple" class="items" role="group"></div><input id="input" role="combobox" aria-autocomplete="list" aria-controls="listbox" :value="display" :placeholder="placeholder" :name="name" :disabled="disabled" :readOnly="readOnly" :required="required" autoComplete="off" part="input"></input><button $if="clearable" type="button" part="affordance">×</button><button $if="help" id="help" type="button" part="affordance" :disabled="disabled"><span aria-hidden="true">?</span></button><button $if="disclosure" type="button" part="affordance" aria-controls="listbox"><span aria-hidden="true">⌄</span></button></div><ui-tooltip $if="help" id="help-text" for="help"><template $value="help"></template></ui-tooltip><div class="popup" part="popup" :hidden="not expanded"><div id="listbox" role="listbox"></div><slot name="footer"></slot></div><div id="validation" class="message" part="validation" :hidden="not validation.issues.length"></div><div class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div></div>
  <style>:scope { display: grid; gap: var(--ui-space-1); min-inline-size: 0; color: var(--ui-text-primary); font: inherit; }
label { color: var(--ui-field-label-color, var(--ui-text-primary)); font-size: var(--ui-field-label-size, 0.875rem); font-weight: var(--ui-field-label-weight, 500); }
.field { display: flex; min-inline-size: 0; border: 1px solid var(--ui-control-border, var(--ui-border-default)); border-radius: var(--ui-radius-2); background: var(--ui-control-surface, var(--ui-surface-default)); }
.field:focus-within { border-color: var(--ui-control-focus, var(--ui-focus-ring)); outline: 2px solid var(--ui-control-focus, var(--ui-focus-ring)); outline-offset: 1px; }
input { appearance: none; width: 100%; min-inline-size: 0; min-block-size: var(--ui-control-min-block-size, 2.75rem); box-sizing: border-box; border: 0; border-radius: inherit; background: transparent; color: inherit; font: inherit; line-height: var(--ui-line-height-md); padding: var(--ui-space-2) var(--ui-space-3); margin: 0; outline: none; }
:scope[data-size='sm'] input { min-block-size: var(--ui-field-compact-size, 2rem); padding: var(--ui-space-1) var(--ui-space-2); }
button { appearance: none; border: 0; border-radius: var(--ui-radius-2); background: transparent; color: var(--ui-field-affordance-color, var(--ui-text-secondary)); font: inherit; font-weight: var(--ui-field-affordance-weight, 400); min-inline-size: 2rem; padding: var(--ui-space-1); cursor: pointer; }
button:hover:enabled { background: var(--ui-surface-muted); color: var(--ui-text-primary); }
button:focus-visible { outline: 2px solid var(--ui-focus-ring); outline-offset: -3px; }
input:disabled, button:disabled { color: var(--ui-text-muted); cursor: not-allowed; }
.field:has(input:disabled) { background: var(--ui-control-surface-disabled, var(--ui-surface-muted)); }
:scope[data-validation='error'] .field { border-color: var(--ui-danger-solid, var(--ui-accent-active)); }
.popup { box-sizing: border-box; min-inline-size: 12rem; max-inline-size: calc(100vw - 1rem); max-block-size: var(--ui-combobox-max-block-size, 18rem); overflow: auto; margin: 0; padding: var(--ui-space-1); border: 1px solid var(--ui-border-default); border-radius: var(--ui-radius-2); background: var(--ui-surface-elevated); color: var(--ui-text-primary); box-shadow: var(--ui-shadow-md); }
[hidden] { display: none !important; }
.option { padding: var(--ui-space-2) var(--ui-space-3); border-radius: var(--ui-radius-1); cursor: pointer; overflow-wrap: anywhere; }
.option:hover, .option[data-active] { background: var(--ui-surface-muted); outline: 1px solid var(--ui-focus-ring); outline-offset: -1px; }
.option[aria-disabled='true'] { color: var(--ui-text-muted); cursor: not-allowed; }
.primary { display: block; color: var(--ui-option-primary-color, var(--ui-text-primary)); font-weight: var(--ui-option-primary-weight, 500); }
.secondary { display: block; color: var(--ui-option-secondary-color, var(--ui-text-secondary)); font-weight: var(--ui-option-secondary-weight, 400); font-size: var(--ui-font-size-sm); }
.message, .group { color: var(--ui-field-message-color, var(--ui-text-secondary)); font-weight: var(--ui-field-message-weight, 400); font-size: var(--ui-font-size-sm); line-height: var(--ui-line-height-md); overflow-wrap: anywhere; }
.group, .popup .message { padding: var(--ui-space-2) var(--ui-space-3); }
.sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (pointer: coarse) { button { min-inline-size: 2.75rem; min-block-size: 2.75rem; } }
@media (forced-colors: active) { .field, .popup { border-color: CanvasText; } .option[data-active] { outline-color: Highlight; } }

/* Multiple mode: chips wrap before the cursor on one flexible field line. */
:scope[data-multiple='true'] .field { flex-wrap: wrap; align-items: center; gap: var(--ui-space-1); min-block-size: var(--ui-multi-combobox-min-block-size, 2.5rem); padding: var(--ui-space-1); }
:scope[data-multiple='true'] input { flex: 1 0 var(--ui-multi-combobox-input-min-inline-size, 5rem); width: auto; min-block-size: 1.75rem; padding: var(--ui-space-0-5) var(--ui-space-1); }
.items { display: contents; }
.item {
  appearance: none;
  display: inline-flex;
  min-inline-size: 0;
  max-inline-size: min(100%, var(--ui-multi-combobox-item-max-inline-size, 12rem));
  overflow: hidden;
  padding: 0;
  border: 0;
  border-radius: var(--ui-radius-1);
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: default;
}
.item > slot { display: block; min-inline-size: 0; max-inline-size: 100%; overflow: hidden; }
.item > slot:slotted(*) { min-inline-size: 0; max-inline-size: 100%; }
.item:focus-visible { outline: 2px solid var(--ui-focus-ring); outline-offset: 1px; }
.item:disabled { opacity: .6; }
</style>
</template>
