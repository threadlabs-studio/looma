name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @threadlabs/looma exec playwright install --with-deps chromium

      - name: Check code documentation
        run: pnpm check:code-documentation

      - name: Check component formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test in a browser
        run: pnpm test:browser

      - name: Check that merged package changes will publish
        run: pnpm release:pending

  release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.6
          cache: pnpm

      - name: Use release npm CLI
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release packaging
        run: pnpm release:verify

  verify:
    if: always()
    needs:
      - quality
      - release-package
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require quality and release packaging
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RELEASE_PACKAGE_RESULT: ${{ needs.release-package.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$RELEASE_PACKAGE_RESULT" = "success"
