name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @threadlabs/looma-core exec playwright install --with-deps chromium

      - name: Generate API metadata
        run: pnpm generate:api

      - name: Check docs sync
        run: pnpm check:docs-sync

      - name: Check API generation is immutable
        run: |
          pnpm generate:api
          git diff --exit-code -- generated/component-api.json

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Check generated contracts remain immutable
        run: git diff --exit-code -- generated packages/core/src/components

      - name: Test
        run: pnpm test

      - name: Test release browser contracts
        run: pnpm test:browser

  release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.6
          cache: pnpm

      - name: Use release npm CLI
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release packaging
        env:
          LOOMA_NPM_APPROVER: CI
          LOOMA_DOCS_APPROVER: CI
          LOOMA_KNIT_APPROVER: CI
        run: pnpm release:verify

  verify:
    if: always()
    needs:
      - quality
      - release-package
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require quality and release packaging
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RELEASE_PACKAGE_RESULT: ${{ needs.release-package.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$RELEASE_PACKAGE_RESULT" = "success"
