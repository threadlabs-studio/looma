name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  CI: "true"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      quality: ${{ steps.plan.outputs.quality }}
      package-consumer: ${{ steps.plan.outputs.package-consumer }}
      chromium: ${{ steps.plan.outputs.chromium }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - name: Select affected checks and validate provider baseline
        id: plan
        run: node tools/scripts/ci-qualification.mjs plan ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-ci-plan-${{ github.run_attempt }}
          path: .qualification/plan.json
          include-hidden-files: true
          if-no-files-found: error

  quality:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualification-ci-plan-${{ github.run_attempt }}
          path: .qualification
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: needs.plan.outputs.quality == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - name: Install dependencies
        if: needs.plan.outputs.quality == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install selected browser engine
        if: needs.plan.outputs.chromium == 'true'
        run: pnpm --filter @threadlabs/looma exec playwright install --with-deps chromium
      - name: Run selected quality checks or validate matching provider proof
        run: node tools/scripts/ci-qualification.mjs run ci quality
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-quality-${{ github.run_attempt }}
          path: .qualification/quality.json
          include-hidden-files: true
          if-no-files-found: error

  release-package:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualification-ci-plan-${{ github.run_attempt }}
          path: .qualification
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: needs.plan.outputs.package-consumer == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - name: Use release npm CLI
        if: needs.plan.outputs.package-consumer == 'true'
        run: npm install --global npm@11.5.1
      - name: Install dependencies
        if: needs.plan.outputs.package-consumer == 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify release packaging or validate matching provider proof
        run: node tools/scripts/ci-qualification.mjs run ci package-consumer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-package-consumer-${{ github.run_attempt }}
          path: .qualification/package-consumer.json
          include-hidden-files: true
          if-no-files-found: error

  verify:
    if: always()
    needs:
      - plan
      - quality
      - release-package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require quality and release packaging
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RELEASE_PACKAGE_RESULT: ${{ needs.release-package.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$RELEASE_PACKAGE_RESULT" = "success"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qualification-*-${{ github.run_attempt }}
          path: .qualification
          merge-multiple: true
      - name: Bind stage receipts to this exact provider revision
        run: node tools/scripts/ci-qualification.mjs combine ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-ci-${{ github.run_attempt }}
          path: .qualification/proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
