name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check proof validator
        run: node --test tools/scripts/reuse-stage-proof.test.mjs

      - name: Reuse executed stage proof
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/scripts/reuse-stage-proof.mjs --stage quality --run-id 37991554540

      - name: Setup pnpm
        if: steps.proof.outputs.reused != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        if: steps.proof.outputs.reused != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        if: steps.proof.outputs.reused != 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: steps.proof.outputs.reused != 'true'
        run: pnpm --filter @threadlabs/looma exec playwright install --with-deps chromium

      - name: Check code documentation
        if: steps.proof.outputs.reused != 'true'
        run: pnpm check:code-documentation

      - name: Check component formatting
        if: steps.proof.outputs.reused != 'true'
        run: pnpm format:check

      - name: Build
        if: steps.proof.outputs.reused != 'true'
        run: pnpm build

      - name: Lint
        if: steps.proof.outputs.reused != 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.proof.outputs.reused != 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.proof.outputs.reused != 'true'
        run: pnpm test

      - name: Test in a browser
        if: steps.proof.outputs.reused != 'true'
        run: pnpm test:browser

  release-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check proof validator
        run: node --test tools/scripts/reuse-stage-proof.test.mjs

      - name: Reuse executed stage proof
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/scripts/reuse-stage-proof.mjs --stage release-package --run-id 37991554540

      - name: Setup pnpm
        if: steps.proof.outputs.reused != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        if: steps.proof.outputs.reused != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Use release npm CLI
        if: steps.proof.outputs.reused != 'true'
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        if: steps.proof.outputs.reused != 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify release packaging
        if: steps.proof.outputs.reused != 'true'
        run: pnpm release:verify

  verify:
    if: always()
    needs:
      - quality
      - release-package
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require quality and release packaging
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RELEASE_PACKAGE_RESULT: ${{ needs.release-package.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$RELEASE_PACKAGE_RESULT" = "success"
