name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

# Independent checks start together. 9 minutes + the 1-minute verify gate leaves
# 5 minutes for release prepare/publish/record: at most 15 active runner minutes.
# Queue time and protected-environment approval time are outside runner control.
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # Keep selection history without downloading old visual baseline bytes.
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Keep generated PNG baselines out of Git
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/scripts/visual-review.mjs check
      - name: Select affected tests
        id: select
        run: node tools/scripts/ci-qualification.mjs plan
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.select.outputs.quality == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.select.outputs.quality == 'true'
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies
        if: steps.select.outputs.quality == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run quality checks
        run: node tools/scripts/ci-qualification.mjs run quality

  browser:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    # Browsers and OS libraries are preinstalled. No apt/CDN install on a fix.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:beddddcf96f19abec078cd2f3da676f40abd460e0e734ad5eed73627ce161d33
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # Selection needs history, not old screenshot bytes.
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Select affected tests
        id: select
        run: node tools/scripts/ci-qualification.mjs plan
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.select.outputs.browser == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.select.outputs.browser == 'true'
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies
        if: steps.select.outputs.browser == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run browser checks
        run: node tools/scripts/ci-qualification.mjs run browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          path: |
            apps/docs/test-results/
            packages/looma/test-results/browser/
          if-no-files-found: ignore

  release-package:
    runs-on: ubuntu-24.04-arm
    # Includes a fresh installed docs build and the local save/discovery flow.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # Selection needs history, not old screenshot bytes.
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Select affected tests
        id: select
        run: node tools/scripts/ci-qualification.mjs plan
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.select.outputs.package == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.select.outputs.package == 'true'
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies
        if: steps.select.outputs.package == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run package-consumer checks
        run: node tools/scripts/ci-qualification.mjs run package-consumer

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        side: [base, head]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Select affected visual surfaces
        id: visual-plan
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/scripts/visual-review.mjs plan --shard=${{ matrix.shard }}/8
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.visual-plan.outputs.selected == 'true'
        with:
          path: .context/visual-capture
          key: visual-${{ matrix.side == 'base' && steps.visual-plan.outputs.base_key || steps.visual-plan.outputs.head_key }}
      - name: Render source revision in the canonical environment
        run: node tools/scripts/visual-review.mjs render-side --side=${{ matrix.side }}
      - name: Preserve disposable render outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-capture-${{ matrix.side }}-${{ matrix.shard }}
          path: .context/visual-capture/
          include-hidden-files: true
          if-no-files-found: error

  verify:
    if: always()
    needs: [quality, browser, release-package, visual]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 1
    steps:
      - name: Require tests, release packaging, and complete visual captures
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          RELEASE_PACKAGE_RESULT: ${{ needs.release-package.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$RELEASE_PACKAGE_RESULT" = "success"
          test "$VISUAL_RESULT" = "success"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: visual-capture-*
          path: .context/visual-artifacts
      - name: Install the pinned comparison runtime
        run: node tools/scripts/visual-review.mjs install-comparator
      - name: Compare regenerated source revisions
        env:
          LOOMA_VISUAL_COMPARATOR_ROOT: .context/visual-comparator
        run: node tools/scripts/visual-review.mjs report --input=.context/visual-artifacts --output=.context/visual-review
      - name: Attach the visual review report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-review
          path: .context/visual-review/report/
          include-hidden-files: true
          if-no-files-found: error
