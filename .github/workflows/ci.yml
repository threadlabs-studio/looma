name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @looma/core exec playwright install --with-deps chromium

      - name: Generate API metadata
        run: pnpm generate:api

      - name: Check docs sync
        run: pnpm check:docs-sync

      - name: Check API generation is immutable
        run: |
          pnpm generate:api
          git diff --exit-code -- generated/component-api.json

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Check generated contracts remain immutable
        run: git diff --exit-code -- generated packages/core/src/components

      - name: Test
        run: pnpm test

      - name: Test release browser contracts
        run: pnpm test:browser
