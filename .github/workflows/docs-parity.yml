name: Documentation parity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  docs-parity:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:beddddcf96f19abec078cd2f3da676f40abd460e0e734ad5eed73627ce161d33
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Select affected tests
        id: select
        run: node tools/scripts/ci-qualification.mjs plan
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.select.outputs.docs == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.select.outputs.docs == 'true'
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies
        if: steps.select.outputs.docs == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run docs checks
        run: node tools/scripts/ci-qualification.mjs run docs
      # Preview the same package-generated Markupress site deployed by docs.yml.
      - name: Upload the Markupress site
        if: steps.select.outputs.docs == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: looma-next-site
          path: apps/docs-next/site/
          if-no-files-found: error
