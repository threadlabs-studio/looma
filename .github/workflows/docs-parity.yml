name: Documentation parity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  CI: "true"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      behavior: ${{ steps.plan.outputs.docs-behavior }}
      visual: ${{ steps.plan.outputs.docs-visual }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Select affected documentation and validate provider baseline
        id: plan
        run: node tools/scripts/ci-qualification.mjs plan docs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-docs-plan-${{ github.run_attempt }}
          path: .qualification/plan.json
          include-hidden-files: true
          if-no-files-found: error

  docs-parity:
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:beddddcf96f19abec078cd2f3da676f40abd460e0e734ad5eed73627ce161d33
      options: --ipc=host
    env:
      LOOMA_DOCS_TEST_URL: http://127.0.0.1:4174/looma/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualification-docs-plan-${{ github.run_attempt }}
          path: .qualification
      - name: Align browser home ownership with the container user
        if: needs.plan.outputs.behavior == 'true' || needs.plan.outputs.visual == 'true'
        run: chown "$(id -u):$(id -g)" "$HOME"
      - name: Install pinned pnpm dependencies
        if: needs.plan.outputs.behavior == 'true' || needs.plan.outputs.visual == 'true'
        run: corepack enable && corepack pnpm install --frozen-lockfile
      - name: Build documentation and check coverage
        if: needs.plan.outputs.behavior == 'true' || needs.plan.outputs.visual == 'true'
        run: corepack pnpm --filter @threadlabs/looma build && corepack pnpm --filter @threadlabs/looma-docs build && node tools/scripts/docs-coverage.mjs && corepack pnpm --filter @threadlabs/looma-docs typecheck:tests
      - name: Serve the one verified documentation build
        if: needs.plan.outputs.behavior == 'true' || needs.plan.outputs.visual == 'true'
        run: |
          corepack pnpm --filter @threadlabs/looma-docs exec docusaurus serve --host 127.0.0.1 --port 4174 --no-open > .qualification/docs-server.log 2>&1 &
          echo "$!" > .qualification/docs-server.pid
          node --input-type=module -e 'const deadline = Date.now() + 45000; while (Date.now() < deadline) { try { if ((await fetch(process.env.LOOMA_DOCS_TEST_URL)).ok) process.exit(0); } catch {} await new Promise(resolve => setTimeout(resolve, 300)); } throw Error("Documentation server did not start");'
      - name: Check selected behavior or validate matching provider proof
        run: node tools/scripts/ci-qualification.mjs run docs docs-behavior
      - name: Compare selected reviewed visuals or validate matching provider proof
        env:
          LOOMA_DOCS_CANONICAL: "1"
        run: node tools/scripts/ci-qualification.mjs run docs docs-visual
      - name: Bind documentation receipts to this exact provider revision
        run: node tools/scripts/ci-qualification.mjs combine docs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-docs-${{ github.run_attempt }}
          path: .qualification/proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Upload browser reports and image differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-parity-failures
          path: |
            .qualification/*-report.json
            apps/docs/playwright-report
            apps/docs/test-results
      - name: Stop the owned documentation server
        if: always()
        run: |
          if test -f .qualification/docs-server.pid; then
            kill "$(cat .qualification/docs-server.pid)" 2>/dev/null || true
          fi
