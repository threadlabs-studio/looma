name: Documentation parity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  docs-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Select affected tests
        id: select
        run: node tools/scripts/ci-qualification.mjs plan
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.select.outputs.docs == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.select.outputs.docs == 'true'
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Install dependencies
        if: steps.select.outputs.docs == 'true'
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run docs checks
        run: node tools/scripts/ci-qualification.mjs run docs
