name: Capture reviewed Table references

# Temporary release capture, removed after the four GitHub-specific images are reviewed.
# Ordinary documentation comparisons remain unchanged and never regenerate references.
on:
  push:
    branches: [feature/controller-host-contract]
    paths: [.github/workflows/capture-table-references.yml]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble@sha256:beddddcf96f19abec078cd2f3da676f40abd460e0e734ad5eed73627ce161d33
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Align browser home ownership
        run: chown "$(id -u):$(id -g)" "$HOME"
      - name: Install pinned dependencies
        run: corepack enable && corepack pnpm install --frozen-lockfile
      - name: Build documentation
        run: corepack pnpm --filter @threadlabs/looma build && corepack pnpm --filter @threadlabs/looma-docs build
      - name: Capture the two reviewed Table views in both desktop themes
        env:
          LOOMA_DOCS_CANONICAL: "1"
          LOOMA_DOCS_REPORT: table-capture
        run: corepack pnpm --filter @threadlabs/looma-docs test:visual --grep 'desktop-.*components/ui-table:' --update-snapshots=all
      - name: Upload captured references
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-table-references
          path: apps/docs/tests/baselines/visual/*ui-table*github-actions.png
          if-no-files-found: error
          retention-days: 5
