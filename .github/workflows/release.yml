name: Release

# Publishes @threadlabs/looma to npm `latest` after CI passes on main, when
# packages/looma/package.json carries a version that is not on npm yet.
# npm trusted publishing is bound to this file name and the npm-release environment.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: looma-npm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_sha: ${{ steps.sha.outputs.release_sha }}
      version_new: ${{ steps.version.outputs.version_new }}
    steps:
      - name: Resolve release commit
        id: sha
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.sha.outputs.release_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.6
          cache: pnpm

      - name: Skip when the version is already published
        id: version
        run: |
          version="$(node -p "require('./packages/looma/package.json').version")"
          if npm view "@threadlabs/looma@${version}" version --registry https://registry.npmjs.org/ > /dev/null 2>&1; then
            echo "@threadlabs/looma@${version} is already published; nothing to release"
            echo "version_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "version_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Use trusted-publishing-capable npm CLI
        if: steps.version.outputs.version_new == 'true'
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        if: steps.version.outputs.version_new == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify and pack release bytes
        if: steps.version.outputs.version_new == 'true'
        run: pnpm release:verify

      - name: Upload release artifact
        if: steps.version.outputs.version_new == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: looma-release
          path: .release/artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: needs.prepare.outputs.version_new == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.6
          registry-url: https://registry.npmjs.org/
          scope: '@threadlabs'

      - name: Use trusted-publishing-capable npm CLI
        run: npm install --global npm@11.5.1

      - name: Download release bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: looma-release
          path: .release/artifacts/

      - name: Publish to latest with trusted publishing
        env:
          LOOMA_RELEASE_PUBLISH: approved
        run: node tools/scripts/publish-release.mjs --execute

      - name: Verify public metadata, integrity, latest tag, and provenance
        run: pnpm release:verify-registry

      - name: Verify clean public-registry consumer
        run: pnpm release:verify-public-consumer
