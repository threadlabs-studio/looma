name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish the approved tarballs to the npm candidate tag
        required: true
        default: false
        type: boolean
      authentication:
        description: Use bootstrap only for first publication; trusted for configured packages
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - trusted
      npm_approver:
        description: Accountable npm release approver
        required: true
        type: string
      documentation_approver:
        description: Accountable public documentation approver
        required: true
        type: string
      knit_approver:
        description: Accountable Knit consumer-validation approver
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: looma-npm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Use trusted-publishing-capable npm CLI
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and pack exact release bytes
        env:
          LOOMA_NPM_APPROVER: ${{ inputs.npm_approver }}
          LOOMA_DOCS_APPROVER: ${{ inputs.documentation_approver }}
          LOOMA_KNIT_APPROVER: ${{ inputs.knit_approver }}
        run: pnpm release:verify

      - name: Upload immutable release artifact set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: looma-0.1.0-candidate
          path: .release/artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: inputs.publish_candidate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the same reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0

      - name: Use trusted-publishing-capable npm CLI
        run: npm install --global npm@11.5.1

      - name: Download approved release bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: looma-0.1.0-candidate
          path: .release/artifacts/

      - name: Prove first-publication scope ownership and name availability
        if: inputs.authentication == 'bootstrap'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node tools/scripts/registry-preflight.mjs

      - name: Publish exact bytes with the bootstrap credential
        if: inputs.authentication == 'bootstrap'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          LOOMA_RELEASE_PUBLISH: approved
        run: node tools/scripts/publish-release.mjs --execute --tag candidate

      - name: Publish exact bytes with trusted publishing
        if: inputs.authentication == 'trusted'
        env:
          LOOMA_RELEASE_PUBLISH: approved
        run: node tools/scripts/publish-release.mjs --execute --tag candidate
