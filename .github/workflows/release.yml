name: Release

# Publishes @threadlabs/looma to npm `latest` after CI passes on main. A merge that changes the
# package releases the next patch by itself; a version already ahead of the registry publishes as
# declared, which is how a minor or major lands.
# npm trusted publishing is bound to this file name and the npm-release environment.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: looma-npm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.publish-commit.outputs.release_sha }}
      release_version: ${{ steps.resolve.outputs.version }}
      releasing: ${{ steps.resolve.outputs.release }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # The release commit is pushed from here, so this checkout keeps its credentials.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.6
          cache: pnpm

      - name: Resolve the version this commit releases
        id: resolve
        run: |
          published="$(npm view @threadlabs/looma version --registry https://registry.npmjs.org/)"
          last_release="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -n "$last_release" ] && git rev-parse -q --verify "$last_release" > /dev/null; then
            # Only the package's own sources: the release commit itself touches versions alone.
            changed="$(git diff --name-only "$last_release"..HEAD -- packages/looma/src packages/looma/build.mjs | wc -l)"
          else
            changed=1
          fi
          if [ "$changed" -gt 0 ]; then package_changed=true; else package_changed=false; fi
          resolution="$(LOOMA_PUBLISHED_VERSION="$published" LOOMA_PACKAGE_CHANGED="$package_changed" node tools/scripts/release-version.mjs --resolve)"
          echo "$resolution"
          echo "release=$(node -p "JSON.parse(process.argv[1]).release" "$resolution")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "JSON.parse(process.argv[1]).version" "$resolution")" >> "$GITHUB_OUTPUT"

      - name: Record the release version
        id: publish-commit
        if: steps.resolve.outputs.release == 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          node tools/scripts/release-version.mjs --apply "$VERSION"
          if git diff --quiet; then
            echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -aqm "Release v${VERSION}"
          git tag "v${VERSION}"
          git push origin "HEAD:main" --follow-tags
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Use trusted-publishing-capable npm CLI
        if: steps.resolve.outputs.release == 'true'
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        if: steps.resolve.outputs.release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify and pack release bytes
        if: steps.resolve.outputs.release == 'true'
        run: pnpm release:verify

      - name: Upload release artifact
        if: steps.resolve.outputs.release == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: looma-release
          path: .release/artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    if: needs.prepare.outputs.releasing == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.19.6
          registry-url: https://registry.npmjs.org/
          scope: '@threadlabs'

      - name: Use trusted-publishing-capable npm CLI
        run: npm install --global npm@11.5.1

      - name: Download release bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: looma-release
          path: .release/artifacts/

      - name: Publish to latest with trusted publishing
        env:
          LOOMA_RELEASE_PUBLISH: approved
        run: node tools/scripts/publish-release.mjs --execute

      - name: Verify public metadata, integrity, latest tag, and provenance
        run: pnpm release:verify-registry

      - name: Verify clean public-registry consumer
        run: pnpm release:verify-public-consumer
